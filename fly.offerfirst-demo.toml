# Disposable public search demo for ScentHunter 2.0.
# Isolated app and volume: never points at production.
app = "scenthunter-offerfirst-demo-20261121"
primary_region = "ams"

[build]
  dockerfile = "Dockerfile.pilot"

[env]
  SCENTHUNTER_CATALOG_DATABASE_URL = "sqlite:////data/catalog/catalog.sqlite3"
  SCENTHUNTER_QUEUE_BACKEND = "sqlite"
  SCENTHUNTER_SQLITE_QUEUE_DB = "/data/catalog/ingestion_queue.sqlite3"
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"
  SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED = "0"
  BPLATZ_PHASE2_PERSISTENCE = "1"
  SCENTHUNTER_DISABLE_AUTOMATIC_CATALOG_STARTUP = "1"
  SCENTHUNTER_ENABLE_SQLITE_WORKER = "1"
  SCENTHUNTER_NOTINO_DISCOVERY_ENABLED = "1"
  SCENTHUNTER_NOTINO_DISCOVERY_FILTER = "Dior Sauvage"
  SCENTHUNTER_LEGACY_DISCOVERY_ENABLED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "sh_offerfirst_demo"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
