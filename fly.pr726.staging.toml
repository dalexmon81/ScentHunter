# Isolated web staging for PR #726. Never points at production app or volume.
app = "scenthunter-pr726-staging"
primary_region = "ams"

[build]

[env]
  SCENTHUNTER_CATALOG_DB = "/data/store_catalog.sqlite3"
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "scenthunter_pr726_data"
  destination = "/data"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
