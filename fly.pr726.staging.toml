# Isolated web staging for PR #726. Ephemeral SQLite only; no production DB or volume.
app = "scenthunter-pr726-staging"
primary_region = "ams"

[build]

[env]
  SCENTHUNTER_CATALOG_DB = "/tmp/store_catalog.sqlite3"
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
