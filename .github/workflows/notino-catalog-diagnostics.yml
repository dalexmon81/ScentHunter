name: Notino.fr PostgreSQL Catalog Diagnostics

on:
  workflow_run:
    workflows: ["Notino CJ Feed Import"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "47 6 * * *"

permissions:
  contents: read

jobs:
  verify-notino-postgres:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Verify Notino offers are visible through the canonical PostgreSQL search API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-Postgres-Notino-Diagnostic/1.0"},
              )
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          status = get("/api/catalog/status")
          if status.get("status") != "ready":
              raise SystemExit("Canonical PostgreSQL catalog is not ready: " + json.dumps(status))
          query = urllib.parse.urlencode({"q": "Dior Sauvage"})
          result = get("/api/catalog/search?" + query)
          if not isinstance(result.get("results"), list):
              raise SystemExit("Canonical catalog search returned an invalid payload")
          notino_offers = [
              offer
              for product in result["results"]
              for offer in (product.get("offers") or [])
              if "notino" in str(offer.get("store") or "").casefold()
          ]
          print("NOTINO_POSTGRES_DIAGNOSTIC=" + json.dumps({
              "catalog_status": status.get("status"),
              "query": "Dior Sauvage",
              "products": len(result["results"]),
              "published_offers": int(result.get("offer_count", 0) or 0),
              "notino_offers": len(notino_offers),
          }, sort_keys=True))
          if not notino_offers:
              raise SystemExit("No Notino offer is visible in canonical PostgreSQL search.")
          print("NOTINO_PUBLIC_POSTGRES_SEARCH=PASS")
          PY
