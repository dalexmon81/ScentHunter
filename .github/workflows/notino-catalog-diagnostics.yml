name: Notino.fr Catalog Discovery Diagnostics

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/notino-catalog-diagnostics.yml'
  workflow_run:
    workflows: ["Fly Deploy"]
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  trace-notino-discovery:
    if: ${{ github.event_name == 'push' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Trace deployed Notino.fr discovery (read-only)
        shell: bash
        run: |
          python - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          url = (
              "https://scenthunter.fly.dev/diagnose-html-discovery-trace"
              "?store=notino&q=parfum&max_pages=10&max_depth=2&max_events=100"
          )
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "ScentHunter-Notino-Diagnostic/1.0",
              },
          )
          try:
              with urllib.request.urlopen(request, timeout=35) as response:
                  payload = response.read().decode("utf-8", "replace")
                  print("HTTP_STATUS:", response.status)
                  parsed = json.loads(payload)
          except urllib.error.HTTPError as exc:
              print("HTTP_STATUS:", exc.code)
              print(exc.read().decode("utf-8", "replace")[:12000])
              raise SystemExit(f"Diagnostic endpoint returned HTTP {exc.code}")
          except json.JSONDecodeError as exc:
              raise SystemExit(f"Diagnostic endpoint did not return JSON: {exc}")
          except Exception as exc:
              raise SystemExit(f"Diagnostic request failed: {type(exc).__name__}: {exc}")

          print(json.dumps(parsed, ensure_ascii=False, indent=2)[:45000])
          errors = parsed.get("errors", []) if isinstance(parsed, dict) else []
          events = parsed.get("events", []) if isinstance(parsed, dict) else []
          successes = int(parsed.get("successes", 0) or 0) if isinstance(parsed, dict) else 0
          product_urls = int(parsed.get("product_urls_found", 0) or 0) if isinstance(parsed, dict) else 0
          http_403 = any("HTTP_403" in str(item) for item in errors)
          if not isinstance(parsed, dict) or parsed.get("ok") is not True:
              status = "DIAGNOSTIC_ERROR"
              detail = "Diagnostic response was not marked ok=true."
          elif http_403 and successes == 0:
              status = "BLOCKED_BY_RETAILER_HTTP_403"
              detail = "Notino public HTML returned HTTP 403 for all attempted pages. Catalog discovery is not operational; use an authorized affiliate feed/API. No anti-bot bypass was attempted."
          elif successes == 0 or product_urls == 0:
              status = "NO_PRODUCTS_DISCOVERED"
              detail = "The read-only trace did not discover product URLs. Do not treat Notino as an active catalog."
          else:
              status = "TRACE_FOUND_PRODUCT_URLS"
              detail = f"Read-only trace found {product_urls} product URLs across {successes} successful pages; this does not by itself prove catalog ingestion or live prices are active."

          print(f"NOTINO_INTEGRATION_STATUS: {status}")
          print(f"NOTINO_INTEGRATION_DETAIL: {detail}")
          summary_path = os.environ.get("GITHUB_STEP_SUMMARY")
          if summary_path:
              with open(summary_path, "a", encoding="utf-8") as summary:
                  summary.write("## Notino.fr integration status\n\n")
                  summary.write(f"**{status}**\n\n{detail}\n\n")
                  summary.write(
                      f"- Successful pages: {successes}\n"
                      f"- Product URLs found: {product_urls}\n"
                      f"- Reported errors: {len(errors)}\n"
                  )
          PY
