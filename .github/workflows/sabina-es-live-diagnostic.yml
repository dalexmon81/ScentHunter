# Bounded diagnostic: one search per query, max four fragrance-page fetches each.
name: Sabina.es live diagnostic

on:
  push:
    branches:
      - investigate/sabina-es-live-validation
    paths:
      - backend/scripts/check_sabina_es_live.py
      - .github/workflows/sabina-es-live-diagnostic.yml

permissions:
  contents: read

jobs:
  bounded-live-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out diagnostic branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper runtime dependencies
        run: python -m pip install requests beautifulsoup4

      - name: Probe Sabina Spanish native search and up to twelve fragrance pages
        timeout-minutes: 3
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_sabina_es_live.py
