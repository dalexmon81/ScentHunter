name: Approved PostgreSQL legacy catalog queue apply
# Production queue writes are disabled on push. Manual dispatch requires a fresh,
# explicit confirmation from an authorized operator after reviewing the dry-run.
on:
  workflow_dispatch:
    inputs:
      confirm_production_queue_write:
        description: 'Type AUTHORIZE_QUEUE_WRITE_4161 to authorize this one-time production queue write'
        required: true
        type: string

jobs:
  approved-production-queue-apply:
    if: ${{ inputs.confirm_production_queue_write == 'AUTHORIZE_QUEUE_WRITE_4161' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter

    steps:
      - name: Check out branch
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Locate app machine and execute guarded queue seed
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl machines list --app "$FLY_APP" --json > /tmp/fly-machines.json
          MACHINE_ID="$(python - <<'PY'
          import json
          with open("/tmp/fly-machines.json", encoding="utf-8") as f:
              machines = json.load(f)
          preferred, other = [], []
          for m in machines:
              cfg = m.get("config") or {}
              meta = cfg.get("metadata") or {}
              group = meta.get("fly_process_group") or meta.get("process_group")
              (preferred if group == "app" else other).append(m.get("id"))
          seen, ordered = set(), []
          for value in preferred + other:
              if value and value not in seen:
                  seen.add(value)
                  ordered.append(value)
          print(ordered[0] if ordered else "")
          PY
          )"
          test -n "$MACHINE_ID"

          seed_b64="$(base64 -w0 backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py)"
          inspect_b64="$(base64 -w0 backend/scripts/inspect_postgres_legacy_seed_target.py)"
          cat > /tmp/guard.py <<'PY'
          import ast, json, sys
          mode, path = sys.argv[1], sys.argv[2]
          if mode in ("preflight", "postflight"):
              d = json.load(open(path))
              assert d["database"] == "scenthunter_offerfirst", d
              assert d["alembic_revision"] == "0006_postgres_ingestion_queue", d
              assert d["safe_to_apply_preflight"] is True, d
              assert not d["domain_conflicts"] and not d["inactive_stores"], d
              assert not d["missing_store_slugs"] and len(d["existing_stores"]) == 9, d
              print(mode.upper() + "_VERIFIED")
              if mode == "postflight":
                  print(json.dumps(d, sort_keys=True))
          elif mode == "dryrun":
              d = ast.literal_eval(open(path).read().strip())
              assert d["mode"] == "dry_run" and d["destination_written"] is False, d
              assert d["target_database"] == "scenthunter_offerfirst", d
              assert d["queued_candidates"] == 127977, d
              assert d["already_active_candidates"] == 123816, d
              assert d["would_insert_candidates"] == 4161, d
              assert d["duplicate_candidates"] == 0, d
              assert all(v == 0 for v in d["rejected_by_store"].values()), d
              print("DRY_RUN_VERIFIED candidates=127977 already_active=123816 to_insert=4161")
          elif mode == "apply":
              d = ast.literal_eval(open(path).read().strip())
              assert d["mode"] == "apply" and d["destination_written"] is True, d
              assert d["target_database"] == "scenthunter_offerfirst", d
              assert d["queued_candidates"] == 127977, d
              assert d["new_jobs_inserted"] == 4161, d
              print("APPLY_VERIFIED candidates=%s inserted_jobs=%s" % (d["queued_candidates"], d["new_jobs_inserted"]))
          else:
              raise SystemExit("unknown guard mode")
          PY
          guard_b64="$(base64 -w0 /tmp/guard.py)"

          remote_command="sh -lc 'set -e
          test -r /data/store_catalog.sqlite3
          test -x /app/.venv/bin/python
          test -n \"\$SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL\"
          mkdir -p /tmp/shim/backend/scripts
          trap \"rm -f /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py /tmp/shim/guard.py /tmp/shim/preflight.json /tmp/shim/dryrun.txt /tmp/shim/apply.txt /tmp/shim/postflight.json\" EXIT
          printf %s ${seed_b64} | base64 -d > /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py
          printf %s ${inspect_b64} | base64 -d > /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py
          printf %s ${guard_b64} | base64 -d > /tmp/shim/guard.py
          export PYTHONPATH=/app/backend
          /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/preflight.json
          /app/.venv/bin/python /tmp/shim/guard.py preflight /tmp/shim/preflight.json
          /app/.venv/bin/python /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py --source /data/store_catalog.sqlite3 > /tmp/shim/dryrun.txt
          /app/.venv/bin/python /tmp/shim/guard.py dryrun /tmp/shim/dryrun.txt
          /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/preflight.json
          /app/.venv/bin/python /tmp/shim/guard.py preflight /tmp/shim/preflight.json
          /app/.venv/bin/python /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py --source /data/store_catalog.sqlite3 --apply --confirm-target scenthunter_offerfirst > /tmp/shim/apply.txt
          cat /tmp/shim/apply.txt
          /app/.venv/bin/python /tmp/shim/guard.py apply /tmp/shim/apply.txt
          /app/.venv/bin/python /tmp/shim/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/postflight.json
          /app/.venv/bin/python /tmp/shim/guard.py postflight /tmp/shim/postflight.json
          '"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"
