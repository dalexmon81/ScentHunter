name: Approved PostgreSQL legacy catalog queue apply
# One-shot production queue write, explicitly authorized on 2026-11-22.
# The exact commit-message guard prevents later edits from re-running this operation.
on:
  push:
    branches:
      - fix/public-postgres-catalog-ingestion-2026-11-22
    paths:
      - .github/workflows/fly-postgres-legacy-catalog-approved-apply.yml

jobs:
  approved-production-queue-apply:
    if: github.event.head_commit.message == 'ops: execute approved PostgreSQL queue seed'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter
      EXPECTED_DATABASE: scenthunter_offerfirst
      EXPECTED_CANDIDATES: "127944"

    steps:
      - name: Check out the approved branch commit
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Locate app machine and run guarded production apply
        id: apply
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl machines list --app "$FLY_APP" --json > /tmp/fly-machines.json
          MACHINE_ID="$(python - <<'PY'
          import json
          with open("/tmp/fly-machines.json", encoding="utf-8") as handle:
              machines = json.load(handle)
          candidates = []
          for machine in machines:
              config = machine.get("config") or {}
              metadata = config.get("metadata") or {}
              group = metadata.get("fly_process_group") or metadata.get("process_group")
              if group == "app":
                  candidates.insert(0, machine.get("id"))
              elif machine.get("id"):
                  candidates.append(machine["id"])
          seen, ordered = set(), []
          for item in candidates:
              if item and item not in seen:
                  seen.add(item)
                  ordered.append(item)
          print(" ".join(ordered))
          PY
          )"
          test -n "$MACHINE_ID"

          seed_b64="$(base64 -w0 backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py)"
          inspect_b64="$(base64 -w0 backend/scripts/inspect_postgres_legacy_seed_target.py)"

          remote_command="sh -lc 'set -e
          test -r /data/store_catalog.sqlite3
          test -x /app/.venv/bin/python
          test -n \"\$SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL\"
          mkdir -p /tmp/shim/backend/scripts
          trap \"rm -f /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py /tmp/shim/preflight.json /tmp/shim/dryrun.txt /tmp/shim/apply.txt /tmp/shim/postflight.json\" EXIT
          printf %s ${seed_b64} | base64 -d > /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py
          printf %s ${inspect_b64} | base64 -d > /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py
          export PYTHONPATH=/app/backend
          /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/preflight.json
          /app/.venv/bin/python -c 'import json; d=json.load(open(\"/tmp/shim/preflight.json\")); expected={\"deloox-nl\",\"deloox-com\",\"deloox-lu\",\"deloox-es\"}; assert d[\"database\"]==\"scenthunter_offerfirst\", d; assert d[\"alembic_revision\"]==\"0006_postgres_ingestion_queue\", d; assert d[\"safe_to_apply_preflight\"] is True, d; assert set(d[\"missing_store_slugs\"])==expected, d; assert len(d[\"existing_stores\"])==5, d; assert not d[\"domain_conflicts\"] and not d[\"inactive_stores\"], d'
          echo APPROVED_PREFLIGHT_PASS
          /app/.venv/bin/python /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py --source /data/store_catalog.sqlite3 > /tmp/shim/dryrun.txt
          /app/.venv/bin/python -c 'import ast; d=ast.literal_eval(open(\"/tmp/shim/dryrun.txt\").read().strip()); assert d[\"mode\"]==\"dry_run\" and d[\"destination_written\"] is False, d; assert d[\"target_database\"]==\"scenthunter_offerfirst\", d; assert d[\"queued_candidates\"]==127944, d; assert d[\"duplicate_candidates\"]==0, d; assert all(v==0 for v in d[\"rejected_by_store\"].values()), d; print(d)'
          echo APPROVED_DRY_RUN_PASS
          # Re-check immediately before the transaction; abort if target state changed.
          /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/preflight.json
          /app/.venv/bin/python -c 'import json; d=json.load(open(\"/tmp/shim/preflight.json\")); expected={\"deloox-nl\",\"deloox-com\",\"deloox-lu\",\"deloox-es\"}; assert d[\"database\"]==\"scenthunter_offerfirst\" and d[\"alembic_revision\"]==\"0006_postgres_ingestion_queue\" and d[\"safe_to_apply_preflight\"] is True and set(d[\"missing_store_slugs\"])==expected and len(d[\"existing_stores\"])==5 and not d[\"domain_conflicts\"] and not d[\"inactive_stores\"], d'
          /app/.venv/bin/python /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py --source /data/store_catalog.sqlite3 --apply --confirm-target scenthunter_offerfirst | tee /tmp/shim/apply.txt
          /app/.venv/bin/python -c 'import ast; d=ast.literal_eval(open(\"/tmp/shim/apply.txt\").read().strip()); assert d[\"mode\"]==\"apply\" and d[\"destination_written\"] is True, d; assert d[\"target_database\"]==\"scenthunter_offerfirst\" and d[\"queued_candidates\"]==127944, d; print(\"APPLY_VERIFIED inserted_jobs=%s candidates=%s\" % (d[\"new_jobs_inserted\"],d[\"queued_candidates\"]))'
          /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py > /tmp/shim/postflight.json
          /app/.venv/bin/python -c 'import json; d=json.load(open(\"/tmp/shim/postflight.json\")); assert d[\"database\"]==\"scenthunter_offerfirst\" and d[\"safe_to_apply_preflight\"] is True and not d[\"missing_store_slugs\"] and not d[\"domain_conflicts\"] and not d[\"inactive_stores\"] and len(d[\"existing_stores\"])==9, d; print(\"POSTFLIGHT_VERIFIED\"); print(json.dumps(d,sort_keys=True))'
          '"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"
          echo "machine_id=$MACHINE_ID" >> "$GITHUB_OUTPUT"
