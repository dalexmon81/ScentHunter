name: Notino CJ Feed Import

on:
  workflow_run:
    workflows:
      - Fly Deploy
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notino-cj-feed-import
  cancel-in-progress: false

jobs:
  import:
    name: Import authorized Notino CJ feed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Import latest CJ offers into the persistent production catalog
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          remote_python=$(cat <<'PY'
          import json
          import sqlite3
          import sys
          import time

          sys.path.insert(0, "/app/backend")
          import catalog_engine

          def state():
              uri = "file:" + str(catalog_engine.DB_PATH) + "?mode=ro"
              conn = sqlite3.connect(uri, uri=True, timeout=45)
              conn.row_factory = sqlite3.Row
              try:
                  row = conn.execute(
                      "SELECT status,started_at,finished_at,discovered_count,error "
                      "FROM sync_state WHERE store=?",
                      ("notino",),
                  ).fetchone()
                  return dict(row) if row else None
              finally:
                  conn.close()

          def is_fresh_feed(value):
              return bool(
                  value
                  and value.get("status") == "FEED_IMPORTED"
                  and value.get("finished_at") is not None
                  and 0 <= time.time() - float(value["finished_at"]) < 23 * 60 * 60
                  and int(value.get("discovered_count") or 0) > 0
              )

          before = state()
          print("NOTINO_IMPORT_BEFORE=" + json.dumps({
              key: before.get(key) for key in (
                  "status", "started_at", "finished_at", "discovered_count", "error"
              )
          }, ensure_ascii=False, default=str) if before else "NOTINO_IMPORT_BEFORE=null", flush=True)

          if not is_fresh_feed(before):
              import_started_at = time.time()
              from scrapers.notino import affiliate_feed as notino_feed
              payload = notino_feed._fetch_feed()
              print("NOTINO_CJ_DOWNLOAD=SUCCESS bytes=" + str(len(payload)), flush=True)

          result = None
          if is_fresh_feed(before):
              result = {
                  "status": "FEED_RECENT",
                  "count": int(before.get("discovered_count") or 0),
                  "source": "cj_viv_authorized_xml",
              }
          else:
              # Import the exact payload already downloaded and inspected above.
              # Do not call discover_store(): it downloads the 78k-item feed again
              # and silently falls back to public crawling when CJ import fails.
              try:
                  report = notino_feed.import_feed_bytes(payload)
                  imported = int(report.get("imported_offers") or 0)
                  if imported <= 0:
                      raise RuntimeError("CJ parser returned zero imported offers")
                  finished_at = time.time()
                  catalog_engine._set_sync_state(
                      "notino",
                      "FEED_IMPORTED",
                      started_at=import_started_at,
                      finished_at=finished_at,
                      discovered_count=imported,
                      fetched_count=imported,
                      error="source=cj_viv_authorized_xml",
                  )
                  result = {
                      "status": "FEED_IMPORTED",
                      "count": imported,
                      "source": "cj_viv_authorized_xml",
                      "products_read": report["products_read"],
                      "valid_links": report["valid_links"],
                  }
              except Exception as exc:
                  print(
                      "NOTINO_IMPORT_FAILED="
                      + json.dumps({
                          "type": type(exc).__name__,
                          "detail": str(exc)[:400],
                      }, ensure_ascii=False),
                      flush=True,
                  )
                  raise

          after = state()
          print("NOTINO_IMPORT_RESULT=" + json.dumps(result, ensure_ascii=False, default=str), flush=True)
          print("NOTINO_IMPORT_AFTER=" + json.dumps({
              key: after.get(key) for key in (
                  "status", "started_at", "finished_at", "discovered_count", "error"
              )
          } if after else None, ensure_ascii=False, default=str), flush=True)

          if not is_fresh_feed(after):
              raise SystemExit("Notino CJ feed import did not reach a fresh FEED_IMPORTED state.")

          # Independently verify persisted rows, not only the sync_state marker.
          verify = sqlite3.connect("file:" + str(catalog_engine.DB_PATH) + "?mode=ro", uri=True, timeout=45)
          try:
              persisted = verify.execute(
                  "SELECT COUNT(*) FROM store_product_variants "
                  "WHERE store=? AND fetched_at>=?",
                  ("notino", float(after["started_at"])),
              ).fetchone()[0]
              urls = verify.execute(
                  "SELECT COUNT(*) FROM store_urls WHERE store=? AND active=1",
                  ("notino",),
              ).fetchone()[0]
          finally:
              verify.close()
          print("NOTINO_PERSISTED_VERIFY=" + json.dumps({
              "fresh_variant_rows": int(persisted),
              "active_product_urls": int(urls),
              "reported_imported_offers": int(after.get("discovered_count") or 0),
          }), flush=True)
          if int(persisted) <= 0 or int(urls) <= 0:
              raise SystemExit("Notino import state exists but no persisted variant/product rows were verified.")
          print("NOTINO_CJ_PRODUCTION_IMPORT=PASS", flush=True)
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'cd /app/backend && printf \"%s\" \"$remote_script_b64\" | base64 -d | /app/.venv/bin/python'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command"
