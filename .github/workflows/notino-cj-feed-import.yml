name: Notino CJ Feed Import

on:
  workflow_run:
    workflows:
      - Fly Deploy
    types:
      - completed
    branches:
      - main
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notino-cj-feed-import
  cancel-in-progress: false

jobs:
  import:
    name: Import authorized Notino CJ feed
    if: ${{ github.event_name == 'workflow_dispatch' || github.event_name == 'schedule' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Import latest CJ offers into the persistent production catalog
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          remote_python=$(cat <<'PY'
          import json
          import sqlite3
          import sys
          import time

          sys.path.insert(0, "/app/backend")
          import catalog_engine

          def state():
              uri = "file:" + str(catalog_engine.DB_PATH) + "?mode=ro"
              conn = sqlite3.connect(uri, uri=True, timeout=45)
              conn.row_factory = sqlite3.Row
              try:
                  row = conn.execute(
                      "SELECT status,started_at,finished_at,discovered_count,error "
                      "FROM sync_state WHERE store=?",
                      ("notino",),
                  ).fetchone()
                  return dict(row) if row else None
              finally:
                  conn.close()

          def is_fresh_feed(value):
              return bool(
                  value
                  and value.get("status") == "FEED_IMPORTED"
                  and value.get("finished_at") is not None
                  and 0 <= time.time() - float(value["finished_at"]) < 23 * 60 * 60
                  and int(value.get("discovered_count") or 0) > 0
              )

          before = state()
          print("NOTINO_IMPORT_BEFORE=" + json.dumps({
              key: before.get(key) for key in (
                  "status", "started_at", "finished_at", "discovered_count", "error"
              )
          }, ensure_ascii=False, default=str) if before else "NOTINO_IMPORT_BEFORE=null", flush=True)

          if not is_fresh_feed(before):
              import collections
              import io
              import zipfile
              import xml.etree.ElementTree as ET
              from scrapers.notino import affiliate_feed as notino_feed
              payload = notino_feed._fetch_feed()
              if zipfile.is_zipfile(io.BytesIO(payload)):
                  with zipfile.ZipFile(io.BytesIO(payload)) as archive:
                      xml_name = next(name for name in archive.namelist() if name.lower().endswith('.xml'))
                      payload = archive.read(xml_name)
              root = ET.fromstring(payload)
              items = [node for node in root.iter() if node.tag.rsplit('}', 1)[-1].lower() in {'item','entry','product'}]
              tag_counts = collections.Counter()
              host_counts = collections.Counter()
              link_shapes = collections.Counter()
              for item in items:
                  for child in list(item):
                      tag = child.tag.rsplit('}', 1)[-1].lower()
                      tag_counts[tag] += 1
                      if tag in {'link','url','producturl','deep_link','deeplink','buy_url'}:
                          raw = (child.text or child.attrib.get('href') or '').strip()
                          parsed = __import__('urllib.parse', fromlist=['urlparse']).urlparse(raw)
                          host_counts[(parsed.hostname or 'NO_HOST').lower()] += 1
                          keys = tuple(sorted(__import__('urllib.parse', fromlist=['parse_qs']).parse_qs(parsed.query).keys()))
                          link_shapes[(parsed.scheme or 'NO_SCHEME', parsed.path.split('/')[1] if parsed.path.count('/') > 1 else '/', keys)] += 1
              print('NOTINO_CJ_SCHEMA=' + json.dumps({
                  'items': len(items),
                  'field_names': dict(tag_counts.most_common(40)),
                  'link_hosts': dict(host_counts.most_common(15)),
                  'link_shapes': [{'scheme': k[0], 'first_path_segment': k[1], 'query_keys': list(k[2]), 'count': v} for k,v in link_shapes.most_common(12)],
              }, ensure_ascii=False), flush=True)

          result = None
          if is_fresh_feed(before):
              result = {
                  "status": "FEED_RECENT",
                  "count": int(before.get("discovered_count") or 0),
                  "source": "cj_viv_authorized_xml",
              }
          else:
              last_error = None
              for attempt in range(1, 4):
                  try:
                      result = catalog_engine.discover_store("notino")
                      break
                  except Exception as exc:
                      last_error = exc
                      print(
                          "NOTINO_IMPORT_ATTEMPT_FAILED="
                          + json.dumps({"attempt": attempt, "type": type(exc).__name__, "detail": str(exc)[:240]}),
                          flush=True,
                      )
                      if attempt < 3:
                          time.sleep(attempt * 20)
              if result is None:
                  raise RuntimeError(
                      "Notino importer could not complete safely after three attempts: "
                      + type(last_error).__name__
                  )

          after = state()
          print("NOTINO_IMPORT_RESULT=" + json.dumps(result, ensure_ascii=False, default=str), flush=True)
          print("NOTINO_IMPORT_AFTER=" + json.dumps({
              key: after.get(key) for key in (
                  "status", "started_at", "finished_at", "discovered_count", "error"
              )
          } if after else None, ensure_ascii=False, default=str), flush=True)

          if not is_fresh_feed(after):
              raise SystemExit(
                  "Notino CJ feed import did not reach a fresh FEED_IMPORTED state; "
                  "public discovery fallback is not accepted as a successful CJ import."
              )
          print("NOTINO_CJ_PRODUCTION_IMPORT=PASS", flush=True)
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'cd /app/backend && printf \"%s\" \"$remote_script_b64\" | base64 -d | /app/.venv/bin/python'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command"
