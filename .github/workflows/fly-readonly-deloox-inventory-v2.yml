name: Fly read-only Deloox inventory v2

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-inventory-v2.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Count Deloox records in SQLite read-only mode
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import sqlite3,json; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True,timeout=5); c.execute(\"PRAGMA query_only=ON\"); out={\"store_urls\":c.execute(\"SELECT COUNT(*) FROM store_urls WHERE store = ?\",(\"deloox\",)).fetchone()[0],\"store_products\":c.execute(\"SELECT COUNT(*) FROM store_products WHERE store = ?\",(\"deloox\",)).fetchone()[0],\"hydration_queue\":c.execute(\"SELECT COUNT(*) FROM hydration_queue WHERE store = ?\",(\"deloox\",)).fetchone()[0]}; print(json.dumps({\"read_only\":True,\"database_mutated\":False,\"deloox\":out})); c.close()'"
