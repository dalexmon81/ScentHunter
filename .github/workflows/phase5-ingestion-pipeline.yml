name: Phase 5 Ingestion Pipeline

on:
  push:
    branches:
      - phase5/redis-celery-ingestion-pipeline
    paths:
      - "backend/app/workers/**"
      - "backend/app/api/**"
      - "backend/main.py"
      - "frontend/index.html"
      - "backend/app/connectors/**"
      - "backend/app/models/**"
      - "backend/alembic/versions/**"
      - "backend/tests/test_celery_ingestion_pipeline.py"
      - "backend/tests/test_connector_ingestion_worker.py"
      - "backend/tests/test_connector_ingestion_session_defaults.py"
      - "backend/tests/test_offer_matching_worker.py"
      - "backend/tests/test_offer_promotion_worker.py"
      - "backend/tests/test_offer_detail_refresh_api.py"
      - "backend/requirements.txt"
      - "backend/Dockerfile.worker"
      - "docker-compose.ingestion.yml"
      - ".github/workflows/phase5-ingestion-pipeline.yml"
  pull_request:
    branches:
      - phase3/product-normalization
    paths:
      - "backend/app/workers/**"
      - "backend/app/api/**"
      - "backend/main.py"
      - "frontend/index.html"
      - "backend/app/connectors/**"
      - "backend/tests/test_celery_ingestion_pipeline.py"
      - "backend/tests/test_connector_ingestion_worker.py"
      - "backend/tests/test_connector_ingestion_session_defaults.py"
      - "backend/tests/test_offer_matching_worker.py"
      - "backend/tests/test_offer_promotion_worker.py"
      - "backend/tests/test_offer_detail_refresh_api.py"
      - "backend/requirements.txt"
      - "backend/Dockerfile.worker"
      - "docker-compose.ingestion.yml"
      - ".github/workflows/phase5-ingestion-pipeline.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingestion-pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONPATH: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml sqlalchemy pyyaml celery[redis]==5.5.3
      - name: Compile pipeline and workers
        run: python -m compileall -q backend/app/workers backend/app/connectors backend/app/models backend/alembic/versions backend/tests/test_celery_ingestion_pipeline.py backend/tests/test_connector_ingestion_worker.py backend/tests/test_connector_ingestion_session_defaults.py backend/tests/test_offer_matching_worker.py backend/tests/test_offer_promotion_worker.py backend/tests/test_offer_detail_refresh_api.py
      - name: Run ingestion, matching, promotion and queue tests
        run: python -m pytest -q backend/tests/test_celery_ingestion_pipeline.py backend/tests/test_connector_ingestion_worker.py backend/tests/test_connector_ingestion_session_defaults.py backend/tests/test_offer_matching_worker.py backend/tests/test_offer_promotion_worker.py backend/tests/test_offer_detail_refresh_api.py
