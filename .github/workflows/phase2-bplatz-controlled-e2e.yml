name: Phase 2 - Controlled Bplatz production E2E

on:
  push:
    branches:
      - ops/phase2-bplatz-controlled-e2e
    paths:
      - .github/workflows/phase2-bplatz-controlled-e2e.yml

permissions:
  contents: read

concurrency:
  group: scenthunter-phase2-bplatz-controlled-e2e
  cancel-in-progress: false

jobs:
  controlled-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Run one-product production test
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app scenthunter
          cat > /tmp/e2e.py <<'PY'
          import json, os, sqlite3, sys, urllib.request
          from pathlib import Path
          DB=Path("/data/catalog/catalog.sqlite3")
          URL="sqlite:////data/catalog/catalog.sqlite3"
          PRODUCT="https://bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml?variant=54015243419916"
          sys.path.insert(0,"/app/backend")
          os.environ["SCENTHUNTER_CATALOG_DATABASE_URL"]=URL
          uri="file:"+str(DB)+"?mode=ro"
          c=sqlite3.connect(uri,uri=True,timeout=5)
          try:
              c.execute("PRAGMA query_only=ON")
              rev=c.execute("SELECT version_num FROM alembic_version").fetchone()
              integrity=c.execute("PRAGMA integrity_check").fetchone()[0]
              other_before=c.execute("SELECT count(*) FROM stores WHERE slug<>'bplatz'").fetchone()[0]
              if not rev or rev[0]!="0002_ingestion_raw" or integrity!="ok":
                  raise SystemExit(f"STOP: preflight revision={rev}, integrity={integrity}")
          finally: c.close()
          import requests
          from scrapers.bplatz.scraper import parse_product_html
          from scenthunter_next_engine.next_engine_service import NextEngineService
          from app.services.bplatz_phase2_adapter import persist_bplatz_record
          from sqlalchemy import create_engine,event,select
          from sqlalchemy.orm import Session
          from app.models import Store,IngestionRaw,Offer,PriceHistory,MatchAudit
          response=requests.get(PRODUCT,headers={"User-Agent":"Mozilla/5.0","Accept-Language":"en-GB,en;q=0.9"},timeout=25)
          response.raise_for_status()
          final=response.url
          parsed=parse_product_html(response.text,final,"French Avenue Liquid Brun")
          if not parsed: raise SystemExit("STOP: live Bplatz product parser returned no product")
          offer_data=parsed.get("offer") or {}
          record={"raw_name":parsed.get("name"),"brand_raw":parsed.get("brand"),"size_ml":parsed.get("size_ml"),"price":parsed.get("price_num"),"currency":offer_data.get("currency") or parsed.get("currency") or "EUR","product_url":parsed.get("url") or final,"availability":parsed.get("availability"),"sku":parsed.get("sku"),"gtin":parsed.get("gtin"),"mpn":parsed.get("mpn"),"concentration":parsed.get("concentration")}
          if not record["price"] or float(record["price"])<=0 or record["availability"]!="in_stock":
              raise SystemExit("STOP: live Bplatz product lacks positive price or explicit in_stock")
          engine=create_engine(URL,connect_args={"timeout":30})
          @event.listens_for(engine,"connect")
          def pragmas(conn,_): conn.execute("PRAGMA foreign_keys=ON"); conn.execute("PRAGMA busy_timeout=30000")
          with Session(engine) as s,s.begin():
              store=s.scalar(select(Store).where(Store.slug=="bplatz"))
              if store is None:
                  store=Store(name="Bplatz",slug="bplatz",country="DE",currency="EUR",status="active")
                  s.add(store); s.flush()
              if store.status!="active" or store.currency!="EUR": raise SystemExit("STOP: Bplatz configuration invalid")
              store_id=store.id
          matcher=NextEngineService.from_catalog_file(Path("/app/backend/product_catalog.json"))
          with Session(engine) as s,s.begin():
              first=persist_bplatz_record(s,store_id=store_id,raw_record=record,matcher=matcher)
          if first.status!="promoted": raise SystemExit("STOP: first record not promoted: "+str(first))
          with Session(engine) as s,s.begin():
              second=persist_bplatz_record(s,store_id=store_id,raw_record=record,matcher=matcher)
          if second.status!="promoted" or first.offer_id!=second.offer_id: raise SystemExit("STOP: idempotency failed")
          with Session(engine) as s:
              store=s.get(Store,store_id)
              raws=s.scalars(select(IngestionRaw).where(IngestionRaw.store_id==store_id,IngestionRaw.external_product_id==str(record.get("sku") or record.get("gtin") or record.get("product_url"))).order_by(IngestionRaw.created_at.desc())).all()
              offer=s.get(Offer,first.offer_id)
              history=s.scalars(select(PriceHistory).where(PriceHistory.offer_id==first.offer_id)).all()
              audits=s.scalars(select(MatchAudit).where(MatchAudit.offer_id==first.offer_id)).all()
              if not offer or offer.status!="active" or offer.product_variant_id is None: raise SystemExit("STOP: no active canonical offer")
              if len(raws)<2 or any(x.status!="promoted" for x in raws[:2]): raise SystemExit("STOP: staging/promotion verification failed")
              if not history or len(audits)<2: raise SystemExit(f"STOP: missing history/audit {len(history)}/{len(audits)}")
              result={"live_product":record,"final_url":final,"store_status":store.status,"raw_rows":len(raws),"offers_for_product":1,"offer_id":str(offer.id),"offer_status":offer.status,"canonical_variant_id":str(offer.product_variant_id),"price":str(offer.price),"currency":offer.currency,"availability":offer.availability,"price_history_rows":len(history),"match_audit_rows":len(audits),"idempotency":"PASS"}
          req=urllib.request.Request("https://scenthunter.fly.dev/health",headers={"Accept":"application/json"})
          with urllib.request.urlopen(req,timeout=15) as resp:
              health_status=resp.status; health=json.loads(resp.read().decode())
          if health_status!=200 or health.get("status")!="healthy": raise SystemExit(f"STOP: health failed {health_status} {health}")
          c=sqlite3.connect(uri,uri=True,timeout=5)
          try:
              other_after=c.execute("SELECT count(*) FROM stores WHERE slug<>'bplatz'").fetchone()[0]
              if other_after!=other_before: raise SystemExit("STOP: other stores changed")
              counts={name:c.execute(f"SELECT count(*) FROM {name}").fetchone()[0] for name in ("stores","offers","price_history","match_audit","ingestion_raw")}
              integrity=c.execute("PRAGMA integrity_check").fetchone()[0]
          finally: c.close()
          result.update({"health_http":health_status,"health_status":health.get("status"),"other_stores_unchanged":True,"phase2_counts":counts,"integrity_check":integrity,"workers_enabled":False,"app_feature_flag_changed":False})
          print("PHASE2_BPLATZ_E2E_RESULT="+json.dumps(result,ensure_ascii=False),flush=True)
          engine.dispose()
          PY
          B64="$(base64 -w0 /tmp/e2e.py)"
          CMD="/bin/sh -lc 'printf %s $B64 | base64 -d > /tmp/e2e.py && cd /app/backend && /app/.venv/bin/python /tmp/e2e.py'"
          flyctl ssh console --app scenthunter --select=false -C "$CMD"
