name: Fly read-only Deloox catalog inventory

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Count Deloox catalog records (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; c=sqlite3.connect(chr(102)+chr(105)+chr(108)+chr(101)+chr(58)+chr(47)+chr(100)+chr(97)+chr(116)+chr(97)+chr(47)+chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(95)+chr(99)+chr(97)+chr(116)+chr(97)+chr(108)+chr(111)+chr(103)+chr(46)+chr(115)+chr(113)+chr(108)+chr(105)+chr(116)+chr(101)+chr(51)+chr(63)+chr(109)+chr(111)+chr(100)+chr(101)+chr(61)+chr(114)+chr(111),uri=True,timeout=5); c.row_factory=sqlite3.Row; c.execute(chr(80)+chr(82)+chr(65)+chr(71)+chr(77)+chr(65)+chr(32)+chr(113)+chr(117)+chr(101)+chr(114)+chr(121)+chr(95)+chr(111)+chr(110)+chr(108)+chr(121)+chr(61)+chr(79)+chr(78)); print(json.dumps({chr(115)+chr(116)+chr(111)+chr(114)+chr(101):chr(100)+chr(101)+chr(108)+chr(111)+chr(111)+chr(120),chr(114)+chr(101)+chr(97)+chr(100)+chr(95)+chr(111)+chr(110)+chr(108)+chr(121):True,chr(100)+chr(97)+chr(116)+chr(97)+chr(98)+chr(97)+chr(115)+chr(101)+chr(95)+chr(109)+chr(117)+chr(116)+chr(97)+chr(116)+chr(101)+chr(100):False,chr(116)+chr(97)+chr(98)+chr(108)+chr(101)+chr(115):{chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(95)+chr(117)+chr(114)+chr(108)+chr(115):c.execute(chr(83)+chr(69)+chr(76)+chr(69)+chr(67)+chr(84)+chr(32)+chr(67)+chr(79)+chr(85)+chr(78)+chr(84)+chr(40)+chr(42)+chr(41)+chr(32)+chr(70)+chr(82)+chr(79)+chr(77)+chr(32)+chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(95)+chr(117)+chr(114)+chr(108)+chr(115)+chr(32)+chr(87)+chr(72)+chr(69)+chr(82)+chr(69)+chr(32)+chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(61)+chr(63),(chr(100)+chr(101)+chr(108)+chr(111)+chr(111)+chr(120),)).fetchone()[0],chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(95)+chr(112)+chr(114)+chr(111)+chr(100)+chr(117)+chr(99)+chr(116)+chr(115):c.execute(chr(83)+chr(69)+chr(76)+chr(69)+chr(67)+chr(84)+chr(32)+chr(67)+chr(79)+chr(85)+chr(78)+chr(84)+chr(40)+chr(42)+chr(41)+chr(32)+chr(70)+chr(82)+chr(79)+chr(77)+chr(32)+chr(115)+chr(116)+chr(111)+chr(114)+chr(101)+chr(95)+chr(112)+