name: SQLite Transaction Telemetry Tests

on:
  push:
    branches:
      - chore/sqlite-lock-telemetry-hardening
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sqlite-telemetry:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run SQLite telemetry regression tests
        run: python -m unittest tests.test_sqlite_transaction_telemetry -v
