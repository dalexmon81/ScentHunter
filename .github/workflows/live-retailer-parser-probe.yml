name: Live Retailer Parser Probe

on:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - "tests/run_live_retailer_parser_probe.py"
      - ".github/workflows/live-retailer-parser-probe.yml"
      - "backend/scrapers/deloox/scraper.py"
      - "backend/scrapers/parfumzentrum/scraper.py"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  live-retailer-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out working branch
        uses: actions/checkout@v4
        with:
          ref: scenthunter-next-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install bounded probe dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Run live retailer probe
        run: python -m tests.run_live_retailer_parser_probe
      - name: Upload live parser report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: live-retailer-parser-probe
          path: live-retailer-parser-probe.json
          if-no-files-found: warn
          retention-days: 7
