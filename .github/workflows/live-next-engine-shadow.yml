name: Manual Live Next Engine Shadow

on:
  push:
    branches: [architecture/offer-engine-v1]
    paths:
      - "backend/offer_engine/**"
      - "backend/scrapers/deloox/**"
  workflow_dispatch:
    inputs:
      confirm_live_read_only:
        description: "Confirm live retailer requests only; no production search, database, or catalog writes"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  live-shadow:
    if: ${{ github.event_name == 'push' || inputs.confirm_live_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4
        with:
          ref: architecture/offer-engine-v1

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Install Chromium for Deloox's browser-aware anti-bot fallback
        run: python -m playwright install chromium

      - name: Run bounded live Deloox offer smoke test
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m backend.offer_engine.live_deloox_smoke

      - name: Upload live comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-engine-live-deloox-smoke
          path: next-engine-live-deloox-smoke.json
          if-no-files-found: warn
          retention-days: 7
