name: Manual Live Next Engine Shadow

on:
  workflow_dispatch:
    inputs:
      confirm_live_read_only:
        description: "Confirm live retailer requests only; no production search, database, or catalog writes"
        required: true
        type: choice
        options:
          - "no"
          - "yes"
        default: "no"

permissions:
  contents: read

jobs:
  live-shadow:
    if: ${{ inputs.confirm_live_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install scraper and test dependencies
        run: python -m pip install requests beautifulsoup4 pytest fastapi httpx

      - name: Run manual bounded live-offer shadow comparison
        env:
          PYTHONUNBUFFERED: "1"
        run: python -m tests.run_next_engine_live_shadow

      - name: Upload live comparison report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: next-engine-live-shadow-comparison
          path: next-engine-live-shadow-comparison.json
          if-no-files-found: warn
          retention-days: 7
