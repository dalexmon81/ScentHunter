name: PerfumeMarket single-request live ingestion

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Respect the retailer cooldown
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from datetime import datetime, timezone
          import time

          deadline = datetime(2026, 11, 27, 5, 41, 0, tzinfo=timezone.utc).timestamp()
          remaining = max(0, int(deadline - time.time()))
          print(f"PerfumeMarket cooldown wait: {remaining} seconds")
          if remaining:
              time.sleep(remaining)
          print("PERFUMEMARKET_COOLDOWN_CLEARED=YES")
          PY

      - name: Require the matching Fly deployment to be successful
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SHA="a5f849051897043abbeabd1654b871d3722d28f8"
          READY=0
          for attempt in $(seq 1 60); do
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            STATUS="$(printf '%s' "$RUNS" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .status // "missing"')"
            CONCLUSION="$(printf '%s' "$RUNS" | jq -r --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .conclusion // ""')"
            echo "PerfumeMarket target deployment: $STATUS / $CONCLUSION ($attempt/60)"
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then READY=1; break; fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo "The target Fly deployment did not succeed; no retailer request will be made." >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo "The target Fly deployment is not confirmed successful; no retailer request will be made." >&2
            exit 1
          fi

      - name: Fetch one live product page and ingest only verified data
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine list --app scenthunter --json > machines.json
          WORKER_ID="$(python - <<'PY'
          import json
          with open("machines.json", encoding="utf-8") as handle:
              machines = json.load(handle)
          workers = [
              machine for machine in machines
              if machine.get("state") == "started"
              and machine.get("config", {}).get("metadata", {}).get("fly_process_group") == "worker"
          ]
          if not workers:
              raise SystemExit("No started ScentHunter worker machine found")
          print(workers[0]["id"])
          PY
          )"
          echo "Selected worker machine: $WORKER_ID"

          SCRIPT="$(cat <<'PY'
          from uuid import UUID
          import requests
          from sqlalchemy import text

          from app.db import make_session_factory
          from app.models import Store
          from app.connectors.legacy_scrapers import LegacyScraperConnector
          from app.offers.ingestion import persist_connector_record
          from app.repositories.ingestion_runs import (
              start_ingestion_run,
              record_ingestion_progress,
              finish_ingestion_run,
          )
          from app.workers.notino_runtime import _matcher
          from scrapers.perfumemarket import scraper

          STORE_ID = UUID("a812a185-4e57-4da0-aef9-bee1d491b592")
          PRODUCT_URL = "https://perfumemarket.eu/products/rasasi-hawas-london-100ml-edp"
          EXPECTED_GTIN = "614514465059"
          factory = make_session_factory()

          with factory() as session:
              store = session.get(Store, STORE_ID)
              if store is None or store.slug != "perfumemarket":
                  raise RuntimeError("PerfumeMarket canonical store is missing")
              existing = session.execute(text("""
                  SELECT count(*) FROM offers
                  WHERE store_id=:store_id AND status='active'
              """), {"store_id": str(STORE_ID)}).scalar_one()
              if existing:
                  print("PERFUMEMARKET_ALREADY_HAS_ACTIVE_OFFERS=" + str(existing))
                  raise SystemExit(0)

          # Exactly one retailer HTTP request. No search endpoints, sitemap,
          # retries, queue discovery, or second product-page fetch are used.
          with requests.Session() as http:
              record = scraper.extract_product_page(
                  http, PRODUCT_URL, query="Rasasi Hawas London"
              )

          if not isinstance(record, dict):
              raise RuntimeError("The single live product-page request returned no valid product record")

          observed = {
              "name": record.get("name"),
              "brand": record.get("brand"),
              "price": record.get("price_num"),
              "currency": record.get("currency"),
              "currency_explicit": record.get("currency_explicit"),
              "availability": record.get("availability"),
              "gtin": record.get("gtin"),
              "url": record.get("url"),
          }
          print("PERFUMEMARKET_LIVE_EVIDENCE=" + repr(observed))

          if str(record.get("gtin") or "") != EXPECTED_GTIN:
              raise RuntimeError("Live GTIN did not match the canonical Rasasi Hawas London 100 ml variant")
          if record.get("currency") != "EUR" or record.get("currency_explicit") is not True:
              raise RuntimeError("Live source did not explicitly confirm EUR currency")
          if record.get("availability") != "in_stock":
              raise RuntimeError("Live source did not explicitly confirm in-stock availability")
          try:
              price = float(record.get("price_num"))
          except (TypeError, ValueError):
              raise RuntimeError("Live source returned no valid price") from None
          if price <= 0:
              raise RuntimeError("Live source returned a non-positive price")
          if record.get("url") != PRODUCT_URL:
              raise RuntimeError("Live product URL did not match the approved canonical URL")

          connector = LegacyScraperConnector("perfumemarket", scraper)
          matcher = _matcher()
          promotion_error = None
          with factory() as session, session.begin():
              store = session.get(Store, STORE_ID)
              run_id = start_ingestion_run(session, store_id=STORE_ID)
              result = persist_connector_record(
                  session,
                  connector=connector,
                  store_id=STORE_ID,
                  raw_record=record,
                  matcher=matcher,
              )
              if result.status == "promoted" and result.offer_id:
                  store.status = "active"
                  record_ingestion_progress(
                      session, run_id=run_id,
                      products_discovered=1, offers_created=1,
                  )
                  finish_ingestion_run(session, run_id=run_id, status="completed")
              else:
                  promotion_error = str(result.reason or result.status)
                  record_ingestion_progress(
                      session, run_id=run_id,
                      products_discovered=1, offers_rejected=1,
                      error="canonical_promotion_not_completed:" + promotion_error,
                  )
                  finish_ingestion_run(session, run_id=run_id, status="partial")
              print("PERFUMEMARKET_INGESTION_RUN=" + str(run_id))
              print("PERFUMEMARKET_OFFER_ID=" + str(result.offer_id))
          if promotion_error:
              raise RuntimeError(
                  "Live product was fetched but canonical offer promotion was not approved: "
                  + promotion_error
              )

          with factory() as session:
              row = session.execute(text("""
                  SELECT s.status AS store_status, o.status AS offer_status,
                         o.price::text AS price, o.currency, o.availability, o.url,
                         b.name AS brand, f.name AS fragrance,
                         pv.size_ml, pv.gtin
                  FROM stores s
                  JOIN offers o ON o.store_id=s.id
                  JOIN product_variants pv ON pv.id=o.product_variant_id
                  JOIN fragrances f ON f.id=pv.fragrance_id
                  JOIN brands b ON b.id=f.brand_id
                  WHERE s.id=:store_id AND o.status='active'
                    AND pv.gtin=:gtin
                  ORDER BY o.captured_at DESC
                  LIMIT 1
              """), {"store_id": str(STORE_ID), "gtin": EXPECTED_GTIN}).mappings().first()
              if not row:
                  raise RuntimeError("No active canonical offer was found after ingestion")
              if row["store_status"] != "active" or row["currency"] != "EUR" or row["availability"] != "in_stock":
                  raise RuntimeError("Persisted PerfumeMarket offer failed final publication checks")
              print("PERFUMEMARKET_FINAL_VERIFICATION=PASS")
              print("PERFUMEMARKET_PERSISTED_OFFER=" + repr(dict(row)))
          PY
          )"
          ENCODED="$(printf '%s' "$SCRIPT" | base64 -w0)"
          REMOTE_SCRIPT="cd /app/backend && printf '%s' '$ENCODED' | base64 -d | /app/.venv/bin/python"
          printf -v REMOTE_COMMAND '/bin/sh -lc %q' "$REMOTE_SCRIPT"

          set +e
          OUTPUT="$(timeout 180s flyctl ssh console --app scenthunter --machine "$WORKER_ID" --pty=false --quiet -C "$REMOTE_COMMAND" 2>&1)"
          STATUS=$?
          set -e
          printf '%s\\n' "$OUTPUT"

          if [ "$STATUS" -ne 0 ]; then
            echo "::error::PerfumeMarket remote verification process exited with status $STATUS."
            exit "$STATUS"
          fi
          if ! grep -q "PERFUMEMARKET_FINAL_VERIFICATION=PASS" <<< "$OUTPUT"; then
            echo "::error::PerfumeMarket remote process did not emit the final persisted-offer PASS marker."
            exit 1
          fi
