name: Deploy staging worker # verify refreshed Fly secrets
on:
  push:
    branches:
      - phase5/fly-staging-workers-config
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/fly-staging-workers-config
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing repository secret FLY_API_TOKEN"
            exit 1
          fi
      - name: Apply staged Fly secrets
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl secrets list --app scenthunter-staging-workers
          flyctl secrets deploy --app scenthunter-staging-workers
      - name: Deploy isolated worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.workers.toml --remote-only --yes
      - name: Start stopped worker machines
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machine_ids="$(flyctl machines list --app scenthunter-staging-workers --json | jq -r '.[] | select(.state == "stopped") | .id')"
          if [ -z "$machine_ids" ]; then
            echo "No stopped machines found."
          else
            while IFS= read -r machine_id; do
              [ -z "$machine_id" ] && continue
              echo "Starting worker machine $machine_id"
              flyctl machine start "$machine_id" --app scenthunter-staging-workers
            done <<< "$machine_ids"
          fi
      - name: Allow worker startup and broker connection
        run: sleep 10
      - name: Inspect worker logs and machine state
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          flyctl status --app scenthunter-staging-workers
          flyctl machines list --app scenthunter-staging-workers
          flyctl logs --app scenthunter-staging-workers --no-tail
