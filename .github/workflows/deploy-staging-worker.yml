name: Deploy staging worker
on:
  push:
    branches:
      - phase5/fly-staging-workers-config
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: phase5/fly-staging-workers-config
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Check Fly token
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing repository secret FLY_API_TOKEN"
            exit 1
          fi
      - name: Deploy isolated worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --config fly.workers.toml --remote-only --yes
