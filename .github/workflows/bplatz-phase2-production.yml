name: Bplatz Phase 2 guarded production verification

on:
  push:
    branches:
      - ops/bplatz-phase2-production-20261102
    paths:
      - .github/workflows/bplatz-phase2-production.yml

permissions:
  contents: read

concurrency:
  group: scenthunter-bplatz-phase2-production
  cancel-in-progress: false

jobs:
  isolated-tests:
    name: Re-run isolated Phase 2 and Bplatz tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Run isolated seed, schema and Bplatz persistence tests
        run: >-
          python -m pytest -q -s
          tests/test_phase2_seed_catalog.py
          tests/test_phase2_schema_contract.py
          tests/test_bplatz_persistence_service.py

  production-bplatz:
    name: Back up both SQLite databases and retry one Bplatz hydration without schema reinitialization
    needs: isolated-tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly app and persistent volume
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl status --app scenthunter --json
          flyctl machines list --app scenthunter --json
          flyctl volumes list --app scenthunter | tee /tmp/fly-volumes.txt
          grep -Fq 'scenthunter_data' /tmp/fly-volumes.txt
          grep -Fq 'ams' /tmp/fly-volumes.txt

      - name: Back up both databases and perform one bounded hydration retry
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          cat > /tmp/phase2_bplatz_retry.py <<'PY'
          from __future__ import annotations
          import json
          import os
          import shutil
          import sqlite3
          import subprocess
          import sys
          import time
          from pathlib import Path

          BACKEND = Path("/app/backend")
          PYTHON = "/app/.venv/bin/python"
          PHASE2_DB = Path("/data/catalog/catalog.sqlite3")
          LEGACY_DB = Path("/data/store_catalog.sqlite3")
          TARGET_URL = "https://bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml?variant=54015243419916"
          PRIOR_BACKUP = Path("/data/backups/phase2-pre-bplatz-41458629766.sqlite3")
          REQUIRED_PHASE2 = {
              "alembic_version", "brands", "fragrances", "product_variants",
              "stores", "offers", "price_history", "match_audit",
              "ingestion_runs", "ingestion_raw",
              "legacy_product_id_map", "legacy_variant_id_map",
          }

          def fail(message):
              raise SystemExit("STOP: " + message)

          def readonly(path):
              return sqlite3.connect("file:" + str(path) + "?mode=ro", uri=True, timeout=45)

          def inspect_db(path, required_tables=None):
              con = readonly(path)
              try:
                  tables = {
                      row[0] for row in con.execute(
                          "SELECT name FROM sqlite_master WHERE type='table'"
                      )
                  }
                  missing = sorted((required_tables or set()) - tables)
                  if missing:
                      fail(f"{path}: missing tables {missing}")
                  integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
                  fk_errors = con.execute("PRAGMA foreign_key_check").fetchall()
                  counts = {
                      table: con.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                      for table in sorted((required_tables or set()) - {"alembic_version"})
                  }
                  return {
                      "integrity_check": integrity,
                      "foreign_key_errors": len(fk_errors),
                      "counts": counts,
                      "tables": sorted(tables),
                  }
              finally:
                  con.close()

          def online_backup(source_path, destination_path, required_tables=None):
              if not source_path.is_file() or source_path.stat().st_size <= 0:
                  fail(f"database missing or empty: {source_path}")
              if destination_path.exists():
                  fail(f"refusing to overwrite backup: {destination_path}")
              destination_path.parent.mkdir(parents=True, exist_ok=True)
              required_free = max(source_path.stat().st_size * 2, 20 * 1024 * 1024)
              free_bytes = shutil.disk_usage(destination_path.parent).free
              if free_bytes < required_free:
                  fail(f"insufficient free space for {source_path}: free={free_bytes}, required={required_free}")

              before = inspect_db(source_path, required_tables)
              if before["integrity_check"] != "ok" or before["foreign_key_errors"]:
                  fail(f"source database failed integrity check: {source_path}: {before}")

              started = time.monotonic()
              source = sqlite3.connect(str(source_path), timeout=45)
              destination = sqlite3.connect(str(destination_path), timeout=45)
              try:
                  source.execute("PRAGMA busy_timeout=45000")
                  destination.execute("PRAGMA busy_timeout=45000")
                  def progress(_status, _remaining, _total):
                      if time.monotonic() - started > 120:
                          raise TimeoutError(f"online backup timed out: {source_path}")
                  source.backup(destination, pages=512, progress=progress, sleep=0.05)
                  destination.commit()
              finally:
                  destination.close()
                  source.close()

              after = inspect_db(destination_path, required_tables)
              if after != before:
                  fail(f"backup does not match source snapshot: {source_path}")
              return {
                  "path": str(destination_path),
                  "bytes": destination_path.stat().st_size,
                  "integrity_check": after["integrity_check"],
                  "foreign_key_errors": after["foreign_key_errors"],
                  "counts": after["counts"],
              }

          if not PRIOR_BACKUP.is_file():
              fail(f"previous pre-seed backup is missing: {PRIOR_BACKUP}")
          prior = inspect_db(PRIOR_BACKUP, REQUIRED_PHASE2)
          if prior["integrity_check"] != "ok" or prior["foreign_key_errors"]:
              fail(f"previous pre-seed backup no longer verifies: {prior}")

          phase2_before = inspect_db(PHASE2_DB, REQUIRED_PHASE2)
          if phase2_before["integrity_check"] != "ok" or phase2_before["foreign_key_errors"]:
              fail(f"Phase 2 database failed preflight: {phase2_before}")
          con = readonly(PHASE2_DB)
          try:
              revision = con.execute("SELECT version_num FROM alembic_version").fetchone()[0]
              bplatz = con.execute(
                  "SELECT name,slug,domain,country,currency,status FROM stores WHERE slug='bplatz'"
              ).fetchall()
          finally:
              con.close()
          if revision != "0003_store_domain":
              fail(f"unexpected Phase 2 Alembic revision: {revision!r}")
          if bplatz != [("Bplatz", "bplatz", "bplatz.de", "DE", "EUR", "active")]:
              fail(f"Bplatz store is not active and canonical: {bplatz}")

          # The failed attempt reached the product parser but failed when the
          # one-off process reran _ensure_schema() and its large legacy Deloox
          # priority backfill. Preserve both current databases, then bypass only
          # that already-completed startup initializer after checking its tables.
          run_id = os.environ.get("GITHUB_RUN_ID", "manual")
          backup_dir = Path("/data/backups")
          phase2_backup = online_backup(
              PHASE2_DB, backup_dir / f"phase2-pre-liquid-brun-retry-{run_id}.sqlite3",
              REQUIRED_PHASE2,
          )

          legacy_required = {"store_urls", "store_products", "hydration_queue", "catalog_discovery_queue"}
          legacy_before = inspect_db(LEGACY_DB)
          if legacy_before["integrity_check"] != "ok":
              fail(f"legacy catalog failed integrity check: {legacy_before}")
          legacy_backup = online_backup(
              LEGACY_DB, backup_dir / f"legacy-pre-liquid-brun-retry-{run_id}.sqlite3",
          )
          legacy_con = readonly(LEGACY_DB)
          try:
              legacy_tables = {
                  row[0] for row in legacy_con.execute(
                      "SELECT name FROM sqlite_master WHERE type='table'"
                  )
              }
              missing = sorted(legacy_required - legacy_tables)
              if missing:
                  fail(f"legacy catalog schema is incomplete: {missing}")
              store_url_columns = {
                  row[1] for row in legacy_con.execute("PRAGMA table_info(store_urls)")
              }
              store_product_columns = {
                  row[1] for row in legacy_con.execute("PRAGMA table_info(store_products)")
              }
              if not {"store", "url", "slug", "discovered_at", "active"}.issubset(store_url_columns):
                  fail(f"store_urls columns are incomplete: {sorted(store_url_columns)}")
              if not {"store", "url", "name", "brand", "price", "currency", "availability", "fetch_status"}.issubset(store_product_columns):
                  fail(f"store_products columns are incomplete: {sorted(store_product_columns)}")
          finally:
              legacy_con.close()

          print("PHASE2_BACKUPS_VERIFIED=" + json.dumps({
              "previous_pre_seed_backup": str(PRIOR_BACKUP),
              "phase2_backup": phase2_backup,
              "legacy_backup": legacy_backup,
              "phase2_revision": revision,
              "phase2_counts": phase2_before["counts"],
              "legacy_counts": legacy_before["counts"],
          }, ensure_ascii=False), flush=True)

          hydration_code = r'''
          import json, sys
          sys.path.insert(0, "/app/backend")
          import catalog_engine
          # The deployed app already initialized and uses these exact legacy
          # tables. Avoid re-running _ensure_schema(), which also rewrites the
          # large Deloox priority frontier and caused the previous SQLite lock.
          catalog_engine._SCHEMA_READY = True
          target = "https://bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml?variant=54015243419916"
          item = catalog_engine.refresh_url("bplatz", target)
          if not isinstance(item, dict):
              raise SystemExit("Bplatz Liquid Brun refresh returned no product")
          try:
              price = float(item.get("price_num"))
          except (TypeError, ValueError):
              price = 0.0
          availability = str(item.get("availability") or "").strip().lower()
          if price <= 0 or availability not in {"in_stock", "out_of_stock"}:
              raise SystemExit("Bplatz Liquid Brun refresh returned invalid price/availability: " + repr(item))
          print("BPLATZ_LIQUID_BRUN_HYDRATION=" + json.dumps({
              "name": item.get("name"),
              "brand": item.get("brand"),
              "url": item.get("url") or target,
              "price": price,
              "currency": item.get("currency") or "EUR",
              "availability": availability,
              "sku": item.get("sku"),
              "gtin": item.get("gtin"),
          }, ensure_ascii=False, default=str), flush=True)
          '''
          env = os.environ.copy()
          env["BPLATZ_PHASE2_PERSISTENCE"] = "true"
          env["SCENTHUNTER_CATALOG_DATABASE_URL"] = "sqlite:////data/catalog/catalog.sqlite3"
          env["PYTHONPATH"] = str(BACKEND) + os.pathsep + env.get("PYTHONPATH", "")
          hydrated = subprocess.run(
              [PYTHON, "-c", hydration_code], cwd=BACKEND, env=env,
              text=True, capture_output=True, check=False,
          )
          if hydrated.stdout:
              print(hydrated.stdout, end="", flush=True)
          if hydrated.stderr:
              print(hydrated.stderr, file=sys.stderr, end="", flush=True)
          if hydrated.returncode:
              fail(f"single bounded Bplatz hydration retry failed with exit code {hydrated.returncode}")
          marker = "BPLATZ_LIQUID_BRUN_HYDRATION="
          line = next((x for x in hydrated.stdout.splitlines() if marker in x), None)
          if not line:
              fail("hydration returned no structured product result")
          item = json.loads(line.split(marker, 1)[1])
          product_url = item.get("url") or TARGET_URL

          con = readonly(PHASE2_DB)
          try:
              rows = con.execute(
                  """
                  SELECT o.id,o.ingestion_raw_id,o.product_variant_id,o.url,
                         o.price,o.currency,o.availability,o.status,o.source,
                         s.slug,pv.size_ml,pv.concentration,f.name,b.name
                  FROM offers o
                  JOIN stores s ON s.id=o.store_id
                  LEFT JOIN product_variants pv ON pv.id=o.product_variant_id
                  LEFT JOIN fragrances f ON f.id=pv.fragrance_id
                  LEFT JOIN brands b ON b.id=f.brand_id
                  WHERE s.slug='bplatz'
                    AND (o.url=? OR o.url=? OR lower(o.url) LIKE '%liquid-brun%')
                  """,
                  (product_url, TARGET_URL),
              ).fetchall()
              if len(rows) != 1:
                  fail(f"expected exactly one Bplatz Liquid Brun offer, found {len(rows)}")
              offer = rows[0]
              (offer_id, raw_id, variant_id, saved_url, saved_price, currency,
               availability, status, _source, store_slug, size_ml,
               _concentration, fragrance_name, brand_name) = offer
              if not variant_id or store_slug != "bplatz" or status != "active":
                  fail(f"offer is not safely promoted/active: {offer}")
              if abs(float(saved_price) - float(item["price"])) > 0.01:
                  fail(f"saved price differs from parsed price: {offer}")
              if currency != item["currency"] or availability != item["availability"]:
                  fail(f"saved currency/availability differs from parsed offer: {offer}")
              if not brand_name or "french avenue" not in brand_name.lower():
                  fail(f"unexpected matched brand: {brand_name!r}")
              if not fragrance_name or "liquid brun" not in fragrance_name.lower():
                  fail(f"unexpected matched fragrance: {fragrance_name!r}")
              if size_ml is None or abs(float(size_ml) - 100.0) > 0.01:
                  fail(f"unexpected matched size: {size_ml!r}")
              raw = con.execute(
                  "SELECT status,product_variant_id FROM ingestion_raw WHERE id=?",
                  (raw_id,),
              ).fetchone()
              if not raw or raw[0] != "promoted" or raw[1] != variant_id:
                  fail(f"raw ingestion record not promoted consistently: {raw}")
              history_count = con.execute(
                  "SELECT COUNT(*) FROM price_history WHERE offer_id=?", (offer_id,)
              ).fetchone()[0]
              audit_count = con.execute(
                  "SELECT COUNT(*) FROM match_audit WHERE offer_id=?", (offer_id,)
              ).fetchone()[0]
              if history_count < 1 or audit_count < 1:
                  fail(f"missing price history/match audit: history={history_count}, audit={audit_count}")
              invalid_active = con.execute(
                  "SELECT COUNT(*) FROM offers WHERE status='active' AND "
                  "(price IS NULL OR url IS NULL OR length(trim(url))=0 OR availability IS NULL)"
              ).fetchone()[0]
              post_counts = {
                  table: con.execute(f"SELECT COUNT(*) FROM {table}").fetchone()[0]
                  for table in sorted(REQUIRED_PHASE2 - {"alembic_version"})
              }
              integrity = con.execute("PRAGMA integrity_check").fetchone()[0]
              fk_errors = con.execute("PRAGMA foreign_key_check").fetchall()
              final_revision = con.execute("SELECT version_num FROM alembic_version").fetchone()[0]
          finally:
              con.close()

          legacy_con = readonly(LEGACY_DB)
          try:
              legacy_rows = legacy_con.execute(
                  "SELECT name,brand,price,currency,availability,fetch_status "
                  "FROM store_products WHERE store='bplatz' "
                  "AND (url=? OR lower(url) LIKE '%liquid-brun%')",
                  (product_url,),
              ).fetchall()
          finally:
              legacy_con.close()
          if len(legacy_rows) != 1:
              fail(f"expected one persisted legacy Bplatz Liquid Brun row, found {len(legacy_rows)}")
          legacy_row = legacy_rows[0]
          if legacy_row[2] is None or float(legacy_row[2]) <= 0 or legacy_row[5] != "OK":
              fail(f"legacy Bplatz product row is not a confirmed offer: {legacy_row}")

          if final_revision != "0003_store_domain" or integrity != "ok" or fk_errors or invalid_active:
              fail("final Phase 2 integrity/validation checks failed")

          print("PHASE2_BPLATZ_RETRY_RESULT=" + json.dumps({
              "status": "success",
              "phase2_database": str(PHASE2_DB),
              "phase2_backup": phase2_backup["path"],
              "legacy_database": str(LEGACY_DB),
              "legacy_backup": legacy_backup["path"],
              "backup_verified": True,
              "revision": final_revision,
              "store": {"name": "Bplatz", "slug": "bplatz", "domain": "bplatz.de", "country": "DE", "currency": "EUR", "status": "active"},
              "hydrated_offer": {
                  "id": offer_id, "brand": brand_name, "fragrance": fragrance_name,
                  "size_ml": size_ml, "price": float(saved_price), "currency": currency,
                  "availability": availability, "status": status, "url": saved_url,
                  "ingestion_raw_status": raw[0],
                  "price_history_rows": history_count, "match_audit_rows": audit_count,
              },
              "legacy_offer": {
                  "name": legacy_row[0], "brand": legacy_row[1],
                  "price": float(legacy_row[2]), "currency": legacy_row[3],
                  "availability": legacy_row[4], "fetch_status": legacy_row[5],
              },
              "counts_after": post_counts,
              "invalid_active_offers": invalid_active,
              "integrity_check": integrity,
              "foreign_key_errors": len(fk_errors),
              "persistent_feature_flag_changed": False,
              "deploy_or_restart_requested": False,
          }, ensure_ascii=False, default=str), flush=True)
          PY

          python -m py_compile /tmp/phase2_bplatz_retry.py
          SCRIPT_B64="$(base64 -w0 /tmp/phase2_bplatz_retry.py)"
          remote_command="/bin/sh -lc 'echo ${SCRIPT_B64} | base64 -d > /tmp/phase2_bplatz_retry.py && GITHUB_RUN_ID=${GITHUB_RUN_ID} /app/.venv/bin/python /tmp/phase2_bplatz_retry.py'"
          timeout 600s flyctl ssh console --app scenthunter --select=false -C "$remote_command"

      - name: Verify production health after the single retry
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request
          url = "https://scenthunter.fly.dev/health"
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=20) as response:
              if response.status != 200:
                  raise RuntimeError(f"health returned HTTP {response.status}")
              payload = json.loads(response.read().decode("utf-8"))
          if payload.get("status") != "healthy":
              raise RuntimeError("Fly production health is not healthy: " + json.dumps(payload))
          print("FLY_PRODUCTION_HEALTH=PASS")
          print("ARCHITECTURE=" + str(payload.get("architecture")))
          PY
