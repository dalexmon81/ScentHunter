name: Legacy Notino CJ feed monitor (manual diagnostics only)

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notino-cj-production-feed-monitor
  cancel-in-progress: true

jobs:
  verify-production-feed:
    name: Verify latest Notino CJ import in production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository for read-only feed parser diagnostics
        uses: actions/checkout@v4

      - name: Set up Python for feed parser diagnostics
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal feed parser dependency
        run: python -m pip install "requests>=2.31,<3"

      - name: Diagnose authorized CJ feed parser rejections without importing
        if: ${{ always() }}
        continue-on-error: true
        env:
          CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
          CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend python - <<'PY'
          import collections
          import gzip
          import io
          import json
          import re
          import urllib.parse
          import xml.etree.ElementTree as ET
          import zipfile
          import scrapers.notino.affiliate_feed as feed
          from scrapers.notino.affiliate_feed import (
              FeedImportError, _fetch_feed, _first, _local, _size_ml, parse_feed,
          )

          try:
              payload = _fetch_feed()
          except FeedImportError as exc:
              print("NOTINO_CJ_FEED_DIAGNOSTIC=FETCH_REJECTED " + str(exc), flush=True)
              raise SystemExit(1)
          except Exception as exc:
              print("NOTINO_CJ_FEED_DIAGNOSTIC=FETCH_FAILED " + type(exc).__name__, flush=True)
              raise SystemExit(1)

          try:
              offers = parse_feed(payload)
          except FeedImportError as exc:
              # FeedImportError is aggregate-only: no product titles, URLs,
              # feed body, username, or password are included.
              detail = str(exc)
              print("NOTINO_CJ_FEED_DIAGNOSTIC=PARSE_REJECTED " + detail, flush=True)

              # Inspect URL metadata only. Never emit full URLs, titles,
              # product IDs, or raw feed values.
              raw = bytes(payload)
              if zipfile.is_zipfile(io.BytesIO(raw)):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      members = [name for name in archive.namelist() if name.lower().endswith(".xml")]
                      if len(members) != 1:
                          raise SystemExit("NOTINO_CJ_FEED_STRUCTURE=ZIP_XML_MEMBER_COUNT_INVALID")
                      raw = archive.read(members[0])
              elif raw[:2] == b"\x1f\x8b":
                  raw = gzip.decompress(raw)
              root = ET.fromstring(raw)
              candidates = [node for node in root.iter() if _local(node.tag) in {"item", "entry", "product"}]
              hosts, schemes, ports, path_heads, query_keys, redirect_hosts = (collections.Counter() for _ in range(6))
              missing_links = 0
              size_present = 0
              for node in candidates:
                  title = _first(node, "title", "name", "productname")
                  raw_link = _first(node, "link", "url", "producturl")
                  if not raw_link:
                      for child in list(node):
                          if _local(child.tag) == "link" and child.attrib.get("href"):
                              raw_link = str(child.attrib["href"]).strip()
                              break
                  if not raw_link:
                      missing_links += 1
                  else:
                      parsed = urllib.parse.urlparse(raw_link)
                      hosts[(parsed.hostname or "").lower() or "<missing>"] += 1
                      schemes[(parsed.scheme or "<missing>").lower()] += 1
                      ports[str(parsed.port or "default")] += 1
                      path_heads[(parsed.path.strip("/").split("/", 1)[0] or "<root>").lower()] += 1
                      params = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
                      for key, values in params.items():
                          query_keys[key.lower()] += 1
                          for value in values:
                              candidate = urllib.parse.urlparse(value)
                              if not candidate.hostname:
                                  candidate = urllib.parse.urlparse(urllib.parse.unquote(value))
                              if candidate.hostname:
                                  redirect_hosts[candidate.hostname.lower()] += 1
                  raw_size = _first(node, "size", "volume", "capacity", "product_size", "g:size")
                  if _size_ml(raw_size, title) is not None:
                      size_present += 1
              structure = {
                  "items": len(candidates),
                  "missing_links": missing_links,
                  "size_present": size_present,
                  "hosts": dict(hosts.most_common(10)),
                  "schemes": dict(schemes),
                  "ports": dict(ports),
                  "path_first_segments": dict(path_heads.most_common(12)),
                  "query_keys": dict(query_keys.most_common(20)),
                  "redirect_target_hosts": dict(redirect_hosts.most_common(10)),
              }
              print("NOTINO_CJ_FEED_URL_SHAPE=" + json.dumps(structure, ensure_ascii=False, sort_keys=True), flush=True)

              summary_path = __import__("os").environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as stream:
                      stream.write("## Notino CJ parser diagnostic (read-only)\n\n")
                      stream.write("Parser diagnostic: " + detail + "\n")
                      stream.write("URL metadata: " + json.dumps(structure, ensure_ascii=False, sort_keys=True) + "\n")
              raise SystemExit(1)

          print(
              "NOTINO_CJ_FEED_DIAGNOSTIC=PARSE_OK "
              + json.dumps({"accepted_offers": len(offers)}, sort_keys=True),
              flush=True,
          )

          # Inspect parameter names only, even when the parser accepts every
          # item. Never emit link values, product data, or credentials.
          outer_keys = collections.Counter()
          destination_keys = collections.Counter()
          destination_hosts = collections.Counter()
          click_hosts = collections.Counter()
          malformed_links = 0
          items_inspected = 0
          with feed._xml_stream(io.BytesIO(bytes(payload))) as stream:
              for node in feed._feed_items(stream):
                  items_inspected += 1
                  fields = feed._field_map(node)
                  raw_link = _first(node, "link", "url", "producturl", fields=fields)
                  if not raw_link:
                      continue
                  try:
                      click = urllib.parse.urlparse(raw_link)
                      pairs = urllib.parse.parse_qsl(
                          click.query, keep_blank_values=True, errors="strict"
                      )
                  except (ValueError, UnicodeDecodeError):
                      malformed_links += 1
                      continue
                  for key, value in pairs:
                      safe_key = key.lower()
                      if re.fullmatch(r"[a-z0-9_.-]{1,64}", safe_key):
                          outer_keys[safe_key] += 1
                      else:
                          outer_keys["<nonstandard-key>"] += 1
                      if safe_key != "url":
                          continue
                      try:
                          target = urllib.parse.urlparse(value)
                          host = (target.hostname or "").lower()
                          if host and re.fullmatch(r"[a-z0-9.-]{1,253}", host):
                              destination_hosts[host] += 1
                          target_pairs = urllib.parse.parse_qsl(
                              target.query, keep_blank_values=True, errors="strict"
                          )
                      except (ValueError, UnicodeDecodeError):
                          malformed_links += 1
                          continue
                      for target_key, _target_value in target_pairs:
                          safe_target_key = target_key.lower()
                          if re.fullmatch(r"[a-z0-9_.-]{1,64}", safe_target_key):
                              destination_keys[safe_target_key] += 1
                          else:
                              destination_keys["<nonstandard-key>"] += 1

          identity_or_destination = {
              "url", "redirect", "redirect_url", "target", "destination", "path",
              "product", "product_id", "productid", "item", "item_id", "variant",
              "variant_id", "sku", "gtin", "ean", "size", "size_ml",
          }
          known_tracking = {
              "utm_source", "utm_medium", "utm_campaign", "utm_term",
              "utm_content", "utm_id", "gclid", "fbclid", "msclkid",
          }
          parameter_classes = {
              "tracking": sorted(
                  key for key in destination_keys
                  if key in known_tracking or key.startswith("utm_")
              ),
              "identity_or_destination": sorted(
                  key for key in destination_keys if key in identity_or_destination
              ),
              "unclassified_reject_by_default": sorted(
                  key for key in destination_keys
                  if key not in identity_or_destination
                  and key not in known_tracking
                  and not key.startswith("utm_")
              ),
          }
          shape = {
              "items_inspected": items_inspected,
              "outer_parameter_keys": dict(sorted(outer_keys.items())),
              "destination_parameter_keys": dict(sorted(destination_keys.items())),
              "destination_parameter_classes": parameter_classes,
              "destination_hosts": dict(destination_hosts.most_common(10)),
              "malformed_links": malformed_links,
              "values_emitted": False,
          }
          validated_clicks = 0
          rejected_clicks = 0
          rejection_reasons = collections.Counter()
          rejected_path_features = collections.Counter()
          for offer in offers:
              click_url = offer.affiliate_url
              if not click_url:
                  continue
              click_host = (urllib.parse.urlparse(click_url).hostname or "").lower()
              if click_host and re.fullmatch(r"[a-z0-9.-]{1,253}", click_host):
                  click_hosts[click_host] += 1
              if feed.validated_cj_offer_url(click_url, offer.url):
                  validated_clicks += 1
              else:
                  rejected_clicks += 1
                  parsed_click = feed._cj_affiliate_link(click_url)
                  product_url = feed._canonical_notino_product_url(offer.url)
                  if not parsed_click:
                      reason = "invalid_click_wrapper"
                  elif not product_url or parsed_click[1] != product_url:
                      reason = "stored_product_mismatch"
                  else:
                      destination = urllib.parse.urlparse(
                          urllib.parse.parse_qsl(
                              urllib.parse.urlparse(click_url).query,
                              keep_blank_values=True,
                          )[0][1]
                      )
                      decoded_path = urllib.parse.unquote(destination.path)
                      if destination.params or destination.fragment:
                          reason = "path_params_or_fragment"
                      elif re.search(r"%(?![0-9a-fA-F]{2})", destination.path):
                          reason = "malformed_percent_encoding"
                      elif re.search(r"%2f|%5c", destination.path, re.I):
                          reason = "encoded_path_separator"
                      elif re.search(r"%25", destination.path, re.I):
                          reason = "double_encoded_path_component"
                      elif re.search(r"[\x00-\x20\x7f\\;?#]", decoded_path):
                          reason = "encoded_delimiter_or_control"
                      elif "//" in decoded_path:
                          reason = "repeated_path_separator"
                      elif any(segment in {".", ".."} for segment in decoded_path.split("/")):
                          reason = "dot_path_segment"
                      elif destination.query:
                          reason = "destination_query_parameters"
                      else:
                          reason = "other_validation_guard"
                  rejection_reasons[reason] += 1
                  if reason == "encoded_delimiter_or_control":
                      for feature, present in {
                          "space": " " in decoded_path,
                          "control": any(ord(char) < 32 or ord(char) == 127 for char in decoded_path),
                          "backslash": "\\" in decoded_path,
                          "semicolon": ";" in decoded_path,
                          "question_mark": "?" in decoded_path,
                          "hash": "#" in decoded_path,
                          "encoded_space": bool(re.search(r"%20", destination.path, re.I)),
                      }.items():
                          if present:
                              rejected_path_features[feature] += 1
          shape["cj_click_hosts"] = dict(click_hosts.most_common(10))
          shape["cj_validation"] = {
              "offers_with_cj_click": validated_clicks + rejected_clicks,
              "validated_for_stored_product": validated_clicks,
              "rejected": rejected_clicks,
              "rejection_categories": dict(sorted(rejection_reasons.items())),
              "rejected_path_features": dict(sorted(rejected_path_features.items())),
          }
          print(
              "NOTINO_CJ_PARAMETER_DIAGNOSTIC="
              + json.dumps(shape, sort_keys=True),
              flush=True,
          )
          PY

      - name: Check production PostgreSQL Notino offers
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASELINE_TOKEN" || { echo "::error::SCENTHUNTER_BASELINE_TOKEN is missing."; exit 1; }
          python - <<'PY'
          import json
          import os
          import urllib.request

          request = urllib.request.Request(
              "https://scenthunter.fly.dev/admin/phase0/postgres-baseline",
              headers={
                  "Accept": "application/json",
                  "Authorization": "Bearer " + os.environ["BASELINE_TOKEN"],
                  "User-Agent": "ScentHunter-Notino-Postgres-Monitor/2.0",
              },
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              if response.status != 200:
                  raise RuntimeError(f"PostgreSQL baseline returned HTTP {response.status}")
              payload = json.loads(response.read().decode("utf-8"))

          if (
              payload.get("report") != "phase0-postgresql-read-only"
              or payload.get("database_backend") != "postgresql"
              or payload.get("read_only") is not True
          ):
              raise RuntimeError("Unexpected PostgreSQL baseline identity or safety mode")

          rows = payload.get("stores")
          if not isinstance(rows, list):
              raise RuntimeError("PostgreSQL baseline has no store rows")
          notino = next((row for row in rows if row.get("store") == "notino"), None)
          if notino is None:
              raise RuntimeError("PostgreSQL baseline is missing the Notino scope row")

          active = int(notino.get("active_offers") or 0)
          publishable = int(notino.get("publishable_offers") or 0)
          offers = notino.get("offers") or []
          latest_capture = max(
              (str(offer.get("captured_at")) for offer in offers if offer.get("captured_at")),
              default=None,
          )
          sync = notino.get("last_successful_sync_at")
          summary = [
              "## Notino CJ production PostgreSQL offers",
              "",
              f"- Database status: **{notino.get('status')}**",
              f"- Active offers: **{active}**",
              f"- Publishable offers: **{publishable}**",
              f"- Latest stored offer capture: **{latest_capture or 'none'}**",
              f"- Last successful connector sync: **{sync or 'none'}**",
              "",
              "Publication is determined by the canonical PostgreSQL freshness, URL, currency, availability and match-audit gates.",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\\n".join(summary) + "\\n")

          print(json.dumps({
              "database_status": notino.get("status"),
              "active_offers": active,
              "publishable_offers": publishable,
              "latest_capture": latest_capture,
              "last_successful_sync_at": sync,
          }, ensure_ascii=False, sort_keys=True))

          if notino.get("status") != "active":
              raise RuntimeError("Notino PostgreSQL store is not active")
          if publishable <= 0:
              raise RuntimeError(
                  f"Notino has {active} active offers but none pass the live PostgreSQL publication gates"
              )
          print("NOTINO_POSTGRES_PUBLICATION_GATE=PASS")
          PY
