name: Notino CJ production feed monitor

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/notino-cj-production-feed-monitor.yml
  pull_request:
    paths:
      - .github/workflows/notino-cj-production-feed-monitor.yml
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: notino-cj-production-feed-monitor
  cancel-in-progress: true

jobs:
  verify-production-feed:
    name: Verify latest Notino CJ import in production
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Check out repository for read-only feed parser diagnostics
        uses: actions/checkout@v4

      - name: Set up Python for feed parser diagnostics
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install minimal feed parser dependency
        run: python -m pip install "requests>=2.31,<3"

      - name: Diagnose authorized CJ feed parser rejections without importing
        if: ${{ always() }}
        continue-on-error: true
        env:
          CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
          CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          PYTHONPATH=backend python - <<'PY'
          import collections
          import gzip
          import io
          import json
          import urllib.parse
          import xml.etree.ElementTree as ET
          import zipfile
          from scrapers.notino.affiliate_feed import (
              FeedImportError, _fetch_feed, _first, _local, _size_ml, parse_feed,
          )

          try:
              payload = _fetch_feed()
          except FeedImportError as exc:
              print("NOTINO_CJ_FEED_DIAGNOSTIC=FETCH_REJECTED " + str(exc), flush=True)
              raise SystemExit(1)
          except Exception as exc:
              print("NOTINO_CJ_FEED_DIAGNOSTIC=FETCH_FAILED " + type(exc).__name__, flush=True)
              raise SystemExit(1)

          try:
              offers = parse_feed(payload)
          except FeedImportError as exc:
              # FeedImportError is aggregate-only: no product titles, URLs,
              # feed body, username, or password are included.
              detail = str(exc)
              print("NOTINO_CJ_FEED_DIAGNOSTIC=PARSE_REJECTED " + detail, flush=True)

              # Inspect URL metadata only. Never emit full URLs, titles,
              # product IDs, or raw feed values.
              raw = bytes(payload)
              if zipfile.is_zipfile(io.BytesIO(raw)):
                  with zipfile.ZipFile(io.BytesIO(raw)) as archive:
                      members = [name for name in archive.namelist() if name.lower().endswith(".xml")]
                      if len(members) != 1:
                          raise SystemExit("NOTINO_CJ_FEED_STRUCTURE=ZIP_XML_MEMBER_COUNT_INVALID")
                      raw = archive.read(members[0])
              elif raw[:2] == b"\x1f\x8b":
                  raw = gzip.decompress(raw)
              root = ET.fromstring(raw)
              candidates = [node for node in root.iter() if _local(node.tag) in {"item", "entry", "product"}]
              hosts, schemes, ports, path_heads, query_keys, redirect_hosts = (collections.Counter() for _ in range(6))
              missing_links = 0
              size_present = 0
              for node in candidates:
                  title = _first(node, "title", "name", "productname")
                  raw_link = _first(node, "link", "url", "producturl")
                  if not raw_link:
                      for child in list(node):
                          if _local(child.tag) == "link" and child.attrib.get("href"):
                              raw_link = str(child.attrib["href"]).strip()
                              break
                  if not raw_link:
                      missing_links += 1
                  else:
                      parsed = urllib.parse.urlparse(raw_link)
                      hosts[(parsed.hostname or "").lower() or "<missing>"] += 1
                      schemes[(parsed.scheme or "<missing>").lower()] += 1
                      ports[str(parsed.port or "default")] += 1
                      path_heads[(parsed.path.strip("/").split("/", 1)[0] or "<root>").lower()] += 1
                      params = urllib.parse.parse_qs(parsed.query, keep_blank_values=True)
                      for key, values in params.items():
                          query_keys[key.lower()] += 1
                          for value in values:
                              candidate = urllib.parse.urlparse(value)
                              if not candidate.hostname:
                                  candidate = urllib.parse.urlparse(urllib.parse.unquote(value))
                              if candidate.hostname:
                                  redirect_hosts[candidate.hostname.lower()] += 1
                  raw_size = _first(node, "size", "volume", "capacity", "product_size", "g:size")
                  if _size_ml(raw_size, title) is not None:
                      size_present += 1
              structure = {
                  "items": len(candidates),
                  "missing_links": missing_links,
                  "size_present": size_present,
                  "hosts": dict(hosts.most_common(10)),
                  "schemes": dict(schemes),
                  "ports": dict(ports),
                  "path_first_segments": dict(path_heads.most_common(12)),
                  "query_keys": dict(query_keys.most_common(20)),
                  "redirect_target_hosts": dict(redirect_hosts.most_common(10)),
              }
              print("NOTINO_CJ_FEED_URL_SHAPE=" + json.dumps(structure, ensure_ascii=False, sort_keys=True), flush=True)

              summary_path = __import__("os").environ.get("GITHUB_STEP_SUMMARY")
              if summary_path:
                  with open(summary_path, "a", encoding="utf-8") as stream:
                      stream.write("## Notino CJ parser diagnostic (read-only)\n\n")
                      stream.write("Parser diagnostic: " + detail + "\n")
                      stream.write("URL metadata: " + json.dumps(structure, ensure_ascii=False, sort_keys=True) + "\n")
              raise SystemExit(1)

          print(
              "NOTINO_CJ_FEED_DIAGNOSTIC=PARSE_OK "
              + json.dumps({"accepted_offers": len(offers)}, sort_keys=True),
              flush=True,
          )
          PY

      - name: Check production catalog status
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import datetime
          import json
          import os
          import urllib.request

          url = "https://scenthunter.fly.dev/catalog-status"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "ScentHunter-Notino-CJ-monitor/1.0",
              },
          )
          payload = None
          last_error = None
          for attempt in range(1, 4):
              try:
                  with urllib.request.urlopen(request, timeout=30) as response:
                      if response.status != 200:
                          raise RuntimeError(f"catalog-status returned HTTP {response.status}")
                      payload = json.loads(response.read().decode("utf-8"))
                  break
              except (OSError, TimeoutError, ValueError, RuntimeError) as exc:
                  last_error = exc
                  print(f"catalog-status attempt {attempt}/3 failed: {type(exc).__name__}: {exc}", flush=True)
                  if attempt < 3:
                      import time
                      time.sleep(5)
          if payload is None:
              raise RuntimeError(f"catalog-status unavailable after three attempts: {last_error}")

          stores = payload.get("stores")
          if not isinstance(stores, dict):
              raise RuntimeError("catalog-status has no stores object")
          notino = stores.get("notino")
          if not isinstance(notino, dict):
              raise RuntimeError("catalog-status has no Notino status")

          status = str(notino.get("status") or "")
          finished_at = notino.get("finished_at")
          age_sec = notino.get("age_sec")
          indexed = int(notino.get("indexed_urls") or 0)
          fetched = int(notino.get("fetched_products") or 0)
          pending = int(notino.get("pending_hydration") or 0)
          error = str(notino.get("error") or "")

          if not isinstance(finished_at, (int, float)) or not isinstance(age_sec, (int, float)):
              raise RuntimeError("Notino status has no valid successful-import timestamp")
          age_hours = float(age_sec) / 3600
          imported_at = datetime.datetime.fromtimestamp(
              float(finished_at), datetime.timezone.utc
          ).isoformat()

          summary = [
              "## Notino CJ production feed",
              "",
              f"- Status: **{status}**",
              f"- Last successful feed import: **{imported_at}**",
              f"- Age: **{age_hours:.2f} hours**",
              f"- Indexed URLs: **{indexed}**",
              f"- Hydrated product pages: **{fetched}**",
              f"- Pending hydration: **{pending}**",
              f"- Last status detail: {error or 'none'}",
          ]
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as stream:
              stream.write("\n".join(summary) + "\n")

          print(json.dumps({
              "status": status,
              "finished_at": imported_at,
              "age_hours": round(age_hours, 2),
              "indexed_urls": indexed,
              "fetched_products": fetched,
              "pending_hydration": pending,
              "error": error,
          }, ensure_ascii=False))

          # A successful feed import is explicitly persisted as FEED_IMPORTED.
          # 27 hours allows the 23-hour throttle plus background round-robin delay.
          if status != "FEED_IMPORTED":
              raise RuntimeError(
                  f"Notino CJ feed has not completed successfully; current status={status!r}, detail={error!r}"
              )
          if age_hours > 27:
              raise RuntimeError(
                  f"Notino CJ feed is stale: last successful import was {age_hours:.2f} hours ago"
              )
          if indexed <= 0:
              raise RuntimeError("Notino CJ feed reports success but has no indexed URLs")
          print("Notino CJ production feed verification: PASS")
          PY

