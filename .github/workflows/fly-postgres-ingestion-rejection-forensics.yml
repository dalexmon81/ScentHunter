name: Read-only PostgreSQL ingestion rejection forensics

on:
  workflow_dispatch:
  push:
    branches:
      - fix/public-postgres-catalog-ingestion-2026-11-22
    paths:
      - .github/workflows/fly-postgres-ingestion-rejection-forensics.yml

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out selected branch
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run read-only PostgreSQL forensics on Fly app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl machines list --app "$FLY_APP" --json > /tmp/scenthunter-machines.json
          MACHINE_ID="$(python - <<'PY'
          import json
          machines = json.load(open("/tmp/scenthunter-machines.json", encoding="utf-8"))
          preferred, others = [], []
          for machine in machines:
              metadata = ((machine.get("config") or {}).get("metadata") or {})
              (preferred if metadata.get("fly_process_group") == "app" else others).append(machine.get("id"))
          print(next((item for item in preferred + others if item), ""))
          PY
          )"
          test -n "$MACHINE_ID"

          script_b64="$(base64 -w0 backend/scripts/inspect_postgres_ingestion_rejections.py)"
          remote_command="sh -lc 'set -e
          test -x /app/.venv/bin/python
          test -n \"\$SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL\"
          mkdir -p /tmp/scenthunter-readonly-inspect
          trap \"rm -f /tmp/scenthunter-readonly-inspect/inspect.py\" EXIT
          printf %s ${script_b64} | base64 -d > /tmp/scenthunter-readonly-inspect/inspect.py
          export PYTHONPATH=/app/backend
          timeout 240 /app/.venv/bin/python /tmp/scenthunter-readonly-inspect/inspect.py
          '"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"
