                  if member.isdir():
                      target.mkdir(parents=True, exist_ok=True)
                  elif member.isfile():
                      target.parent.mkdir(parents=True, exist_ok=True)
                      source = archive.extractfile(member)
                      if source is None:
                          raise SystemExit(f'Cannot read archive member: {member.name}')
                      target.write_bytes(source.read())
          print('Isolated package copied. Existing main.py, catalog_engine.py and database were not changed.')
          PY

      - name: Validate Python syntax and offline tests
        shell: bash
        run: |
          python -m compileall -q backend/scenthunter_next_engine tests/next_engine
          PYTHONPATH=backend python -m unittest discover -s tests/next_engine -v

      - name: Commit isolated package
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add backend/scenthunter_next_engine tests/next_engine docs/next-engine
          if git diff --cached --quiet; then
            echo "No package changes to commit."
            exit 0
          fi
          git commit -m "Add isolated ScentHunter next engine"
          git push
