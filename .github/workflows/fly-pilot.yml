name: Deploy isolated Offer Engine pilot

on:
  push:
    branches:
      - architecture/offer-engine-v1
    paths:
      - '.github/workflows/fly-pilot.yml'
      - 'fly.staging.toml'
      - 'Dockerfile'
      - '.dockerignore'
      - 'backend/**'
      - 'frontend/**'
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to create/update the isolated Fly.io pilot
        required: true
        type: choice
        options:
          - deploy

permissions:
  contents: read

concurrency:
  group: scenthunter-offer-engine-pilot
  cancel-in-progress: false

jobs:
  deploy-pilot:
    name: Deploy isolated pilot (not production)
    if: ${{ github.event_name == 'push' || github.event.inputs.confirm_deploy == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_PILOT_DEPLOY_TOKEN: ${{ secrets.FLY_PILOT_DEPLOY_TOKEN }}
      FLY_API_TOKEN: ${{ secrets.FLY_PILOT_DEPLOY_TOKEN }}
      FLY_APP: sh-pilot-20261030
      FLY_ORG: personal
      FLY_VOLUME: scenthunter_data
      PILOT_URL: https://sh-pilot-20261030.fly.dev
    steps:
      - name: Checkout the architecture branch only
        uses: actions/checkout@v4
        with:
          ref: architecture/offer-engine-v1

      - name: Validate isolated target and Fly token
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "architecture/offer-engine-v1" || {
            echo "Run this workflow from architecture/offer-engine-v1 only." >&2
            exit 1
          }
          test -n "$FLY_PILOT_DEPLOY_TOKEN" || {
            echo "Repository secret FLY_PILOT_DEPLOY_TOKEN is missing." >&2
            exit 1
          }
          normalized_token="$FLY_PILOT_DEPLOY_TOKEN"
          case "$normalized_token" in
            fm2_*) normalized_token="FlyV1 $normalized_token" ;;
          esac
          echo "::add-mask::$normalized_token"
          printf 'FLY_API_TOKEN=%s\n' "$normalized_token" >> "$GITHUB_ENV"
          grep -Fq 'app = "sh-pilot-20261030"' fly.staging.toml
          grep -Fq 'source = "scenthunter_data"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_OFFER_ENGINE_SEARCH_ENABLED = "1"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_OFFER_ENGINE_ON_DEMAND_REFRESH_ENABLED = "1"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_OFFER_ENGINE_CONNECTOR_TIMEOUT_SECONDS = "90"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_OFFER_ENGINE_REFRESH_WORKER_ENABLED = "0"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_OFFER_ENGINE_AUTO_MIGRATE = "1"' fly.staging.toml
          echo "Production fly.toml is not used by this workflow."

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify app-scoped Fly token and existing pilot app
        shell: bash
        run: |
          set -euo pipefail
          # This workflow now uses a deploy token scoped to the already-created pilot app.
          # It deliberately performs no organization-wide token or app-list operations.
          flyctl status --app "$FLY_APP"

      - name: Create or verify dedicated persistent volume
        shell: bash
        run: |
          set -euo pipefail
          volume_list=""
          for attempt in $(seq 1 6); do
            if volume_list="$(flyctl volumes list --app "$FLY_APP" 2>&1)"; then
              break
            fi
            echo "Waiting for Fly app/volume API propagation ($attempt/6): $volume_list"
            sleep 5
          done
          if printf '%s\n' "$volume_list" | grep -Fq "$FLY_VOLUME"; then
            echo "Dedicated pilot volume already exists."
          else
            flyctl volumes create "$FLY_VOLUME" --app "$FLY_APP" --region ams --size 1 --count 1 --yes
          fi

      - name: Deploy pilot app
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --config fly.staging.toml --app "$FLY_APP" --yes

      - name: Ensure pilot has public Fly IP addresses
        shell: bash
        run: |
          set -euo pipefail
          ip_list="$(flyctl ips list --app "$FLY_APP")"
          printf '%s\n' "$ip_list"
          if ! printf '%s\n' "$ip_list" | grep -Eq '^[[:space:]]*v4[[:space:]]'; then
            echo "No public IPv4 found; allocating a free shared IPv4."
            flyctl ips allocate-v4 --shared --app "$FLY_APP" --yes
          fi
          if ! printf '%s\n' "$ip_list" | grep -Eq '^[[:space:]]*v6[[:space:]]'; then
            echo "No public IPv6 found; allocating IPv6."
            flyctl ips allocate-v6 --app "$FLY_APP"
          fi
          echo "Public IP allocation check complete."

      - name: Verify pilot health, read API and user search path
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import ssl
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://sh-pilot-20261030.fly.dev"

          def get(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-Pilot-Smoke/1.0"},
              )
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=30) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path}: HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read(1000).decode("utf-8", "replace")
                      print(
                          f"PILOT_HTTP_ERROR path={path} status={exc.code} "
                          f"reason={exc.reason} body={body!r}",
                          flush=True,
                      )
                      if exc.code not in {429, 500, 502, 503, 504}:
                          raise RuntimeError(f"Pilot endpoint {path} returned HTTP {exc.code}: {body}") from exc
                      last_error = exc
                  except (urllib.error.URLError, TimeoutError, ssl.SSLError, ConnectionError) as exc:
                      last_error = exc
                  if attempt < 5:
                      delay = min(2 ** attempt, 16)
                      print(f"Transient pilot request failure for {path} ({attempt}/5): {last_error}; retrying in {delay}s", flush=True)
                      time.sleep(delay)
              raise RuntimeError(f"Pilot request failed after 5 attempts for {path}: {last_error}")

          # Pilot diagnostics must identify the exact first endpoint failure;
          # never emit a bare HTTPError without its route and response body.

          # The read API must be healthy, but it is no longer required to
          # have a pre-warmed product. The actual user-search flow below
          # performs query-scoped retailer discovery before reading offers.
          health = get("/health")
          print("PILOT_HEALTH=" + json.dumps(health, ensure_ascii=False), flush=True)
          if health.get("status") != "healthy":
              raise RuntimeError("Pilot health is not healthy: " + json.dumps(health))
          if not health.get("offer_engine_api_mounted"):
              raise RuntimeError("Offer Engine API did not mount: " + json.dumps(health))
          # Exercise the exact broad query from the user screenshot and capture
          # per-retailer discovery, identity resolution and publication evidence.
          born_query = urllib.parse.urlencode({"query": "Born in Roma", "limit": 200})
          born_request = urllib.request.Request(
              base + "/offer-engine/search?" + born_query,
              headers={"Accept": "application/json", "User-Agent": "ScentHunter-Pilot-Diagnostic/1.0"},
              method="POST",
          )
          with urllib.request.urlopen(born_request, timeout=180) as response:
              born_refresh = json.loads(response.read().decode("utf-8"))
          print("PILOT_BORN_IN_ROMA_REFRESH=" + json.dumps(born_refresh, ensure_ascii=False, default=str), flush=True)
          born_connectors = (born_refresh.get("refresh") or {}).get("connectors") or []
          print("PILOT_BORN_IN_ROMA_CONNECTOR_SUMMARY=" + json.dumps([
              {
                  "retailer": item.get("retailer"),
                  "status": item.get("status"),
                  "listings_seen": item.get("listings_seen"),
                  "observations_written": item.get("observations_written"),
                  "offers_published": item.get("offers_published"),
                  "unresolved": item.get("unresolved"),
                  "errors": item.get("errors"),
                  "unresolved_samples": item.get("unresolved_samples"),
                  "discovery_details": item.get("discovery_details"),
              } for item in born_connectors
          ], ensure_ascii=False, default=str), flush=True)

          query = urllib.parse.urlencode({"query": "Liquid Brun"})
          offer_api = get("/offer-engine/search?" + query)
          if offer_api.get("status") != "ok" or not isinstance(offer_api.get("offers"), list):
              raise RuntimeError("Read API contract mismatch: " + json.dumps(offer_api))
          product_ids = {str(item.get("product_id") or "") for item in offer_api.get("offers", [])}
          print("PILOT_OFFER_API_COUNT=" + str(offer_api.get("count", 0)), flush=True)
          print("PILOT_OFFER_PRODUCT_IDS=" + json.dumps(sorted(product_ids)), flush=True)

          ui_search = get("/search?q=" + urllib.parse.quote("Liquid Brun"))
          if not isinstance(ui_search, dict):
              raise RuntimeError("Synchronous user search endpoint returned a non-object response.")

          # Exercise the exact browser flow and verify both distinct canonical
          # products are present for the broad family query.
          started = get("/search-start?q=" + urllib.parse.quote("Liquid Brun"))
          if not isinstance(started, dict):
              raise RuntimeError("User search-start endpoint returned a non-object response.")
          job_id = started.get("job_id")
          ui_result = started
          for poll in range(120):
              if ui_result.get("completed"):
                  break
              if not job_id:
                  raise RuntimeError("User search did not return a job_id: " + json.dumps(ui_result))
              time.sleep(1.5)
              ui_result = get("/search-status?" + urllib.parse.urlencode({"job_id": job_id}))
          if not ui_result.get("completed"):
              raise RuntimeError("User search job did not complete: " + json.dumps(ui_result))
          print("PILOT_LIQUID_BRUN_UI_RESULT=" + json.dumps(ui_result, ensure_ascii=False, default=str), flush=True)

          ui_product_ids = {
              str(item.get("catalog_id") or "")
              for item in ui_result.get("results") or []
              if isinstance(item, dict)
          }
          expected_ids = {"SH-0030", "SH-0031"}
          if not expected_ids.issubset(ui_product_ids):
              raise RuntimeError(
                  "Broad Liquid Brun search did not return both canonical products: "
                  + json.dumps({"expected": sorted(expected_ids), "actual": sorted(ui_product_ids)})
              )

          # A product identity card is not evidence of a usable comparison.
          # Require verified offers to survive the exact /search-start/status
          # response consumed by the browser, for each canonical bottle size.
          ui_groups = {
              str(item.get("catalog_id") or ""): item
              for item in (ui_result.get("results") or [])
              if isinstance(item, dict)
          }
          expected_sizes = {"SH-0030": 100, "SH-0031": 150}
          # This is a Bplatz-only verification deployment. Other retailers
          # are deliberately excluded and cannot block the Bplatz checks.
          expected_stores = {"bplatz"}
          actual_stores = set((ui_result.get("stores") or {}).keys())
          missing_stores = sorted(expected_stores - actual_stores)
          print("PILOT_BROWSER_STORES=" + json.dumps(ui_result.get("stores") or {}, ensure_ascii=False, default=str), flush=True)
          print("PILOT_BROWSER_ERRORS=" + json.dumps(ui_result.get("errors") or {}, ensure_ascii=False, default=str), flush=True)
          print("PILOT_BROWSER_ELAPSED=" + str(ui_result.get("elapsed")), flush=True)
          if missing_stores:
              raise RuntimeError("The user search did not report every configured retailer: " + json.dumps(missing_stores))

          stores = ui_result.get("stores") or {}

          # A retailer key alone is not proof that its connector ran: the
          # read-only repository can add cached store summaries after refresh.
          # Require every configured retailer to carry the on-demand source
          # marker emitted only by the query-scoped connector runner.
          wrong_refresh_sources = {
              store: (stores.get(store) or {}).get("details", {}).get("source")
              for store in sorted(expected_stores)
              if (stores.get(store) or {}).get("details", {}).get("source")
                 != "on_demand_verified_query_refresh"
          }
          if wrong_refresh_sources:
              raise RuntimeError(
                  "Some retailers were represented by cached/read-only summaries instead "
                  "of a confirmed query-scoped refresh: "
                  + json.dumps(wrong_refresh_sources, ensure_ascii=False)
              )
          failed_refreshes = {
              store: {
                  "status": (stores.get(store) or {}).get("status"),
                  "verified": (stores.get(store) or {}).get("verified"),
                  "details": (stores.get(store) or {}).get("details"),
              }
              for store in sorted(expected_stores)
              if (stores.get(store) or {}).get("status") != "success"
                 or (stores.get(store) or {}).get("verified") is not True
          }
          if failed_refreshes:
              raise RuntimeError(
                  "One or more retailer query-scoped refreshes did not complete cleanly: "
                  + json.dumps(failed_refreshes, ensure_ascii=False, default=str)
              )
          group_diagnostics = {}
          for product_id, expected_size in expected_sizes.items():
              group = ui_groups.get(product_id) or {}
              group_offers = [
                  offer for offer in (group.get("offers") or [])
                  if isinstance(offer, dict)
              ]
              matching_size = [
                  offer for offer in group_offers
                  if int(offer.get("size_ml") or 0) == expected_size
              ]
              group_diagnostics[product_id] = {
                  "expected_size_ml": expected_size,
                  "offer_count": len(group_offers),
                  "matching_size_offer_count": len(matching_size),
                  "offers": [
                      {
                          "store": offer.get("store") or offer.get("shop"),
                          "size_ml": offer.get("size_ml"),
                          "price": offer.get("price_num") or offer.get("price"),
                          "url": offer.get("url"),
                      }
                      for offer in group_offers
                  ],
              }
              print("PILOT_BROWSER_GROUP_DIAGNOSTIC=" + json.dumps(group_diagnostics[product_id], ensure_ascii=False), flush=True)
              if not matching_size:
                  raise RuntimeError(
                      "Browser search returned a product card without a verified offer "
                      "for its exact bottle size: " + json.dumps(group_diagnostics, ensure_ascii=False)
                  )
              for offer in matching_size:
                  url = str(offer.get("url") or "").lower()
                  import re
                  explicit_sizes = [
                      int(value) for value in re.findall(r"(?<![0-9])(30|50|75|100|150|200)[\s-]*ml", url)
                  ]
                  # ParfumCity Shopify handles can retain the default
                  # bottle size in the SEO slug while the selected variant
                  # query parameter and verified offer are for another size.
                  # The connector validates the selected Shopify variant;
                  # do not re-reject that exact retailer-specific case here.
                  retailer = str(offer.get("store") or offer.get("shop") or "").strip().lower()
                  if explicit_sizes and expected_size not in explicit_sizes and retailer != "parfumcity":
                      raise RuntimeError(
                          "Offer URL explicitly conflicts with the canonical bottle size: "
                          + json.dumps({"product_id": product_id, "expected_size_ml": expected_size,
                                        "offer": offer}, ensure_ascii=False)
                      )
          print("PILOT_BROWSER_GROUP_OFFERS=" + json.dumps(group_diagnostics, ensure_ascii=False), flush=True)

          legacy_catalog_failures = {
              store: report for store, report in stores.items()
              if str(report.get("status") or "").lower() == "catalog_not_indexed"
              or str(report.get("error") or "").lower() == "catalog_not_indexed"
          }
          if legacy_catalog_failures:
              raise RuntimeError("Browser search is still using the legacy catalog collector: " + json.dumps(legacy_catalog_failures))
          if ui_result.get("status") not in {"completed", "completed_with_store_issues"}:
              raise RuntimeError("Unexpected browser search status: " + json.dumps(ui_result))

          # Verify the exact Bplatz Atlantis product through the same
          # asynchronous user-search path, not the legacy catalog diagnostic.
          atlantis_query = "French Avenue Atlantis"
          atlantis_started = get("/search-start?q=" + urllib.parse.quote(atlantis_query))
          if not isinstance(atlantis_started, dict):
              raise RuntimeError("Atlantis user search returned a non-object response.")
          atlantis_job_id = atlantis_started.get("job_id")
          atlantis_result = atlantis_started
          for poll in range(120):
              if atlantis_result.get("completed"):
                  break
              if not atlantis_job_id:
                  raise RuntimeError("Atlantis user search did not return a job_id: " + json.dumps(atlantis_result))
              time.sleep(1.5)
              atlantis_result = get("/search-status?" + urllib.parse.urlencode({"job_id": atlantis_job_id}))
          if not atlantis_result.get("completed"):
              raise RuntimeError("Atlantis user search did not complete: " + json.dumps(atlantis_result))
          atlantis_stores = atlantis_result.get("stores") or {}
          missing_atlantis_stores = sorted(expected_stores - set(atlantis_stores))
          failed_atlantis_stores = {
              store: report for store, report in atlantis_stores.items()
              if report.get("status") != "success" or report.get("verified") is not True
          }
          if missing_atlantis_stores or failed_atlantis_stores:
              raise RuntimeError(
                  "Atlantis query did not complete cleanly across all retailers: "
                  + json.dumps({"missing": missing_atlantis_stores, "failed": failed_atlantis_stores}, ensure_ascii=False, default=str)
              )
          atlantis_bplatz_offers = [
              offer
              for group in (atlantis_result.get("results") or [])
              if isinstance(group, dict)
              for offer in (group.get("offers") or [])
              if isinstance(offer, dict)
              and str(offer.get("store") or offer.get("shop") or "").strip().lower() == "bplatz"
              and int(offer.get("size_ml") or 0) == 100
              and float(offer.get("price_num") or offer.get("price") or 0) > 0
          ]
          if len(atlantis_bplatz_offers) != 1:
              raise RuntimeError(
                  "Atlantis user search must return exactly one verified Bplatz 100 ml offer: "
                  + json.dumps(atlantis_bplatz_offers, ensure_ascii=False, default=str)
              )
          print("PILOT_ATLANTIS_BPLATZ_OFFERS=" + json.dumps(atlantis_bplatz_offers, ensure_ascii=False, default=str), flush=True)
          print("PILOT_ATLANTIS_STORES=" + json.dumps(atlantis_stores, ensure_ascii=False, default=str), flush=True)

          print("PILOT_HEALTH=PASS")
          print("PILOT_OFFER_ENGINE_READ_API=PASS")
          print("PILOT_SYNC_SEARCH_ENDPOINT=PASS")
          print("PILOT_BROWSER_SEARCH_START_STATUS=PASS")
          print("PILOT_BROWSER_SEARCH_STATUS=" + str(ui_result.get("status")))
          print("PILOT_BROWSER_OFFER_COUNT=" + str(ui_result.get("offer_count", 0)))
          print("PILOT_OFFER_API_COUNT=" + str(offer_api.get("count", 0)))
          # Print a compact retailer/variant breakdown so a green smoke test
          # cannot hide a connector coverage regression behind one successful
          # offer. Keep exact URL evidence in the log for market/locale checks.
          for item in offer_api.get("offers", []):
              print("PILOT_OFFER=" + json.dumps({
                  "retailer": item.get("retailer_name") or item.get("retailer_id"),
                  "product_id": item.get("product_id"),
                  "size_ml": item.get("size_ml"),
                  "price": item.get("price"),
                  "currency": item.get("currency"),
                  "availability": item.get("availability"),
                  "market": item.get("market"),
                  "url": item.get("product_url"),
              }, ensure_ascii=False, sort_keys=True), flush=True)
          print("PILOT_URL=" + base)
          PY

      - name: Verify live Bplatz Liquid Brun page parser (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://sh-pilot-20261030.fly.dev"
          product_url = "https://en.bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml"
          path = "/diagnostic/bplatz-page-check?" + urllib.parse.urlencode({"url": product_url})
          request = urllib.request.Request(
              base + path,
              headers={"Accept": "application/json", "User-Agent": "ScentHunter-Bplatz-Parser-Check/1.0"},
          )
          with urllib.request.urlopen(request, timeout=45) as response:
              result = json.loads(response.read().decode("utf-8"))
          print("PILOT_BPLATZ_LIVE_PAGE_CHECK=" + json.dumps(result, ensure_ascii=False, sort_keys=True), flush=True)
          parsed = result.get("parser_result") or {}
          name = str(parsed.get("name") or "").casefold()
          if not result.get("ok") or "liquid brun" not in name or parsed.get("size_ml") != 100:
              raise SystemExit("Bplatz live page parser failed to identify Liquid Brun 100 ml: " + json.dumps(result, ensure_ascii=False))
          print("PILOT_BPLATZ_LIVE_PAGE_PARSER=PASS", flush=True)
          PY

      - name: Refresh the one approved Bplatz Liquid Brun URL and verify persistence
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://sh-pilot-20261030.fly.dev"
          product_url = "https://en.bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml"
          query = urllib.parse.urlencode({"url": product_url})

          def get(path, label):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-Bplatz-Verification/1.0"},
              )
              last_error = None
              for attempt in range(1, 6):
                  try:
                      with urllib.request.urlopen(request, timeout=90) as response:
                          return json.loads(response.read().decode("utf-8"))
                  except urllib.error.HTTPError as exc:
                      body = exc.read(1000).decode("utf-8", "replace")
                      print(f"{label}_HTTP_ERROR status={exc.code} body={body!r}", flush=True)
                      last_error = exc
                      if exc.code not in {429, 500, 502, 503, 504} or attempt == 5:
                          raise
                  except (urllib.error.URLError, TimeoutError, ConnectionError) as exc:
                      last_error = exc
                      if attempt == 5:
                          raise
                  delay = min(2 ** attempt, 16)
                  print(f"{label}_RETRY attempt={attempt}/5 delay={delay}s error={last_error}", flush=True)
                  time.sleep(delay)
              raise RuntimeError(f"{label} failed after retries: {last_error}")

          # Read first: do not repeat the approved mutation if the row is already correct.
          catalog_path = "/diagnostic/bplatz-catalog?" + query
          catalog = get(catalog_path, "BPLATZ_INITIAL_READ")
          rows = catalog.get("store_product_row") or []
          exact = next((x for x in rows if x.get("url", "").split("?")[0] == product_url), None)
          valid = bool(catalog.get("ok") and exact and exact.get("size_ml") == 100
                       and exact.get("price") is not None and exact.get("fetch_status") == "OK")

          if not valid:
              # This is the single explicitly approved Bplatz product URL; no other URL/store is refreshed.
              refreshed = get("/diagnostic/bplatz-refresh?" + query, "BPLATZ_APPROVED_REFRESH")
              print("BPLATZ_SINGLE_URL_REFRESH=" + json.dumps(refreshed, ensure_ascii=False, sort_keys=True), flush=True)
              if not refreshed.get("ok"):
                  raise SystemExit("Bplatz targeted refresh returned ok=false: " + json.dumps(refreshed, ensure_ascii=False))
              persisted = refreshed.get("persisted_row") or {}
              if persisted.get("size_ml") != 100 or persisted.get("price") is None or persisted.get("fetch_status") != "OK":
                  raise SystemExit("Bplatz refresh returned an invalid persisted row: " + json.dumps(refreshed, ensure_ascii=False))
              catalog = get(catalog_path, "BPLATZ_FINAL_READBACK")
              rows = catalog.get("store_product_row") or []
              exact = next((x for x in rows if x.get("url", "").split("?")[0] == product_url), None)

          print("BPLATZ_CATALOG_READBACK=" + json.dumps(catalog, ensure_ascii=False, sort_keys=True), flush=True)
          if not catalog.get("ok") or not exact:
              raise SystemExit("Bplatz catalog readback did not find the exact product URL.")
          print("BPLATZ_CATALOG_MATCHING_ROW=" + json.dumps(exact, ensure_ascii=False, sort_keys=True), flush=True)
          if exact.get("size_ml") != 100 or exact.get("price") is None or exact.get("fetch_status") != "OK":
