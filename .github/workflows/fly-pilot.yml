name: Deploy isolated Offer Engine pilot

on:
  workflow_dispatch:
    inputs:
      confirm_deploy:
        description: Type deploy to create/update the isolated Fly.io pilot
        required: true
        type: choice
        options:
          - deploy

permissions:
  contents: read

concurrency:
  group: scent-hunter-offer-engine-pilot
  cancel-in-progress: false

jobs:
  deploy-pilot:
    name: Deploy isolated pilot (not production)
    if: ${{ github.event.inputs.confirm_deploy == 'deploy' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter-pilot-20261030
      FLY_ORG: personal
      FLY_VOLUME: scenthunter_pilot_data
      PILOT_URL: https://scenthunter-pilot-20261030.fly.dev
      APISH_API_KEY: ${{ secrets.APISH_API_KEY }}
    steps:
      - name: Checkout the architecture branch only
        uses: actions/checkout@v4
        with:
          ref: refactor/catalog-first-architecture

      - name: Validate isolated target and Fly token
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "refactor/catalog-first-architecture" || {
            echo "Run this workflow from refactor/catalog-first-architecture only." >&2
            exit 1
          }
          test -n "$FLY_API_TOKEN" || {
            echo "Repository secret FLY_API_TOKEN is missing." >&2
            exit 1
          }
          # Fly dashboard/org tokens use the FlyV1 macaroon scheme.
          # Some copy surfaces expose only the fm2_ payload; normalize it
          # before flyctl reads FLY_API_TOKEN. Never print the token.
          normalized_token="$FLY_API_TOKEN"
          case "$normalized_token" in
            fm2_*) normalized_token="FlyV1 $normalized_token" ;;
          esac
          echo "::add-mask::$normalized_token"
          printf 'FLY_API_TOKEN=%s\\n' "$normalized_token" >> "$GITHUB_ENV"
          grep -Fq 'app = "scenthunter-pilot-20261030"' fly.staging.toml
          grep -Fq 'source = "scenthunter_pilot_data"' fly.staging.toml
          grep -Fq 'SCENTHUNTER_CATALOG_DATABASE_URL = "sqlite:////data/catalog/catalog.sqlite3"' fly.staging.toml
          grep -Fq 'BPLATZ_PHASE2_PERSISTENCE = "1"' fly.staging.toml
          grep -Fq 'source = "scenthunter_pilot_data"' fly.staging.toml
          echo "Production fly.toml is not used by this workflow."

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Create or verify isolated Fly app
        shell: bash
        run: |
          set -euo pipefail
          # Explicitly target the personal organization. Scoped tokens should
          # not rely on flyctl's implicit organization selection.
          if ! flyctl apps create "$FLY_APP" --org "$FLY_ORG" --yes; then
            echo "App creation returned non-zero; checking whether it already exists."
          fi
          app_names="$(flyctl apps list --org "$FLY_ORG" --quiet 2>&1)" || {
            printf '%s\n' "$app_names" >&2
            echo "Cannot list apps in the target organization; refusing volume/deploy." >&2
            exit 1
          }
          printf '%s\n' "$app_names"
          printf '%s\n' "$app_names" | grep -Fxq "$FLY_APP" || {
            echo "Fly app is not present in organization $FLY_ORG; refusing volume/deploy." >&2
            exit 1
          }

      - name: Create or verify dedicated persistent volume
        shell: bash
        run: |
          set -euo pipefail
          # Allow the newly-created app a short time to become visible to the
          # volumes API before attempting volume creation.
          volume_list=""
          for attempt in $(seq 1 6); do
            if volume_list="$(flyctl volumes list --app "$FLY_APP" 2>&1)"; then
              break
            fi
            echo "Waiting for Fly app/volume API propagation ($attempt/6): $volume_list"
            sleep 5
          done
          if printf '%s\n' "$volume_list" | grep -Fq "$FLY_VOLUME"; then
            echo "Dedicated pilot volume already exists."
          else
            flyctl volumes create "$FLY_VOLUME" \
              --app "$FLY_APP" \
              --region ams \
              --size 1 \
              --count 1 \
              --yes
          fi

      - name: Configure optional API.SH provider key
        if: ${{ env.APISH_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets set APISH_API_KEY="$APISH_API_KEY" --app "$FLY_APP"

      - name: Deploy pilot app
        shell: bash
        run: |
          set -euo pipefail
          flyctl deploy --remote-only --config fly.staging.toml --app "$FLY_APP" --yes

      - name: Wait for isolated pilot to boot
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import time
          import urllib.request

          url = "https://scenthunter-pilot-20261030.fly.dev/health"
          for attempt in range(1, 25):
              try:
                  with urllib.request.urlopen(url, timeout=15) as response:
                      if response.status == 200:
                          print("PILOT_BOOT=PASS")
                          break
              except Exception as exc:
                  print(f"Attempt {attempt}/24: {type(exc).__name__}")
              if attempt < 24:
                  time.sleep(5)
          else:
              raise SystemExit("Pilot did not become healthy.")
          PY

      - name: Migrate and seed the isolated canonical catalog
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app "$FLY_APP" --command "sh -lc 'cd /app/backend && /app/.venv/bin/python -m alembic -c alembic.ini upgrade head && /app/.venv/bin/python scripts/seed_catalog.py --apply --seed-bplatz-store'"

      - name: Verify pilot health, canonical status and catalog search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          base = "https://scenthunter-pilot-20261030.fly.dev"
          query = urllib.parse.urlencode({"query": "Liquid Brun 100 ml", "market": "LU"})
          last_error = None

          for attempt in range(1, 25):
              try:
                  def get(path):
                      request = urllib.request.Request(
                          base + path,
                          headers={"Accept": "application/json", "User-Agent": "ScentHunter-Pilot-Smoke/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path}: HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))

                  health = get("/health")
                  if health.get("status") != "healthy":
                      raise RuntimeError("Pilot health is not healthy: " + json.dumps(health))
                  catalog_status = get("/api/catalog/status")
                  if catalog_status.get("status") != "ready":
                      raise RuntimeError("Canonical catalog is not ready: " + json.dumps(catalog_status))
                  catalog_search = get("/api/catalog/search?q=" + urllib.parse.quote("French Avenue Liquid Brun EDP 100ml"))
                  if catalog_search.get("status") != "completed" or not isinstance(catalog_search.get("results"), list):
                      raise RuntimeError("Canonical catalog search returned an invalid contract: " + json.dumps(catalog_search))
                  print("PILOT_HEALTH=PASS")
                  print("PILOT_CATALOG_STATUS=PASS")
                  print("PILOT_CATALOG_SEARCH=PASS")
                  print("PILOT_CANONICAL_PRODUCTS=" + str(catalog_status.get("canonical_products", 0)))
                  print("PILOT_CANONICAL_VARIANTS=" + str(catalog_status.get("canonical_variants", 0)))
                  print("PILOT_PUBLISHED_OFFERS=" + str(catalog_status.get("published_offers", 0)))
                  print("PILOT_SEARCH_RESULTS=" + str(catalog_search.get("count", 0)))
                  print("PILOT_URL=" + base)
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = f"{type(exc).__name__}: {exc}"
                  print(f"Attempt {attempt}/24: {last_error}", flush=True)
                  if attempt < 24:
                      time.sleep(5)
          else:
              raise SystemExit("Pilot smoke test failed: " + str(last_error))
          PY

      - name: Set up Python for API.SH smoke
        if: ${{ env.APISH_API_KEY != '' }}
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Verify API.SH Notino provider (one bounded search)
        if: ${{ env.APISH_API_KEY != '' }}
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --quiet requests beautifulsoup4
          PYTHONPATH=backend python - <<'PY'
          import json
          from scrapers.notino.scraper import _search_apish

          rows, diagnostics = _search_apish("French Avenue Liquid Brun 100 ml")
          safe = {key: value for key, value in diagnostics.items() if key not in {"api_key", "token"}}
          print("APISH_DIAGNOSTICS=" + json.dumps(safe, ensure_ascii=False))
          print("APISH_VERIFIED_OFFERS=" + str(len(rows)))
          if diagnostics.get("error"):
              raise SystemExit("API.SH provider request failed: " + str(diagnostics["error"]))
          print("APISH_PROVIDER_REQUEST=PASS")
          PY

      - name: Print pilot URL
        if: success()
        run: echo "ScentHunter isolated Offer Engine pilot is available at $PILOT_URL"
