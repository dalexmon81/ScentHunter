name: Fly PostgreSQL legacy catalog dry-run
# This workflow performs inspection only; it never enqueues or mutates data.
# Host-level rejection counts are emitted to preserve visibility into skipped storefronts.
# This run validates the expanded Deloox market mapping without writing to PostgreSQL.

on:
  push:
    branches:
      - fix/public-postgres-catalog-ingestion-2026-11-22
    paths:
      - .github/workflows/fly-postgres-legacy-catalog-dry-run.yml

jobs:
  legacy-catalog-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    permissions:
      contents: read
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter

    steps:
      - name: Check out exact pushed commit
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Find the app machine with the mounted legacy catalog
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl machines list --app "$FLY_APP" --json > /tmp/fly-machines.json
          python - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          with open("/tmp/fly-machines.json", encoding="utf-8") as handle:
              machines = json.load(handle)
          candidates = []
          for machine in machines:
              config = machine.get("config") or {}
              metadata = config.get("metadata") or {}
              group = metadata.get("fly_process_group") or metadata.get("process_group")
              if group == "app":
                  candidates.insert(0, machine.get("id"))
              elif machine.get("id"):
                  candidates.append(machine["id"])
          seen = set()
          ordered = []
          for machine_id in candidates:
              if machine_id and machine_id not in seen:
                  ordered.append(machine_id)
                  seen.add(machine_id)
          print("machine_ids=" + " ".join(ordered))
          PY

      - name: Verify mounted SQLite source and PostgreSQL target configuration
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          found=0
          for machine_id in ${{ steps.machine.outputs.machine_ids }}; do
            if flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "sh -lc 'test -r /data/store_catalog.sqlite3 && test -x /app/.venv/bin/python && test -n \"\$SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL\" && echo SCENTHUNTER_PREFLIGHT=PASS'" ; then
              echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
              found=1
              break
            fi
          done
          test "$found" -eq 1

      - name: Run read-only SQLite to PostgreSQL queue dry-run
        shell: bash
        env:
          MACHINE_ID: ${{ steps.preflight.outputs.machine_id }}
        run: |
          set -euo pipefail
          script_b64="$(base64 -w0 backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py)"
          remote_command="sh -lc 'set -e; mkdir -p /tmp/shim/backend/scripts; trap \"rm -f /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py\" EXIT; printf %s ${script_b64} | base64 -d > /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py; PYTHONPATH=/app/backend /app/.venv/bin/python /tmp/shim/backend/scripts/seed_postgres_fetch_queue_from_legacy_catalog.py --source /data/store_catalog.sqlite3'"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"

      - name: Inspect PostgreSQL stores and queue without writing
        shell: bash
        env:
          MACHINE_ID: ${{ steps.preflight.outputs.machine_id }}
        run: |
          set -euo pipefail
          script_b64="$(base64 -w0 backend/scripts/inspect_postgres_legacy_seed_target.py)"
          remote_command="sh -lc 'set -e; mkdir -p /tmp/shim/backend/scripts; trap \"rm -f /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py\" EXIT; printf %s ${script_b64} | base64 -d > /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py; PYTHONPATH=/app/backend /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py'"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"
