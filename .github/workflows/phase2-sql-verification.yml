name: Phase 2 SQL Verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    name: Read-only Phase 2 SQL verification
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call authenticated read-only verification endpoint
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${SCENTHUNTER_BASELINE_URL:-}" || -z "${SCENTHUNTER_BASELINE_TOKEN:-}" ]]; then
            printf '%s\\n' '{"error":"Required repository secret is unavailable."}'
            exit 1
          fi

          suffix="/admin/phase0/baseline-report.csv"
          if [[ "$SCENTHUNTER_BASELINE_URL" == *"$suffix" ]]; then
            base_url="${SCENTHUNTER_BASELINE_URL%"$suffix"}"
          else
            base_url="${SCENTHUNTER_BASELINE_URL%/}"
          fi

          http_code=$(curl --silent --connect-timeout 10 --max-time 30 \
            --output phase2-response.json --write-out '%{http_code}' \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            -H "Accept: application/json" \
            "$base_url/admin/phase2/sql-verification" 2>/dev/null) || {
              printf '%s\\n' '{"error":"Endpoint request failed."}'
              exit 1
            }

          if [[ "$http_code" != "200" ]] || ! jq -e 'type == "object" and all(["A","B","C","D"][]; has(.))' phase2-response.json >/dev/null 2>&1; then
            printf '%s\\n' '{"error":"Endpoint returned an unsuccessful or invalid response."}'
            exit 1
          fi

          jq . phase2-response.json
