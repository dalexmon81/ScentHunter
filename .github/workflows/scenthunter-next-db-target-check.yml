name: ScentHunter inspect PostgreSQL target configuration

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenthunter-next-db-target-check
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly access
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"

      - name: Inspect configured target URLs without exposing credentials
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'PY'
          import os
          from sqlalchemy.engine import make_url
          keys = (
              "SCENTHUNTER_NEXT_DB",
              "SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL",
              "SCENTHUNTER_CATALOG_DATABASE_URL",
              "SCENTHUNTER_DATABASE_URL",
          )
          for key in keys:
              raw = (os.getenv(key) or "").strip()
              print(key + "_CONFIGURED=" + str(bool(raw)))
              if not raw:
                  continue
              try:
                  url = make_url(raw)
                  print(key + "_BACKEND=" + url.get_backend_name())
                  print(key + "_DRIVER=" + url.drivername)
                  print(key + "_HOST=" + str(url.host or ""))
                  print(key + "_DATABASE=" + str(url.database or ""))
                  print(key + "_USERNAME_PRESENT=" + str(bool(url.username)))
                  print(key + "_PASSWORD_PRESENT=" + str(bool(url.password)))
              except Exception:
                  print(key + "_PARSE=INVALID")
          PY
          )"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl ssh console --app scenthunter --select=false -C "/bin/sh -lc 'echo $encoded_script | base64 -d | /app/.venv/bin/python -'"

      - name: Confirm read-only boundary
        run: echo "TARGET_CONFIG_INSPECTION=READ_ONLY"
