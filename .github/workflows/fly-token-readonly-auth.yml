name: Fly token read-only authentication check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fly-token-readonly-auth.yml

permissions:
  contents: read

jobs:
  verify-fly-auth:
    name: Diagnose Fly app token authorization (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Capture direct Fly API authorization response
        env:
          FLY_API_TOKEN: ${{ startsWith(secrets.FLY_API_TOKEN, 'fm2_') && format('FlyV1 {0}', secrets.FLY_API_TOKEN) || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          for endpoint in \
            "https://api.machines.dev/v1/apps/scenthunter" \
            "https://api.machines.dev/v1/apps/scenthunter/volumes"; do
            echo "Checking endpoint: ${endpoint##*/}"
            code=$(curl --silent --show-error \
              -H "Authorization: Bearer ${FLY_API_TOKEN}" \
              -H "Accept: application/json" \
              -o /tmp/fly-response.json \
              -w "%{http_code}" "$endpoint")
            echo "HTTP_STATUS=$code"
            jq -c . /tmp/fly-response.json 2>/dev/null || sed -n '1,8p' /tmp/fly-response.json
          done
