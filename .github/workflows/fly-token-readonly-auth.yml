name: Fly token read-only authentication check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fly-token-readonly-auth.yml

permissions:
  contents: read

jobs:
  verify-fly-auth:
    name: Verify Fly token scope (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify direct access to ScentHunter app
        env:
          FLY_API_TOKEN: ${{ startsWith(secrets.FLY_API_TOKEN, 'fm2_') && format('FlyV1 {0}', secrets.FLY_API_TOKEN) || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "STEP 1: Fly recognizes the configured token"
          flyctl auth whoami
          echo "STEP 2: Direct visibility of app scenthunter"
          flyctl status --app scenthunter --json
          echo "STEP 3: Volume visibility"
          flyctl volumes list --app scenthunter --json
