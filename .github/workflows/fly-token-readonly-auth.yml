name: Fly token read-only authentication check

on:
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fly-token-readonly-auth.yml

permissions:
  contents: read

jobs:
  verify-fly-auth:
    name: Verify Fly app-scoped token (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify token identity, app access, and volume access
        env:
          FLY_API_TOKEN: ${{ startsWith(secrets.FLY_API_TOKEN, 'fm2_') && format('FlyV1 {0}', secrets.FLY_API_TOKEN) || secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "STEP 1: Does Fly recognize the token?"
          flyctl auth whoami
          echo "FLY_TOKEN_IDENTITY_CHECK=PASS"
          echo "STEP 2: Can the token read app scenthunter?"
          flyctl status --app scenthunter --json
          echo "FLY_APP_READ_CHECK=PASS"
          echo "STEP 3: Can the token list app volumes?"
          flyctl volumes list --app scenthunter --json
          echo "FLY_VOLUME_READ_CHECK=PASS"
