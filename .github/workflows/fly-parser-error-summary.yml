name: Fly read-only parser error summary

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  parser-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Summarize recent Deloox parser errors (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          timeout 45s flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; c=sqlite3.connect(\x27file:/data/store_catalog.sqlite3?mode=ro\x27,uri=True); c.row_factory=sqlite3.Row; c.execute(\x27PRAGMA query_only=ON\x27); p=[dict(r) for r in c.execute(\x27SELECT url,substr(fetch_status,1,220) AS error,fetched_at FROM store_products WHERE lower(store)=\x27\x27deloox\x27\x27 AND fetch_status LIKE \x27\x27%product_parser_not_found%\x27\x27 ORDER BY fetched_at DESC LIMIT 12\x27)]; q=[dict(r) for r in c.execute(\x27SELECT state,substr(last_error,1,160) AS error,COUNT(*) AS n,MAX(last_started_at) AS max_started FROM hydration_queue WHERE lower(store)=\x27\x27deloox\x27\x27 AND COALESCE(last_error,\x27\x27)<>\x27\x27 GROUP BY state,substr(last_error,1,160) ORDER BY max_started DESC LIMIT 10\x27)]; print(json.dumps({\x27read_only\x27:True,\x27database_mutated\x27:False,\x27latest_parser_errors\x27:p,\x27queue_recent_errors\x27:q},ensure_ascii=False,default=str)); c.close()' || echo '{"audit_error":"Fly SSH timed out or failed; read-only audit only."}'
