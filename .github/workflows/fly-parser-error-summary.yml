name: Fly read-only parser error summary

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  parser-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Summarize recent Deloox parser errors (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          timeout 45s flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import base64;exec(base64.b64decode(\\x27))"' || echo '{"audit_error":"Fly SSH timed out or failed; read-only audit only."}'
