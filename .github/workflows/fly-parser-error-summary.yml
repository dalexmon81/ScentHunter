name: Fly read-only parser error summary

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  parser-summary:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Summarize recent Deloox parser errors (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # The fallback must not hide SSH failures as a green audit. SQLite is
          # opened with mode=ro and query_only=ON by the embedded read-only script.
          timeout 180s flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import base64;exec(base64.b64decode(\"  \"))'";
