name: Temporary read-only Notino staging diagnosis

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Observe isolated staging searches
        shell: bash
        run: |
          python - <<'PY'
          import json, urllib.parse
          from collections import Counter
          import requests

          base = "https://scenthunter-pr726-staging.fly.dev"
          queries = (
              "Hawas", "Rasasi Hawas Kobra", "Liquid Brun",
              "Liquid Brun Limited Edition", "Dior Sauvage",
              "Armaf Club de Nuit", "Lattafa Asad",
          )
          for term in queries:
              try:
                  response = requests.get(base + "/search", params={"q": term}, timeout=60)
                  response.raise_for_status()
                  payload = response.json()
                  groups = []
                  stores, prices, cj_hosts = Counter(), Counter(), Counter()
                  for group in payload.get("results", []):
                      offers = []
                      for offer in group.get("offers", []):
                          store = str(offer.get("store") or offer.get("shop") or "")
                          stores[store] += 1
                          if offer.get("price_num") is not None:
                              prices[store] += 1
                          host = urllib.parse.urlsplit(offer.get("url") or "").hostname
                          if store.casefold() == "notino":
                              cj_hosts[host or "missing"] += 1
                          offers.append({key: offer.get(key) for key in
                              ("store", "price_num", "currency", "size_ml",
                               "price_stale", "availability", "url", "source")})
                      groups.append({
                          "id": group.get("catalog_id"), "name": group.get("name"),
                          "retailer_only": group.get("retailer_only"), "offers": offers,
                      })
                  print("STAGING_SEARCH=" + json.dumps({
                      "query": term, "group_count": len(groups),
                      "stores": stores, "priced": prices, "notino_hosts": cj_hosts,
                      "results": groups,
                  }, ensure_ascii=False))
              except (requests.RequestException, ValueError) as exc:
                  print("STAGING_SEARCH_ERROR=" + json.dumps({"query": term, "error": str(exc)}))
          PY
