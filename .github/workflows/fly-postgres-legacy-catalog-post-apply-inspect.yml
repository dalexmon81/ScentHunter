name: Read-only PostgreSQL queue inspection
on:
  push:
    branches:
      - fix/public-postgres-catalog-ingestion-2026-11-22
    paths:
      - .github/workflows/fly-postgres-legacy-catalog-post-apply-inspect.yml
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect production database without writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
        shell: bash
        run: |
          set -euo pipefail
          test "$COMMIT_MESSAGE" = "ops: inspect PostgreSQL queue after interrupted apply"
          test -n "$FLY_API_TOKEN"
          flyctl machines list --app "$FLY_APP" --json > /tmp/machines.json
          MACHINE_ID="$(python -c 'import json; m=json.load(open("/tmp/machines.json")); p=[x.get("id") for x in m if ((x.get("config") or {}).get("metadata") or {}).get("fly_process_group")=="app"]; o=[x.get("id") for x in m if x.get("id") not in p]; print(next((x for x in p+o if x), ""))')"
          test -n "$MACHINE_ID"
          inspector_b64="$(base64 -w0 backend/scripts/inspect_postgres_legacy_seed_target.py)"
          remote_command="sh -lc 'set -e; test -x /app/.venv/bin/python; mkdir -p /tmp/shim/backend/scripts; trap \"rm -f /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py\" EXIT; printf %s ${inspector_b64} | base64 -d > /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py; export PYTHONPATH=/app/backend; timeout 180 /app/.venv/bin/python /tmp/shim/backend/scripts/inspect_postgres_legacy_seed_target.py'"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "$remote_command"

# one-shot read-only inspection run
