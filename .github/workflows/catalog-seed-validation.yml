name: Catalog seed validation

on:
  pull_request:
    branches:
      - catalog/brand-expansion-2026-11
    paths:
      - "backend/product_catalog.json"
      - "backend/family_registry.json"
      - "backend/tests/test_catalog_seed_recovery.py"
      - ".github/workflows/catalog-seed-validation.yml"
  push:
    branches:
      - catalog/complete-brand-expansion-2026-11

permissions:
  contents: read

jobs:
  validate-catalog-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate recovered catalog seed
        run: >-\n          python -m unittest\n          backend.tests.test_catalog_seed_integrity\n          backend.tests.test_catalog_seed_recovery\n          backend.tests.test_catalog_source_confidence\n          backend.tests.test_bujairami_originals\n          backend.tests.test_armaf_detail_evidence\n          backend.tests.test_paris_corner_detail_evidence\n          backend.tests.test_zimaya_detail_evidence\n          backend.tests.test_maison_asrar_royal_collection\n          backend.tests.test_al_haramain_catalog\n          backend.tests.test_al_wataniah_detail_evidence\n          backend.tests.test_arabiyat_prestige_extrait\n          backend.tests.test_arabiyat_prestige_marwa_extrait\n          backend.tests.test_arabiyat_prestige_official_store\n          backend.tests.test_french_avenue_catalog\n          backend.tests.test_games_of_spades_catalog\n          backend.tests.test_khadlaj_catalog_parity\n          backend.tests.test_khadlaj_la_fede\n          backend.tests.test_lattafa_catalog\n          backend.tests.test_maison_asrar_lock_and_key\n          backend.tests.test_paris_corner_catalog_parity\n          backend.tests.test_swiss_arabian_detail_evidence\n          -v
