name: Catalog seed validation

on:
  pull_request:
    branches:
      - catalog/catalog-final-continuation-2026-11-10-afnan-armaf
  push:
    branches:
      - catalog/catalog-final-continuation-2026-11-10-afnan-armaf

permissions:
  contents: read

jobs:
  catalog-seed-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run catalog seed validation
        run: |
          python -m unittest \
            backend.tests.test_official_afnan_armaf_variant_batch_2026_11_10
