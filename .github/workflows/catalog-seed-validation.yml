name: Catalog seed validation

on:
  pull_request:
    branches:
      - catalog/official-brand-audit-2026-11-10
      - catalog/khadlaj-cream-velvet-verified-2026-11-10
      - catalog/cumulative-audit-next-2026-11-10
      - catalog/brand-expansion-2026-11
      - catalog/complete-brand-expansion-2026-11
      - catalog/assaf-range-harvest-2026-11-08
      - catalog/al-haramain-gulf-orchid-harvest-2026-11-08
      - catalog/afnan-lattafa-official-harvest-2026-11-08
      - catalog/khadlaj-paris-corner-official-harvest-2026-11-08
      - catalog/consolidated-brand-catalog-2026-11-08
      - catalog/requested-brand-harvest-2026-11-08
    paths:
      - "backend/product_catalog.json"
      - "backend/family_registry.json"
      - "backend/tests/**"
      - ".github/workflows/catalog-seed-validation.yml"
  push:
    branches:
      - catalog/khadlaj-cream-velvet-verified-2026-11-10
      - catalog/complete-brand-expansion-2026-11
      - catalog/assaf-range-harvest-2026-11-08
      - catalog/al-haramain-gulf-orchid-harvest-2026-11-08
      - catalog/afnan-lattafa-official-harvest-2026-11-08
      - catalog/khadlaj-paris-corner-official-harvest-2026-11-08
      - catalog/consolidated-brand-catalog-2026-11-08
      - catalog/requested-brand-harvest-2026-11-08

permissions:
  contents: read

jobs:
  validate-catalog-seed:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate recovered catalog seed
        run: >-
          python -m unittest
          backend.tests.test_catalog_seed_integrity
          backend.tests.test_catalog_seed_recovery
          backend.tests.test_catalog_family_registry_coverage
          backend.tests.test_catalog_source_confidence
          backend.tests.test_bujairami_originals
          backend.tests.test_bujairami_catalog
          backend.tests.test_armaf_detail_evidence
          backend.tests.test_paris_corner_detail_evidence
          backend.tests.test_zimaya_detail_evidence
          backend.tests.test_maison_asrar_royal_collection
          backend.tests.test_maison_asrar_lock_and_key
          backend.tests.test_al_haramain_catalog
          backend.tests.test_al_wataniah_detail_evidence
          backend.tests.test_french_avenue_catalog
          backend.tests.test_games_of_spades_catalog
          backend.tests.test_khadlaj_catalog_parity
          backend.tests.test_khadlaj_la_fede
          backend.tests.test_lattafa_catalog
          backend.tests.test_paris_corner_catalog_parity
          backend.tests.test_swiss_arabian_detail_evidence
          backend.tests.test_arabiyat_prestige_extrait
          backend.tests.test_arabiyat_prestige_marwa_extrait
          backend.tests.test_assaf_range_harvest
          backend.tests.test_al_haramain_gulf_orchid_store_harvest
          backend.tests.test_afnan_lattafa_official_harvest
          backend.tests.test_khadlaj_official_spray_harvest
          backend.tests.test_khadlaj_cream_velvet_official_variant
          backend.tests.test_paris_corner_official_collection_reconciliation
          backend.tests.test_arabiyat_prestige_official_store
          backend.tests.test_arabiyat_prestige_new_launch_2026_11_10
          backend.tests.test_al_wataniah_official_collection_harvest
          backend.tests.test_requested_brand_catalog_coverage
          backend.tests.test_velixir_official_storefront
          backend.tests.test_mykonos_official_storefront
          backend.tests.test_al_wataniah_official_storefront
          backend.tests.test_afnan_official_global_storefront
          backend.tests.test_aromatix_official_catalog
          backend.tests.test_gulf_orchid_new_arrivals_2026_11_10
          backend.tests.test_maison_asrar_official_detail_reconciliation
          backend.tests.test_maison_asrar_official_product_page_batch
          backend.tests.test_maison_asrar_official_product_page_batch_two
          backend.tests.test_maison_asrar_official_size_variant_batch_three

          backend.tests.test_maison_asrar_official_product_page_batch_four          backend.tests.test_maison_asrar_new_arrivals_2026_11_10
          -v
