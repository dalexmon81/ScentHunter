name: Catalog seed validation

on:
  pull_request:
    branches:
      - catalog/al-haramain-official-variants-2026-11-10
      - catalog/afnan-official-variants-2026-11-10
      - catalog/maison-asrar-official-name-audit-2026-11-10
      - catalog/catalog-audit-next-2026-11-10
      - catalog/armaf-paris-corner-variant-gap-2026-11-10
      - catalog/al-wataniah-cumulative-ci-docs-2026-11-10
      - catalog/maison-alhambra-mens-detail-batch-2026-11-10
      - catalog/maison-alhambra-womens-detail-batch-2026-11-10
      - catalog/maison-alhambra-unisex-detail-batch-2026-11-10
      - catalog/armaf-cdn-intense-extrait-70ml-2026-11-10
      - catalog/armaf-cdn-woman-extrait-70ml-2026-11-10
      - catalog/afnan-official-evidence-batch-2026-11-10
      - catalog/afnan-official-evidence-followup-2026-11-10
      - catalog/afnan-official-evidence-third-batch-2026-11-10
      - catalog/afnan-official-evidence-fourth-batch-2026-11-10
  push:
    branches:
      - catalog/khadlaj-official-gtin-gender-audit-2026-11-10
      - catalog/al-haramain-official-variants-2026-11-10
      - catalog/afnan-official-variants-2026-11-10
      - catalog/catalog-audit-next-2026-11-10
      - catalog/armaf-paris-corner-variant-gap-2026-11-10
      - catalog/al-wataniah-cumulative-ci-docs-2026-11-10
      - catalog/maison-alhambra-mens-detail-batch-2026-11-10
      - catalog/maison-alhambra-womens-detail-batch-2026-11-10
      - catalog/maison-alhambra-unisex-detail-batch-2026-11-10
      - catalog/armaf-cdn-intense-extrait-70ml-2026-11-10
      - catalog/armaf-cdn-woman-extrait-70ml-2026-11-10
      - catalog/afnan-official-evidence-batch-2026-11-10
      - catalog/afnan-official-evidence-followup-2026-11-10
      - catalog/afnan-official-evidence-third-batch-2026-11-10
      - catalog/afnan-official-evidence-fourth-batch-2026-11-10

permissions:
  contents: read

jobs:
  catalog-seed-validation:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run cumulative catalog seed validation
        run: |
          python -m unittest \
            backend.tests.test_catalog_seed_integrity \
            backend.tests.test_catalog_global_integrity_2026_11_10 \
            backend.tests.test_catalog_seed_recovery \
            backend.tests.test_catalog_family_registry_coverage \
            backend.tests.test_catalog_source_confidence \
            backend.tests.test_cumulative_catalog_integration_2026_11_10 \
            backend.tests.test_cumulative_catalog_regression_guard_2026_11_10 \
            backend.tests.test_cumulative_family_registry_mapping_2026_11_10 \
            backend.tests.test_family_registry_identity_normalization \
            backend.tests.test_armaf_paris_corner_variant_gap_2026_11_10 \
            backend.tests.test_requested_brand_catalog_coverage \
            backend.tests.test_official_afnan_armaf_variant_batch_2026_11_10 \
            backend.tests.test_afnan_official_variants_2026_11_10 \
            backend.tests.test_afnan_official_evidence_batch_2026_11_10 \
            backend.tests.test_afnan_official_evidence_followup_2026_11_10 \
            backend.tests.test_afnan_official_evidence_third_batch_2026_11_10 \
            backend.tests.test_afnan_official_evidence_fourth_batch_2026_11_10 \
            backend.tests.test_al_haramain_official_variants_2026_11_10 \
            backend.tests.test_khadlaj_official_new_launch_completeness_2026_11_10 \
            backend.tests.test_khadlaj_shiyaaka_rose_gold_official_2026_11_10 \
            backend.tests.test_al_wataniah_detail_evidence \
            backend.tests.test_al_wataniah_official_collection_harvest \
            backend.tests.test_al_wataniah_official_storefront \
            backend.tests.test_al_wataniah_official_details_2026_11_10 \
            backend.tests.test_al_wataniah_cumulative_coverage_2026_11_10 \
            backend.tests.test_assaf_wild_colt_alex_enable_official_variants_2026_11_10 \
            backend.tests.test_maison_alhambra_jean_lowe_official_variants_2026_11_10 \
            backend.tests.test_maison_alhambra_five_official_variants_2026_11_10 \
            backend.tests.test_maison_alhambra_jean_lowe_azure_noir_2026_11_10 \
            backend.tests.test_maison_alhambra_luxe_bold_mindset_official_2026_11_10 \
            backend.tests.test_maison_alhambra_kismet_matiere_official_2026_11_10 \
            backend.tests.test_maison_alhambra_glacier_fusion_mysterious_amber_2026_11_10 \
            backend.tests.test_maison_alhambra_mens_detail_batch_2026_11_10 \
            backend.tests.test_maison_alhambra_womens_detail_batch_2026_11_10 \
            backend.tests.test_maison_alhambra_unisex_detail_batch_2026_11_10 \
            backend.tests.test_armaf_cdn_intense_extrait_70ml_2026_11_10 \
            backend.tests.test_armaf_cdn_woman_extrait_variants_2026_11_10 \
            backend.tests.test_maison_asrar_official_name_audit_2026_11_10 \
            backend.tests.test_maison_asrar_official_identity_pages_2026_11_10 \
            backend.tests.test_khadlaj_hareem_al_sultan_gold_oil_2026_11_10 \
            backend.tests.test_khadlaj_cumulative_catalog_integrity \
            backend.tests.test_al_haramain_catalog \
            backend.tests.test_bujairami_catalog \
            backend.tests.test_french_avenue_catalog \
            backend.tests.test_games_of_spades_catalog \
            backend.tests.test_lattafa_catalog \
            backend.tests.test_paris_corner_catalog_parity \
            backend.tests.test_aromatix_official_catalog
