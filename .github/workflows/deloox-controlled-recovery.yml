# Guarded recovery is deliberately opt-in via the commit message; target refresh is exact-URL and identity-validated.
name: Controlled Deloox queue recovery

on:
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

jobs:
  recover:
    if: ${{ contains(github.event.head_commit.message, 'trigger guarded Deloox recovery') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Cancel stale recovery runs and stop orphaned recovery commands
        env:
          GH_TOKEN: ${{ github.token }}
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?per_page=100")"
          while IFS= read -r stale_id; do
            [ -n "$stale_id" ] || continue
            echo "Cancelling stale recovery run $stale_id"
            gh api -X POST "repos/$GITHUB_REPOSITORY/actions/runs/$stale_id/cancel" || true
          done < <(printf '%s' "$RUNS" | jq -r --arg current "$GITHUB_RUN_ID" '.workflow_runs[] | select(.name == "Controlled Deloox queue recovery" and .status == "in_progress" and (.id|tostring) != $current) | .id')

          echo '--- Inspect possible orphan recovery process ---'
          timeout 20s flyctl ssh console --app scenthunter --select=false -C "ps -eo pid,args | grep '[d]eloox_recovery.py' || true" || true
          echo '--- Stop only orphaned apply commands; SQLite will roll back any uncommitted transaction ---'
          timeout 20s flyctl ssh console --app scenthunter --select=false -C "pkill -f '[d]eloox_recovery.py --apply --confirm-recovery' || true" || true

      - name: Wait for this revision's deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 90); do
            DEPLOYS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            STATUS="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .status // "missing"')"
            CONCLUSION="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .conclusion // ""')"
            echo "Waiting for Fly Deploy for $GITHUB_SHA: $STATUS / $CONCLUSION (attempt $attempt/90)"
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then READY=1; break; fi
            # The Fly Deploy workflow also runs production smoke tests after
            # the actual deploy. A smoke-test failure must not permanently
            # block a guarded data recovery if the live app is healthy.
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              HEALTH="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' https://scenthunter.fly.dev/health || true)"
              CATALOG="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' https://scenthunter.fly.dev/catalog-status || true)"
              echo "Deploy workflow failed post-deploy checks; live health=$HEALTH catalog=$CATALOG"
              if [ "$HEALTH" = "200" ] && [ "$CATALOG" = "200" ]; then READY=1; break; fi
              echo 'Live app health could not be verified; recovery blocked.' >&2; exit 1
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then echo 'Deploy did not complete in time; recovery blocked.' >&2; exit 1; fi

      - name: Wait for validated parser, apply guarded recovery, and verify
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='/app/.venv/bin/python /app/backend/scenthunter_next_engine/deloox_recovery.py'
          PRECHECK=''
          READY=0
          for attempt in $(seq 1 12); do
            echo "Read-only parser precheck attempt $attempt/12"
            if PRECHECK="$(timeout 25s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT" 2>&1)"; then
              printf '%s\n' "$PRECHECK"
              if printf '%s\n' "$PRECHECK" | grep -Eq '"recovery_apply_allowed": true' &&
                 printf '%s\n' "$PRECHECK" | grep -Eq '"matches_validated_revision": true'; then
                READY=1
                break
              fi
            else
              printf '%s\n' "$PRECHECK"
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Parser identity was not verified; recovery was NOT applied.' >&2
            exit 1
          fi

          echo '--- APPLY GUARDED RECOVERY ---'
          RESULT="$(timeout 120s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT --apply --confirm-recovery")"
          printf '%s\n' "$RESULT"
          printf '%s\n' "$RESULT" | grep -Eq '"status": "RECOVERY_QUEUED"'
          printf '%s\n' "$RESULT" | grep -Eq '"matches_validated_revision": true'

          echo '--- READ-ONLY POSTCHECK ---'
          POSTCHECK="$(timeout 25s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT")"
          printf '%s\n' "$POSTCHECK"
          printf '%s\n' "$POSTCHECK" | grep -Eq '"recovery_apply_allowed": true'
          printf '%s\n' "$POSTCHECK" | grep -Eq '"eligible_product_urls": 0'
          echo '--- VERIFY LIVE SEARCH AFTER PERSISTED Deloox RECOVERY ---'
          python - <<'PY'
          import json
          import re
          import time
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          def get_json(path, timeout=25):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-deloox-post-recovery/1.0"},
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          query = "Liquid Brun Limited Edition 150 ml"
          started_at = time.monotonic()
          job_id = ""
          while time.monotonic() - started_at < 45:
              started = get_json("/search-start?q=" + urllib.parse.quote(query))
              if started.get("status") == "busy":
                  time.sleep(0.25)
                  continue
              job_id = str(started.get("job_id") or "")
              if not job_id:
                  raise RuntimeError("search-start returned no job_id: " + json.dumps(started))
              break
          if not job_id:
              raise RuntimeError("production search stayed busy after Deloox recovery")

          deadline = time.monotonic() + 120
          result = {}
          while time.monotonic() < deadline:
              result = get_json("/search-status?job_id=" + urllib.parse.quote(job_id))
              if result.get("completed"):
                  break
              time.sleep(0.2)
          else:
              raise RuntimeError("production search timed out after Deloox recovery")

          found = []
          all_deloox = []
          for group in result.get("results") or []:
              if not isinstance(group, dict):
                  continue
              group_text = " ".join(str(group.get(k) or "") for k in ("name", "title"))
              for offer in group.get("offers") or []:
                  if not isinstance(offer, dict):
                      continue
                  store = str(offer.get("store") or "").lower()
                  text = " ".join(str(offer.get(k) or "") for k in ("name", "title", "url", "product_url"))
                  if "deloox" in store:
                      all_deloox.append({
                          "group": group_text,
                          "store": offer.get("store"),
                          "name": offer.get("name") or offer.get("title"),
                          "url": offer.get("url") or offer.get("product_url"),
                          "size_ml": offer.get("size_ml"),
                          "availability": offer.get("availability"),
                          "price": offer.get("price"),
                          "price_num": offer.get("price_num"),
                      })
                  combined = group_text + " " + text
                  url = str(offer.get("url") or offer.get("product_url") or "")
                  if "deloox" in store and "/1385920/" in url and re.search(r"(?<!\d)150\s?ml\b", combined, re.I):
                      found.append({
                          "group": group_text,
                          "store": offer.get("store"),
                          "name": offer.get("name") or offer.get("title"),
                          "url": url,
                          "availability": offer.get("availability"),
                          "price": offer.get("price"),
                          "price_num": offer.get("price_num"),
                      })
          print("DELOOX_POST_RECOVERY_SEARCH=" + json.dumps({
              "query": query,
              "count": result.get("count"),
              "matches": found,
              "all_deloox_offers": all_deloox,
              "results": result.get("results"),
              "errors": result.get("errors"),
          }, ensure_ascii=False))
          if not found:
              raise RuntimeError("verified Deloox 150 ml offer is still missing from production search")
          if not any(float(item.get("price_num") or 0) > 0 for item in found):
              raise RuntimeError("Deloox 150 ml offer is present but has no positive price")
          PY

  audit_state:
    # Run a lightweight read-only production audit after every main push so
    # regressions are visible without requiring a specially named commit.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for this revision's deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 90); do
            DEPLOYS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            STATUS="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .status // "missing"')"
            CONCLUSION="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .conclusion // ""')"
            echo "Waiting for Fly Deploy for $GITHUB_SHA: $STATUS / $CONCLUSION (attempt $attempt/90)"
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then READY=1; break; fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              HEALTH="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' https://scenthunter.fly.dev/health || true)"
              CATALOG="$(curl --silent --show-error --max-time 10 -o /dev/null -w '%{http_code}' https://scenthunter.fly.dev/catalog-status || true)"
              echo "Deploy workflow failed post-deploy checks; live health=$HEALTH catalog=$CATALOG"
              if [ "$HEALTH" = "200" ] && [ "$CATALOG" = "200" ]; then READY=1; break; fi
              echo 'Live app health could not be verified; audit blocked.' >&2; exit 1
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then echo 'Deploy did not complete in time; audit blocked.' >&2; exit 1; fi
      - name: Read-only queue and parser audit
        shell: bash
        run: |
          set -euo pipefail
          probe() {
            local label="$1"
            local url="$2"
            local limit="$3"
            echo "--- $label ---"
            if ! curl --silent --show-error --max-time "$limit" "$url"; then
              echo "DIAGNOSTIC_PROBE_FAILED label=$label url=$url"
            fi
            echo
          }
          probe 'Production catalog status (read-only HTTP)' 'https://scenthunter.fly.dev/catalog-status' 20
          probe 'Recent Deloox hydration errors (read-only)' 'https://scenthunter.fly.dev/catalog/hydration-errors?store=deloox&limit=10' 20
          probe 'Liquid Brun Limited Edition URL parser gate (read-only)' 'https://scenthunter.fly.dev/diagnose-deloox-product-url?url=https%3A%2F%2Fwww.deloox.be%2Fproduit%2F1385920%2Ffrench-avenue-liquid-brun-extrait-de-parfum-limited-edition-150-ml.html&q=Liquid%20Brun%20Limited%20Edition%20150%20ml' 45
          probe 'Deloox pipeline GTIN and canonical matching trace (read-only)' 'https://scenthunter.fly.dev/diagnostic/deloox-pipeline' 45
          probe 'Liquid Brun standard 100 ml URL parser gate (read-only)' 'https://scenthunter.fly.dev/diagnose-deloox-product-url?url=https%3A%2F%2Fwww.deloox.be%2Fproduit%2F1355229%2Ffrench-avenue-liquid-brun-eau-de-parfum-100-ml.html&q=Liquid%20Brun%20100%20ml' 45
