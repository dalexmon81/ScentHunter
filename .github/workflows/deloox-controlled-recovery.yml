name: Controlled Deloox queue recovery

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  recover:
    if: ${{ contains(github.event.head_commit.message, 'trigger guarded Deloox recovery') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Wait for validated parser, apply guarded recovery, and verify
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='/app/.venv/bin/python /app/backend/scenthunter_next_engine/deloox_recovery.py'
          PRECHECK=''
          READY=0
          for attempt in $(seq 1 12); do
            echo "Read-only parser precheck attempt $attempt/12"
            if PRECHECK="$(timeout 25s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT" 2>&1)"; then
              printf '%s\n' "$PRECHECK"
              if printf '%s\n' "$PRECHECK" | grep -Eq '"recovery_apply_allowed": true' &&
                 printf '%s\n' "$PRECHECK" | grep -Eq '"matches_validated_revision": true'; then
                READY=1
                break
              fi
            else
              printf '%s\n' "$PRECHECK"
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then
            echo 'Parser identity was not verified; recovery was NOT applied.' >&2
            exit 1
          fi

          echo '--- APPLY GUARDED RECOVERY ---'
          RESULT="$(timeout 120s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT --apply --confirm-recovery")"
          printf '%s\n' "$RESULT"
          printf '%s\n' "$RESULT" | grep -Eq '"status": "RECOVERY_QUEUED"'
          printf '%s\n' "$RESULT" | grep -Eq '"matches_validated_revision": true'

          echo '--- READ-ONLY POSTCHECK ---'
          POSTCHECK="$(timeout 25s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT")"
          printf '%s\n' "$POSTCHECK"
          printf '%s\n' "$POSTCHECK" | grep -Eq '"recovery_apply_allowed": true'
          printf '%s\n' "$POSTCHECK" | grep -Eq '"eligible_product_urls": 0'

  audit_state:
    if: ${{ contains(github.event.head_commit.message, 'diagnose Deloox recovery state') }}
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Read-only queue and parser audit
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          SCRIPT='/app/.venv/bin/python /app/backend/scenthunter_next_engine/deloox_recovery.py'
          timeout 45s flyctl ssh console --app scenthunter --select=false -C "$SCRIPT"
