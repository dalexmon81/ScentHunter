name: Read-only production SQL verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-sql-verification:
    name: Run four read-only SQLite checks on Fly
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Fly CLI (pinned)
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Execute A-D queries in SQLite read-only mode
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          DB='file:/data/store_catalog.sqlite3?mode=ro'

          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import sqlite3; q=chr(39); conn=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\", uri=True); queries=[(\"A: ingestion_raw row\", \"SELECT id, status, created_at FROM ingestion_raw WHERE id = \"+q+\"b9a5a0e9-2130-4dfa-b016-e717071235a1\"+q+\";\"),(\"B: linked offer row\", \"SELECT id, ingestion_raw_id, sku, status FROM offers WHERE id = \"+q+\"f723da10-5f85-4c8e-93bf-c0072163e88e\"+q+\";\"),(\"C: raw ingestion status\", \"SELECT status FROM ingestion_raw WHERE id = \"+q+\"b9a5a0e9-2130-4dfa-b016-e717071235a1\"+q+\";\"),(\"D: raw payload contains target SKU\", \"SELECT id FROM ingestion_raw WHERE id = \"+q+\"b9a5a0e9-2130-4dfa-b016-e717071235a1\"+q+\" AND raw_payload LIKE \"+q+\"%614514178065%\"+q+\";\")]; [(print(\"===== \"+label+\" =====\"), print(conn.execute(query).fetchall())) for label, query in queries]; conn.close()'"

          echo 'READ_ONLY_SQL_VERIFICATION=COMPLETE'
