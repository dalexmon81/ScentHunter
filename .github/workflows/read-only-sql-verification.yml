name: Read-only production SQL verification

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  read-only-sql-verification:
    name: Inspect legacy and Phase 2 databases read-only
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Fly CLI (pinned)
        uses: superfly/flyctl-actions/setup-flyctl@1.5

      - name: Confirm Phase 2 secret is configured (names only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl secrets list --app scenthunter | grep -E 'NAME|SCENTHUNTER_CATALOG_DATABASE_URL' || true

      - name: Inspect legacy and Phase 2 databases in read-only mode
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import base64; exec(base64.b64decode(\"\"))'"
