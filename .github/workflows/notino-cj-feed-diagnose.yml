name: Notino CJ Feed Schema Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notino-cj-feed-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    name: Inspect authorized CJ feed without touching catalog
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Download and inspect CJ feed on Fly (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 8
        shell: bash
        run: |
          set -euo pipefail
          remote_python=$(cat <<'PY'
          import collections, gzip, io, json, os, sys, tempfile, time, urllib.parse, zipfile
          import requests
          import xml.etree.ElementTree as ET

          sys.path.insert(0, "/app/backend")
          from scrapers.notino import affiliate_feed as feed

          started = time.monotonic()
          url = (os.environ.get("NOTINO_CJ_FEED_URL", "").strip() or feed.DEFAULT_CJ_FEED_URL)
          username = (os.environ.get("NOTINO_CJ_FEED_USERNAME", "").strip() or os.environ.get("CJ_HTTP_USERNAME", "").strip())
          password = os.environ.get("NOTINO_CJ_FEED_PASSWORD", "") or os.environ.get("CJ_HTTP_PASSWORD", "")
          if not username or not password:
              raise RuntimeError("notino_diagnostic_credentials_missing")
          parsed = urllib.parse.urlparse(url)
          if parsed.scheme != "https" or not parsed.hostname or parsed.username or parsed.password:
              raise RuntimeError("notino_diagnostic_feed_url_rejected")

          max_bytes = int(getattr(feed, "MAX_FEED_BYTES", 512 * 1024 * 1024))
          paths, hosts, shapes = collections.Counter(), collections.Counter(), collections.Counter()
          candidates = {"link","url","producturl","deep_link","deeplink","buy_url","buyurl","mobile_link","canonical_link","affiliate_link","tracking_link","product_link"}
          count = size = 0
          with tempfile.TemporaryFile() as downloaded:
              with requests.get(url, auth=(username,password), headers={"Accept":"application/xml,text/xml,application/rss+xml,application/atom+xml,*/*","Accept-Encoding":"identity","User-Agent":getattr(feed,"USER_AGENT","ScentHunter feed diagnostic")}, timeout=(15,90), stream=True, allow_redirects=True) as response:
                  final = urllib.parse.urlparse(str(response.url or ""))
                  if final.scheme != "https" or not final.hostname or final.username or final.password:
                      raise RuntimeError("notino_diagnostic_redirect_rejected")
                  if response.status_code in (401,403):
                      raise RuntimeError("notino_diagnostic_auth_denied")
                  response.raise_for_status()
                  if "html" in response.headers.get("Content-Type","").lower():
                      raise RuntimeError("notino_diagnostic_html_response")
                  for chunk in response.iter_content(1024*1024):
                      if chunk:
                          size += len(chunk)
                          if size > max_bytes:
                              raise RuntimeError("notino_diagnostic_feed_too_large")
                          downloaded.write(chunk)
              downloaded.seek(0)
              magic = downloaded.read(4); downloaded.seek(0)
              if magic[:2] == b"\\x1f\\x8b":
                  xml = gzip.GzipFile(fileobj=downloaded)
              elif zipfile.is_zipfile(downloaded):
                  archive = zipfile.ZipFile(downloaded)
                  members = [n for n in archive.namelist() if n.lower().endswith(".xml")]
                  if len(members) != 1:
                      raise RuntimeError("notino_diagnostic_expected_one_xml_in_zip")
                  xml = archive.open(members[0])
              else:
                  xml = downloaded

              def walk(el, prefix):
                  tag = feed._local(el.tag)
                  path = prefix + "/" + tag
                  value = (el.text or "").strip()
                  if value:
                      paths[path] += 1
                  if tag.lower() in candidates:
                      raw = value or el.attrib.get("href","").strip()
                      if raw:
                          p = urllib.parse.urlparse(raw)
                          host = (p.hostname or "NO_HOST").lower()
                          hosts[host] += 1
                          shape = {"scheme":p.scheme or "NO_SCHEME","host":host,"path_prefix":"/".join(p.path.split("/")[:3]),"query_keys":sorted(urllib.parse.parse_qs(p.query).keys())}
                          shapes[json.dumps(shape,sort_keys=True)] += 1
                  for child in list(el):
                      walk(child,path)

              try:
                  for event,node in ET.iterparse(xml,events=("end",)):
                      if feed._local(node.tag).lower() in {"item","entry","product","offer"}:
                          count += 1
                          walk(node,"")
                          node.clear()
              finally:
                  if xml is not downloaded:
                      xml.close()

          print("NOTINO_CJ_STREAM_DIAGNOSTIC="+json.dumps({"items":count,"download_bytes":size,"elapsed_seconds":round(time.monotonic()-started,2),"field_paths":dict(paths.most_common(100)),"link_hosts":dict(hosts.most_common(40)),"link_shapes":[{**json.loads(k),"count":v} for k,v in shapes.most_common(40)]},ensure_ascii=False),flush=True)
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'printf "%s" "$remote_script_b64" | base64 -d | /app/.venv/bin/python'"
          timeout 420s flyctl ssh console --app scenthunter --select=false -C "$remote_command"
