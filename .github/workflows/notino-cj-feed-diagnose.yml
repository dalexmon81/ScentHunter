name: Notino CJ Feed Schema Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: notino-cj-feed-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    name: Inspect authorized CJ feed with PR parser (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Stream feed schema with the parser from this branch
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          parser_source_b64=$(base64 -w0 backend/scrapers/notino/affiliate_feed.py)
          remote_python=$(cat <<'PY'
          import base64
          import collections
          import importlib.util
          import json
          import os
          import sys
          import tempfile
          import time
          import urllib.parse
          import xml.etree.ElementTree as ET

          module_path = "/tmp/notino_affiliate_feed_pr_diagnostic.py"
          with open(module_path, "wb") as handle:
              handle.write(base64.b64decode(os.environ["NOTINO_PARSER_SOURCE_B64"]))
          spec = importlib.util.spec_from_file_location("notino_affiliate_feed_pr_diagnostic", module_path)
          feed = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = feed
          spec.loader.exec_module(feed)

          started = time.monotonic()
          deadline = started + 8 * 60
          field_names = collections.Counter()
          link_hosts = collections.Counter()
          link_shapes = collections.Counter()
          item_count = 0
          stack = []
          item_names = {"item", "entry", "product", "offer"}
          candidate_names = {
              "link", "url", "producturl", "deep_link", "deeplink",
              "buy_url", "buyurl", "mobile_link", "canonical_link",
              "affiliate_link", "tracking_link", "product_link",
          }
          with tempfile.TemporaryFile() as source:
              downloaded = feed._download_feed(source, deadline)
              with feed._xml_stream(source, deadline) as stream:
                  for event, node in ET.iterparse(stream, events=("start", "end")):
                      if time.monotonic() >= deadline:
                          raise RuntimeError("diagnostic_timeout")
                      name = feed._local(node.tag)
                      if event == "start":
                          stack.append(node)
                          continue
                      if name in item_names:
                          item_count += 1
                          for child in node.iter():
                              if child is node:
                                  continue
                              tag = feed._local(child.tag)
                              field_names[tag] += 1
                              if tag in candidate_names:
                                  raw = (child.text or child.attrib.get("href") or "").strip()
                                  if raw:
                                      parsed = urllib.parse.urlparse(raw)
                                      host = (parsed.hostname or "NO_HOST").lower()
                                      link_hosts[host] += 1
                                      keys = tuple(sorted(urllib.parse.parse_qs(parsed.query).keys()))
                                      shape = {
                                          "scheme": parsed.scheme or "NO_SCHEME",
                                          "host": host,
                                          "first_path_segment": parsed.path.split("/")[1] if parsed.path.count("/") > 1 else "/",
                                          "query_keys": list(keys),
                                      }
                                      link_shapes[json.dumps(shape, sort_keys=True)] += 1
                          if len(stack) > 1:
                              stack[-2].remove(node)
                          node.clear()
                      if stack:
                          stack.pop()

          print("NOTINO_CJ_STREAM_DIAGNOSTIC=" + json.dumps({
              "items": item_count,
              "download_bytes": downloaded,
              "elapsed_seconds": round(time.monotonic() - started, 2),
              "field_names": dict(field_names.most_common(100)),
              "link_hosts": dict(link_hosts.most_common(40)),
              "link_shapes": [
                  {**json.loads(shape), "count": count}
                  for shape, count in link_shapes.most_common(40)
              ],
              "catalog_database_touched": False,
          }, ensure_ascii=False), flush=True)
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'export NOTINO_PARSER_SOURCE_B64=\"$parser_source_b64\"; printf \"%s\" \"$remote_script_b64\" | base64 -d | /app/.venv/bin/python'"
          timeout 570s flyctl ssh console --app scenthunter --select=false -C "$remote_command"
