name: Dior pilot staging dry-run

on:
  push:
    branches:
      - phase5/dior-pilot-scoped-seed
    paths:
      - ".github/workflows/dior-pilot-staging-dry-run.yml"

permissions:
  contents: read

jobs:
  staging-dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out pilot branch
        uses: actions/checkout@v4
        with:
          ref: phase5/dior-pilot-scoped-seed
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify Fly token is available
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if [ -z "$FLY_API_TOKEN" ]; then
            echo "::error::Missing repository secret FLY_API_TOKEN"
            exit 1
          fi
      - name: Run scoped dry-run on the isolated staging worker
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          set -euo pipefail
          machine_id="$(flyctl machines list --app scenthunter-staging-workers --json | jq -r '[.[] | select(.state == "started" and .config.metadata.fly_process_group == "app")][0].id')"
          if [ -z "$machine_id" ] || [ "$machine_id" = "null" ]; then
            echo "::error::No started staging app worker found; refusing to continue."
            exit 1
          fi
          remote_command="python -c \"import sys,urllib.request; u='https://raw.githubusercontent.com/dalexmon81/ScentHunter/85b96a34758df6dcb309cff534551e0d987c12c0/backend/scripts/seed_catalog.py'; s=urllib.request.urlopen(u,timeout=20).read(); sys.argv=['seed_catalog_pilot.py','--product-id','SH-AUTO-0178']; exec(compile(s,'/app/backend/scripts/seed_catalog_pilot.py','exec'),{'__name__':'__main__','__file__':'/app/backend/scripts/seed_catalog_pilot.py'})\""
          output="$(flyctl ssh console --app scenthunter-staging-workers --machine "$machine_id" --command "$remote_command")"
          printf '%s\n' "$output"
          printf '%s\n' "$output" | python -c 'import json,sys; r=json.load(sys.stdin); expected={"status":"validated","product_filter":["SH-AUTO-0178"],"brands":1,"fragrances":1,"variants":1,"products_without_variants":0,"offers_imported":0,"stores_to_seed":[],"database_written":False,"source_modified":False}; assert all(r.get(k)==v for k,v in expected.items()), r; print("Staging Dior dry-run safety assertions: PASS")'
