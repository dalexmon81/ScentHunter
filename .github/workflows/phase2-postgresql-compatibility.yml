name: Phase 2 PostgreSQL Compatibility

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/db.py"
      - "backend/app/db_runtime_identity.py"
      - "backend/app/models/**"
      - "backend/alembic/**"
      - "backend/tests/test_phase2_postgresql.py"
      - ".github/workflows/phase2-postgresql-compatibility.yml"

permissions:
  contents: read

jobs:
  postgres-compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scent_test
          POSTGRES_PASSWORD: scent_test
          POSTGRES_DB: scent_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scent_test -d scent_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      SCENTHUNTER_CATALOG_DATABASE_URL: postgresql+psycopg://scent_test:scent_test@localhost:5432/scent_test
      SCENTHUNTER_TEST_POSTGRES_URL: postgresql+psycopg://scent_test:scent_test@localhost:5432/scent_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Upgrade disposable PostgreSQL schema
        working-directory: backend
        run: alembic upgrade head
      - name: Verify repeat migration is a no-op
        working-directory: backend
        run: alembic upgrade head
      - name: Run PostgreSQL compatibility tests
        working-directory: backend
        run: python -m unittest tests.test_phase2_postgresql -v
