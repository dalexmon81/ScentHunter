name: Final isolated ScentHunter pilot verification

on:
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - ".github/workflows/fly-pilot-final-verify.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scent-hunter-offer-engine-pilot
  cancel-in-progress: false

jobs:
  verify:
    name: Verify live isolated catalog and publication
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter-pilot-20261030
      PILOT_URL: https://scenthunter-pilot-20261030.fly.dev

    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate access and locate the started pilot machine
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN" >&2; exit 1; }
          case "$FLY_API_TOKEN" in
            fm2_*) FLY_API_TOKEN="FlyV1 $FLY_API_TOKEN" ;;
          esac
          echo "::add-mask::$FLY_API_TOKEN"
          printf 'FLY_API_TOKEN=%s\n' "$FLY_API_TOKEN" >> "$GITHUB_ENV"
          flyctl status --app "$FLY_APP"
          machine_id="$(flyctl machine list --app "$FLY_APP" --json | python -c 'import json,sys; machines=json.load(sys.stdin); started=[m for m in machines if m.get("state") == "started"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started pilot machine." >&2; exit 1; }
          echo "PILOT_MACHINE_ID=$machine_id" >> "$GITHUB_ENV"
          echo "PILOT_MACHINE_STATE=started"

      - name: Launch bounded detached catalog diagnostics and evidence backfill
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'REMOTE'
          set -eu
          mkdir -p /data/catalog
          rm -f /data/catalog/final_verify.done
          cat > /data/catalog/final_verify.sh <<'VERIFY'
          #!/bin/sh
          cd /app/backend
          timeout 90s /app/.venv/bin/python scripts/ingestion_coverage_report.py --hours 168 > /data/catalog/coverage.log 2>&1
          echo $? > /data/catalog/coverage.exit

          timeout 90s /app/.venv/bin/python scripts/publication_gate_report.py > /data/catalog/publication_before.log 2>&1
          echo $? > /data/catalog/publication_before.exit

          timeout 90s /app/.venv/bin/python scripts/backfill_notino_currency_evidence.py --apply > /data/catalog/currency_backfill.log 2>&1
          echo $? > /data/catalog/currency_backfill.exit

          timeout 90s /app/.venv/bin/python scripts/publication_gate_report.py > /data/catalog/publication_after.log 2>&1
          echo $? > /data/catalog/publication_after.exit

          echo complete > /data/catalog/final_verify.done
          VERIFY
          chmod +x /data/catalog/final_verify.sh
          nohup /bin/sh /data/catalog/final_verify.sh </dev/null >/data/catalog/final_verify.runner.log 2>&1 &
          echo FINAL_VERIFY_STARTED
          REMOTE
          )"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl machine exec "$PILOT_MACHINE_ID" "sh -c 'echo $encoded_script | base64 -d | sh'" --app "$FLY_APP" --timeout 30

          finished=0
          for attempt in $(seq 1 90); do
            poll="$(flyctl machine exec "$PILOT_MACHINE_ID" "sh -lc 'test -f /data/catalog/final_verify.done && echo FINAL_VERIFY_DONE || echo FINAL_VERIFY_RUNNING'" --app "$FLY_APP" --timeout 30 2>&1)" || {
              echo "Verification status poll failed ($attempt/90): $poll"
              sleep 5
              continue
            }
            printf '%s\n' "$poll"
            if printf '%s\n' "$poll" | grep -q 'FINAL_VERIFY_DONE'; then
              finished=1
              break
            fi
            sleep 5
          done
          if [ "$finished" -ne 1 ]; then
            echo "Detached verification did not finish within the polling window." >&2
            flyctl machine exec "$PILOT_MACHINE_ID" "tail -n 80 /data/catalog/final_verify.runner.log" --app "$FLY_APP" --timeout 30 || true
            exit 1
          fi

          flyctl machine exec "$PILOT_MACHINE_ID" "sh -lc 'for f in coverage publication_before currency_backfill publication_after; do echo ===\$f===; cat /data/catalog/\$f.exit 2>/dev/null || true; tail -n 100 /data/catalog/\$f.log 2>/dev/null || true; done'" --app "$FLY_APP" --timeout 30

          for f in coverage publication_before currency_backfill publication_after; do
            code="$(flyctl machine exec "$PILOT_MACHINE_ID" "cat /data/catalog/$f.exit" --app "$FLY_APP" --timeout 30 | tail -n 1)"
            if [ "$code" != "0" ]; then
              echo "PILOT_DIAGNOSTIC_FAILED=$f exit=$code" >&2
              exit 1
            fi
          done
          echo "PILOT_DIAGNOSTICS_AND_CURRENCY_EVIDENCE_BACKFILL=PASS"

      - name: Verify live health and public product search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          base = "https://scenthunter-pilot-20261030.fly.dev"
          def get(path):
              last_error = None
              for attempt in range(1, 9):
                  try:
                      req = urllib.request.Request(
                          base + path,
                          headers={"Accept": "application/json", "User-Agent": "ScentHunter-Final-Pilot-Verification/1.0"},
                      )
                      with urllib.request.urlopen(req, timeout=12) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path} returned HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))
                  except Exception as exc:
                      last_error = exc
                      print(f"RETRY {attempt}/8 {path}: {type(exc).__name__}: {exc}", flush=True)
                      if attempt < 8:
                          time.sleep(5)
              raise RuntimeError(f"{path} failed after retries: {last_error}")

          get("/health")
          status = get("/api/catalog/status")
          query = urllib.parse.quote("French Avenue Liquid Brun EDP 100ml")
          result = get("/api/catalog/search?q=" + query)
          if result.get("status") != "completed":
              raise RuntimeError("Public catalog search did not complete: " + json.dumps(result))
          if int(result.get("offer_count", 0)) < 1:
              raise RuntimeError("Expected verified Notino offer in public search: " + json.dumps(result))
          print("FINAL_PILOT_HEALTH=PASS")
          print("FINAL_CATALOG_STATUS=PASS")
          print("FINAL_PUBLIC_SEARCH=PASS")
          print("FINAL_CANONICAL_PRODUCTS=" + str(status.get("canonical_products", 0)))
          print("FINAL_CANONICAL_VARIANTS=" + str(status.get("canonical_variants", 0)))
          print("FINAL_PUBLISHED_OFFERS=" + str(status.get("published_offers", 0)))
          print("FINAL_QUERY_OFFER_COUNT=" + str(result.get("offer_count", 0)))
          print("FINAL_PILOT_URL=" + base)
          PY

      - name: Print isolated pilot URL
        if: success()
        run: echo "ScentHunter isolated pilot verified at $PILOT_URL"
