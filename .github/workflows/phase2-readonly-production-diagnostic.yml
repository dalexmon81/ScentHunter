name: Phase 2 Read-only Production DB Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    name: Read-only production database inspection
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out diagnostic script
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run read-only database checks on Fly
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${FLY_API_TOKEN:-}" ]]; then
            echo "Required Fly.io access secret is unavailable."
            exit 1
          fi

          encoded_script="$(base64 -w 0 backend/scripts/phase2_readonly_production_diagnostic.py)"
          remote_command="/bin/sh -lc 'echo ${encoded_script} | base64 -d | /app/.venv/bin/python -'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command" 2>&1 | tee phase2-db-readonly-output.txt

      - name: Inspect the 07:43:12 worker log entry (if retained)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl logs --app scenthunter --no-tail 2>&1 > production-logs.txt || true
          matches="$(grep -E '07:43:12' production-logs.txt | grep 'hydration_worker bplatz' || true)"
          if [[ -z "$matches" ]]; then
            echo "WORKER_LOG_07_43_12=NOT_FOUND_IN_RETAINED_LOGS"
            exit 0
          fi
          while IFS= read -r line; do
            product="$(sed -nE 's/.*product=([^ ]+).*/\1/p' <<< "$line")"
            offer_id="$(sed -nE 's/.*offer_id=([^ ]+).*/\1/p' <<< "$line")"
            raw_id="$(sed -nE 's/.*ingestion_raw_id=([^ ]+).*/\1/p' <<< "$line")"
            timestamp="$(grep -oE '[0-9]{4}-[0-9]{2}-[0-9]{2}[^ ]*07:43:12[^ ]*|07:43:12' <<< "$line" | head -n 1 || true)"
            printf 'WORKER_LOG timestamp=%s product=%s offer_id=%s ingestion_raw_id=%s\n' "${timestamp:-07:43:12}" "${product:-NOT_FOUND}" "${offer_id:-NOT_FOUND}" "${raw_id:-NOT_FOUND}"
          done <<< "$matches"
