name: Phase 10 catalog admin metrics tests

on:
  push:
    branches:
      - phase10/catalog-admin-observability
    paths:
      - "backend/app/api/catalog_admin.py"
      - "backend/app/services/catalog_metrics.py"
      - "backend/app/models/**"
      - "backend/tests/test_catalog_admin_metrics.py"
      - ".github/workflows/phase10-catalog-admin-metrics.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  admin-metrics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend and test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r backend/requirements.txt pytest
      - name: Run catalog admin metrics tests
        env:
          PYTHONPATH: backend
        run: python -m pytest -q backend/tests/test_catalog_admin_metrics.py
