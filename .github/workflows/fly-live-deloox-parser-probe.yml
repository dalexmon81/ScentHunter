name: Fly read-only live Deloox parser probe

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Probe live Deloox pages without database writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          timeout 55s flyctl ssh console --app scenthunter --select=false -C "/app/.venv/bin/python -c 'import json,requests; from bs4 import BeautifulSoup; from scrapers.deloox import scraper; urls=[(\"https://www.deloox.com/product/1380881/chloe-le-parfum-parfum-150-ml.html\",\"Chloe Le Parfum\"),(\"https://www.deloox.be/produit/1009926/hermes-eau-de-pamplemousse-rose-eau-de-cologne-100-ml.html\",\"Hermes Eau de Pamplemousse Rose\")]; s=requests.Session(); s.headers.update(scraper.HEADERS); out={\"read_only\":True,\"database_mutated\":False,\"probes\":[]}; exec(\"for url,q in urls:\\n try:\\n  r=s.get(url,timeout=(5,12)); soup=BeautifulSoup(r.text,\\\"html.parser\\\"); data=scraper._jsonld(soup); name=data.get(\\\"name\\\") or \\\"\\\"; out[\\\"probes\\\"].append({\\\"url\\\":url,\\\"status\\\":r.status_code,\\\"jsonld_name\\\":name,\\\"query_matches\\\":scraper.matches(name,q),\\\"url_matches_name\\\":scraper._url_matches_product_name(r.url,name)})\\n except Exception as e: out[\\\"probes\\\"].append({\\\"url\\\":url,\\\"error\\\":str(e)})\"); print(json.dumps(out,ensure_ascii=False)' " || echo '{"audit_error":"Fly SSH timed out or failed; probe is read-only."}'
