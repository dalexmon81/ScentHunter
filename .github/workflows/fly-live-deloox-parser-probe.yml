name: Fly read-only live Deloox parser probe

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  parser-probe:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Probe live Deloox pages without database writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          timeout 55s flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import base64;exec(base64.b64decode(\"\"))'" || echo '{"audit_error":"Fly SSH timed out or failed; probe is read-only."}'
