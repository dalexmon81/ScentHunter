name: Fly read-only runtime code identity audit

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm read-only inspection of the production process and code"
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

jobs:
  runtime-audit:
    if: ${{ inputs.confirm_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect production runtime without changing it
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import os,glob,hashlib; ps=[p for p in glob.glob(\x27/proc/[0-9]*\x27) if \x27uvicorn\x27 in open(p+\x27/comm\x27).read()]; print(\x27UVICORN_PIDS=\x27+\x27,\x27.join(p.rsplit(\x27/\x27,1)[1] for p in ps)); [(lambda f: (print(\x27PROCESS_CWD=\x27+os.readlink(p+\x27/cwd\x27)), print(\x27SOURCE_PATH=\x27+f), print(\x27SOURCE_SHA256=\x27+hashlib.sha256(open(f,\x27rb\x27).read()).hexdigest()), [print(\x27SOURCE_MARKER=\x27+str(i+1)+\x27:\x27+s.strip()) for i,s in enumerate(open(f).read().splitlines()) if any(m in s for m in (\x27class _TelemetrySQLiteConnection\x27,\x27factory=_TelemetrySQLiteConnection\x27,\x27def _save_discovery\x27))]))(os.readlink(p+\x27/cwd\x27)+\x27/backend/catalog_engine.py\x27) for p in ps if os.path.isfile(os.readlink(p+\x27/cwd\x27)+\x27/backend/catalog_engine.py\x27)]; print(\x27RUNTIME_AUDIT=READ_ONLY\x27)'"
