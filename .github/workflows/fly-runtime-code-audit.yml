name: Fly read-only runtime code identity audit

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm read-only inspection of the production process and code"
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

jobs:
  runtime-audit:
    if: ${{ inputs.confirm_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect production runtime without changing it
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import glob,os,hashlib; ps=[p for p in glob.glob(\"/proc/[0-9]*\") if open(p+\"/comm\").read().strip()==\"uvicorn\"]; print(\"UVICORN_PIDS=\"+\",\".join(p.rsplit(\"/\",1)[1] for p in ps)); [(lambda f: (print(\"PROCESS_CWD=\"+os.readlink(p+\"/cwd\")), print(\"SOURCE_PATH=\"+f), print(\"SOURCE_SHA256=\"+hashlib.sha256(open(f,\"rb\").read()).hexdigest()), [print(\"SOURCE_MARKER=\"+str(i+1)+\":\"+s.strip()) for i,s in enumerate(open(f).read().splitlines()) if any(m in s for m in (\"class _TelemetrySQLiteConnection\",\"factory=_TelemetrySQLiteConnection\",\"def _save_discovery\"))]))(os.readlink(p+\"/cwd\")+\"/backend/catalog_engine.py\") for p in ps if os.path.isfile(os.readlink(p+\"/cwd\")+\"/backend/catalog_engine.py\")]; print(\"RUNTIME_AUDIT=READ_ONLY\")'"
