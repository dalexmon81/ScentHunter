name: Verify one real Notino CJ offer in isolated catalog

on:
  push:
    branches:
      - refactor/catalog-first-architecture
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ingest-one:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[pilot-notino-ingestion]') }}
    concurrency:
      group: scent-hunter-notino-pilot-ingestion
      cancel-in-progress: true
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter-pilot-20261030
    steps:
      - name: Checkout current pilot code
        uses: actions/checkout@v4

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate isolated pilot access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN" >&2; exit 1; }
          case "$FLY_API_TOKEN" in
            fm2_*) FLY_API_TOKEN="FlyV1 $FLY_API_TOKEN" ;;
          esac
          echo "::add-mask::$FLY_API_TOKEN"
          echo "FLY_API_TOKEN=$FLY_API_TOKEN" >> "$GITHUB_ENV"
          flyctl status --app "$FLY_APP"
          flyctl machine list --app "$FLY_APP"

      - name: Run real authorized CJ feed through canonical persistence
        timeout-minutes: 22
        shell: bash
        run: |
          set -euo pipefail
          machine_id="$(flyctl machine list --app "$FLY_APP" --json | python -c 'import json,sys; rows=json.load(sys.stdin); started=[r for r in rows if r.get("state")=="started"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started pilot machine." >&2; exit 1; }

          script_b64="$(base64 -w0 backend/scripts/smoke_notino_catalog_ingestion.py)"
          remote_script="$(cat <<'REMOTE'
          set -eu
          mkdir -p /data/catalog
          if [ -f /data/catalog/notino_smoke.exit ] && [ "$(cat /data/catalog/notino_smoke.exit)" = "0" ] && grep -q "NOTINO_OFFER_PERSISTENCE=PASS" /data/catalog/notino_smoke.log 2>/dev/null; then
            echo NOTINO_SMOKE_ALREADY_PASSED
            exit 0
          fi
          __SCRIPT_B64__
                    /app/.venv/bin/python - <<'PY'
          import glob, os, signal
          for path in glob.glob("/proc/[0-9]*/cmdline"):
              try:
                  pid = int(path.split("/")[2])
                  cmd = open(path, "rb").read()
                  if cmd.startswith(b"/app/.venv/bin/python\0scripts/smoke_notino_catalog_ingestion.py"):
                      print("STOPPING_PREVIOUS_NOTINO_SMOKE_PID=" + str(pid), flush=True)
                      os.kill(pid, signal.SIGTERM)
              except (OSError, ValueError, IndexError):
                  pass
          PY
          rm -f /data/catalog/notino_smoke.exit /data/catalog/notino_smoke.log /data/catalog/notino_smoke.pid
          nohup /bin/sh -c '
            cd /app/backend
            /app/.venv/bin/python scripts/smoke_notino_catalog_ingestion.py
            result=$?
            echo "$result" > /data/catalog/notino_smoke.exit
          ' </dev/null >/data/catalog/notino_smoke.log 2>&1 &
          echo "$!" > /data/catalog/notino_smoke.pid
          echo NOTINO_SMOKE_STARTED
          REMOTE
          )"
          remote_script="${remote_script/__SCRIPT_B64__/printf '%s' '$script_b64' | base64 -d > /app/backend/scripts/smoke_notino_catalog_ingestion.py}"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl machine exec "$machine_id" "sh -c 'echo $encoded_script | base64 -d | sh'" --app "$FLY_APP" --timeout 30

          for attempt in $(seq 1 240); do
            poll="$(flyctl machine exec "$machine_id" "sh -c 'if [ -f /data/catalog/notino_smoke.exit ]; then echo NOTINO_SMOKE_EXIT=\$(cat /data/catalog/notino_smoke.exit); else echo NOTINO_SMOKE_RUNNING; fi'" --app "$FLY_APP" --timeout 30 2>&1)" || {
              echo "Notino smoke status poll failed ($attempt/240): $poll"
              sleep 5
              continue
            }
            printf '%s\\n' "$poll"
            if printf '%s\\n' "$poll" | grep -q 'NOTINO_SMOKE_EXIT=0'; then
              flyctl machine exec "$machine_id" "tail -n 120 /data/catalog/notino_smoke.log" --app "$FLY_APP" --timeout 30
              echo "NOTINO_CJ_FEED_TO_CANONICAL=PASS"
              break
            fi
            if printf '%s\\n' "$poll" | grep -Eq 'NOTINO_SMOKE_EXIT=[1-9]'; then
              flyctl machine exec "$machine_id" "tail -n 160 /data/catalog/notino_smoke.log" --app "$FLY_APP" --timeout 30 || true
              exit 1
            fi
            if [ "$attempt" -eq 240 ]; then
              flyctl machine exec "$machine_id" "tail -n 160 /data/catalog/notino_smoke.log" --app "$FLY_APP" --timeout 30 || true
              echo "Notino feed ingestion did not finish within 20 minutes." >&2
              exit 1
            fi
            sleep 5
          done

      - name: Verify persisted Notino offer and catalog search
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request
          base = "https://scenthunter-pilot-20261030.fly.dev"
          for path in (
              "/api/catalog/status",
              "/api/catalog/search?" + urllib.parse.urlencode({"q":"Liquid Brun 100 ml"}),
          ):
              request = urllib.request.Request(base + path, headers={"Accept":"application/json"})
              with urllib.request.urlopen(request, timeout=30) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              print(path, json.dumps(payload, ensure_ascii=False))
              if path.startswith("/api/catalog/status") and int(payload.get("published_offers", 0)) < 1:
                  raise SystemExit("NOTINO_PERSISTED_OFFER_NOT_VISIBLE_IN_CATALOG_STATUS")
              if path.startswith("/api/catalog/search") and int(payload.get("offer_count", 0)) < 1:
                  raise SystemExit("NOTINO_PERSISTED_OFFER_NOT_VISIBLE_IN_CATALOG_SEARCH")
          print("NOTINO_REAL_OFFER_VISIBLE=PASS")
          PY
