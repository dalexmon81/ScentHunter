name: Retailer connector contract

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/connectors/**"
      - "backend/app/services/connector_ingestion.py"
      - "backend/scripts/ingest_notino_catalog.py"
      - "backend/scrapers/notino/affiliate_feed.py"
      - "backend/tests/test_*connector*.py"
      - ".github/workflows/retailer-connector-contract.yml"

permissions:
  contents: read

jobs:
  connector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Notino feed parser dependency
        run: python -m pip install requests
      - name: Compile connector package
        run: python -m compileall -q backend/app/connectors
      - name: Run connector contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p "test_*connector*.py" -v
