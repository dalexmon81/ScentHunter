name: Read-only Python stack and legacy SQLite lock diagnosis

on:
  push:
    branches:
      - chore/diagnose-legacy-lock

permissions:
  contents: read

jobs:
  inspect-python-stacks:
    name: Capture dynamic WAL lock owner and Python stacks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Install temporary py-spy and collect two read-only dumps
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -u
          : > pyspy-lock-diagnosis.txt
          remote_script=$(cat <<'REMOTE'
          set -u
          TMP_PYSPY=/tmp/scenthunter-py-spy
          cleanup() {
            rm -f "$TMP_PYSPY"
            echo TEMPORARY_PY_SPY_REMOVED
          }
          trap cleanup EXIT

          echo === ENVIRONMENT ===
          date -u
          uname -a
          id
          command -v python3 || true

          echo === INSTALL_TEMPORARY_PY_SPY ===
          ARCH=$(uname -m)
          case "$ARCH" in
            x86_64|amd64) ASSET=py-spy-linux-x86_64 ;;
            aarch64|arm64) ASSET=py-spy-linux-aarch64 ;;
            *) echo "UNSUPPORTED_ARCH=$ARCH"; exit 2 ;;
          esac
          python3 -c 'import sys,urllib.request; urllib.request.urlretrieve(sys.argv[1],sys.argv[2])' \
            "https://github.com/benfred/py-spy/releases/latest/download/$ASSET" "$TMP_PYSPY"
          chmod 700 "$TMP_PYSPY"
          "$TMP_PYSPY" --version

          find_lock_owner() {
            shm=/data/store_catalog.sqlite3-shm
            [ -e "$shm" ] || return 1
            inode=$(stat -c '%i' "$shm" 2>/dev/null) || return 1
            awk -v inode="$inode" '
              $1=="POSIX" && $3=="WRITE" {
                n=split($5, devino, ":")
                if (n >= 3 && devino[3] == inode) print $4
              }
            ' /proc/locks | sort -u
          }

          sample() {
            label=$1
            echo === "$label" ===
            date -u
            echo LEGACY_FILES
            ls -li --time-style=long-iso /data/store_catalog.sqlite3* 2>&1
            echo LOCK_TABLE
            cat /proc/locks 2>&1
            PIDS=$(find_lock_owner || true)
            if [ -z "$PIDS" ]; then
              echo NO_WRITE_LOCK_OWNER_FOUND_FOR_STORE_CATALOG_SHM
              return
            fi
            for PID in $PIDS; do
              echo === LOCK_OWNER_PID_$PID ===
              echo PROCESS_CMDLINE
              tr '\000' ' ' < "/proc/$PID/cmdline" 2>&1
              echo
              echo PROCESS_STATUS
              grep -E '^(Name|State|Threads):' "/proc/$PID/status" 2>&1
              echo PROCESS_LEGACY_FDS
              for fd in /proc/"$PID"/fd/*; do
                target=$(readlink "$fd" 2>/dev/null) || continue
                case "$target" in
                  /data/store_catalog.sqlite3|/data/store_catalog.sqlite3-*)
                    echo "$fd -> $target"
                    ;;
                esac
              done
              echo PY_SPY_DUMP_BEGIN
              "$TMP_PYSPY" dump --pid "$PID" 2>&1
              echo PY_SPY_DUMP_EXIT=$?
              echo PY_SPY_DUMP_END
            done
          }

          sample SAMPLE_1
          echo WAITING_45_SECONDS_NO_DATABASE_OR_PROCESS_MODIFICATION
          sleep 45
          sample SAMPLE_2
          REMOTE
          )
          encoded_script=$(printf '%s' "$remote_script" | base64 -w0)
          remote_command="/bin/sh -lc 'echo $encoded_script | base64 -d | /bin/sh'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command" 2>&1 | tee pyspy-lock-diagnosis.txt
          ssh_status=${PIPESTATUS[0]}
          echo "FLY_SSH_EXIT_STATUS=$ssh_status" | tee -a pyspy-lock-diagnosis.txt
          exit "$ssh_status"

      - name: Upload Python stack diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pyspy-lock-diagnosis-two-samples
          path: pyspy-lock-diagnosis.txt
          if-no-files-found: warn
          retention-days: 30
