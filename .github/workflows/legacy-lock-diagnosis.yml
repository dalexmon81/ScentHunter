name: Read-only TID 620 legacy SQLite lock diagnosis

on:
  push:
    branches:
      - chore/diagnose-legacy-lock

permissions:
  contents: read

jobs:
  inspect-tid-620:
    name: Compare two read-only TID 620 and legacy lock samples
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Collect two targeted read-only samples
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -u
          : > tid-620-lock-diagnosis.txt
          remote_command="/bin/sh -lc 'sample() {
            label=\$1
            echo === \$label ===
            echo SNAPSHOT_TIME_UTC
            date -u
            echo TID_620_STACK
            cat /proc/614/task/620/stack 2>&1
            echo TID_620_WCHAN
            cat /proc/614/task/620/wchan 2>&1
            echo TID_620_STATUS
            cat /proc/614/task/620/status 2>&1
            echo TID_620_FD_LIST
            ls -l /proc/614/task/620/fd 2>&1
            echo TID_620_SQLITE_FD_TARGETS_AND_FDINFO
            for fd in /proc/614/task/620/fd/*; do
              target=\$(readlink \$fd 2>/dev/null) || continue
              case \$target in
                /data/store_catalog.sqlite3|/data/catalog/catalog.sqlite3|/data/store_catalog.sqlite3-*|/data/catalog/catalog.sqlite3-*)
                  echo --- \$fd -\> \$target ---
                  info_fd=\${fd##*/}
                  cat /proc/614/task/620/fdinfo/\$info_fd 2>&1
                  ;;
              esac
            done
            echo PROCESS_614_CMDLINE
            cat /proc/614/cmdline 2>&1
            echo PROCESS_614_STATUS
            cat /proc/614/status 2>&1
            echo PROCESS_614_LEGACY_FD_TARGETS
            for fd in /proc/614/fd/*; do
              target=\$(readlink \$fd 2>/dev/null) || continue
              case \$target in
                /data/store_catalog.sqlite3|/data/catalog/catalog.sqlite3|/data/store_catalog.sqlite3-*|/data/catalog/catalog.sqlite3-*)
                  echo \$fd -\> \$target
                  ;;
              esac
            done
            echo LEGACY_DB_INODES_AND_TIMESTAMPS
            ls -li --time-style=long-iso /data/store_catalog.sqlite3* /data/catalog/catalog.sqlite3* 2>&1
            echo CURRENT_DISCOVERY_SYNC_STATE_READ_ONLY
            echo  | base64 -d | /app/.venv/bin/python
            echo PROCESS_614_LOCKS
            cat /proc/locks 2>&1
          }
          sample SAMPLE_1
          echo WAITING_45_SECONDS_WITHOUT_TOUCHING_DATABASES
          sleep 45
          sample SAMPLE_2
          '"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command" 2>&1 | tee tid-620-lock-diagnosis.txt
          ssh_status=${PIPESTATUS[0]}
          echo "FLY_SSH_EXIT_STATUS=$ssh_status" | tee -a tid-620-lock-diagnosis.txt
          exit "$ssh_status"

      - name: Upload TID 620 diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tid-620-lock-diagnosis-two-samples
          path: tid-620-lock-diagnosis.txt
          if-no-files-found: warn
          retention-days: 30
