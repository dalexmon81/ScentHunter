name: Read-only legacy SQLite lock diagnosis (two samples)

on:
  push:
    branches:
      - chore/diagnose-legacy-lock

permissions:
  contents: read

jobs:
  inspect-fly-processes:
    name: Compare PID 614 SQLite locks before and after 45 seconds
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Collect two read-only process and lock snapshots
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -u
          : > legacy-lock-diagnosis.txt
          remote_command="/bin/sh -lc 'echo === SAMPLE_1_BEFORE ===; date -u; echo === /proc/locks ===; cat /proc/locks; echo === PID_614_FD ===; ls -l /proc/614/fd; echo === PID_614_CMDLINE ===; cat /proc/614/cmdline; echo; echo === PID_614_STATUS ===; cat /proc/614/status; echo === PID_614_WCHAN ===; cat /proc/614/wchan; echo; echo === DATABASE_INODES_AND_TIMESTAMPS ===; ls -li --time-style=long-iso /data/store_catalog.sqlite3* /data/catalog/catalog.sqlite3* 2>&1; echo === DATABASE_FD_TARGETS ===; for fd in /proc/614/fd/*; do target=\$(readlink \"\$fd\" 2>/dev/null) || continue; case \"\$target\" in /data/store_catalog.sqlite3|/data/catalog/catalog.sqlite3|/data/store_catalog.sqlite3-*|/data/catalog/catalog.sqlite3-*) echo \"\$fd -> \$target\";; esac; done; echo === WAITING_45_SECONDS ===; sleep 45; echo === SAMPLE_2_AFTER ===; date -u; echo === /proc/locks ===; cat /proc/locks; echo === PID_614_FD ===; ls -l /proc/614/fd; echo === PID_614_CMDLINE ===; cat /proc/614/cmdline; echo; echo === PID_614_STATUS ===; cat /proc/614/status; echo === PID_614_WCHAN ===; cat /proc/614/wchan; echo; echo === DATABASE_INODES_AND_TIMESTAMPS ===; ls -li --time-style=long-iso /data/store_catalog.sqlite3* /data/catalog/catalog.sqlite3* 2>&1; echo === DATABASE_FD_TARGETS ===; for fd in /proc/614/fd/*; do target=\$(readlink \"\$fd\" 2>/dev/null) || continue; case \"\$target\" in /data/store_catalog.sqlite3|/data/catalog/catalog.sqlite3|/data/store_catalog.sqlite3-*|/data/catalog/catalog.sqlite3-*) echo \"\$fd -> \$target\";; esac; done'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command" 2>&1 | tee legacy-lock-diagnosis.txt
          ssh_status=${PIPESTATUS[0]}
          echo "FLY_SSH_EXIT_STATUS=$ssh_status" | tee -a legacy-lock-diagnosis.txt
          exit "$ssh_status"

      - name: Upload diagnosis evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: legacy-lock-diagnosis-two-samples
          path: legacy-lock-diagnosis.txt
          if-no-files-found: warn
          retention-days: 30
