name: Pilot refresh and Bplatz connector regressions

on:
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - "backend/app/connectors/legacy_scrapers.py"
      - "backend/app/workers/sqlite_worker.py"
      - "backend/app/workers/notino_runtime.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/tests/test_legacy_scraper_connectors.py"
      - "backend/tests/test_pilot_refresh_scheduling.py"
      - ".github/workflows/pilot-refresh-regression.yml"

permissions:
  contents: read

jobs:
  regressions:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install pytest
        run: python -m pip install pytest
      - name: Compile changed worker and connector modules
        run: python -m compileall -q backend/app/connectors/legacy_scrapers.py backend/app/workers/sqlite_worker.py
      - name: Test Bplatz connector factory and refresh scheduling
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          backend/tests/test_legacy_scraper_connectors.py
          backend/tests/test_notino_worker_runtime.py
          backend/tests/test_pilot_refresh_scheduling.py
