name: Catalog-first normalization tests

on:
  pull_request:
    paths:
      - "backend/app/models/normalization.py"
      - "backend/app/models/test_normalization.py"
      - ".github/workflows/catalog-first-normalization.yml"
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - "backend/app/models/normalization.py"
      - "backend/app/models/test_normalization.py"
      - ".github/workflows/catalog-first-normalization.yml"

permissions:
  contents: read

jobs:
  normalization:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Run pure normalization regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest app.models.test_normalization -v
