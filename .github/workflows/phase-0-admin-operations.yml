name: Phase 0 - admin operations (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        shell: bash
        run: |
          echo "::error::This legacy admin workflow targets endpoints that are not exposed by the active PostgreSQL runtime."
          echo "No production request was sent. Use the read-only PostgreSQL Phase 0 status probe instead."
          exit 1
