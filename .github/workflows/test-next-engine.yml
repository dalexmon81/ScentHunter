name: ScentHunter Next Engine Tests

on:
  push:
    branches:
      - scenthunter-next-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-engine-tests:
    name: Isolated next-engine unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
