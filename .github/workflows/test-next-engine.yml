name: ScentHunter Next Engine Tests

on:
  push:
    branches:
      - scenthunter-next-engine
  workflow_dispatch:

permissions:
  contents: read

jobs:
  next-engine-tests:
    name: Isolated next-engine tests and read-only catalog reports
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install test runner
        run: python -m pip install pytest

      - name: Run isolated next-engine tests
        run: >-
          python -m pytest -q
          tests/test_scenthunter_next_engine.py
          tests/test_canonical_matcher.py
          tests/test_offer_aggregator.py
          tests/test_next_engine_service.py
          tests/test_real_catalog_end_to_end.py
          tests/test_catalog_preflight.py
          tests/test_migration_plan_validator.py
          tests/test_audit_migration.py

      - name: Audit real catalog without modifying it
        run: python -m backend.scenthunter_next_engine.catalog_preflight_cli

      - name: Detailed catalog classification (read-only)
        run: python -m backend.scenthunter_next_engine.catalog_preflight_detail

      - name: Build migration review plan (read-only)
        run: python -m backend.scenthunter_next_engine.catalog_migration_plan

      - name: Validate generated migration review plan (read-only)
        run: python -m backend.scenthunter_next_engine.validate_generated_migration_plan

      - name: Audit consistency between generated reports (read-only)
        run: >-
          python -m backend.scenthunter_next_engine.audit_migration_reports
          --detail catalog-preflight-detail.json
          --plan catalog-migration-plan.json
          --output migration-report-audit.json

      - name: Upload read-only catalog reports
        uses: actions/upload-artifact@v4
        with:
          name: catalog-migration-review
          path: |
            catalog-preflight-detail.json
            catalog-migration-plan.json
            migration-report-audit.json
          if-no-files-found: error
          retention-days: 7
