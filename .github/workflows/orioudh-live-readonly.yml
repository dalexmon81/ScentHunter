name: Orioudh live read-only smoke test

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scrapers/orioudh/**"
      - "backend/scripts/check_orioudh_live_readonly.py"
      - ".github/workflows/orioudh-live-readonly.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orioudh-live-readonly:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install scraper dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Run read-only Orioudh smoke test
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python scripts/check_orioudh_live_readonly.py
