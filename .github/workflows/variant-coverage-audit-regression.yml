name: Variant coverage audit regression

on:
  push:
    branches:
      - fix/catalog-variant-coverage-audit-2026-11-08
    paths:
      - "backend/scripts/audit_variant_coverage.py"
      - "backend/tests/test_audit_variant_coverage.py"
      - ".github/workflows/variant-coverage-audit-regression.yml"

permissions:
  contents: read

jobs:
  audit-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install "SQLAlchemy==2.0.44" pytest
      - name: Run variant coverage audit regression tests
        env:
          PYTHONPATH: backend
        run: pytest -q backend/tests/test_audit_variant_coverage.py
      - name: Compile audit script
        run: python -m py_compile backend/scripts/audit_variant_coverage.py
