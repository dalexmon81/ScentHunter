name: Catalog worker queue foundation

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/app/workers/**"
      - "backend/app/discovery/**"
      - "backend/app/extraction/**"
      - "backend/tests/test_extraction_product.py"
      - "backend/app/repositories/**"
      - "backend/scripts/audit_python_import_graph.py"
      - "backend/tests/test_import_graph_audit.py"
      - "backend/app/offers/**"
      - "backend/app/matching/**"
      - "backend/app/pricing/**"
      - "backend/app/monitoring/**"
      - "backend/app/connectors/base.py"
      - "backend/app/connectors/notino_feed.py"
      - "backend/app/connectors/legacy_scrapers.py"
      - "backend/tests/test_seed_catalog_store_safety.py"
      - "backend/scripts/seed_catalog.py"
      - "backend/app/connectors/__init__.py"
      - "backend/app/models/catalog.py"
      - "backend/alembic/versions/**"
      - "backend/app/services/canonical_matching.py"
      - "backend/app/services/connector_ingestion.py"
      - "backend/app/services/offer_refresh.py"
      - "backend/app/services/connector_health.py"
      - "backend/app/services/ingestion_persistence.py"
      - "backend/tests/test_discovery_dispatch.py"
      - "backend/tests/test_catalog_normalization.py"
      - "backend/scripts/enqueue_notino_discovery.py"
      - "backend/scripts/reinstate_store_connector.py"
      - "backend/scripts/seed_notino_store.py"
      - "backend/tests/test_notino_store_provisioning.py"
      - "backend/tests/test_catalog_worker_queue.py"
      - "backend/tests/test_sqlite_ingestion_queue.py"
      - "backend/tests/test_offer_refresh_persistence.py"
      - "backend/tests/test_connector_health.py"
      - "backend/tests/test_notino_feed_connector.py"
      - "backend/tests/test_legacy_scraper_connectors.py"
      - "backend/tests/test_legacy_worker_runtime.py"
      - "backend/scrapers/easycosmetic/scraper.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/requirements.txt"
      - "backend/app/workers/README.md"
      - "Dockerfile.pilot"
      - "fly.staging.toml"
      - ".github/workflows/catalog-worker-queue.yml"

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Build static backend Python import graph
        working-directory: backend
        run: python scripts/audit_python_import_graph.py > /tmp/scenthunter-python-import-graph.json
      - name: Test static import graph auditor
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_import_graph_audit.py' -v
      - name: Publish static import graph artifact
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-backend-import-graph
          path: /tmp/scenthunter-python-import-graph.json
          if-no-files-found: error
      - name: Run Celery and SQLite queue contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_catalog_worker_queue.py' -v
      - name: Run ingestion run lifecycle tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_catalog_ingestion_run.py' -v
      - name: Run shared discovery dispatch tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_discovery_dispatch.py' -v
      - name: Run known-product extraction tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_extraction_product.py' -v
      - name: Run Notino worker runtime tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_worker_runtime.py' -v
      - name: Run canonical database matching tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_canonical_matching.py' -v
      - name: Run offer refresh persistence regression tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_offer_refresh_persistence.py' -v

      - name: Run connector quarantine health tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python -m unittest discover -s tests -p 'test_connector_health.py' -v
          python -m unittest discover -s tests -p 'test_notino_feed_connector.py' -v

      - name: Run explicit Notino store provisioning tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_store_provisioning.py' -v

      - name: Run explicit retailer store seeding tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_seed_catalog_store_safety.py' -v

      - name: Run legacy retailer worker runtime tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_legacy_worker_runtime.py' -v

      - name: Run legacy retailer connector adapter tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_legacy_scraper_connectors.py' -v

      - name: Verify explicit Notino discovery kickoff CLI
        working-directory: backend
        env:
          PYTHONPATH: .
        run: |
          python scripts/enqueue_notino_discovery.py --help
          python scripts/reinstate_store_connector.py --help
