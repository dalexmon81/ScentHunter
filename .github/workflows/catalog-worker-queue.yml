name: Catalog worker queue foundation

on:
  pull_request:
    branches: [refactor/catalog-first-architecture]
    paths:
      - "backend/app/workers/**"
      - "backend/tests/test_catalog_worker_queue.py"
      - "backend/requirements.txt"
      - ".github/workflows/catalog-worker-queue.yml"

permissions:
  contents: read

jobs:
  queue-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Run Celery queue contract tests
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_catalog_worker_queue.py' -v
