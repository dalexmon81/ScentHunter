name: Notino feed publication regression

on:
  pull_request:
    branches: [main]
    paths:
      - "backend/scrapers/notino/affiliate_feed.py"
      - "backend/tests/test_notino_feed_staging_indexes.py"
      - ".github/workflows/notino-feed-publication-regression.yml"
  push:
    branches:
      - work/notino-feed-publication-optimization-20261120
    paths:
      - "backend/scrapers/notino/affiliate_feed.py"
      - "backend/tests/test_notino_feed_staging_indexes.py"
      - ".github/workflows/notino-feed-publication-regression.yml"

permissions:
  contents: read

jobs:
  staging-index-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Verify Notino staging indexes are created before publication
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_feed_staging_indexes.py' -v
      - name: Run existing Notino feed parser and publication regressions
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_affiliate_feed.py' -v
