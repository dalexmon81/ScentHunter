name: ScentHunter PostgreSQL pre-cutover backup (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        shell: bash
        run: |
          echo "::error::This backup procedure targets the retired SQLite catalog and historical schema/count assumptions."
          echo "It must not create a production volume snapshot or attempt a stale SQLite backup."
          echo "Use the approved PostgreSQL read-only restore drill after Neon quota reset."
          exit 1
