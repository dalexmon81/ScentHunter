name: Phase 4 Universal Connector Contract

on:
  push:
    branches:
      - phase4/universal-store-connectors
    paths:
      - "backend/app/connectors/**"
      - "backend/app/workers/connector_ingestion.py"
      - "backend/app/workers/matching_worker.py"
      - "backend/app/workers/offer_promotion.py"
      - "backend/app/services/canonical_identity_review_queue.py"
      - "backend/app/matching/**"
      - "backend/tests/test_offer_matching_worker.py"
      - "backend/tests/test_offer_promotion_worker.py"
      - "backend/tests/test_connector_ingestion_worker.py"
      - "backend/tests/test_connector_ingestion_session_defaults.py"
      - "backend/tests/test_store_connector_contract.py"
      - "backend/tests/test_notino_connector_fixture.py"
      - "backend/tests/test_notino_universal_connector.py"
      - "backend/tests/test_deloox_universal_connector.py"
      - "backend/tests/test_easycosmetic_universal_connector.py"
      - "backend/tests/test_sabina_universal_connector.py"
      - "backend/tests/test_parfumzentrum_universal_connector.py"
      - "backend/tests/test_remaining_universal_connectors.py"
      - "backend/tests/test_bplatz_stock_signal_precedence.py"
      - "backend/tests/test_bplatz_universal_connector_fixture.py"
      - "backend/tests/test_bplatz_parser_quality.py"
      - "backend/tests/fixtures/connectors/**"
      - "backend/scrapers/bplatz/**"
      - "backend/scrapers/notino/affiliate_feed.py"
      - "backend/scrapers/deloox/scraper.py"
      - "backend/scrapers/easycosmetic/scraper.py"
      - "backend/scrapers/sabina/scraper.py"
      - "backend/scrapers/parfumzentrum/scraper.py"
      - "tests/fixtures/connectors/**"
      - ".github/workflows/phase4-universal-connectors.yml"
      - ".github/workflows/fly-pilot.yml"
  pull_request:
    branches:
      - phase3/product-normalization
    paths:
      - "backend/app/connectors/**"
      - "backend/app/workers/connector_ingestion.py"
      - "backend/app/workers/matching_worker.py"
      - "backend/app/workers/offer_promotion.py"
      - "backend/app/services/canonical_identity_review_queue.py"
      - "backend/app/matching/**"
      - "backend/tests/test_offer_matching_worker.py"
      - "backend/tests/test_offer_promotion_worker.py"
      - "backend/tests/test_connector_ingestion_worker.py"
      - "backend/tests/test_connector_ingestion_session_defaults.py"
      - "backend/tests/test_store_connector_contract.py"
      - "backend/tests/test_notino_connector_fixture.py"
      - "backend/tests/test_notino_universal_connector.py"
      - "backend/tests/test_deloox_universal_connector.py"
      - "backend/tests/test_easycosmetic_universal_connector.py"
      - "backend/tests/test_sabina_universal_connector.py"
      - "backend/tests/test_parfumzentrum_universal_connector.py"
      - "backend/tests/test_remaining_universal_connectors.py"
      - "backend/tests/test_bplatz_stock_signal_precedence.py"
      - "backend/tests/test_bplatz_universal_connector_fixture.py"
      - "backend/tests/test_bplatz_parser_quality.py"
      - "backend/tests/fixtures/connectors/**"
      - "backend/scrapers/bplatz/**"
      - "backend/scrapers/notino/affiliate_feed.py"
      - "backend/scrapers/deloox/scraper.py"
      - "backend/scrapers/easycosmetic/scraper.py"
      - "backend/scrapers/sabina/scraper.py"
      - "backend/scrapers/parfumzentrum/scraper.py"
      - "tests/fixtures/connectors/**"
      - ".github/workflows/phase4-universal-connectors.yml"
      - ".github/workflows/fly-pilot.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connector-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      PYTHONPATH: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install focused test dependencies
        run: python -m pip install pytest requests beautifulsoup4 lxml sqlalchemy pyyaml
      - name: Validate isolated Fly workflow syntax and manual-only safety gate
        run: |
          python - <<'PY'
          import yaml

          with open(".github/workflows/fly-pilot.yml", encoding="utf-8") as stream:
              raw_workflow = stream.read()
          workflow = yaml.load(raw_workflow, Loader=yaml.BaseLoader)

          assert set(workflow["on"]) == {"workflow_dispatch"}
          assert workflow["jobs"]["deploy-pilot"]["if"] != ""
          assert workflow["jobs"]["deploy-pilot"]["steps"][0]["with"]["ref"] == "architecture/offer-engine-v1"
          print("FLY_WORKFLOW_YAML=PASS")
          print("FLY_WORKFLOW_MANUAL_ONLY=PASS")
          print("FLY_WORKFLOW_ISOLATED_BRANCH=PASS")
          PY
      - name: Compile connector contract
        run: python -m compileall -q backend/app/connectors backend/tests/test_store_connector_contract.py backend/tests/test_notino_connector_fixture.py backend/tests/test_notino_universal_connector.py backend/tests/test_deloox_universal_connector.py backend/tests/test_easycosmetic_universal_connector.py backend/tests/test_sabina_universal_connector.py backend/tests/test_parfumzentrum_universal_connector.py backend/tests/test_remaining_universal_connectors.py backend/tests/test_bplatz_stock_signal_precedence.py backend/tests/test_bplatz_universal_connector_fixture.py backend/tests/test_bplatz_parser_quality.py backend/app/workers/connector_ingestion.py backend/scrapers/bplatz backend/app/workers/matching_worker.py backend/app/workers/offer_promotion.py backend/app/matching/offer_matcher.py backend/tests/test_connector_ingestion_worker.py backend/tests/test_connector_ingestion_session_defaults.py backend/tests/test_offer_matching_worker.py backend/tests/test_offer_promotion_worker.py
      - name: Run connector contract and retailer fixture tests
        run: python -m pytest -q backend/tests/test_store_connector_contract.py backend/tests/test_notino_connector_fixture.py backend/tests/test_notino_universal_connector.py backend/tests/test_deloox_universal_connector.py backend/tests/test_easycosmetic_universal_connector.py backend/tests/test_sabina_universal_connector.py backend/tests/test_parfumzentrum_universal_connector.py backend/tests/test_remaining_universal_connectors.py backend/tests/test_bplatz_stock_signal_precedence.py backend/tests/test_bplatz_universal_connector_fixture.py backend/tests/test_bplatz_parser_quality.py backend/tests/test_connector_ingestion_worker.py backend/tests/test_connector_ingestion_session_defaults.py backend/tests/test_offer_matching_worker.py backend/tests/test_offer_promotion_worker.py
