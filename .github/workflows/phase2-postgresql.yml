name: Phase 2 PostgreSQL compatibility

on:
  pull_request:
    branches: [main, refactor/catalog-first-architecture]
    paths:
      - "backend/app/db.py"
      - "backend/app/db_runtime_identity.py"
      - "backend/app/api/catalog_search.py"
      - "backend/app/search/catalog.py"
      - "backend/catalog_engine.py"
      - "backend/app/models/**"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/tests/test_phase2_database_backends.py"
      - "backend/tests/test_catalog_search_token_tolerance.py"
      - "backend/tests/test_notino_sauvage_catalog_additions.py"
      - "backend/scripts/bootstrap_notino_postgres.py"
      - "backend/tests/test_notino_bootstrap_batch.py"
      - "backend/scripts/backfill_notino_verified_gtin.py"
      - "backend/tests/test_notino_verified_gtin_backfill.py"
      - "backend/scenthunter_next_engine/notino_verified_catalog_additions.json"
      - "backend/tests/test_phase2_postgres_schema.py"
      - "backend/tests/test_postgres_queue_cutover.py"
      - "backend/tests/test_phase2_runtime_db_identity.py"
      - "backend/app/services/canonical_matching.py"
      - "backend/app/services/connector_ingestion.py"
      - "backend/app/services/ingestion_persistence.py"
      - "backend/app/workers/**"
      - "backend/tests/test_canonical_matching.py"
      - "backend/tests/test_catalog_worker_queue.py"
      - "backend/tests/test_catalog_ingestion_run.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/scripts/migrate_canonical_sqlite_to_postgres.py"
      - "backend/tests/test_phase2_sqlite_postgres_import.py"
      - "backend/tests/test_phase2_bplatz_postgres.py"
      - "tests/test_catalog_offer_price_selection.py"
      - "tests/test_catalog_first_search.py"
      - "tests/test_bplatz_persistence_service.py"
      - "frontend/index.html"
      - ".github/workflows/phase2-postgresql.yml"
      - ".github/workflows/notino-cj-feed-import.yml"

permissions:
  contents: read

jobs:
  postgres-schema-and-engine:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: phase2
          POSTGRES_PASSWORD: phase2_ci_only
          POSTGRES_DB: phase2_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U phase2 -d phase2_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
      SCENTHUNTER_CATALOG_DATABASE_URL: postgresql+psycopg://phase2:phase2_ci_only@127.0.0.1:5432/phase2_test
      SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL: postgresql+psycopg://phase2:phase2_ci_only@127.0.0.1:5432/phase2_test
      SCENTHUNTER_TEST_POSTGRES_URL: postgresql+psycopg://phase2:phase2_ci_only@127.0.0.1:5432/phase2_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend database dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Upgrade disposable PostgreSQL schema to Alembic head
        working-directory: backend
        run: alembic upgrade head
      - name: Confirm a second upgrade is a no-op
        working-directory: backend
        run: alembic upgrade head
      - name: Import the complete checked-in canonical catalog into disposable PostgreSQL
        shell: bash
        run: |
          set -euo pipefail
          temp_dir="$(mktemp -d)"
          trap 'rm -rf "$temp_dir"' EXIT
          export SCENTHUNTER_CATALOG_DATABASE_URL="sqlite:///$temp_dir/canonical-source.sqlite3"
          (cd backend && alembic upgrade head)
          python backend/scripts/seed_catalog.py --apply > "$temp_dir/seed-report.json"
          python backend/scripts/migrate_canonical_sqlite_to_postgres.py \
            --source "$temp_dir/canonical-source.sqlite3" > "$temp_dir/dry-run.json"
          python backend/scripts/migrate_canonical_sqlite_to_postgres.py \
            --source "$temp_dir/canonical-source.sqlite3" --apply \
            --confirm-target phase2_test > "$temp_dir/applied.json"
          python backend/scripts/migrate_canonical_sqlite_to_postgres.py \
            --source "$temp_dir/canonical-source.sqlite3" --apply \
            --confirm-target phase2_test > "$temp_dir/repeated.json"
          python - "$temp_dir" <<'PY'
          import json
          import pathlib
          import sys
          root = pathlib.Path(sys.argv[1])
          seed = json.loads((root / "seed-report.json").read_text())
          dry = json.loads((root / "dry-run.json").read_text())
          applied = json.loads((root / "applied.json").read_text())
          repeated = json.loads((root / "repeated.json").read_text())
          assert seed["status"] == "seeded" and seed["database_written"] is True
          assert dry["status"] == "dry_run" and dry["destination_written"] is False
          assert applied["status"] == "applied" and applied["destination_written"] is True
          assert applied["source_alembic_revision"] == "0007_catalog_identity"
          assert all(row["checksums_match_after_import"] for row in applied["tables"].values())
          assert all(row["would_insert"] == 0 for row in repeated["tables"].values())
          print("Full checked-in catalog import, checksums and idempotent repeat: PASS")
          print("Source counts:", {name: row["source_rows"] for name, row in applied["tables"].items()})
          PY
      - name: Verify PostgreSQL schema, constraints and rollback behavior
        working-directory: backend
        run: pytest -q tests/test_phase2_database_backends.py tests/test_phase2_postgres_schema.py tests/test_phase2_runtime_db_identity.py tests/test_phase2_sqlite_postgres_import.py tests/test_phase2_bplatz_postgres.py
      - name: Verify production queue cutover boundary parsing
        run: pytest -q backend/tests/test_postgres_queue_cutover.py
      - name: Verify catalog-first API with the historical Bplatz fixture
        run: pytest -q tests/test_catalog_first_search.py
      - name: Verify four reviewed Notino Dior Sauvage GTINs
        # Exact GTIN checksum, expected canonical variant ID and size must agree.
        working-directory: backend
        run: pytest -q tests/test_notino_verified_gtin_backfill.py
      - name: Verify resumed Notino discovery batch
        # Reuse discovery pages from the last two hours and never restart the full first page on deploy.
        working-directory: backend
        run: pytest -q tests/test_notino_bootstrap_batch.py
      - name: Verify Dior Sauvage Notino formats and concentration titles
        working-directory: backend
        run: pytest -q tests/test_notino_sauvage_catalog_additions.py
      - name: Verify concentration and format grouping in catalog search
        run: pytest -q backend/tests/test_catalog_search_token_tolerance.py
      - name: Verify retailer offer price selection regression
        run: pytest -q tests/test_catalog_offer_price_selection.py
