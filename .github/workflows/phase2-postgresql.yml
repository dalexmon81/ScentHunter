name: Phase 2 SQLite schema checks

on:
  pull_request:
    paths:
      - "backend/app/models/**"
      - "backend/app/db.py"
      - "backend/alembic/**"
      - "backend/alembic.ini"
      - "backend/scripts/seed_catalog.py"
      - "requirements.txt"
      - "tests/test_phase2_schema_contract.py"
      - ".github/workflows/phase2-postgresql.yml"
  push:
    branches:
      - "feature/phase-2-postgresql-data-model"

permissions:
  contents: read

jobs:
  schema-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SQLite migration tooling
        run: python -m pip install "SQLAlchemy==2.0.44" "alembic==1.17.1" pytest
      - name: Run schema and SQLite integration tests
        run: pytest -q tests/test_phase2_schema_contract.py
