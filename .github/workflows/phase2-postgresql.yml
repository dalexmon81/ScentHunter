name: Phase 2 PostgreSQL integration

on:
  push:
    branches:
      - phase11/gradual-migration
    paths:
      - "backend/**"
      - "tests/test_phase2_*.py"
      - "tests/test_phase3_*.py"
      - ".github/workflows/phase2-postgresql.yml"
  pull_request:
    paths:
      - "backend/**"
      - "tests/test_phase2_*.py"
      - ".github/workflows/phase2-postgresql.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgresql-integration:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: scenthunter_test
          POSTGRES_USER: scenthunter
          POSTGRES_PASSWORD: scenthunter_ci_only
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenthunter -d scenthunter_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      SCENTHUNTER_CATALOG_DATABASE_URL: postgresql+psycopg://scenthunter:scenthunter_ci_only@localhost:5432/scenthunter_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest
      - name: Run SQLite contract, seed, and normalization regression tests
        env:
          PYTHONPATH: backend
        run: pytest -q tests/test_phase2_schema_contract.py tests/test_phase2_seed_catalog.py tests/test_phase3_normalization.py
      - name: Run PostgreSQL migration and persistence integration
        working-directory: backend
        run: |
          python -m alembic -c alembic.ini upgrade head
          cd ..
          pytest -q tests/test_phase2_postgresql_integration.py
