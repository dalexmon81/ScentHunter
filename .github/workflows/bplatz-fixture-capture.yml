name: Bplatz raw fixture capture

on:
  push:
    branches:
      - feat/phase2-bplatz-staging-pipeline
    paths:
      - .github/workflows/bplatz-fixture-capture.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  capture:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/phase2-bplatz-staging-pipeline
      - name: Capture original Bplatz response
        env:
          PRODUCT_URL: https://bplatz.de/products/fragrance-world-liquid-brun-eau-de-parfum-100ml?variant=54015243419916
        run: |
          python - <<'PY'
          import datetime, hashlib, json, os, pathlib, urllib.request
          from urllib.error import HTTPError

          out = pathlib.Path("capture")
          out.mkdir()
          url = os.environ["PRODUCT_URL"]
          request = urllib.request.Request(url, headers={
              "User-Agent": "Mozilla/5.0 (compatible; ScentHunterFixtureCapture/1.0)",
              "Accept": "text/html,application/xhtml+xml"
          })
          try:
              with urllib.request.urlopen(request, timeout=25) as response:
                  payload = response.read()
                  status = response.status
                  final_url = response.geturl()
                  content_type = response.headers.get("Content-Type", "")
          except HTTPError as exc:
              payload = exc.read()
              status = exc.code
              final_url = exc.geturl()
              content_type = exc.headers.get("Content-Type", "")
          (out / "liquid-brun-54015243419916.raw.html").write_bytes(payload)
          meta = {
              "url_requested": url,
              "url_final": final_url,
              "shopify_variant_id": "54015243419916",
              "acquired_at_utc": datetime.datetime.now(datetime.timezone.utc).isoformat(),
              "http_status": status,
              "content_type": content_type,
              "sha256": hashlib.sha256(payload).hexdigest(),
              "note": "Authentic response bytes; price, availability and identifiers must be parsed from this payload, never hardcoded."
          }
          (out / "liquid-brun-54015243419916.meta.json").write_text(
              json.dumps(meta, ensure_ascii=False, indent=2) + chr(10), encoding="utf-8"
          )
          print(json.dumps(meta, ensure_ascii=False, indent=2))
          if not payload:
              raise SystemExit("Bplatz returned an empty response body")
          if not 200 <= status < 300:
              raise SystemExit(f"Bplatz HTTP status not successful: {status}")
          PY
      - name: Commit exact captured bytes to dedicated branch
        run: |
          mkdir -p tests/fixtures/bplatz
          cp capture/liquid-brun-54015243419916.raw.html tests/fixtures/bplatz/liquid-brun-54015243419916.raw.html
          cp capture/liquid-brun-54015243419916.meta.json tests/fixtures/bplatz/liquid-brun-54015243419916.meta.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/fixtures/bplatz/liquid-brun-54015243419916.raw.html tests/fixtures/bplatz/liquid-brun-54015243419916.meta.json
          git commit -m "Add authentic Bplatz Liquid Brun response fixture"
          git pull --rebase origin feat/phase2-bplatz-staging-pipeline
          git push origin HEAD:feat/phase2-bplatz-staging-pipeline
      - name: Upload captured response
        uses: actions/upload-artifact@v4
        with:
          name: bplatz-liquid-brun-raw-fixture
          path: capture/
          if-no-files-found: error
          retention-days: 7
