name: ScentHunter - Read-only recovery volume verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenthunter-recovery-volume-verification
  cancel-in-progress: false

jobs:
  verify-recovery-volume:
    name: Inspect recovery SQLite database without deploying
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect the recovery volume using a temporary machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          RECOVERY_VOLUME_ID="vol_vgnqnnwxex3d5xz4"

          echo "Confirming that the recovery volume exists and is unattached..."
          flyctl volumes list --app scenthunter | tee /tmp/volumes-before.txt
          grep -q "$RECOVERY_VOLUME_ID" /tmp/volumes-before.txt

          echo "Starting a one-off Python machine attached ONLY to the recovery volume."
          cat > /tmp/verify.py <<'PY'
          import pathlib, sqlite3, json
          root = pathlib.Path("/data")
          print("FILES", json.dumps([{"name": p.name, "bytes": p.stat().st_size} for p in root.iterdir()]))
          db = root / "store_catalog.sqlite3"
          print("DB_EXISTS", db.exists())
          print("DB_BYTES", db.stat().st_size if db.exists() else 0)
          assert db.exists() and db.stat().st_size > 0, "Catalog database missing or empty"
          con = sqlite3.connect("file:" + str(db) + "?mode=ro", uri=True, timeout=30)
          print("INTEGRITY", con.execute("PRAGMA quick_check").fetchone()[0])
          tables = [r[0] for r in con.execute("SELECT name FROM sqlite_master WHERE type='table' ORDER BY name")]
          print("TABLES", json.dumps(tables))
          assert tables, "No SQLite tables found"
          con.close()
          PY
          VERIFY_B64="$(base64 -w0 /tmp/verify.py)"

          flyctl machine run \
            --app scenthunter \
            --region ams \
            --volume "$RECOVERY_VOLUME_ID:/data" \
            --vm-cpu-kind shared \
            --vm-cpus 1 \
            --vm-memory 256 \
            --restart no \
            --rm \
            --file-literal "/verify.py=$VERIFY_B64" \
            python:3.12-alpine \
            python /verify.py

          echo "Collecting the one-off machine output before cleanup."
          flyctl logs --app scenthunter --machine d891e960a17448 --no-tail || true
          echo "Removing only the temporary verification machine; the recovery volume itself is retained."
          flyctl machine destroy d891e960a17448 --app scenthunter --force --yes
          echo "Checking that the recovery volume has been released after the temporary machine was destroyed."
          flyctl volumes list --app scenthunter | tee /tmp/volumes-after.txt
          grep -q "$RECOVERY_VOLUME_ID" /tmp/volumes-after.txt
          grep -q "scenthunter_data" /tmp/volumes-after.txt
          echo "Verification machine completed. No production deploy was requested."
