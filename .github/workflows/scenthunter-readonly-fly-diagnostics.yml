name: ScentHunter 2.0 read-only Fly diagnostics

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenthunter-readonly-fly-diagnostics
  cancel-in-progress: false

jobs:
  inspect:
    name: Inspect production without changing it
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || {
            echo "::error::FLY_API_TOKEN repository secret is missing."
            exit 1
          }
          echo "Fly authentication is configured."

      - name: Read app, machine, volume and secret-name inventory
        shell: bash
        run: |
          set -euo pipefail
          echo "=== APP STATUS ==="
          flyctl status --app scenthunter
          echo "=== MACHINES ==="
          flyctl machines list --app scenthunter
          echo "=== VOLUMES ==="
          flyctl volumes list --app scenthunter
          echo "=== SECRET NAMES ONLY ==="
          flyctl secrets list --app scenthunter

      - name: Read runtime database backend and file presence
        shell: bash
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/scenthunter-db-probe.py" <<'PY'
          import os
          from pathlib import Path
          from sqlalchemy.engine import make_url
          from app.db import database_url

          url = make_url(database_url())
          print("CANONICAL_BACKEND:", url.get_backend_name())
          print("CANONICAL_DRIVER:", url.drivername)
          print("CATALOG_URL_CONFIGURED:", bool(os.getenv("SCENTHUNTER_CATALOG_DATABASE_URL")))
          print("GENERAL_URL_CONFIGURED:", bool(os.getenv("SCENTHUNTER_DATABASE_URL")))
          print("POSTGRES_REQUIRED:", os.getenv("SCENTHUNTER_CATALOG_REQUIRE_POSTGRESQL", "unset"))
          print("STORE_DB_PATH:", os.getenv("SCENTHUNTER_CATALOG_DB", "unset"))
          for label, path in (
              ("CANONICAL_SQLITE", "/data/catalog/catalog.sqlite3"),
              ("STORE_SQLITE", "/data/store_catalog.sqlite3"),
          ):
              print(f"{label}_EXISTS:", Path(path).exists())
          PY
          base64 -w0 "$RUNNER_TEMP/scenthunter-db-probe.py" > "$RUNNER_TEMP/scenthunter-db-probe.b64"
          probe_b64="$(cat "$RUNNER_TEMP/scenthunter-db-probe.b64")"
          remote_command="/bin/sh -lc 'echo $probe_b64 | base64 -d > /tmp/scenthunter-db-probe.py && cd /app/backend && /app/.venv/bin/python /tmp/scenthunter-db-probe.py'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command"

      - name: Record diagnostic boundary
        if: success()
        run: |
          echo "READ_ONLY_DIAGNOSTICS=COMPLETE"
          echo "No deploy, restart, migration, import, secret update, or database write was requested."
