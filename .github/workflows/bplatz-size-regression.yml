name: Bplatz generic hydration size regression

on:
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - backend/catalog_engine.py
      - tests/test_catalog_first_search.py
      - .github/workflows/bplatz-size-regression.yml

permissions:
  contents: read

jobs:
  bplatz-size:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/catalog-first-architecture
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt pytest
      - name: Verify Bplatz title size and concentration extraction
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          tests/test_catalog_first_search.py::test_bplatz_catalog_parser_preserves_explicit_title_size_and_concentration
          tests/test_catalog_first_search.py::test_bplatz_hydration_uses_authoritative_parser_for_size_and_currency
