name: PostgreSQL ingestion runtime audit

on:
  push:
    branches: [main]
    # Fly Deploy intentionally ignores workflow-only changes. Do not start a
    # PostgreSQL runtime audit that waits for a deploy which cannot run.
    paths-ignore:
      - .github/workflows/**
      - backend/scenthunter_next_engine/baseline_report.py

permissions:
  contents: read
  actions: read

jobs:
  audit_state:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Wait for this revision's successful PostgreSQL deploy
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          READY=0
          for attempt in $(seq 1 90); do
            DEPLOYS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            STATUS="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .status // "missing"')"
            CONCLUSION="$(printf '%s' "$DEPLOYS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .conclusion // ""')"
            echo "Waiting for Fly Deploy for $GITHUB_SHA: $STATUS / $CONCLUSION (attempt $attempt/90)"
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" = "success" ]; then READY=1; break; fi
            if [ "$STATUS" = "completed" ] && [ "$CONCLUSION" != "success" ]; then
              echo 'Deploy failed; PostgreSQL audit blocked.' >&2
              exit 1
            fi
            sleep 10
          done
          if [ "$READY" -ne 1 ]; then echo 'Deploy did not complete in time.' >&2; exit 1; fi

      - name: Verify PostgreSQL catalog health and public search (read-only)
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          def get(path):
              request = urllib.request.Request(base + path, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=25) as response:
                  return json.loads(response.read().decode("utf-8"))

          status = get("/api/catalog/status")
          if status.get("status") != "ready":
              raise SystemExit("PostgreSQL catalog is not ready: " + json.dumps(status))
          result = get("/api/catalog/search?" + urllib.parse.urlencode({"q": "Dior Sauvage"}))
          if not isinstance(result.get("results"), list):
              raise SystemExit("Canonical PostgreSQL search returned an invalid response")
          print("POSTGRES_CATALOG_AUDIT=PASS")
          print("PUBLIC_SEARCH_PRODUCTS=" + str(len(result["results"])))
          print("PUBLIC_SEARCH_OFFERS=" + str(int(result.get("offer_count", 0) or 0)))
          PY
