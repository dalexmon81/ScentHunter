name: Fly Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/phase-0-live-baseline.yml
      - .github/workflows/phase2-sql-verification.yml
      - backend/scenthunter_next_engine/baseline_report.py
      - .github/workflows/notino-cj-production-feed-monitor.yml
      # Read-only production inventory workflows must never trigger an app deploy.
      - .github/workflows/scenthunter-production-db-inventory.yml
      - .github/workflows/scenthunter-postgres-precutover-backup.yml
      # Deploy workflow changes are production changes and must run through this workflow.

jobs:
  deploy:
    name: Deploy ScentHunter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Keep CI on the Python version supported by the pinned native extensions.
      # ubuntu-latest moved to Python 3.14, which forces incompatible source builds
      # for lxml 5.3.0, greenlet 3.0.1 and pydantic-core 2.23.2.
      - name: Set up supported Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Reject stale deployment
        run: |
          git fetch origin main --quiet

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to deploy stale commit." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The dedicated Notino CJ Feed Import workflow is the sole production
      # writer for the authenticated feed in /data/store_catalog.sqlite3.
      # Stage credentials for this release; do not print or persist them.
      - name: Configure authorized Notino CJ feed for production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
          CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CJ_HTTP_USERNAME}" || -z "${CJ_HTTP_PASSWORD}" ]]; then
            echo "::error::Missing CJ_HTTP_USERNAME or CJ_HTTP_PASSWORD Actions secret; production Notino feed import cannot be configured."
            exit 1
          fi
          flyctl secrets set --stage \
            "NOTINO_CJ_FEED_URL=https://datatransfer.cj.com/datatransfer/files/8115142/outgoing/productcatalog/324587/NOTINO_fr-NotinoFR_google_all-shopping.xml.zip" \
            "NOTINO_CJ_FEED_USERNAME=${CJ_HTTP_USERNAME}" \
            "NOTINO_CJ_FEED_PASSWORD=${CJ_HTTP_PASSWORD}" \
            "SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED=1" \
            "SCENTHUNTER_DISCOVERY_QUERIES_BPLATZ=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_DELOOX=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_SABINA=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_EASYCOSMETIC=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_PARFUMZENTRUM=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            --app scenthunter
          echo "Notino CJ feed URL and credentials staged for the production release."

      - name: Ensure catalog volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app scenthunter | grep -q 'scenthunter_data'; then
            echo "Volume scenthunter_data already exists."
          else
            echo "Creating catalog volume in ams..."
            flyctl volumes create scenthunter_data \
              --app scenthunter \
              --region ams \
              --size 1 \
              --count 1 \
              --yes
          fi

      - name: Inspect Fly machines and volume attachments before deployment
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FLY STATUS ==="
          flyctl status --app scenthunter --json
          echo "=== FLY MACHINES ==="
          flyctl machines list --app scenthunter --json
          echo "=== FLY VOLUMES ==="
          flyctl volumes list --app scenthunter --json

      - name: Deploy ScentHunter
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Fly deploy attempt $attempt/5"
            flyctl deploy --remote-only 2>&1 | tee /tmp/fly-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'status 503|503 Service Unavailable|No server is available|temporarily unavailable|connection reset|i/o timeout|context deadline exceeded' /tmp/fly-deploy.log; then
              echo "Fly deploy failed for a non-transient reason; not retrying." >&2
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Fly deploy still failed after five transient-error retries." >&2
              exit "$status"
            fi
            delay=$((attempt * 10))
            echo "Transient Fly.io error detected; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Diagnose failed Fly release machine
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set +e
          echo "=== DEPLOY FAILURE CONTEXT ==="
          if [ -f /tmp/fly-deploy.log ]; then
            cat /tmp/fly-deploy.log
            release_id="$(sed -nE 's/.*Created release_command machine ([a-f0-9]+).*/\\1/p' /tmp/fly-deploy.log | tail -n1)"
            if [ -n "$release_id" ]; then
              echo "=== RELEASE MACHINE STATUS: $release_id ==="
              flyctl machine status "$release_id" --app scenthunter || true
              echo "=== RELEASE MACHINE LOGS: $release_id ==="
              timeout 30s flyctl logs --app scenthunter --instance "$release_id" --no-tail || true
            fi
            worker_id="$(sed -nE 's/.*Machine ([a-f0-9]+) \\[worker\\] was created.*/\\1/p' /tmp/fly-deploy.log | tail -n1)"
            if [ -n "$worker_id" ]; then
              echo "=== WORKER MACHINE STATUS: $worker_id ==="
              flyctl machine status "$worker_id" --app scenthunter || true
              echo "=== WORKER MACHINE LOGS: $worker_id ==="
              timeout 30s flyctl logs --app scenthunter --instance "$worker_id" --no-tail || true
            fi
          fi
          echo "=== CURRENT MACHINES ==="
          flyctl machines list --app scenthunter --json || true

      - name: Seed and verify canonical PostgreSQL catalog and retailer stores
        if: ${{ !contains(github.event.head_commit.message, '[config-only-no-db]') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          remote_command="/bin/sh -lc 'cd /app/backend && /app/.venv/bin/alembic upgrade head && /app/.venv/bin/python scripts/seed_catalog.py --apply --seed-bplatz-store --seed-notino-store --seed-deloox-store --seed-sabina-store --seed-easycosmetic-store --seed-parfumzentrum-store && /app/.venv/bin/python scripts/verify_catalog.py'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command"

      - name: Verify production health and catalog API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://scenthunter.fly.dev"
          endpoints = ("/health", "/catalog-status")
          last_error = None

          for attempt in range(1, 13):
              try:
                  payloads = {}
                  for endpoint in endpoints:
                      request = urllib.request.Request(
                          base + endpoint,
                          headers={"Accept": "application/json", "User-Agent": "ScentHunter-deploy-smoke-test/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=12) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{endpoint} returned HTTP {response.status}")
                          payloads[endpoint] = json.loads(response.read().decode("utf-8"))

                  health = payloads["/health"]
                  if health.get("status") != "healthy":
                      raise RuntimeError(f"Unexpected health payload: {health}")
                  if not health.get("architecture"):
                      raise RuntimeError("Health payload is missing architecture")

                  catalog = payloads["/catalog-status"]
                  if not isinstance(catalog.get("stores"), dict):
                      raise RuntimeError("Catalog status is missing the stores object")
                  for field in ("bootstrap_started", "bootstrap_running", "bootstrap_done"):
                      if field not in catalog:
                          raise RuntimeError(f"Catalog status is missing {field}")

                  print("Production health check: PASS")
                  print(f"Architecture: {health['architecture']}")
                  print(f"Catalog API: PASS ({len(catalog['stores'])} store status entries)")
                  print("Bootstrap: " + json.dumps({
                      key: catalog.get(key) for key in (
                          "bootstrap_started", "bootstrap_running", "bootstrap_done", "bootstrap_error"
                      )
                  }, ensure_ascii=False))
                  if catalog.get("bootstrap_error"):
                      print("WARNING: catalog bootstrap reports an error; inspect /catalog-status.")
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {type(exc).__name__}: {exc}", flush=True)
                  if attempt < 12:
                      time.sleep(5)
          else:
              raise SystemExit(f"Production smoke test failed after retries: {last_error}")
          PY

      - name: Verify public search is served by the canonical PostgreSQL catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          query = "Dior Sauvage"

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-postgres-search-smoke/1.0"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          status = get_json("/api/catalog/status")
          if status.get("status") != "ready" or int(status.get("published_offers") or 0) < 1:
              raise RuntimeError("Canonical PostgreSQL catalog is not ready or has no publishable offers")

          encoded = urllib.parse.quote(query)
          canonical = get_json("/api/catalog/search?q=" + encoded)
          public = get_json("/search?q=" + encoded)

          for label, payload in (("canonical", canonical), ("public", public)):
              if payload.get("status") != "completed" or not payload.get("completed"):
                  raise RuntimeError(f"{label} search did not complete")
              if int(payload.get("offer_count") or 0) < 1:
                  raise RuntimeError(f"{label} search returned no publishable offers")
              for product in payload.get("results") or []:
                  for offer in product.get("offers") or []:
                      if offer.get("currency") != "EUR" or not offer.get("url"):
                          raise RuntimeError(f"{label} search exposed an invalid offer")

          if public.get("results") != canonical.get("results"):
              raise RuntimeError("Public /search does not return the canonical PostgreSQL search result")

          print("PUBLIC_SEARCH_BACKEND=postgresql")
          print("PUBLIC_SEARCH_ROUTE=PASS")
          print("CANONICAL_API=PASS")
          print("PUBLISHED_OFFERS=" + str(public["offer_count"]))
          PY

      - name: Queue and verify PostgreSQL active-offer refresh for Bplatz
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          machine_id="$(flyctl machine list --app scenthunter --json | python -c 'import json,sys; machines=json.load(sys.stdin); started=[m for m in machines if m.get("state")=="started" and m.get("config",{}).get("metadata",{}).get("fly_process_group")=="app"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started app machine found for Bplatz queue verification." >&2; exit 1; }

          python_script="$(cat <<'PY'
          import os
          from sqlalchemy import text
          from app.db import make_session_factory
          from app.workers.postgres_worker import _schedule_active_offer_refresh

          refresh_flag = os.environ.get("SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED", "<unset>")
          queue_backend = os.environ.get("SCENTHUNTER_QUEUE_BACKEND", "<unset>")
          print("ACTIVE_OFFER_REFRESH_ENABLED=" + refresh_flag)
          print("QUEUE_BACKEND=" + queue_backend)
          assert refresh_flag.lower() in {"1", "true", "yes", "on"}
          assert queue_backend.lower() == "postgres"

          factory = make_session_factory()
          _schedule_active_offer_refresh(factory)
          session = factory()
          store_id = session.execute(
              text("SELECT id::text FROM stores WHERE slug='bplatz' AND status='active'")
          ).scalar_one()
          count = session.execute(
              text("""
                  SELECT count(*) FROM ingestion_queue_jobs
                  WHERE stage='refresh'
                    AND payload->>'store_id'=:store_id
                    AND created_at >= now() - interval '10 minutes'
              """),
              {"store_id": store_id},
          ).scalar_one()
          session.close()
          print("BPLATZ_REFRESH_JOBS_SCHEDULED=" + str(count))
          assert count >= 1, "No Bplatz PostgreSQL refresh jobs were scheduled"
          PY
          )"
          encoded="$(printf '%s' "$python_script" | base64 -w0)"
          remote_command="sh -c 'cd /app/backend && echo $encoded | base64 -d | /app/.venv/bin/python'"
          flyctl machine exec "$machine_id" "$remote_command" --app scenthunter --timeout 60

      - name: Queue and verify daily PostgreSQL discovery for all legacy retailers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          machine_id="$(flyctl machine list --app scenthunter --json | python -c 'import json,sys; machines=json.load(sys.stdin); started=[m for m in machines if m.get("state")=="started" and m.get("config",{}).get("metadata",{}).get("fly_process_group")=="app"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started app machine found for retailer discovery verification." >&2; exit 1; }

          python_script="$(cat <<'PY'
          import os
          from sqlalchemy import text
          from app.db import make_session_factory
          from app.workers.postgres_worker import _schedule_daily_discovery

          retailers = {
              "bplatz": "BPLATZ",
              "deloox-be": "DELOOX",
              "sabina-es": "SABINA",
              "easycosmetic-de": "EASYCOSMETIC",
              "parfumzentrum-de": "PARFUMZENTRUM",
          }
          for slug, suffix in retailers.items():
              key = "SCENTHUNTER_DISCOVERY_QUERIES_" + suffix
              queries = [item.strip() for item in os.environ.get(key, "").split(";") if item.strip()]
              print(key + "_COUNT=" + str(len(queries)))
              assert len(queries) >= 5, "Missing approved discovery query seeds for " + slug

          factory = make_session_factory()
          _schedule_daily_discovery(factory)
          session = factory()
          for slug in retailers:
              store_id = session.execute(
                  text("SELECT id::text FROM stores WHERE slug=:slug AND status='active'"),
                  {"slug": slug},
              ).scalar_one()
              count = session.execute(
                  text("""
                      SELECT count(*) FROM ingestion_queue_jobs
                      WHERE stage='discover'
                        AND payload->>'store_id'=:store_id
                        AND created_at >= now() - interval '10 minutes'
                  """),
                  {"store_id": store_id},
              ).scalar_one()
              print("DISCOVERY_JOBS_" + slug.upper().replace("-", "_") + "=" + str(count))
              assert count >= 1, "No PostgreSQL discovery job scheduled for " + slug
          session.close()
          PY
          )"
          encoded="$(printf '%s' "$python_script" | base64 -w0)"
          remote_command="sh -c 'cd /app/backend && echo $encoded | base64 -d | /app/.venv/bin/python'"
          flyctl machine exec "$machine_id" "$remote_command" --app scenthunter --timeout 60

      - name: Force-refresh and verify the affected Deloox offer directly on Fly
        if: ${{ contains(github.event.head_commit.message, 'trigger Deloox live refresh') || contains(github.event.head_commit.message, 'Correct Deloox compact-page markup recognition') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shlex
          import subprocess
          import sys

          target = "https://www.deloox.be/produit/1385920/french-avenue-liquid-brun-extrait-de-parfum-limited-edition-150-ml.html"
          remote_python = r"""
          import json, sys, time
          sys.path.insert(0, "/app/backend")
          import catalog_engine
          target = "https://www.deloox.be/produit/1385920/french-avenue-liquid-brun-extrait-de-parfum-limited-edition-150-ml.html"
          started = time.time()
          item = None
          error = None
          attempts = 0
          for attempts in range(1, 3):
              try:
                  item = catalog_engine.refresh_url("deloox", target)
                  error = None
              except Exception as exc:
                  error = type(exc).__name__ + ":" + str(exc)
                  item = None
              try:
                  item_price = float((item or {}).get("price_num"))
              except (TypeError, ValueError):
                  item_price = 0.0
              if item and item.get("name") and item_price > 0:
                  break
              if attempts < 2:
                  time.sleep(5)
          conn = catalog_engine.db()
          try:
              row = conn.execute(
                  "SELECT price,currency,fetched_at,fetch_status,name,size_ml,availability FROM store_products WHERE store=? AND url=?",
                  ("deloox", target),
              ).fetchone()
              persisted = dict(row) if row else None
          finally:
              conn.close()
          print("DELOOX_TARGETED_REFRESH=" + json.dumps({
              "item_ok": bool(item and item.get("name")),
              "item_name": (item or {}).get("name"),
              "item_price": (item or {}).get("price_num"),
              "refresh_error": error,
              "attempts": attempts,
              "store_product": persisted,
              "started_at": started,
          }, ensure_ascii=False, default=str), flush=True)
          """
          remote_command = "/app/.venv/bin/python -c " + shlex.quote(remote_python)
          try:
              result = subprocess.run(
                  ["flyctl", "ssh", "console", "--app", "scenthunter", "--select=false", "-C", remote_command],
                  capture_output=True, text=True, timeout=210,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit("Timed out while running the targeted refresh directly on the Fly machine.") from exc
          if result.stdout:
              print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")
          marker = "DELOOX_TARGETED_REFRESH="
          line = next((line for line in result.stdout.splitlines() if marker in line), None)
          if result.returncode != 0:
              raise SystemExit(f"Fly SSH refresh command failed with exit code {result.returncode}")
          if not line:
              raise SystemExit("Fly SSH refresh returned no structured result.")
          payload = json.loads(line.split(marker, 1)[1])
          row = payload.get("store_product")
          if not payload.get("item_ok") or not isinstance(row, dict):
              raise SystemExit("Deloox refresh did not persist a validated product: " + json.dumps(payload, ensure_ascii=False))
          try:
              price = float(row.get("price"))
              fetched_at = float(row.get("fetched_at"))
              started_at = float(payload.get("started_at"))
          except (TypeError, ValueError):
              raise SystemExit("Deloox refresh returned no explicit price/fetch timestamp: " + json.dumps(payload, ensure_ascii=False))
          if price <= 0:
              raise SystemExit(f"Deloox refreshed price is not positive: {price}")
          import time
          if fetched_at < started_at - 5 or fetched_at > time.time() + 5:
              raise SystemExit(f"Deloox catalog row was not freshly fetched: fetched_at={fetched_at}, started_at={started_at}")
          try:
              parsed_price = float(payload.get("item_price"))
              size_ml = float(row.get("size_ml"))
          except (TypeError, ValueError):
              raise SystemExit("Deloox refresh returned no parsed price or product size: " + json.dumps(payload, ensure_ascii=False))
          # Compare against the live parser result, never against a historical hard-coded retail price.
          if abs(price - parsed_price) > 0.01:
              raise SystemExit(f"Persisted Deloox price EUR {price:.2f} differs from freshly parsed price EUR {parsed_price:.2f}.")
          if abs(size_ml - 150.0) > 0.01 or "liquid brun" not in str(row.get("name") or "").lower():
              raise SystemExit("Deloox refreshed the wrong product/size: " + json.dumps(row, ensure_ascii=False))
          if row.get("fetch_status") != "OK":
              raise SystemExit(f"Deloox product fetch status is not OK: {row.get('fetch_status')}")
          print(f"DELOOX_LIVE_PRICE_VERIFIED=EUR {price:.2f}; size_ml={size_ml:g}; fetched_at={fetched_at}; status={row.get('fetch_status')}")
          PY

      - name: Force-refresh and verify Valentino Born in Roma Donna 50 ml on the Luxembourg storefront
        if: ${{ contains(github.event.head_commit.message, 'trigger Deloox live refresh') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, shlex, subprocess, sys
          target = "https://www.deloox.lu/produit/1215287/valentino-born-in-roma-donna-eau-de-parfum-50-ml.html"
          remote_python = r"""
          import json, sys, time
          sys.path.insert(0, "/app/backend")
          import catalog_engine
          target = "https://www.deloox.lu/produit/1215287/valentino-born-in-roma-donna-eau-de-parfum-50-ml.html"
          started = time.time()
          item = catalog_engine.refresh_url("deloox", target)
          conn = catalog_engine.db()
          try:
              row = conn.execute(
                  "SELECT price,currency,fetched_at,fetch_status,name,size_ml,availability FROM store_products WHERE store=? AND url=?",
                  ("deloox", target),
              ).fetchone()
              persisted = dict(row) if row else None
          finally:
              conn.close()
          print("DELOOX_VALENTINO_50ML=" + json.dumps({
              "item": item, "store_product": persisted, "started_at": started
          }, ensure_ascii=False, default=str), flush=True)
          """
          command = "/app/.venv/bin/python -c " + shlex.quote(remote_python)
          result = subprocess.run(
              ["flyctl", "ssh", "console", "--app", "scenthunter", "--select=false", "-C", command],
              capture_output=True, text=True, timeout=210,
          )
          print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")
          if result.returncode:
              raise SystemExit(f"Fly SSH Valentino refresh failed: {result.returncode}")
          marker = "DELOOX_VALENTINO_50ML="
          line = next((x for x in result.stdout.splitlines() if marker in x), None)
          if not line:
              raise SystemExit("No structured Valentino refresh result returned.")
          payload = json.loads(line.split(marker, 1)[1])
          item, row = payload.get("item") or {}, payload.get("store_product") or {}
          try:
              parsed_price = float(item.get("price_num"))
              saved_price = float(row.get("price"))
              size_ml = float(row.get("size_ml"))
              fetched_at = float(row.get("fetched_at"))
              started_at = float(payload.get("started_at"))
          except (TypeError, ValueError):
              raise SystemExit("Valentino refresh missing validated price/size/timestamp: " + json.dumps(payload, ensure_ascii=False))
          if "valentino" not in str(row.get("name") or "").lower() or "born in roma" not in str(row.get("name") or "").lower():
              raise SystemExit("Wrong product persisted: " + json.dumps(row, ensure_ascii=False))
          if abs(size_ml - 50.0) > 0.01:
              raise SystemExit("Wrong Valentino size persisted: " + json.dumps(row, ensure_ascii=False))
          if abs(parsed_price - saved_price) > 0.01:
              raise SystemExit(f"Valentino parsed price EUR {parsed_price:.2f} differs from saved price EUR {saved_price:.2f}")
          if fetched_at < started_at - 5 or row.get("fetch_status") != "OK":
              raise SystemExit("Valentino offer was not freshly and successfully persisted: " + json.dumps(row, ensure_ascii=False))
          print(f"DELOOX_VALENTINO_50ML_VERIFIED=EUR {saved_price:.2f}; size={size_ml:g}ml; fetched_at={fetched_at}")
          PY

