name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ScentHunter
    runs-on: ubuntu-latest
    concurrency: deploy-group

    steps:
      - uses: actions/checkout@v4

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure catalog volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app scenthunter | grep -q 'scenthunter_data'; then
            echo "Volume scenthunter_data already exists."
          else
            echo "Creating volume scenthunter_data in ams..."
            flyctl volumes create scenthunter_data \
              --app scenthunter \
              --region ams \
              --size 1 \
              --count 1 \
              --yes
          fi

      - name: Deploy ScentHunter
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
