name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ScentHunter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Reject stale deployment
        run: |
          git fetch origin main --quiet

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to deploy stale commit." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure catalog volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app scenthunter | grep -q 'scenthunter_data'; then
            echo "Volume scenthunter_data already exists."
          else
            echo "Creating catalog volume in ams..."
            flyctl volumes create scenthunter_data \
              --app scenthunter \
              --region ams \
              --size 1 \
              --count 1 \
              --yes
          fi

      - name: Deploy ScentHunter
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Fly deploy attempt $attempt/5"
            flyctl deploy --remote-only 2>&1 | tee /tmp/fly-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'status 503|503 Service Unavailable|No server is available|temporarily unavailable|connection reset|i/o timeout|context deadline exceeded' /tmp/fly-deploy.log; then
              echo "Fly deploy failed for a non-transient reason; not retrying." >&2
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Fly deploy still failed after five transient-error retries." >&2
              exit "$status"
            fi
            delay=$((attempt * 10))
            echo "Transient Fly.io error detected; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Verify production health and catalog API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.error
          import urllib.request

          base = "https://scenthunter.fly.dev"
          endpoints = ("/health", "/catalog-status")
          last_error = None

          for attempt in range(1, 13):
              try:
                  payloads = {}
                  for endpoint in endpoints:
                      request = urllib.request.Request(
                          base + endpoint,
                          headers={"Accept": "application/json", "User-Agent": "ScentHunter-deploy-smoke-test/1.0"},
                      )
                      with urllib.request.urlopen(request, timeout=12) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{endpoint} returned HTTP {response.status}")
                          payloads[endpoint] = json.loads(response.read().decode("utf-8"))

                  health = payloads["/health"]
                  if health.get("status") != "healthy":
                      raise RuntimeError(f"Unexpected health payload: {health}")
                  if not health.get("architecture"):
                      raise RuntimeError("Health payload is missing architecture")

                  catalog = payloads["/catalog-status"]
                  if not isinstance(catalog.get("stores"), dict):
                      raise RuntimeError("Catalog status is missing the stores object")
                  for field in ("bootstrap_started", "bootstrap_running", "bootstrap_done"):
                      if field not in catalog:
                          raise RuntimeError(f"Catalog status is missing {field}")

                  print("Production health check: PASS")
                  print(f"Architecture: {health['architecture']}")
                  print(f"Catalog API: PASS ({len(catalog['stores'])} store status entries)")
                  print("Bootstrap: " + json.dumps({
                      key: catalog.get(key) for key in (
                          "bootstrap_started", "bootstrap_running", "bootstrap_done", "bootstrap_error"
                      )
                  }, ensure_ascii=False))
                  if catalog.get("bootstrap_error"):
                      print("WARNING: catalog bootstrap reports an error; inspect /catalog-status.")
                  break
              except (OSError, ValueError, RuntimeError, urllib.error.URLError) as exc:
                  last_error = exc
                  print(f"Attempt {attempt}/12 failed: {type(exc).__name__}: {exc}", flush=True)
                  if attempt < 12:
                      time.sleep(5)
          else:
              raise SystemExit(f"Production smoke test failed after retries: {last_error}")
          PY

      - name: Force-refresh and verify the affected Deloox offer directly on Fly
        if: ${{ contains(github.event.head_commit.message, 'trigger Deloox live refresh') || contains(github.event.head_commit.message, 'Correct Deloox compact-page markup recognition') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import shlex
          import subprocess
          import sys

          target = "https://www.deloox.be/produit/1385920/french-avenue-liquid-brun-extrait-de-parfum-limited-edition-150-ml.html"
          remote_python = r"""
          import json, sys, time
          sys.path.insert(0, "/app/backend")
          import catalog_engine
          target = "https://www.deloox.be/produit/1385920/french-avenue-liquid-brun-extrait-de-parfum-limited-edition-150-ml.html"
          started = time.time()
          item = None
          error = None
          attempts = 0
          for attempts in range(1, 3):
              try:
                  item = catalog_engine.refresh_url("deloox", target)
                  error = None
              except Exception as exc:
                  error = type(exc).__name__ + ":" + str(exc)
                  item = None
              try:
                  item_price = float((item or {}).get("price_num"))
              except (TypeError, ValueError):
                  item_price = 0.0
              if item and item.get("name") and item_price > 0:
                  break
              if attempts < 2:
                  time.sleep(5)
          conn = catalog_engine.db()
          try:
              row = conn.execute(
                  "SELECT price,currency,fetched_at,fetch_status,name,size_ml,availability FROM store_products WHERE store=? AND url=?",
                  ("deloox", target),
              ).fetchone()
              persisted = dict(row) if row else None
          finally:
              conn.close()
          print("DELOOX_TARGETED_REFRESH=" + json.dumps({
              "item_ok": bool(item and item.get("name")),
              "item_name": (item or {}).get("name"),
              "item_price": (item or {}).get("price_num"),
              "refresh_error": error,
              "attempts": attempts,
              "store_product": persisted,
              "started_at": started,
          }, ensure_ascii=False, default=str), flush=True)
          """
          remote_command = "/app/.venv/bin/python -c " + shlex.quote(remote_python)
          try:
              result = subprocess.run(
                  ["flyctl", "ssh", "console", "--app", "scenthunter", "--select=false", "-C", remote_command],
                  capture_output=True, text=True, timeout=210,
              )
          except subprocess.TimeoutExpired as exc:
              raise SystemExit("Timed out while running the targeted refresh directly on the Fly machine.") from exc
          if result.stdout:
              print(result.stdout, end="")
          if result.stderr:
              print(result.stderr, file=sys.stderr, end="")
          marker = "DELOOX_TARGETED_REFRESH="
          line = next((line for line in result.stdout.splitlines() if marker in line), None)
          if result.returncode != 0:
              raise SystemExit(f"Fly SSH refresh command failed with exit code {result.returncode}")
          if not line:
              raise SystemExit("Fly SSH refresh returned no structured result.")
          payload = json.loads(line.split(marker, 1)[1])
          row = payload.get("store_product")
          if not payload.get("item_ok") or not isinstance(row, dict):
              raise SystemExit("Deloox refresh did not persist a validated product: " + json.dumps(payload, ensure_ascii=False))
          try:
              price = float(row.get("price"))
              fetched_at = float(row.get("fetched_at"))
              started_at = float(payload.get("started_at"))
          except (TypeError, ValueError):
              raise SystemExit("Deloox refresh returned no explicit price/fetch timestamp: " + json.dumps(payload, ensure_ascii=False))
          if price <= 0:
              raise SystemExit(f"Deloox refreshed price is not positive: {price}")
          import time
          if fetched_at < started_at - 5 or fetched_at > time.time() + 5:
              raise SystemExit(f"Deloox catalog row was not freshly fetched: fetched_at={fetched_at}, started_at={started_at}")
          if abs(price - 42.59) > 0.01:
              raise SystemExit(f"Live Deloox price differs from the reported current price €42.59: received €{price:.2f}; do not mark the incident resolved.")
          print(f"DELOOX_LIVE_PRICE_VERIFIED=EUR {price:.2f}; fetched_at={fetched_at}; status={row.get('fetch_status')}")
          PY

      - name: Capture Fly logs if the targeted Deloox refresh fails
        if: ${{ failure() && (contains(github.event.head_commit.message, 'trigger Deloox live refresh') || contains(github.event.head_commit.message, 'Correct Deloox compact-page markup recognition')) }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          timeout 25s flyctl logs --app scenthunter --no-tail || true

      - name: Check Deloox discovered product URLs are re-queued unless already hydrated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import sqlite3
          from pathlib import Path

          source = Path("backend/catalog_engine.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_deloox_persist_products")
          function_source = ast.get_source_segment(source, function)
          assert "transaction_batch_size = 25" in function_source, "Deloox writes must use bounded transaction chunks"
          assert "for chunk_start in range(0, len(items), transaction_batch_size)" in function_source, "Deloox writer lock must be released between chunks"
          statement = next(
              (
                  node.value.value
                  for node in ast.walk(function)
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "hydration_sql" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
                  and "INSERT INTO hydration_queue" in node.value.value
              ),
              None,
          )
          assert statement, "Deloox persistence must update the hydration queue"

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.executescript("""
          CREATE TABLE hydration_queue(store TEXT,url TEXT,state TEXT,priority INTEGER NOT NULL DEFAULT 100,attempts INTEGER,available_at REAL,first_seen_at REAL,leased_until REAL,lease_token TEXT,last_error TEXT,last_http_status INTEGER,PRIMARY KEY(store,url));
          CREATE TABLE store_products(store TEXT,url TEXT,price REAL,fetched_at REAL,fetch_status TEXT,brand TEXT,size_ml REAL,gtin TEXT,sku TEXT,PRIMARY KEY(store,url));
          """)
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,last_error) VALUES('deloox','https://www.deloox.com/product/a','ERROR',3,9999999999,1,'timeout')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/b','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/c','PROCESSING',1,9999999999,1,9999999999,'lease-c')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,last_error) VALUES('deloox','https://www.deloox.com/product/d','ERROR',1,9999999999,1,'parser')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/e','DONE',1,9999999999,1)")
          now = 1000.0
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/b',29.99,now-60,'OK','Brand',100,'12345670','sku-b'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/d',25.0,now-60,'OK','Brand',100,'12345670','sku-d'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/e',25.0,now-30*3600,'OK','Brand',100,'12345670','sku-e'))
          # A recent null-price row is only hydrated if its core identity is complete.
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/f','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/g','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/f',None,now-60,'OK','',150,'','1385920'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/g',None,now-60,'OK','French Avenue',150,'','1385921'))

          def upsert(url):
              conn.execute(statement, ('deloox',url,'PENDING',0,now,now,now,now-24*3600,now-6*3600,now,now-24*3600,now-6*3600,now-24*3600,now-6*3600,now-24*3600,now-6*3600))

          for suffix in ('a','b','c','d','e','f','g'):
              upsert('https://www.deloox.com/product/'+suffix)

          states={row['url'].rsplit('/',1)[-1]:row for row in conn.execute("SELECT * FROM hydration_queue")}
          assert states['a']['state']=='PENDING' and states['a']['available_at'] <= now, states['a']
          assert states['b']['state']=='DONE', states['b']
          assert states['c']['state']=='PROCESSING' and states['c']['lease_token']=='lease-c', states['c']
          assert states['d']['state']=='DONE', states['d']
          assert states['e']['state']=='PENDING' and states['e']['available_at'] <= now, states['e']
          assert states['f']['state']=='PENDING' and states['f']['available_at'] <= now, states['f']
          assert states['g']['state']=='DONE', states['g']
          # Verify the bounded search-priority hint elevates a matching queue row.
          priority_function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "prioritize_hydration_candidates")
          priority_sql = next(
              (
                  node.value.value
                  for node in ast.walk(priority_function)
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "priority_sql" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
                  and "UPDATE hydration_queue" in node.value.value
              ),
              None,
          )
          claim_function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_claim_one_hydration_task")
          claim_sql = next(
              (
                  part.value
                  for node in ast.walk(claim_function)
                  if isinstance(node, ast.Call)
                  and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "execute"
                  and node.args
                  for part in ast.walk(node.args[0])
                  if isinstance(part, ast.Constant)
                  and isinstance(part.value, str)
                  and "SELECT q.store,q.url,q.attempts" in part.value
              ),
              None,
          )
          assert priority_sql and claim_sql, "Query-priority update and hydration claim SQL must exist"
          assert "q.priority ASC" in claim_sql, "Hydration claims must take priority URLs first"
          conn.executescript("""
          CREATE TABLE store_urls(store TEXT,url TEXT,active INTEGER,PRIMARY KEY(store,url));
          """)
          conn.execute("INSERT INTO hydration_queue(store,url,state,priority,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/ordinary','PENDING',100,0,0,1,9999999999,'ordinary-lease')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,priority,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/target','PENDING',100,0,0,1,9999999999,'target-lease')")
          conn.execute("INSERT INTO store_urls VALUES('deloox','https://www.deloox.com/product/ordinary',1)")
          conn.execute("INSERT INTO store_urls VALUES('deloox','https://www.deloox.com/product/target',1)")
          conn.execute(priority_sql, (0,'deloox','https://www.deloox.com/product/target'))
          chosen = conn.execute(claim_sql, ('deloox', now)).fetchone()
          assert chosen['url'].endswith('/target'), chosen
          print("Deloox search-priority regression test: PASS (query-selected URL claimed before general backlog)")
          print("Deloox hydration queue upsert regression test: PASS (ERROR requeued; DONE and live leases preserved; persisted OK respected)")
          PY

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run bounded Deloox discovery regression tests
        working-directory: backend
        run: python -m unittest tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_deadline_skips_initial_fanout_when_expired tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_budget_rotates_query_and_limits_each_run tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_budget_reserves_time_for_frontier tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_discovery_graph_reports_search_then_frontier_progress tests.test_deloox_out_of_stock.DelooxRegionalOfferPriorityTests -v

      - name: Exercise real production searches and offer data
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"

          def get_json(path, timeout=25):
              # Search-status polling can briefly contend with catalog hydration.
              # Allow the HTTP read to finish; the independent 120s search deadline
              # below still fails a genuinely stalled search instead of a single slow poll.
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-search-smoke-test/1.2"},
              )
              with urllib.request.urlopen(request, timeout=timeout) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          def search(query):
              search_started_at = time.monotonic()
              start_deadline = search_started_at + 45
              job_id = ""
              while time.monotonic() < start_deadline:
                  started = get_json("/search-start?q=" + urllib.parse.quote(query))
                  if started.get("status") == "busy":
                      time.sleep(max(0.05, min(0.25, float(started.get("retry_after_ms", 200)) / 1000)))
                      continue
                  if started.get("status") == "error":
                      raise RuntimeError("Production search rejected: " + json.dumps(started.get("errors", {})))
                  job_id = str(started.get("job_id") or "").strip()
                  if job_id:
                      break
                  raise RuntimeError("Search API did not return a job_id: " + json.dumps(started))
              if not job_id:
                  raise RuntimeError("Production search remained busy for 45 seconds")

              deadline = time.monotonic() + 120
              last = {}
              while time.monotonic() < deadline:
                  last = get_json("/search-status?job_id=" + urllib.parse.quote(job_id))
                  if last.get("completed"):
                      break
                  # Atomic publication contract: the API must expose no
                  # products until the whole search job is finalized.
                  partial_results = last.get("results")
                  if isinstance(partial_results, list) and partial_results:
                      raise RuntimeError(
                          f"Atomic search regression: '{query}' exposed "
                          f"{len(partial_results)} products before completion"
                      )
                  time.sleep(0.05)
              else:
                  raise RuntimeError("Production search timed out: " + json.dumps({
                      "status": last.get("status"),
                      "count": last.get("count"),
                      "offer_count": last.get("offer_count"),
                      "errors": last.get("errors"),
                  }))

              count = int(last.get("count") or 0)
              offer_count = int(last.get("offer_count") or 0)
              if count == 0 and offer_count == 0:
                  raise RuntimeError(f"Search '{query}' returned zero products and offers")

              if query == "Hawas":
                  # Keep validated family coverage and a bounded latency budget.
                  # Production search fan-out can briefly contend with catalog work;
                  # a single 1-2s sample is diagnostic noise, while >=2.5s is a real
                  # regression. The complete search still has its own 120s deadline.
                  backend_elapsed = float(last.get("elapsed") or 0)
                  if count < 29:
                      raise RuntimeError(
                          f"Hawas family regression: expected at least 29 variants, got {count}"
                      )
                  if backend_elapsed <= 0 or backend_elapsed >= 2.5:
                      raise RuntimeError(
                          f"Hawas backend latency regression: expected under 2.5s, got {backend_elapsed:.3f}s"
                      )
                  print(
                      f"Hawas baseline: PASS ({count} products, backend {backend_elapsed:.3f}s)"
                  )

              groups = last.get("results") if isinstance(last.get("results"), list) else []
              if query == "Hawas":
                  # Guard the exact production regression fixed by PR #71:
                  # a family-level title must not point at a different explicit variant.
                  import re
                  family_url_conflicts = []
                  for group in groups:
                      if not isinstance(group, dict):
                          continue
                      for offer in (group.get("offers") if isinstance(group.get("offers"), list) else []):
                          if not isinstance(offer, dict):
                              continue
                          title = re.sub(r"[^a-z0-9]+", " ", str(offer.get("name") or offer.get("title") or "").lower()).strip()
                          url_identity = re.sub(r"[^a-z0-9]+", " ", str(offer.get("url") or offer.get("product_url") or "").lower()).strip()
                          if "hawas for him" in title and "hawas malibu" in url_identity:
                              family_url_conflicts.append({
                                  "store": offer.get("store"),
                                  "name": offer.get("name") or offer.get("title"),
                                  "url": offer.get("url") or offer.get("product_url"),
                              })
                  if family_url_conflicts:
                      raise RuntimeError(
                          "Hawas family/variant URL identity mismatch: "
                          + json.dumps(family_url_conflicts[:5], ensure_ascii=False)
                      )
                  print("Hawas family/variant URL identity guard: PASS")
              offers = [
                  offer
                  for group in groups if isinstance(group, dict)
                  for offer in (group.get("offers") if isinstance(group.get("offers"), list) else [])
                  if isinstance(offer, dict)
              ]
              valid = []
              for offer in offers:
                  price = offer.get("price_num")
                  try:
                      numeric_price = float(price)
                  except (TypeError, ValueError):
                      continue
                  url = str(offer.get("url") or "")
                  if numeric_price > 0 and url.startswith(("http://", "https://")) and offer.get("name") and offer.get("store"):
                      valid.append(offer)

              elapsed_sec = time.monotonic() - search_started_at
              print(f"Query '{query}': status={last.get('status')}, products={count}, elapsed={last.get('elapsed')}s, collect={last.get('collect_elapsed')}s, dedupe={last.get('dedupe_elapsed')}s, aggregate={last.get('aggregate_elapsed')}s, offers={offer_count}, priced_linked_offers={len(valid)}, elapsed_sec={elapsed_sec:.3f}")
              print("Search phase/store diagnostics: " + json.dumps({
                  "query": query,
                  "backend_elapsed": last.get("elapsed"),
                  "collect_elapsed": last.get("collect_elapsed"),
                  "dedupe_elapsed": last.get("dedupe_elapsed"),
                  "aggregate_elapsed": last.get("aggregate_elapsed"),
                  "store_timings": {
                      store: {
                          "elapsed": (info or {}).get("elapsed"),
                          "count": (info or {}).get("count"),
                          "candidate_count": ((info or {}).get("details") or {}).get("candidate_count"),
                          "search_local_elapsed": ((info or {}).get("details") or {}).get("search_local_elapsed"),
                          "targeted_refresh_elapsed": ((info or {}).get("details") or {}).get("targeted_refresh_elapsed"),
                          "identity_resolution_elapsed": ((info or {}).get("details") or {}).get("identity_resolution_elapsed"),
                          "unresolved_count": ((info or {}).get("details") or {}).get("unresolved_count"),
                      }
                      for store, info in (last.get("stores") or {}).items()
                  },
              }, ensure_ascii=False, sort_keys=True))
              if query == "Born in Roma":
                  # This family is expected to contain 20 registered variants;
                  # fail loudly if the production search returns only a subset.
                  if count < 20:
                      raise RuntimeError(f"Born in Roma family incomplete: expected at least 20 products, got {count}")
                  # Count alone can hide missing canonical variants. Assert both
                  # requested Rendez-Vous Ruby variants appear in the actual API payload.
                  family_payload = json.dumps(groups, ensure_ascii=False).lower().replace("-", " ").replace("_", " ")
                  required_variants = (
                      ("rendez vous ruby uomo", "Born in Roma Rendez-Vous Ruby Uomo"),
                      ("rendez vous ruby donna", "Born in Roma Rendez-Vous Ruby Donna"),
                  )
                  missing_variants = [
                      label for token, label in required_variants
                      if token not in family_payload
                  ]
                  if missing_variants:
                      raise RuntimeError(
                          "Born in Roma search is missing required canonical variants: "
                          + ", ".join(missing_variants)
                      )
                  print("Born in Roma required variants: PASS (Rendez-Vous Ruby Uomo, Rendez-Vous Ruby Donna)")
              print("Store statuses: " + json.dumps(last.get("stores") or {}, ensure_ascii=False))
              print("Errors: " + json.dumps(last.get("errors") or {}, ensure_ascii=False))
              if not valid:
                  raise RuntimeError(f"Search '{query}' returned no grouped offers with a positive price and product URL")
              sample = min(valid, key=lambda item: float(item["price_num"]))
              print("Cheapest valid offer sample: " + json.dumps({
                  "name": sample.get("name"),
                  "store": sample.get("store"),
                  "price": sample.get("price"),
                  "price_num": sample.get("price_num"),
                  "url": sample.get("url"),
              }, ensure_ascii=False))
              return last

          failures = []
          for query in ("Born in Roma", "Hawas", "Hawas Ice", "Dior Sauvage", "Liquid Brun 100 ml", "Liquid Brun Limited Edition 150 ml"):
              try:
                  result = search(query)
                  if query == "Liquid Brun 100 ml":
                      import re
                      mismatches = []
                      groups = result.get("results") if isinstance(result.get("results"), list) else []
                      for group in groups:
                          if not isinstance(group, dict):
                              continue
                          group_name = str(group.get("name") or group.get("title") or "")
                          if not re.search(r"(?<!\d)100(?:\s*[-_]?\s*)?ml\b", group_name, flags=re.I):
                              continue
                          for offer in (group.get("offers") or []):
                              if not isinstance(offer, dict):
                                  continue
                              store = str(offer.get("store") or "").lower()
                              if "deloox" not in store:
                                  continue
                              offer_identity = " ".join(str(offer.get(key) or "") for key in ("name", "title", "url", "product_url"))
                              if re.search(r"(?<!\d)150\s?ml\b", offer_identity, flags=re.I):
                                  mismatches.append({
                                      "group": group_name,
                                      "store": offer.get("store"),
                                      "name": offer.get("name") or offer.get("title"),
                                      "url": offer.get("url") or offer.get("product_url"),
                                  })
                      print("Liquid Brun 100 ml Deloox size-integrity check: " + json.dumps({
                          "groups_checked": len(groups),
                          "mismatches": mismatches[:10],
                      }, ensure_ascii=False))
                      if mismatches:
                          raise RuntimeError("Deloox 150 ml offer published in Liquid Brun 100 ml group: " + json.dumps(mismatches[:5], ensure_ascii=False))
                  # This assertion is the post-recovery regression gate for the persisted Deloox 150 ml offer.
                  if query == "Liquid Brun Limited Edition 150 ml":
                      import re
                      matches_150 = []
                      for group in (result.get("results") or []):
                          if not isinstance(group, dict):
                              continue
                          group_identity = " ".join(str(group.get(key) or "") for key in ("name", "title"))
                          for offer in (group.get("offers") or []):
                              if not isinstance(offer, dict):
                                  continue
                              store = str(offer.get("store") or "").lower()
                              identity = " ".join(str(offer.get(key) or "") for key in ("name", "title", "url", "product_url"))
                              combined = group_identity + " " + identity
                              try:
                                  is_150ml = abs(float(offer.get("size_ml")) - 150.0) < 0.01
                              except (TypeError, ValueError):
                                  is_150ml = bool(re.search(r"(?<!\d)150(?:\s*[-_]?\s*)?ml\b", combined, flags=re.I))
                              if "deloox" not in store or not is_150ml:
                                  continue
                              matches_150.append({
                                  "group": group_identity,
                                  "name": offer.get("name") or offer.get("title"),
                                  "url": offer.get("url") or offer.get("product_url"),
                                  "availability": offer.get("availability"),
                                  "available": offer.get("available"),
                                  "price": offer.get("price"),
                                  "price_num": offer.get("price_num"),
                              })
                      sold_out = [
                          item for item in matches_150
                          if str(item.get("availability") or "").lower().replace("-", "_").replace(" ", "_") in ("out_of_stock", "outofstock", "sold_out", "soldout")
                          or item.get("available") is False
                      ]
                      stale_price = [
                          item for item in sold_out
                          if item.get("price") not in (None, "") or item.get("price_num") not in (None, "")
                      ]
                      print("Liquid Brun Limited Edition 150 ml Deloox production check: " + json.dumps({
                          "matches": matches_150,
                          "sold_out_matches": sold_out,
                          "stale_price_matches": stale_price,
                      }, ensure_ascii=False))
                      if not matches_150:
                          raise RuntimeError("Deloox Limited Edition 150 ml is missing from production")
                      if stale_price:
                          raise RuntimeError("Deloox out-of-stock 150 ml offer still has a stale price: " + json.dumps(stale_price[:5], ensure_ascii=False))
                      in_stock = [
                          item for item in matches_150
                          if str(item.get("availability") or "").lower().replace("-", "_").replace(" ", "_") in ("in_stock", "instock", "available", "limited_availability", "preorder")
                          or item.get("available") is True
                      ]
                      priced_in_stock = [
                          item for item in in_stock
                          if item.get("price") not in (None, "") or item.get("price_num") not in (None, "")
                      ]
                      if in_stock and not priced_in_stock:
                          raise RuntimeError("Deloox in-stock 150 ml offer has no valid price: " + json.dumps(in_stock[:5], ensure_ascii=False))
                  if query == "Dior Sauvage":
                      store_statuses = result.get("stores") if isinstance(result.get("stores"), dict) else {}
                      easycosmetic = store_statuses.get("easycosmetic") if isinstance(store_statuses.get("easycosmetic"), dict) else {}
                      easy_count = int(easycosmetic.get("count") or 0)
                      print(f"Easycosmetic known-brand coverage (Dior Sauvage): {easy_count} matching products")
                      if easy_count <= 0:
                          raise RuntimeError("Easycosmetic returned no Dior Sauvage candidates despite its official Dior assortment")
                      non_fragrance_terms = (
                          "soap", "cleanser", "limpiador", "nettoyant", "face wash",
                          "facial cleanser", "toner", "tonique", "gesichtswasser",
                          "moisturizer", "moisturiser", "face and beard", "beard oil",
                          "beard balm", "beard cream", "shaving", "shave gel",
                          "gel de afeitado", "gel de rasage", "aftershave", "after shave",
                          "deodorant", "body lotion",
                      )
                      bad_offers = [
                          {"store": offer.get("store"), "name": offer.get("name"), "url": offer.get("url")}
                          for offer in (result.get("results") or [])
                          if isinstance(offer, dict)
                          for offer in (offer.get("offers") or [])
                          if isinstance(offer, dict)
                          and any(term in (str(offer.get("name") or "") + " " + str(offer.get("url") or "")).lower()
                                  for term in non_fragrance_terms)
                      ]
                      if bad_offers:
                          raise RuntimeError("Non-fragrance Dior Sauvage offers detected: " + json.dumps(bad_offers[:5], ensure_ascii=False))
                      def concentration(value):
                          value = str(value or "").lower().replace("-", " ").replace("_", " ")
                          if any(token in value for token in ("eau de parfum intense", "edp intense", "intense edp")):
                              return "edp_intense"
                          if any(token in value for token in ("eau de toilette intense", "edt intense", "intense edt")):
                              return "edt_intense"
                          if "eau de toilette" in value or " edt" in (" " + value):
                              return "edt"
                          if "eau de parfum" in value or " edp" in (" " + value):
                              return "edp"
                          if "eau de cologne" in value or " edc" in (" " + value):
                              return "edc"
                          # Retailer slugs are sometimes imprecise: treat elixir,
                          # extrait and generic parfum as ambiguous descriptors.
                          if "elixir" in value:
                              return "elixir"
                          if "extrait" in value:
                              return "extrait"
                          if "parfum" in value:
                              return "parfum"
                          return ""
                      def explicit_line_identity(value):
                          value = __import__("re").sub(r"[^a-z0-9]+", " ", str(value or "").lower())
                          if "eau sauvage" in value:
                              return "dior_eau_sauvage"
                          if "sauvage" in value:
                              return "dior_sauvage"
                          return ""
                      concentration_mismatches = []
                      for group in (result.get("results") or []):
                          if not isinstance(group, dict):
                              continue
                          for offer in (group.get("offers") or []):
                              if not isinstance(offer, dict):
                                  continue
                              title_token = concentration(offer.get("name") or offer.get("title"))
                              url_token = concentration(offer.get("url") or offer.get("product_url"))
                              hard_tokens = {"edt", "edp", "edc", "edt_intense", "edp_intense"}
                              # Fail on clear concentration conflicts; do not infer a
                              # mismatch from generic parfum/extrait/elixir wording alone.
                              if title_token in hard_tokens and url_token in hard_tokens and title_token != url_token:
                                  concentration_mismatches.append({
                                      "store": offer.get("store"), "name": offer.get("name"),
                                      "url": offer.get("url"), "title_concentration": title_token,
                                      "url_concentration": url_token,
                                  })
                              title_line = explicit_line_identity(offer.get("name") or offer.get("title"))
                              url_line = explicit_line_identity(offer.get("url") or offer.get("product_url"))
                              if title_line and url_line and title_line != url_line:
                                  concentration_mismatches.append({
                                      "store": offer.get("store"), "name": offer.get("name"),
                                      "url": offer.get("url"), "title_line": title_line,
                                      "url_line": url_line,
                                  })
                      if concentration_mismatches:
                          raise RuntimeError("Dior Sauvage title/URL concentration mismatch: " + json.dumps(concentration_mismatches[:5], ensure_ascii=False))
              except Exception as exc:
                  failures.append(f"{query}: {type(exc).__name__}: {exc}")
                  print("SMOKE TEST FAILURE: " + failures[-1], flush=True)
          if failures:
              raise SystemExit("; ".join(failures))
          print("Production search and offer-data smoke tests: PASS")
          PY

      - name: Verify aggregate catalog price freshness diagnostic
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.request

          url = "https://scenthunter.fly.dev/diagnose-catalog-price-freshness-read-only"
          request = urllib.request.Request(
              url,
              headers={
                  "Accept": "application/json",
                  "User-Agent": "ScentHunter-price-freshness-audit/1.0",
              },
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              if response.status != 200:
                  raise RuntimeError(f"price freshness diagnostic returned HTTP {response.status}")
              payload = json.loads(response.read().decode("utf-8"))

          if payload.get("ok") is not True:
              raise RuntimeError("price freshness diagnostic did not return ok=true: " + json.dumps(payload))
          if payload.get("read_only") is not True or payload.get("writes_database") is not False:
              raise RuntimeError("price freshness diagnostic did not confirm read-only behavior")
          if payload.get("network_requests") is not False:
              raise RuntimeError("price freshness diagnostic unexpectedly reports network requests")
          stores = payload.get("stores")
          if not isinstance(stores, dict) or not stores:
              raise RuntimeError("price freshness diagnostic returned no per-store aggregates")
          required = (
              "product_rows", "priced_rows", "missing_price_rows",
              "priced_fresh_24h", "priced_stale_24h",
              "missing_price_retry_due_6h", "fetch_age_buckets",
              "hydration_queue", "variants",
          )
          for store, stats in stores.items():
              if not isinstance(stats, dict):
                  raise RuntimeError(f"invalid aggregate for store {store}")
              missing = [field for field in required if field not in stats]
              if missing:
                  raise RuntimeError(f"store {store} aggregate missing fields: {missing}")
          print("CATALOG_PRICE_FRESHNESS_DIAGNOSTIC=" + json.dumps(payload, ensure_ascii=False, sort_keys=True))
          PY

