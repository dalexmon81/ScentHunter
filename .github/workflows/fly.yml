name: Fly Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy ScentHunter
    runs-on: ubuntu-latest

    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      - name: Reject stale deployment
        run: |
          git fetch origin main --quiet

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to deploy stale commit." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Ensure catalog volume exists
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: |
          if flyctl volumes list --app scenthunter | grep -q 'scenthunter_data'; then
            echo "Volume scenthunter_data already exists."
          else
            echo "Creating catalog volume in ams..."
            flyctl volumes create scenthunter_data \
              --app scenthunter \
              --region ams \
              --size 1 \
              --count 1 \
              --yes
          fi

      - name: Deploy ScentHunter
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        run: flyctl deploy --remote-only
