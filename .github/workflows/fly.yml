name: Fly Deploy

on:
  push:
    branches:
      - main
    paths-ignore:
      - .github/workflows/phase-0-live-baseline.yml
      - .github/workflows/phase2-sql-verification.yml
      - backend/scenthunter_next_engine/baseline_report.py
      - .github/workflows/notino-cj-production-feed-monitor.yml
      # Read-only production inventory workflows must never trigger an app deploy.
      - .github/workflows/scenthunter-production-db-inventory.yml
      - .github/workflows/scenthunter-postgres-precutover-backup.yml
      # Deploy workflow changes are production changes and must run through this workflow.

jobs:
  deploy:
    name: Deploy ScentHunter
    runs-on: ubuntu-latest
    timeout-minutes: 20

    concurrency:
      group: deploy-group
      cancel-in-progress: true

    steps:
      - uses: actions/checkout@v4

      # Keep CI on the Python version supported by the pinned native extensions.
      # ubuntu-latest moved to Python 3.14, which forces incompatible source builds
      # for lxml 5.3.0, greenlet 3.0.1 and pydantic-core 2.23.2.
      - name: Set up supported Python for backend tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"


      - name: Reject stale deployment
        run: |
          git fetch origin main --quiet

          if [ "$(git rev-parse HEAD)" != "$(git rev-parse origin/main)" ]; then
            echo "Refusing to deploy stale commit." >&2
            exit 1
          fi

      - uses: superfly/flyctl-actions/setup-flyctl@master

      # The dedicated Notino CJ Feed Import workflow is the sole production
      # writer for the authenticated feed in /data/store_catalog.sqlite3.
      # Stage credentials for this release; do not print or persist them.
      - name: Configure authorized Notino CJ feed for production
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
          CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "${CJ_HTTP_USERNAME}" || -z "${CJ_HTTP_PASSWORD}" ]]; then
            echo "::error::Missing CJ_HTTP_USERNAME or CJ_HTTP_PASSWORD Actions secret; production Notino feed import cannot be configured."
            exit 1
          fi
          flyctl secrets set --stage \
            "NOTINO_CJ_FEED_URL=https://datatransfer.cj.com/datatransfer/files/8115142/outgoing/productcatalog/324587/NOTINO_fr-NotinoFR_google_all-shopping.xml.zip" \
            "NOTINO_CJ_FEED_USERNAME=${CJ_HTTP_USERNAME}" \
            "NOTINO_CJ_FEED_PASSWORD=${CJ_HTTP_PASSWORD}" \
            "SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED=1" \
            "SCENTHUNTER_DISCOVERY_QUERIES_BPLATZ=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_DELOOX=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_SABINA=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_EASYCOSMETIC=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            "SCENTHUNTER_DISCOVERY_QUERIES_PARFUMZENTRUM=Dior Sauvage;Guerlain Shalimar;Guerlain La Petite Robe Noire;Creed Aventus;Lancome La Vie Est Belle;Armani Acqua di Gio Profondo;Yves Saint Laurent Y Eau de Parfum;Azzaro Wanted;Givenchy Gentleman Society;Armaf Club de Nuit Intense Man" \
            --app scenthunter
          echo "Notino CJ feed URL and credentials staged for the production release."

      - name: Deploy ScentHunter
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -uo pipefail
          for attempt in 1 2 3 4 5; do
            echo "Fly deploy attempt $attempt/5"
            # PostgreSQL-only runtime intentionally retires the legacy SQLite volume mount.
            # Confirm Fly's replacement of machines that still carry that obsolete mount.
            flyctl deploy --remote-only --yes 2>&1 | tee /tmp/fly-deploy.log
            status=${PIPESTATUS[0]}
            if [ "$status" -eq 0 ]; then
              exit 0
            fi
            if ! grep -Eqi 'status 503|503 Service Unavailable|No server is available|temporarily unavailable|connection reset|i/o timeout|context deadline exceeded' /tmp/fly-deploy.log; then
              echo "Fly deploy failed for a non-transient reason; not retrying." >&2
              exit "$status"
            fi
            if [ "$attempt" -eq 5 ]; then
              echo "Fly deploy still failed after five transient-error retries." >&2
              exit "$status"
            fi
            delay=$((attempt * 10))
            echo "Transient Fly.io error detected; retrying in ${delay}s."
            sleep "$delay"
          done

      - name: Diagnose failed Fly release machine
        if: failure()
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set +e
          echo "=== DEPLOY FAILURE CONTEXT ==="
          if [ -f /tmp/fly-deploy.log ]; then
            cat /tmp/fly-deploy.log
            release_id="$(sed -nE 's/.*Created release_command machine ([a-f0-9]+).*/\\1/p' /tmp/fly-deploy.log | tail -n1)"
            if [ -n "$release_id" ]; then
              echo "=== RELEASE MACHINE STATUS: $release_id ==="
              flyctl machine status "$release_id" --app scenthunter || true
              echo "=== RELEASE MACHINE LOGS: $release_id ==="
              timeout 30s flyctl logs --app scenthunter --instance "$release_id" --no-tail || true
            fi
            worker_id="$(sed -nE 's/.*Machine ([a-f0-9]+) \\[worker\\] was created.*/\\1/p' /tmp/fly-deploy.log | tail -n1)"
            if [ -n "$worker_id" ]; then
              echo "=== WORKER MACHINE STATUS: $worker_id ==="
              flyctl machine status "$worker_id" --app scenthunter || true
              echo "=== WORKER MACHINE LOGS: $worker_id ==="
              timeout 30s flyctl logs --app scenthunter --instance "$worker_id" --no-tail || true
            fi
          fi
          echo "=== CURRENT MACHINES ==="
          flyctl machines list --app scenthunter --json || true

      - name: Seed and verify canonical PostgreSQL catalog and retailer stores
        if: ${{ !contains(github.event.head_commit.message, '[config-only-no-db]') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 4
        shell: bash
        run: |
          set -euo pipefail
          remote_command="/bin/sh -lc 'cd /app/backend && /app/.venv/bin/alembic upgrade head && /app/.venv/bin/python scripts/seed_catalog.py --apply --seed-bplatz-store --seed-notino-store --seed-deloox-store --seed-sabina-store --seed-easycosmetic-store --seed-parfumzentrum-store && /app/.venv/bin/python scripts/verify_catalog.py'"
          flyctl ssh console --app scenthunter --select=false -C "$remote_command"

      - name: Verify production health and PostgreSQL catalog API
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import time
          import urllib.request

          base = "https://scenthunter.fly.dev"
          for attempt in range(1, 13):
              try:
                  def get(path):
                      request = urllib.request.Request(
                          base + path,
                          headers={"Accept": "application/json", "User-Agent": "ScentHunter-postgres-health/2.0"},
                      )
                      with urllib.request.urlopen(request, timeout=15) as response:
                          if response.status != 200:
                              raise RuntimeError(f"{path} returned HTTP {response.status}")
                          return json.loads(response.read().decode("utf-8"))

                  health = get("/health")
                  catalog = get("/api/catalog/status")
                  if health.get("status") != "healthy" or health.get("architecture") != "postgresql-catalog-only":
                      raise RuntimeError("Production app is not the PostgreSQL-only runtime: " + json.dumps(health))
                  if catalog.get("status") != "ready":
                      raise RuntimeError("Canonical PostgreSQL catalog is not ready: " + json.dumps(catalog))
                  print("Production health: PASS")
                  print("Runtime architecture: postgresql-catalog-only")
                  print("Canonical PostgreSQL catalog: READY")
                  break
              except Exception as exc:
                  if attempt == 12:
                      raise
                  print(f"Health attempt {attempt}/12 failed: {type(exc).__name__}: {exc}")
                  time.sleep(5)
          PY

      - name: Verify public search is served by the canonical PostgreSQL catalog
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          query = "Odyssey Mandarin Sky"

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-postgres-search-smoke/1.0"},
              )
              with urllib.request.urlopen(request, timeout=20) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          status = get_json("/api/catalog/status")
          if status.get("status") != "ready" or int(status.get("published_offers") or 0) < 1:
              raise RuntimeError("Canonical PostgreSQL catalog is not ready or has no publishable offers")

          encoded = urllib.parse.quote(query)
          canonical = get_json("/api/catalog/search?q=" + encoded)
          public = get_json("/search?q=" + encoded)

          for label, payload in (("canonical", canonical), ("public", public)):
              if payload.get("status") != "completed" or not payload.get("completed"):
                  raise RuntimeError(f"{label} search did not complete")
              if int(payload.get("offer_count") or 0) < 1:
                  raise RuntimeError(f"{label} search returned no publishable offers")
              for product in payload.get("results") or []:
                  for offer in product.get("offers") or []:
                      if offer.get("currency") != "EUR" or not offer.get("url"):
                          raise RuntimeError(f"{label} search exposed an invalid offer")

          if public.get("results") != canonical.get("results"):
              raise RuntimeError("Public /search does not return the canonical PostgreSQL search result")

          print("PUBLIC_SEARCH_BACKEND=postgresql")
          print("PUBLIC_SEARCH_ROUTE=PASS")
          print("CANONICAL_API=PASS")
          print("PUBLISHED_OFFERS=" + str(public["offer_count"]))
          PY

      - name: Queue and verify PostgreSQL active-offer refresh for Bplatz
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          machine_id="$(flyctl machine list --app scenthunter --json | python -c 'import json,sys; machines=json.load(sys.stdin); started=[m for m in machines if m.get("state")=="started" and m.get("config",{}).get("metadata",{}).get("fly_process_group")=="app"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started app machine found for Bplatz queue verification." >&2; exit 1; }

          python_script="$(cat <<'PY'
          import os
          from sqlalchemy import text
          from app.db import make_session_factory
          from app.workers.postgres_worker import _schedule_active_offer_refresh

          refresh_flag = os.environ.get("SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED", "<unset>")
          queue_backend = os.environ.get("SCENTHUNTER_QUEUE_BACKEND", "<unset>")
          print("ACTIVE_OFFER_REFRESH_ENABLED=" + refresh_flag)
          print("QUEUE_BACKEND=" + queue_backend)
          assert refresh_flag.lower() in {"1", "true", "yes", "on"}
          assert queue_backend.lower() == "postgres"

          factory = make_session_factory()
          _schedule_active_offer_refresh(factory)
          session = factory()
          store_id = session.execute(
              text("SELECT id::text FROM stores WHERE slug='bplatz' AND status='active'")
          ).scalar_one()
          count = session.execute(
              text("""
                  SELECT count(*) FROM ingestion_queue_jobs
                  WHERE stage='refresh'
                    AND payload->>'store_id'=:store_id
                    AND status IN ('queued','running')
                    AND created_at >= now() - interval '24 hours'
              """),
              {"store_id": store_id},
          ).scalar_one()
          session.close()
          print("BPLATZ_REFRESH_JOBS_AVAILABLE=" + str(count))
          assert count >= 1, "No eligible Bplatz PostgreSQL refresh jobs were available"
          PY
          )"
          encoded="$(printf '%s' "$python_script" | base64 -w0)"
          remote_command="sh -c 'cd /app/backend && echo $encoded | base64 -d | /app/.venv/bin/python'"
          flyctl machine exec "$machine_id" "$remote_command" --app scenthunter --timeout 60

      - name: Queue and verify daily PostgreSQL discovery for all legacy retailers
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          machine_id="$(flyctl machine list --app scenthunter --json | python -c 'import json,sys; machines=json.load(sys.stdin); started=[m for m in machines if m.get("state")=="started" and m.get("config",{}).get("metadata",{}).get("fly_process_group")=="app"]; print(started[0]["id"] if started else "")')"
          test -n "$machine_id" || { echo "No started app machine found for retailer discovery verification." >&2; exit 1; }

          python_script="$(cat <<'PY'
          import os
          from sqlalchemy import text
          from app.db import make_session_factory
          from app.workers.postgres_worker import _schedule_daily_discovery

          retailers = {
              "bplatz": "BPLATZ",
              "deloox-be": "DELOOX",
              "sabina-es": "SABINA",
              "easycosmetic-de": "EASYCOSMETIC",
              "parfumzentrum-de": "PARFUMZENTRUM",
          }
          for slug, suffix in retailers.items():
              key = "SCENTHUNTER_DISCOVERY_QUERIES_" + suffix
              queries = [item.strip() for item in os.environ.get(key, "").split(";") if item.strip()]
              print(key + "_COUNT=" + str(len(queries)))
              assert len(queries) >= 5, "Missing approved discovery query seeds for " + slug

          factory = make_session_factory()
          _schedule_daily_discovery(factory)
          session = factory()
          for slug in retailers:
              store_id = session.execute(
                  text("SELECT id::text FROM stores WHERE slug=:slug AND status='active'"),
                  {"slug": slug},
              ).scalar_one()
              count = session.execute(
                  text("""
                      SELECT count(*) FROM ingestion_queue_jobs
                      WHERE stage='discover'
                        AND payload->>'store_id'=:store_id
                        AND created_at >= now() - interval '10 minutes'
                  """),
                  {"store_id": store_id},
              ).scalar_one()
              print("DISCOVERY_JOBS_" + slug.upper().replace("-", "_") + "=" + str(count))
              assert count >= 1, "No PostgreSQL discovery job scheduled for " + slug
          session.close()
          PY
          )"
          encoded="$(printf '%s' "$python_script" | base64 -w0)"
          remote_command="sh -c 'cd /app/backend && echo $encoded | base64 -d | /app/.venv/bin/python'"
          flyctl machine exec "$machine_id" "$remote_command" --app scenthunter --timeout 60

      - name: Check Deloox discovered product URLs are re-queued unless already hydrated
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import ast
          import sqlite3
          from pathlib import Path

          source = Path("backend/catalog_engine.py").read_text(encoding="utf-8")
          tree = ast.parse(source)
          function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_deloox_persist_products")
          function_source = ast.get_source_segment(source, function)
          assert "transaction_batch_size = 25" in function_source, "Deloox writes must use bounded transaction chunks"
          assert "for chunk_start in range(0, len(items), transaction_batch_size)" in function_source, "Deloox writer lock must be released between chunks"
          statement = next(
              (
                  node.value.value
                  for node in ast.walk(function)
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "hydration_sql" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
                  and "INSERT INTO hydration_queue" in node.value.value
              ),
              None,
          )
          assert statement, "Deloox persistence must update the hydration queue"

          conn = sqlite3.connect(":memory:")
          conn.row_factory = sqlite3.Row
          conn.executescript("""
          CREATE TABLE hydration_queue(store TEXT,url TEXT,state TEXT,priority INTEGER NOT NULL DEFAULT 100,attempts INTEGER,available_at REAL,first_seen_at REAL,leased_until REAL,lease_token TEXT,last_error TEXT,last_http_status INTEGER,PRIMARY KEY(store,url));
          CREATE TABLE store_products(store TEXT,url TEXT,price REAL,fetched_at REAL,fetch_status TEXT,brand TEXT,size_ml REAL,gtin TEXT,sku TEXT,PRIMARY KEY(store,url));
          """)
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,last_error) VALUES('deloox','https://www.deloox.com/product/a','ERROR',3,9999999999,1,'timeout')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/b','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/c','PROCESSING',1,9999999999,1,9999999999,'lease-c')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at,last_error) VALUES('deloox','https://www.deloox.com/product/d','ERROR',1,9999999999,1,'parser')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/e','DONE',1,9999999999,1)")
          now = 1000.0
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/b',29.99,now-60,'OK','Brand',100,'12345670','sku-b'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/d',25.0,now-60,'OK','Brand',100,'12345670','sku-d'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/e',25.0,now-30*3600,'OK','Brand',100,'12345670','sku-e'))
          # A recent null-price row is only hydrated if its core identity is complete.
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/f','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO hydration_queue(store,url,state,attempts,available_at,first_seen_at) VALUES('deloox','https://www.deloox.com/product/g','DONE',1,9999999999,1)")
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/f',None,now-60,'OK','',150,'','1385920'))
          conn.execute("INSERT INTO store_products VALUES(?,?,?,?,?,?,?,?,?)", ('deloox','https://www.deloox.com/product/g',None,now-60,'OK','French Avenue',150,'','1385921'))

          def upsert(url):
              conn.execute(statement, ('deloox',url,'PENDING',0,now,now,now,now-24*3600,now-6*3600,now,now-24*3600,now-6*3600,now-24*3600,now-6*3600,now-24*3600,now-6*3600))

          for suffix in ('a','b','c','d','e','f','g'):
              upsert('https://www.deloox.com/product/'+suffix)

          states={row['url'].rsplit('/',1)[-1]:row for row in conn.execute("SELECT * FROM hydration_queue")}
          assert states['a']['state']=='PENDING' and states['a']['available_at'] <= now, states['a']
          assert states['b']['state']=='DONE', states['b']
          assert states['c']['state']=='PROCESSING' and states['c']['lease_token']=='lease-c', states['c']
          assert states['d']['state']=='DONE', states['d']
          assert states['e']['state']=='PENDING' and states['e']['available_at'] <= now, states['e']
          assert states['f']['state']=='PENDING' and states['f']['available_at'] <= now, states['f']
          assert states['g']['state']=='DONE', states['g']
          # Verify the bounded search-priority hint elevates a matching queue row.
          priority_function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "prioritize_hydration_candidates")
          priority_sql = next(
              (
                  node.value.value
                  for node in ast.walk(priority_function)
                  if isinstance(node, ast.Assign)
                  and any(isinstance(target, ast.Name) and target.id == "priority_sql" for target in node.targets)
                  and isinstance(node.value, ast.Constant)
                  and isinstance(node.value.value, str)
                  and "UPDATE hydration_queue" in node.value.value
              ),
              None,
          )
          claim_function = next(node for node in tree.body if isinstance(node, ast.FunctionDef) and node.name == "_claim_one_hydration_task")
          claim_sql = next(
              (
                  part.value
                  for node in ast.walk(claim_function)
                  if isinstance(node, ast.Call)
                  and isinstance(node.func, ast.Attribute)
                  and node.func.attr == "execute"
                  and node.args
                  for part in ast.walk(node.args[0])
                  if isinstance(part, ast.Constant)
                  and isinstance(part.value, str)
                  and "SELECT q.store,q.url,q.attempts" in part.value
              ),
              None,
          )
          assert priority_sql and claim_sql, "Query-priority update and hydration claim SQL must exist"
          assert "q.priority ASC" in claim_sql, "Hydration claims must take priority URLs first"
          conn.executescript("""
          CREATE TABLE store_urls(store TEXT,url TEXT,active INTEGER,PRIMARY KEY(store,url));
          """)
          conn.execute("INSERT INTO hydration_queue(store,url,state,priority,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/ordinary','PENDING',100,0,0,1,9999999999,'ordinary-lease')")
          conn.execute("INSERT INTO hydration_queue(store,url,state,priority,attempts,available_at,first_seen_at,leased_until,lease_token) VALUES('deloox','https://www.deloox.com/product/target','PENDING',100,0,0,1,9999999999,'target-lease')")
          conn.execute("INSERT INTO store_urls VALUES('deloox','https://www.deloox.com/product/ordinary',1)")
          conn.execute("INSERT INTO store_urls VALUES('deloox','https://www.deloox.com/product/target',1)")
          conn.execute(priority_sql, (0,'deloox','https://www.deloox.com/product/target'))
          chosen = conn.execute(claim_sql, ('deloox', now)).fetchone()
          assert chosen['url'].endswith('/target'), chosen
          print("Deloox search-priority regression test: PASS (query-selected URL claimed before general backlog)")
          print("Deloox hydration queue upsert regression test: PASS (ERROR requeued; DONE and live leases preserved; persisted OK respected)")
          PY

      - name: Install native libraries for backend test dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libxml2-dev libxslt1-dev zlib1g-dev

      - name: Install backend test dependencies
        run: python -m pip install -r backend/requirements.txt

      - name: Run bounded Deloox discovery regression tests
        working-directory: backend
        run: python -m unittest tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_deadline_skips_initial_fanout_when_expired tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_budget_rotates_query_and_limits_each_run tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_search_budget_reserves_time_for_frontier tests.test_parfumzentrum_hydration.CatalogHydrationTests.test_deloox_discovery_graph_reports_search_then_frontier_progress tests.test_deloox_out_of_stock.DelooxRegionalOfferPriorityTests tests.test_phase0_baseline_jobs -v

      - name: Exercise the canonical PostgreSQL search API
        if: ${{ !contains(github.event.head_commit.message, '[config-only-no-db]') }}
        timeout-minutes: 2
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          import urllib.parse
          import urllib.request

          base = "https://scenthunter.fly.dev"
          query = "Dior Sauvage"

          def get_json(path):
              request = urllib.request.Request(
                  base + path,
                  headers={"Accept": "application/json", "User-Agent": "ScentHunter-postgres-search-smoke/2.0"},
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  if response.status != 200:
                      raise RuntimeError(f"{path} returned HTTP {response.status}")
                  return json.loads(response.read().decode("utf-8"))

          status = get_json("/api/catalog/status")
          if status.get("status") != "ready":
              raise RuntimeError("Canonical PostgreSQL catalog is not ready: " + json.dumps(status))
          result = get_json("/api/catalog/search?q=" + urllib.parse.quote(query))
          if not isinstance(result.get("results"), list):
              raise RuntimeError("Canonical search returned an invalid results payload")
          for product in result["results"]:
              for offer in product.get("offers") or []:
                  if offer.get("currency") != "EUR" or not offer.get("url"):
                      raise RuntimeError("Canonical search exposed an invalid offer")
          print("PUBLIC_SEARCH_BACKEND=postgresql")
          print("PUBLIC_SEARCH_ROUTE=PASS")
          print("CANONICAL_API=PASS")
          print("PRODUCTS=" + str(len(result["results"])))
          print("PUBLISHED_OFFERS=" + str(result.get("offer_count", 0)))
          PY

      - name: Bootstrap first canonical Notino ingestion on PostgreSQL
        if: ${{ contains(github.event.head_commit.message, 'Notino PostgreSQL bootstrap') }}
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 18
        shell: bash
        run: |
          set -euo pipefail
          worker_id="$(flyctl machines list --app scenthunter --json | python -c 'import json,sys; rows=json.load(sys.stdin); matches=[m for m in rows if m.get("state")=="started" and (m.get("config",{}).get("metadata",{}).get("fly_process_group")=="worker")]; print(matches[0]["id"] if matches else "")')"
          if [[ -z "$worker_id" ]]; then
            echo "::error::No started PostgreSQL worker machine found."
            flyctl machines list --app scenthunter --json
            exit 1
          fi
          echo "Using PostgreSQL worker machine: $worker_id"
          flyctl machine status "$worker_id" --app scenthunter

          # This bootstrap waits for ingestion (up to 15 minutes). Fly Machine
          # Exec has a short foreground request deadline, so detach it and poll
          # a durable exit marker on the worker's persistent volume.
          remote_script="$(cat <<'REMOTE'
          set -eu
          mkdir -p /tmp
          rm -f /tmp/notino_postgres_bootstrap.exit /tmp/notino_postgres_bootstrap.log
          nohup /bin/sh -c '
            /app/.venv/bin/python /app/backend/scripts/bootstrap_notino_postgres.py
            result=$?
            echo "$result" > /tmp/notino_postgres_bootstrap.exit
          ' </dev/null >/tmp/notino_postgres_bootstrap.log 2>&1 &
          echo NOTINO_POSTGRES_BOOTSTRAP_STARTED
          REMOTE
          )"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl machine exec "$worker_id" "sh -c 'echo $encoded_script | base64 -d | sh'" --app scenthunter --timeout 30

          for attempt in $(seq 1 190); do
            poll="$(flyctl machine exec "$worker_id" "sh -c 'if [ -f /tmp/notino_postgres_bootstrap.exit ]; then echo NOTINO_BOOTSTRAP_EXIT=\$(cat /tmp/notino_postgres_bootstrap.exit); else echo NOTINO_BOOTSTRAP_RUNNING; fi'" --app scenthunter --timeout 30 2>&1)" || {
              echo "Notino PostgreSQL bootstrap poll failed ($attempt/190): $poll"
              sleep 5
              continue
            }
            printf '%s\\n' "$poll"
            if printf '%s\\n' "$poll" | grep -q 'NOTINO_BOOTSTRAP_EXIT=0'; then
              flyctl machine exec "$worker_id" "tail -n 100 /tmp/notino_postgres_bootstrap.log" --app scenthunter --timeout 30
              echo "NOTINO_POSTGRES_INGESTION=PASS"
              break
            fi
            if printf '%s\\n' "$poll" | grep -Eq 'NOTINO_BOOTSTRAP_EXIT=[1-9]'; then
              flyctl machine exec "$worker_id" "tail -n 160 /tmp/notino_postgres_bootstrap.log" --app scenthunter --timeout 30 || true
              exit 1
            fi
            if [ "$attempt" -eq 190 ]; then
              echo "Notino PostgreSQL bootstrap did not finish within 16 minutes." >&2
              flyctl machine exec "$worker_id" "tail -n 160 /tmp/notino_postgres_bootstrap.log" --app scenthunter --timeout 30 || true
              exit 1
            fi
            sleep 5
          done

          echo "=== POST-INGESTION WORKER LOGS ==="
          timeout 30s flyctl logs --app scenthunter --instance "$worker_id" --no-tail || true
