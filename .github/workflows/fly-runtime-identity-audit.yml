name: Fly read-only runtime SQLite inventory

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read SQLite schema without changing the database
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3; p=\"file:/data/store_catalog.sqlite3?mode=ro\"; c=sqlite3.connect(p, uri=True); c.execute(\"PRAGMA query_only=ON\"); print(\"TABLES\"); [print(r[0]) for r in c.execute(\"SELECT name FROM sqlite_master WHERE type IN (\\\"table\\\",\\\"view\\\") ORDER BY name\")]; print(\"SCHEMA\"); [print(r[0]) for r in c.execute(\"SELECT sql FROM sqlite_master WHERE sql IS NOT NULL ORDER BY type, name\")]; c.close()"'
