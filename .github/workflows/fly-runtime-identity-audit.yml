name: Fly read-only runtime SQLite inventory

on:
  workflow_dispatch:
    inputs:
      confirm_read_only:
        description: "Confirm read-only inspection of the production catalog"
        required: true
        type: choice
        options:
          - no
          - yes
        default: no

permissions:
  contents: read

jobs:
  inventory:
    if: ${{ inputs.confirm_read_only == 'yes' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read SQLite schema without changing the database
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'sqlite3 -readonly /data/store_catalog.sqlite3 ".tables"'
          flyctl ssh console --app scenthunter --select=false -C 'sqlite3 -readonly /data/store_catalog.sqlite3 ".schema"'
