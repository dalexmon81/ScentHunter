name: Fly read-only runtime SQLite identity audit

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect exact Profondo sizes and retailer identifiers (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True); c.row_factory=sqlite3.Row; c.execute(\"PRAGMA query_only=ON\"); rows=c.execute(\"SELECT store,url,name,brand,sku,gtin,mpn,size_ml,concentration,gender,price,currency,availability,fetch_status FROM store_products WHERE lower(name) LIKE ? AND (size_ml IN (75,125) OR lower(name) LIKE ? OR lower(name) LIKE ?) ORDER BY store,name LIMIT 100\",(\\\"%profondo%\\\",\\\"%125ml%\\\",\\\"%75ml%\\\")).fetchall(); print(json.dumps({\"database\":\"/data/store_catalog.sqlite3\",\"mode\":\"read_only\",\"query\":\"Profondo names with size_ml 75/125 or 75ml/125ml title\",\"rows\":[dict(r) for r in rows]},sort_keys=True)); c.close()"'