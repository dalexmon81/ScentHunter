name: Fly read-only runtime SQLite identity and Deloox audit

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect catalog identity references and Deloox inventory (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          # Read-only SQLite audit. Fail visibly on SSH timeout rather than
          # printing a success-shaped fallback and hiding missing evidence.
          timeout 180s flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import base64;exec(base64.b64decode(\"    uX19uYW1lX19fCnByaW50KGpzb24uZHVtcHMoeyJyZWFkX29ubHkiOlRydWUsImRhdGFiYXNlX211dGF0ZWQiOkZhbHNlLCJleGlzdGluZ19pZGVudGl0eV9yZXN1bHRzIjpvdXQsImRlbG9veF9pbnZlbnRvcnkiOmRlbG9veH0sZW5zdXJlX2FzY2lpPUZhbHNlKSkKYy5jbG9zZSgp\"))'"

      - name: Fingerprint deployed parser code (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          timeout 90s flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import hashlib,json;from pathlib import Path;root=Path(\"/app/backend\");files=[\"main.py\",\"catalog_engine.py\",\"scrapers/deloox/scraper.py\"];version=next((line.strip() for line in (root/\"main.py\").read_text().splitlines() if line.startswith(\"APP_VERSION\")),\"missing\");print(json.dumps({\"app_version\":version,\"git_blob_sha\":{p:hashlib.sha1(b\"blob \"+str(len((root/p).read_bytes())).encode()+b\"\\0\"+(root/p).read_bytes()).hexdigest() for p in files}},indent=2))'"
