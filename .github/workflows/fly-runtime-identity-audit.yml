name: Fly read-only runtime SQLite identity audit

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scan Armani names and URLs (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True); c.execute(\"PRAGMA query_only=ON\"); q=lambda s: chr(34)+s.replace(chr(34),chr(34)*2)+chr(34); out=[]; objs=c.execute(\"SELECT name,type FROM sqlite_master WHERE type IN (\\\"table\\\",\\\"view\\\") AND name NOT LIKE \\\"sqlite_%\\\" ORDER BY name\").fetchall(); exec(\"for name,typ in objs:\\n cols=[r[1] for r in c.execute(\\\"PRAGMA table_info(\\\"+q(name)+\\\")\\\")]\\n for col in cols:\\n  try:\\n   n=c.execute(\\\"SELECT COUNT(*) FROM \\\"+q(name)+\\\" WHERE lower(CAST(\\\"+q(col)+\\\" AS TEXT)) LIKE ?\\\",(\\\"%armani%\\\",)).fetchone()[0]\\n   if n:\\n    samples=c.execute(\\\"SELECT substr(CAST(\\\"+q(col)+\\\" AS TEXT),1,240) FROM \\\"+q(name)+\\\" WHERE lower(CAST(\\\"+q(col)+\\\" AS TEXT)) LIKE ? LIMIT 3\\\",(\\\"%armani%\\\",)).fetchall()\\n    out.append({\\\"table\\\":name,\\\"column\\\":col,\\\"count\\\":n,\\\"samples\\\":[r[0] for r in samples]})\\n  except sqlite3.Error: pass\"); print(json.dumps({\"database\":\"/data/store_catalog.sqlite3\",\"mode\":\"read_only\",\"objects_scanned\":len(objs),\"armani_text_matches\":out},sort_keys=True)); c.close()"'
