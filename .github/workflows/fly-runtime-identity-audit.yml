name: Fly read-only runtime SQLite identity audit

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Scan known identity references (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; ids=[\"SH-AUTO-0288\",\"SH-AUTO-0018\",\"SH-0043\",\"SH-AUTO-0019\",\"VAR-89c2a2a86bedb3c5\",\"VAR-09a73d0a5594cf49\",\"VAR-30ce093fd9e9ab47\",\"VAR-46b03c1f1cff0a6e\",\"VAR-f79ca5b3b5fd237f\",\"VAR-69fbeda0c7a3c691\",\"VAR-b6adcf86ddaab498\",\"VAR-d2e93b41952c6151\"]; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True); c.execute(\"PRAGMA query_only=ON\"); q=lambda s: chr(34)+s.replace(chr(34),chr(34)*2)+chr(34); out=[]; objs=c.execute(\"SELECT name,type FROM sqlite_master WHERE type IN (\\\"table\\\",\\\"view\\\") AND name NOT LIKE \\\"sqlite_%\\\" ORDER BY name\").fetchall(); exec(\"for name,typ in objs:\\n cols=[r[1] for r in c.execute(\\\"PRAGMA table_info(\\\"+q(name)+\\\")\\\")]\\n for col in cols:\\n  try:\\n   for ident in ids:\\n    n=c.execute(\\\"SELECT COUNT(*) FROM \\\"+q(name)+\\\" WHERE CAST(\\\"+q(col)+\\\" AS TEXT)=?\\\",(ident,)).fetchone()[0]\\n    if n: out.append({\\\"id\\\":ident,\\\"table\\\":name,\\\"column\\\":col,\\\"count\\\":n})\\n  except sqlite3.Error: pass\"); print(json.dumps({\"database\":\"/data/store_catalog.sqlite3\",\"mode\":\"read_only\",\"objects_scanned\":len(objs),\"matches\":out},sort_keys=True)); c.close()"'
