name: Fly read-only runtime SQLite identity audit

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect Acqua di Gio retailer rows and coverage (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C 'python3 -c "import sqlite3,json; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True); c.row_factory=sqlite3.Row; c.execute(\"PRAGMA query_only=ON\"); q=lambda s: chr(34)+s.replace(chr(34),chr(34)*2)+chr(34); out={}; exec(\"for table,needlecol,needle in [(\\\"store_products\\\",\\\"name\\\",\\\"acqua di gio\\\"),(\\\"catalog_coverage\\\",\\\"canonical_name\\\",\\\"acqua di gio\\\")]:\\n try:\\n  cols=[r[1] for r in c.execute(\\\"PRAGMA table_info(\\\"+q(table)+\\\")\\\")]\\n  if needlecol not in cols: out[table]={\\\"columns\\\":cols,\\\"error\\\":\\\"search column missing\\\"}; continue\\n  rows=c.execute(\\\"SELECT * FROM \\\"+q(table)+\\\" WHERE lower(CAST(\\\"+q(needlecol)+\\\" AS TEXT)) LIKE ? LIMIT 30\\\",(\\\"%\\\"+needle+\\\"%\\\",)).fetchall()\\n  out[table]={\\\"columns\\\":cols,\\\"row_count_sampled\\\":len(rows),\\\"rows\\\":[{k:r[k] for k in r.keys() if k in (\\\"id\\\",\\\"product_id\\\",\\\"variant_id\\\",\\\"store\\\",\\\"retailer\\\",\\\"name\\\",\\\"brand\\\",\\\"url\\\",\\\"price\\\",\\\"size\\\",\\\"volume\\\",\\\"canonical_name\\\",\\\"query\\\",\\\"status\\\",\\\"result\\\",\\\"updated_at\\\",\\\"created_at\\\")} for r in rows]}\\n except sqlite3.Error as e: out[table]={\\\"error\\\":str(e)}\"); print(json.dumps({\"database\":\"/data/store_catalog.sqlite3\",\"mode\":\"read_only\",\"tables\":out},sort_keys=True)); c.close()"'