name: Fly read-only runtime SQLite identity audit

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect Profondo retailer rows and runtime tables (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import base64;exec(base64.b64decode(\"\"))'"
