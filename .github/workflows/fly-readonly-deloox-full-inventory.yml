name: Fly read-only Deloox full inventory

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-full-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect Deloox database schema and aggregate counts (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import sqlite3,json,time; db=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True,timeout=5); db.row_factory=sqlite3.Row; db.execute(\"PRAGMA query_only=ON\"); store=\"deloox\"; now=time.time(); tables={r[\"name\"] for r in db.execute(\"SELECT name FROM sqlite_master WHERE type=\\\x27table\\\x27 AND name NOT LIKE \\\x27sqlite_%\\\x27\")}; targets=[\"store_urls\",\"store_products\",\"store_product_variants\",\"store_url_metadata\",\"hydration_queue\"]; out={\"read_only\":True,\"database_mutated\":False,\"store\":store,\"tables\":{}}; ident=lambda s:\"\\\"\"+s.replace(\"\\\"\",\"\\\"\\\"\")+ \"\\\"\"; exec(\"for table in targets:\\n if table not in tables:\\n  out[\\\"tables\\\"][table]={\\\"present\\\":False}; continue\\n cols=[r[\\\"name\\\"] for r in db.execute(\\\"PRAGMA table_info(\\\"+ident(table)+\\\")\\\")]\\n item={\\\"present\\\":True,\\\"columns\\\":cols}\\n if \\\"store\\\" not in cols: item[\\\"store_scoped_count\\\"]=None; out[\\\"tables\\\"][table]=item; continue\\n where=\\\" WHERE \\\"+ident(\\\"store\\\")+\\\"=?\\\"; args=(store,)\\n item[\\\"store_scoped_count\\\"]=db.execute(\\\"SELECT COUNT(*) FROM \\\"+ident(table)+where,args).fetchone()[0]\\n agg={}\\n for field in (\\\"fetch_status\\\",\\\"state\\\",\\\"availability\\\",\\\"last_http_status\\\"):\\n  if field in cols: agg[field+\\\"_counts\\\"]={str(r[0]):r[1] for r in db.execute(\\\"SELECT \\\"+ident(field)+\\\",COUNT(*) FROM \\\"+ident(table)+where+\\\" GROUP BY \\\"+ident(field),args)}\\n for field in (\\\"price\\\",\\\"price_num\\\"):\\n  if field in cols: agg[field+\\\"_non_null\\\"]=db.execute(\\\"SELECT COUNT(*) FROM \\\"+ident(table)+where+\\\" AND \\\"+ident(field)+\\\" IS NOT NULL\\\",args).fetchone()[0]\\n for field in (\\\"fetched_at\\\",\\\"last_finished_at\\\",\\\"last_started_at\\\"):\\n  if field in cols:\\n   agg[field+\\\"_min_max\\\"]=list(db.execute(\\\"SELECT MIN(\\\"+ident(field)+\\\"),MAX(\\\"+ident(field)+\\\") FROM \\\"+ident(table)+where,args).fetchone())\\n   for label,seconds in ((\\\"24h\\\",86400),(\\\"7d\\\",604800),(\\\"30d\\\",2592000)): agg[field+\\\"_last_\\\"+label]=db.execute(\\\"SELECT COUNT(*) FROM \\\"+ident(table)+where+\\\" AND CAST(\\\"+ident(field)+\\\" AS REAL)>=?\\\",args+(now-seconds,)).fetchone()[0]\\n item[\\\"aggregates\\\"]=agg; out[\\\"tables\\\"][table]=item\"); print(json.dumps(out,default=str)); db.close()'"
