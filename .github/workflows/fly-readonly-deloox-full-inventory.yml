name: Fly read-only Deloox full inventory

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-full-inventory.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Inspect Deloox database schema and aggregate counts (read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'exec(__import__(\"base64\").b64decode(\"\").decode())'"
