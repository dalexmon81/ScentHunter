name: Deloox branch live parser probe

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine

permissions:
  contents: read

jobs:
  branch-parser:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Check out dedicated branch
        uses: actions/checkout@v4
        with:
          ref: scenthunter-next-engine
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install requests beautifulsoup4
      - name: Parse current Deloox product pages with branch code
        run: |
          python - <<'PY'
          import json
          import requests
          from bs4 import BeautifulSoup
          from backend.scrapers.deloox import scraper
          
          targets = [
              ("https://www.deloox.com/product/1380881/chloe-le-parfum-parfum-150-ml.html", "Chloe Le Parfum"),
              ("https://www.deloox.be/produit/1009926/hermes-eau-de-pamplemousse-rose-eau-de-cologne-100-ml.html", "Hermes Eau de Pamplemousse Rose"),
          ]
          report = {"branch_parser": True, "database_mutated": False, "results": []}
          session = requests.Session()
          session.headers.update(scraper.HEADERS)
          for url, query in targets:
              row = {"url": url, "query": query}
              try:
                  response = session.get(url, timeout=(5, 15), allow_redirects=True)
                  row["http_status"] = response.status_code
                  row["final_url"] = response.url
                  row["bytes"] = len(response.content)
                  if response.ok:
                      parsed = scraper._product(response.url, response.text, query)
                      row["parsed"] = bool(parsed)
                      if parsed:
                          row["name"] = parsed.get("name")
                          row["brand"] = (parsed.get("source") or {}).get("source_brand")
                          row["price"] = (parsed.get("offer") or {}).get("price")
                          row["size_ml"] = ((parsed.get("attributes") or {}).get("size_ml") or {}).get("value")
                  else:
                      row["error"] = "non-200 response"
              except Exception as exc:
                  row["error"] = type(exc).__name__ + ": " + str(exc)
              report["results"].append(row)
          session.close()
          print(json.dumps(report, ensure_ascii=False))
          if any(not row.get("parsed") for row in report["results"]):
              raise SystemExit(1)
          
          PY
