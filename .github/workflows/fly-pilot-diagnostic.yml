name: Diagnose isolated ScentHunter pilot

on:
  push:
    branches:
      - refactor/catalog-first-architecture
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scent-hunter-pilot-diagnostics
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      FLY_APP: scenthunter-pilot-20261030
      PILOT_URL: https://scenthunter-pilot-20261030.fly.dev
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Validate pilot access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN" >&2; exit 1; }
          case "$FLY_API_TOKEN" in
            fm2_*) FLY_API_TOKEN="FlyV1 $FLY_API_TOKEN" ;;
          esac
          echo "::add-mask::$FLY_API_TOKEN"
          echo "FLY_API_TOKEN=$FLY_API_TOKEN" >> "$GITHUB_ENV"
          flyctl status --app "$FLY_APP"

      # Read-only inspection while the deploy pipeline is running.
      - name: Inspect machine, logs and SQLite catalog
        shell: bash
        run: |
          set -euo pipefail
          flyctl logs --app "$FLY_APP" --no-tail || true
          machine_json="$(flyctl machine list --app "$FLY_APP" --json)"
          printf '%s\\n' "$machine_json"
          machine_id="$(printf '%s' "$machine_json" | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0]["id"] if rows else "")')"
          test -n "$machine_id" || { echo "No pilot machine exists." >&2; exit 1; }
          state="$(printf '%s' "$machine_json" | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0].get("state","unknown") if rows else "unknown")')"
          if [ "$state" != "started" ]; then
            echo "PILOT_MACHINE_STATE=$state; starting the isolated machine for diagnosis."
            flyctl machine start "$machine_id" --app "$FLY_APP" || true
          fi
          for attempt in $(seq 1 12); do
            state="$(flyctl machine list --app "$FLY_APP" --json | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0].get("state","unknown") if rows else "unknown")')"
            echo "PILOT_MACHINE_STATE=$state"
            [ "$state" = "started" ] && break
            sleep 5
          done
          if [ "$state" != "started" ]; then
            flyctl logs --app "$FLY_APP" --no-tail -n 100 || true
            echo "Pilot machine did not start." >&2
            exit 1
          fi
          remote_script="$(cat <<'REMOTE'
          set -eu
          echo "SEED_EXIT=$(cat /data/catalog/catalog_seed.exit 2>/dev/null || echo NOT_FINISHED)"
          echo "SEED_PROCESSES:"
          ps -eo pid,ppid,stat,etime,args | grep -E "[s]eed_catalog|[a]lembic" || true
          echo "SEED_LOG_TAIL:"
          tail -n 120 /data/catalog/catalog_seed.log 2>/dev/null || true
          ls -lh /data/catalog
          echo "=== NOTINO SMOKE STATUS ==="
          echo "NOTINO_SMOKE_EXIT=$(cat /data/catalog/notino_smoke.exit 2>/dev/null || echo RUNNING)"
          tail -n 80 /data/catalog/notino_smoke.log 2>/dev/null || true
          echo "=== MEMORY (live ingestion follow-up) ==="
          cat /proc/meminfo | head -n 12 || true
          echo "=== ACTIVE PYTHON PROCESSES ==="
          for proc in /proc/[0-9]*/cmdline; do
            command="$(tr '\\000' ' ' < "$proc" 2>/dev/null || true)"
            case "$command" in *python*|*uvicorn*) echo "$proc $command" ;; esac
          done
          echo "=== SEED LOG ==="
          tail -n 100 /data/catalog/catalog_seed.log 2>/dev/null || true
          /app/.venv/bin/python - <<'PY'
          import os, sqlite3
          p = "/data/catalog/catalog.sqlite3"
          print("DB_EXISTS=" + str(os.path.exists(p)))
          if os.path.exists(p):
              db = sqlite3.connect(p)
              tables = {r[0] for r in db.execute("select name from sqlite_master where type='table'")}
              print("TABLES=" + ",".join(sorted(tables)))
              for table in ("brands", "fragrances", "product_variants", "stores", "offers", "ingestion_raw", "ingestion_runs"):
                  if table in tables:
                      print("COUNT_" + table.upper() + "=" + str(db.execute("select count(*) from " + table).fetchone()[0]))
              if "alembic_version" in tables:
                  print("ALEMBIC_VERSION=" + str(db.execute("select version_num from alembic_version").fetchone()))
          PY
          REMOTE
          )"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl machine exec "$machine_id" "sh -c 'echo $encoded_script | base64 -d | sh'" --app "$FLY_APP" --timeout 30

      - name: Check public health and catalog endpoints
        if: always()
        shell: bash
        run: |
          python - <<'PY'
          import urllib.request
          base = "https://scenthunter-pilot-20261030.fly.dev"
          for path in ("/health", "/api/catalog/status", "/api/catalog/search?q=French%20Avenue%20Liquid%20Brun%20EDP%20100ml"):
              try:
                  req = urllib.request.Request(base + path, headers={"Accept":"application/json","User-Agent":"ScentHunter-Pilot-Diagnostic/1.0"})
                  with urllib.request.urlopen(req, timeout=20) as response:
                      print(path, "HTTP", response.status, response.read(4000).decode("utf-8","replace"))
              except Exception as exc:
                  print(path, type(exc).__name__, str(exc))
          PY
