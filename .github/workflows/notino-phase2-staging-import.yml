name: Notino Phase 2 persistent staging import

on:
  push:
    branches:
      - feature/notino-cj-feed-ingestion-2026-11-10
    paths:
      - ".github/workflows/notino-phase2-staging-import.yml"
      - "backend/scripts/import_notino_phase2_persistent.py"
      - "backend/app/services/notino_phase2_adapter.py"
      - "backend/app/services/ingestion_persistence.py"
      - "backend/scripts/seed_catalog.py"
      - "backend/scripts/build_notino_match_candidates.py"
      - "backend/app/models/**"
  workflow_dispatch:
    inputs:
      confirm:
        description: Type import-notino-staging to write only to the isolated PR 726 staging volume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: notino-phase2-staging-import-v2
  cancel-in-progress: true

jobs:
  import:
    if: ${{ github.event_name == 'push' || inputs.confirm == 'import-notino-staging' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
      CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
      FLY_APP: scenthunter-pr726-staging
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/notino-cj-feed-ingestion-2026-11-10

      - name: Validate credentials and isolated target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          test -n "$CJ_HTTP_USERNAME"
          test -n "$CJ_HTTP_PASSWORD"
          echo "Validated required credentials without displaying their values."

      - name: Set up Python and download the authorized CJ feed
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download current Notino XML snapshot
        run: |
          set -euo pipefail
          python -m pip install -r backend/requirements.txt
          python -m backend.scripts.download_notino_cj_feed --output-dir /tmp/notino-feed
          XML="$(find /tmp/notino-feed -maxdepth 1 -type f -name "*.xml" -print -quit)"
          test -n "$XML"
          test -s "$XML"
          echo "NOTINO_XML_PATH=$XML" >> "$GITHUB_ENV"
          sha256sum "$XML"
          python - "$XML" <<'PY'
          import sys
          from pathlib import Path
          from backend.scripts.build_notino_match_candidates import iter_perfume_rows
          rows = list(iter_perfume_rows(Path(sys.argv[1])))
          hits = [r for r in rows if "liquid brun" in " ".join(str(r.get(k) or "") for k in ("title", "brand", "gtin", "id")).casefold()]
          print(f"NOTINO_FEED_ROWS={len(rows)} LIQUID_BRUN_MATCHES={len(hits)}")
          for row in hits[:10]:
              print({k: row.get(k) for k in ("id", "gtin", "brand", "title", "price", "sale_price", "availability", "link")})
          PY

      - name: Install Fly CLI and normalize isolated staging token
        shell: bash
        run: |
          set -euo pipefail
          normalized_token="$FLY_API_TOKEN"
          case "$normalized_token" in
            fm2_*) normalized_token="FlyV1 $normalized_token" ;;
          esac
          echo "::add-mask::$normalized_token"
          echo "FLY_API_TOKEN=$normalized_token" >> "$GITHUB_ENV"
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Select a running PR staging machine and confirm mounted data volume
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machine list --app "$FLY_APP" --json)"
          machine_id="$(printf '%s' "$machines" | jq -r '[.[] | select(.state == "started")][0].id // empty')"
          if [ -z "$machine_id" ]; then
            echo "::error::No started machine exists in the isolated staging app."
            exit 1
          fi
          status="$(flyctl machine status "$machine_id" --app "$FLY_APP")"
          if ! grep -Eq "Volume[[:space:]]*│[[:space:]]*vol_" <<< "$status"; then
            echo "::error::Selected staging machine does not report an attached persistent Fly volume."
            printf '%s\\n' "$status"
            exit 1
          fi
          echo "machine_id=$machine_id" >> "$GITHUB_OUTPUT"
          echo "Selected isolated staging machine $machine_id with /data volume mount."

      - name: Upload XML to isolated staging volume using Fly SFTP
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "mkdir -p /data/notino-phase2"
          REMOTE_TMP="/data/notino-phase2/notino-cj-feed-${GITHUB_RUN_ID}.xml"
          flyctl ssh sftp put "$NOTINO_XML_PATH" "$REMOTE_TMP" --app "$FLY_APP" --machine "$MACHINE_ID"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "test -s $REMOTE_TMP"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "mv -f $REMOTE_TMP /data/notino-phase2/notino-cj-feed.xml"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "sha256sum /data/notino-phase2/notino-cj-feed.xml"

      - name: Import into the dedicated persistent Phase 2 SQLite database
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python /app/backend/scripts/import_notino_phase2_persistent.py /data/notino-phase2/notino-cj-feed.xml --database /data/notino-phase2/catalog.sqlite3 --apply"

      - name: Re-import same snapshot and verify offer idempotency
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter-pr726-staging
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python /app/backend/scripts/import_notino_phase2_persistent.py /data/notino-phase2/notino-cj-feed.xml --database /data/notino-phase2/catalog.sqlite3 --apply"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python -c 'import sqlite3,json; c=sqlite3.connect(\"/data/notino-phase2/catalog.sqlite3\"); q=lambda s:c.execute(s).fetchone()[0]; out={\"offers\":q(\"select count(*) from offers o join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\"\"),\"history\":q(\"select count(*) from price_history h join offers o on o.id=h.offer_id join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\"\"),\"duplicates\":q(\"select count(*) from (select external_product_id from offers o join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\" group by external_product_id having count(*)>1)\")}; print(json.dumps(out)); assert out[\"offers\"]==83 and out[\"history\"]>=166 and out[\"duplicates\"]==0'"

      - name: Verify Phase 2 catalog-first Notino search
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          OUTPUT="$(flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python /app/backend/scripts/search_notino_phase2_catalog.py 'Liquid Brun' --database /data/notino-phase2/catalog.sqlite3 --limit 20")"
          printf '%s\\n' "$OUTPUT"
          python -c 'import json,sys; raw=sys.stdin.read(); start=raw.find("{"); end=raw.rfind("}"); assert start >= 0 and end > start, f"No JSON object in search output: {raw[-2000:]}"; d=json.loads(raw[start:end+1]); assert d["source"]=="notino_phase2_catalog_sqlite", d; assert d["live_scraping"] is False, d; assert d["count"]>0, d; assert any("liquid brun" in x["fragrance"].lower() for x in d["offers"]), d; print("PHASE2_NOTINO_SEARCH=PASS")' <<< "$OUTPUT"

      - name: Verify persisted database and offer uniqueness
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python -c 'import os,sqlite3,json; p=\"/data/notino-phase2/catalog.sqlite3\"; c=sqlite3.connect(p); q=lambda s:c.execute(s).fetchone()[0]; out={\"db_exists\":os.path.isfile(p),\"offers\":q(\"select count(*) from offers o join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\"\"),\"price_history\":q(\"select count(*) from price_history h join offers o on o.id=h.offer_id join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\"\"),\"duplicate_external_ids\":q(\"select count(*) from (select external_product_id from offers o join stores s on s.id=o.store_id where s.slug=\\\"notino-fr\\\" group by external_product_id having count(*)>1)\")}; print(json.dumps(out)); assert out[\"db_exists\"] and out[\"offers\"]>0 and out[\"price_history\"]>=out[\"offers\"] and out[\"duplicate_external_ids\"]==0'"
