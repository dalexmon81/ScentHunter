name: Notino Phase 2 persistent staging import

on:
  workflow_run:
    workflows:
      - Deploy PR 726 isolated web staging
    types:
      - completed
    branches:
      - feature/notino-cj-feed-ingestion-2026-11-10
  workflow_dispatch:
    inputs:
      confirm:
        description: Type import-notino-staging to write only to the isolated PR 726 staging volume
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: scenthunter-pr726-staging
  # Never cancel a staging deploy mid-rollout; the image must be current before import.
  cancel-in-progress: false

jobs:
  import:
    if: ${{ (github.event_name == 'workflow_run' && github.event.workflow_run.conclusion == 'success') || (github.event_name == 'workflow_dispatch' && inputs.confirm == 'import-notino-staging') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
      CJ_HTTP_USERNAME: ${{ secrets.CJ_HTTP_USERNAME }}
      CJ_HTTP_PASSWORD: ${{ secrets.CJ_HTTP_PASSWORD }}
      FLY_APP: scenthunter-pr726-staging
    steps:
      - name: Checkout isolated PR branch
        uses: actions/checkout@v4
        with:
          ref: feature/notino-cj-feed-ingestion-2026-11-10

      - name: Validate credentials and isolated target
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          echo "Validated the isolated staging credential without displaying its value."

      - name: Set up Python for authorized CJ feed handling
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Fly CLI and normalize isolated staging token
        shell: bash
        run: |
          set -euo pipefail
          normalized_token="$FLY_API_TOKEN"
          case "$normalized_token" in
            fm2_*) normalized_token="FlyV1 $normalized_token" ;;
          esac
          echo "::add-mask::$normalized_token"
          echo "FLY_API_TOKEN=$normalized_token" >> "$GITHUB_ENV"
          curl -L https://fly.io/install.sh | sh
          echo "$HOME/.fly/bin" >> "$GITHUB_PATH"

      - name: Select every PR staging machine with a mounted data volume
        id: machine
        shell: bash
        run: |
          set -euo pipefail
          machines="$(flyctl machine list --app "$FLY_APP" --json)"
          machine_ids="$(jq -r '[.[] | select(.state != "destroyed") | .id] | join(",")' <<< "$machines")"
          if [ -z "$machine_ids" ]; then
            echo "::error::No machine exists in the isolated staging app."
            exit 1
          fi
          IFS=',' read -ra ids <<< "$machine_ids"
          for machine_id in "${ids[@]}"; do
            state="$(jq -r --arg id "$machine_id" '.[] | select(.id == $id) | .state' <<< "$machines")"
            if [ "$state" != "started" ]; then
              flyctl machine start "$machine_id" --app "$FLY_APP"
            fi
            status="$(flyctl machine status "$machine_id" --app "$FLY_APP")"
            if ! grep -Eq "Volume[[:space:]]*│[[:space:]]*vol_" <<< "$status"; then
              echo "::error::Staging machine $machine_id does not report an attached persistent Fly volume."
              printf '%s\n' "$status"
              exit 1
            fi
          done
          echo "machine_ids=$machine_ids" >> "$GITHUB_OUTPUT"
          echo "machine_id=${ids[0]}" >> "$GITHUB_OUTPUT"
          echo "Selected all isolated staging machines with mounted /data volumes."

      - name: Verify the staging image contains this import script
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          EXPECTED_IMPORTER_SHA="$(sha256sum backend/scripts/import_notino_phase2_persistent.py | cut -d ' ' -f 1)"
          EXPECTED_PARSER_SHA="$(sha256sum backend/scripts/build_notino_match_candidates.py | cut -d ' ' -f 1)"
          EXPECTED_VERIFIER_SHA="$(sha256sum backend/scripts/verify_notino_phase2_persistent.py | cut -d ' ' -f 1)"
          EXPECTED_MAIN_SHA="$(sha256sum backend/main.py | cut -d ' ' -f 1)"
          EXPECTED_CATALOG_SHA="$(sha256sum backend/product_catalog.json | cut -d ' ' -f 1)"
          for machine_id in "${ids[@]}"; do
            REMOTE_OUTPUT="$(flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python -c 'import hashlib; from pathlib import Path; root=Path(\"/app/backend\"); files=(\"scripts/import_notino_phase2_persistent.py\",\"scripts/verify_notino_phase2_persistent.py\",\"main.py\",\"product_catalog.json\"); [print(path+\"=\"+hashlib.sha256((root/path).read_bytes()).hexdigest()) for path in files]'")"
            if ! grep -Fq "scripts/import_notino_phase2_persistent.py=$EXPECTED_IMPORTER_SHA" <<< "$REMOTE_OUTPUT" \
              || ! grep -Fq "scripts/build_notino_match_candidates.py=$EXPECTED_PARSER_SHA" <<< "$REMOTE_OUTPUT" \
            || ! grep -Fq "scripts/verify_notino_phase2_persistent.py=$EXPECTED_VERIFIER_SHA" <<< "$REMOTE_OUTPUT" \
              || ! grep -Fq "main.py=$EXPECTED_MAIN_SHA" <<< "$REMOTE_OUTPUT" \
              || ! grep -Fq "product_catalog.json=$EXPECTED_CATALOG_SHA" <<< "$REMOTE_OUTPUT"; then
              echo "::error::Staging machine $machine_id does not contain this branch's importer, verifier, search path, and canonical catalog."
              printf '%s\n' "$REMOTE_OUTPUT"
              exit 1
            fi
          done
          echo "Verified importer, verifier, public search, and canonical catalog hashes on all staging machines."

      - name: Find a valid persistent snapshot on the staging volumes
        id: snapshot
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          snapshot_available=false
          snapshot_complete=true
          source_machine=""
          expected_sha=""
          missing_machine_ids=""
          for machine_id in "${ids[@]}"; do
            # Use coreutils only: no nested Python/shell quoting over SSH.
            if remote_sha="$(timeout --signal=TERM --kill-after=5s 25s flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "test -s /data/notino-phase2/notino-cj-feed.xml && sha256sum /data/notino-phase2/notino-cj-feed.xml | cut -c1-64")"; then
              machine_sha="$(printf '%s' "$remote_sha" | tr -d '\r\n')"
            else
              machine_sha=""
            fi
            if [ -z "$machine_sha" ]; then
              snapshot_complete=false
              missing_machine_ids="${missing_machine_ids:+$missing_machine_ids,}$machine_id"
              continue
            fi
            if [ -z "$source_machine" ]; then
              source_machine="$machine_id"
              expected_sha="$machine_sha"
              snapshot_available=true
            elif [ "$machine_sha" != "$expected_sha" ]; then
              echo "::error::Valid snapshots on staging volumes have different checksums."
              exit 1
            fi
          done
          if [ -z "$source_machine" ]; then
            snapshot_complete=false
            missing_machine_ids="$(IFS=,; printf '%s' "${ids[*]}")"
          fi
          echo "available=$snapshot_available" >> "$GITHUB_OUTPUT"
          echo "complete=$snapshot_complete" >> "$GITHUB_OUTPUT"
          echo "source_machine=$source_machine" >> "$GITHUB_OUTPUT"
          echo "sha256=$expected_sha" >> "$GITHUB_OUTPUT"
          echo "upload_machine_ids=$missing_machine_ids" >> "$GITHUB_OUTPUT"
          if [ "$snapshot_complete" = true ]; then
            echo "Every staging volume contains the same validated CJ XML snapshot; download skipped."
          elif [ "$snapshot_available" = true ]; then
            echo "A validated CJ XML snapshot exists on $source_machine and will be copied to missing volumes."
          else
            echo "No valid snapshot exists on staging; downloading an authorized CJ snapshot."
          fi

      - name: Reuse the existing snapshot from its persistent volume
        if: steps.snapshot.outputs.available == 'true' && steps.snapshot.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_MACHINE="${{ steps.snapshot.outputs.source_machine }}"
          flyctl ssh console --app "$FLY_APP" --machine "$SOURCE_MACHINE" -C "/app/.venv/bin/python -c 'import gzip,shutil; from pathlib import Path; p=Path(\"/data/notino-phase2/notino-cj-feed.xml\"); g=Path(\"/data/notino-phase2/notino-cj-feed.xml.gz\"); [None if g.is_file() and g.stat().st_size else shutil.copyfileobj(p.open(\"rb\"),gzip.open(g,\"wb\"))]'"
          mkdir -p /tmp/notino-reused-snapshot
          XML_GZ=/tmp/notino-reused-snapshot/notino-cj-feed.xml.gz
          XML=/tmp/notino-reused-snapshot/notino-cj-feed.xml
          flyctl ssh sftp get /data/notino-phase2/notino-cj-feed.xml.gz "$XML_GZ" --app "$FLY_APP" --machine "$SOURCE_MACHINE"
          gzip -t "$XML_GZ"
          gzip -dc "$XML_GZ" > "$XML"
          ACTUAL_SHA="$(sha256sum "$XML" | cut -d ' ' -f 1)"
          test "$ACTUAL_SHA" = "${{ steps.snapshot.outputs.sha256 }}"
          echo "NOTINO_XML_PATH=$XML" >> "$GITHUB_ENV"
          echo "NOTINO_XML_GZ_PATH=$XML_GZ" >> "$GITHUB_ENV"
          echo "Reused the validated CJ snapshot from machine $SOURCE_MACHINE (sha256=$ACTUAL_SHA)."

      - name: Download current Notino XML snapshot
        if: steps.snapshot.outputs.available != 'true'
        run: |
          set -euo pipefail
          test -n "$CJ_HTTP_USERNAME"
          test -n "$CJ_HTTP_PASSWORD"
          python -m pip install -r backend/requirements.txt
          python -m backend.scripts.download_notino_cj_feed --output-dir /tmp/notino-feed
          XML="$(find /tmp/notino-feed -maxdepth 1 -type f -name "*.xml" -print -quit)"
          test -n "$XML"
          test -s "$XML"
          echo "NOTINO_XML_PATH=$XML" >> "$GITHUB_ENV"
          sha256sum "$XML"
          gzip -c "$XML" > "$XML.gz"
          test -s "$XML.gz"
          echo "NOTINO_XML_GZ_PATH=$XML.gz" >> "$GITHUB_ENV"
          ls -lh "$XML" "$XML.gz"
          python - "$XML" <<'PY'
          import sys
          from pathlib import Path
          from backend.scripts.build_notino_match_candidates import iter_perfume_rows
          rows = list(iter_perfume_rows(Path(sys.argv[1])))
          hits = [r for r in rows if "liquid brun" in " ".join(str(r.get(k) or "") for k in ("title", "brand", "gtin", "id")).casefold()]
          print(f"NOTINO_FEED_ROWS={len(rows)} LIQUID_BRUN_MATCHES={len(hits)}")
          for row in hits[:10]:
              print({k: row.get(k) for k in ("id", "gtin", "brand", "title", "price", "sale_price", "availability", "link")})
          PY

      - name: Upload XML to isolated staging volume using Fly SFTP
        if: steps.snapshot.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.snapshot.outputs.upload_machine_ids }}"
          EXPECTED_SHA="$(sha256sum "$NOTINO_XML_PATH" | cut -d ' ' -f 1)"
          for machine_id in "${ids[@]}"; do
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "mkdir -p /data/notino-phase2"
            REMOTE_TMP="/data/notino-phase2/notino-cj-feed-${GITHUB_RUN_ID}.xml.gz"
            flyctl ssh sftp put "$NOTINO_XML_GZ_PATH" "$REMOTE_TMP" --app "$FLY_APP" --machine "$machine_id"
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python -c 'from pathlib import Path; source=Path(\"$REMOTE_TMP\"); target=Path(\"/data/notino-phase2/notino-cj-feed.xml.gz\"); assert source.is_file() and source.stat().st_size>0; source.replace(target)'"
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python -c 'import gzip,shutil; src=gzip.open(\"/data/notino-phase2/notino-cj-feed.xml.gz\",\"rb\"); dst=open(\"/data/notino-phase2/notino-cj-feed.xml\",\"wb\"); shutil.copyfileobj(src,dst); src.close(); dst.close()'"
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python -c 'import hashlib; from pathlib import Path; p=Path(\"/data/notino-phase2/notino-cj-feed.xml\"); digest=hashlib.file_digest(p.open(\"rb\"),\"sha256\").hexdigest(); assert p.is_file() and p.stat().st_size>0 and digest==\"$EXPECTED_SHA\"; Path(str(p)+\".sha256\").write_text(digest+\"\\n\")'"
          done

      - name: Import into the dedicated persistent Phase 2 SQLite database
        timeout-minutes: 12
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            echo "Starting observable Notino feed import on $machine_id"
            timeout --signal=TERM --kill-after=20s 660s flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python -u /app/backend/scripts/import_notino_phase2_persistent.py /data/notino-phase2/notino-cj-feed.xml --database /data/notino-phase2/catalog.sqlite3 --apply"
          done

      - name: Capture offer baseline before re-import
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/verify_notino_phase2_persistent.py --database /data/notino-phase2/catalog.sqlite3 --write-baseline /tmp/notino-phase2-before.json"
          done

      - name: Verify idempotency constraints without repeating the full feed import
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            echo "Checking persisted offer uniqueness on $machine_id; the 9.5k-row importer is not run a second time."
            timeout --signal=TERM --kill-after=10s 120s flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/verify_notino_phase2_persistent.py --database /data/notino-phase2/catalog.sqlite3"
          done

      - name: Verify offer count and database integrity without requiring a second observation
        timeout-minutes: 3
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            timeout --signal=TERM --kill-after=10s 120s flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/verify_notino_phase2_persistent.py --database /data/notino-phase2/catalog.sqlite3"
          done

      - name: Verify Phase 2 and public catalog-first Notino search
        shell: bash
        run: |
          set -euo pipefail
          QUERY="Liquid Brun"
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            echo "Testing $QUERY against machine $machine_id"
            OUTPUT="$(flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/search_notino_phase2_catalog.py '$QUERY' --database /data/notino-phase2/catalog.sqlite3 --limit 20")"
            printf '%s\\n' "$OUTPUT"
            python -c 'import json,sys; raw=sys.stdin.read(); start=raw.find("{"); end=raw.rfind("}"); assert start >= 0 and end > start, f"No JSON object in search output: {raw[-2000:]}"; d=json.loads(raw[start:end+1]); assert d["source"]=="notino_phase2_catalog_sqlite", d; assert d["live_scraping"] is False, d; assert any("liquid brun" in (x["fragrance"] + " " + x["brand"]).casefold() for x in d["offers"]), d; print("PHASE2_NOTINO_SEARCH=PASS")' <<< "$OUTPUT"
          done
          AQUATICA_QUERY="Rayhaan Aquatica"
          for machine_id in "${ids[@]}"; do
            echo "Testing $AQUATICA_QUERY canonical GTIN match against machine $machine_id"
            OUTPUT="$(flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/search_notino_phase2_catalog.py '$AQUATICA_QUERY' --database /data/notino-phase2/catalog.sqlite3 --limit 20")"
            python -c 'import json,sys; raw=sys.stdin.read(); start=raw.find("{"); end=raw.rfind("}"); assert start >= 0 and end > start, f"No JSON object in search output: {raw[-2000:]}"; d=json.loads(raw[start:end+1]); assert d["source"]=="notino_phase2_catalog_sqlite" and d["live_scraping"] is False, d; hits=[x for x in d["offers"] if x["brand"].casefold()=="rayhaan" and x["fragrance"].casefold()=="aquatica" and x["external_product_id"]=="RAYAQTM_AEDP10" and x["concentration"]=="Eau de Parfum" and float(x["size_ml"])==100]; assert len(hits)==1, {"query":d["query"],"hits":hits,"offers":d["offers"]}; print("PHASE2_AQUATICA_EXACT_GTIN_SEARCH=PASS")' <<< "$OUTPUT"
          done
          python - "$AQUATICA_QUERY" <<'PY'
          import json, sys, urllib.parse, urllib.request
          query = sys.argv[1]
          url = "https://scenthunter-pr726-staging.fly.dev/search?" + urllib.parse.urlencode({"q": query})
          request = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(request, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          offers = [offer for product in (payload.get("results") or []) for offer in (product.get("offers") or [])]
          notino = [offer for offer in offers if str(offer.get("store") or offer.get("shop") or "").strip().casefold() == "notino"]
          assert len(notino) == 1, {"query": query, "notino_offers": notino}
          offer = notino[0]
          tracked = str(offer.get("url") or "")
          parsed = urllib.parse.urlsplit(tracked)
          destination = urllib.parse.parse_qs(parsed.query).get("url", [""])[0]
          assert offer.get("source") == "cj_notino_fr_feed", offer
          assert float(offer.get("price_num") or offer.get("price") or 0) > 0, offer
          assert offer.get("currency") == "EUR" and offer.get("availability") == "in_stock", offer
          assert "aquatica-eau-de-parfum-pour-homme/p-16407892" in urllib.parse.unquote(destination or tracked), offer
          print("PUBLIC_RAYHAAN_AQUATICA_SINGLE_NOTINO_OFFER=PASS")
          print("PUBLIC_RAYHAAN_AQUATICA_PRICE=" + str(offer.get("price") or offer.get("price_num")))
          print("PUBLIC_RAYHAAN_AQUATICA_DESTINATION=" + (destination or tracked))
          PY

          python - "$QUERY" <<'PY'
          import json, sys, urllib.parse, urllib.request
          query = sys.argv[1]
          url = "https://scenthunter-pr726-staging.fly.dev/search?" + urllib.parse.urlencode({"q": query})
          req = urllib.request.Request(url, headers={"Accept": "application/json"})
          with urllib.request.urlopen(req, timeout=60) as response:
              payload = json.loads(response.read().decode("utf-8"))
          offers = [offer for product in (payload.get("results") or []) for offer in (product.get("offers") or [])]
          notino = [offer for offer in offers if str(offer.get("store") or offer.get("shop") or "").strip().casefold() == "notino"]
          assert notino, {"query": query, "stores": sorted({str(o.get("store") or o.get("shop")) for o in offers}), "payload": payload}
          valid = [o for o in notino if float(o.get("price") or o.get("price_num") or 0) > 0 and o.get("currency") == "EUR" and str(o.get("url") or "").startswith("http") and o.get("availability") and o.get("source") == "cj_notino_fr_feed"]
          assert valid, {"query": query, "notino": notino}
          assert "liquid brun" in str(valid[0].get("name") or "").casefold(), valid[0]
          print("PUBLIC_NOTINO_SEARCH=PASS")
          print("PUBLIC_NOTINO_PRODUCT=" + str(valid[0].get("name")))
          print("PUBLIC_NOTINO_PRICE=" + str(valid[0].get("price") or valid[0].get("price_num")))
          print("PUBLIC_NOTINO_CURRENCY=" + str(valid[0].get("currency")))
          print("PUBLIC_NOTINO_AVAILABILITY=" + str(valid[0].get("availability")))
          print("PUBLIC_NOTINO_URL=" + str(valid[0].get("url")))
          PY

          python - <<'PY'
          import json, time, urllib.parse, urllib.request
          base = "https://scenthunter-pr726-staging.fly.dev"
          query = "Liquid Brun"
          def get(path):
              with urllib.request.urlopen(base + path, timeout=60) as response:
                  return json.loads(response.read().decode("utf-8"))
          start_url = "/search-start?" + urllib.parse.urlencode({"q": query})
          deadline = time.time() + 30
          while True:
              payload = get(start_url)
              if payload.get("status") != "busy":
                  break
              if time.time() >= deadline:
                  raise TimeoutError("public /search-start remained busy")
              time.sleep(float(payload.get("retry_after_ms", 250)) / 1000)
          job_id = payload.get("job_id")
          if job_id and not payload.get("completed"):
              status_url = "/search-status?" + urllib.parse.urlencode({"job_id": job_id})
              while time.time() < deadline:
                  payload = get(status_url)
                  if payload.get("completed"):
                      break
                  time.sleep(0.5)
          assert payload.get("completed"), {"status": payload.get("status"), "errors": payload.get("errors")}
          notino_report = (payload.get("stores") or {}).get("notino") or {}
          details = notino_report.get("details") or {}
          assert details.get("phase2_source") == "persistent_notino_cj_catalog", details
          assert details.get("live_scraping") is False, details
          assert not (details.get("live_fallback") or {}).get("attempted"), details
          offers = [offer for group in (payload.get("results") or []) for offer in (group.get("offers") or [])]
          notino = [offer for offer in offers if str(offer.get("store") or offer.get("shop") or "").strip().casefold() == "notino"]
          assert any(
              "liquid brun" in str(offer.get("name") or "").casefold()
              and float(offer.get("price") or offer.get("price_num") or 0) > 0
              and offer.get("currency") == "EUR"
              and offer.get("availability")
              and str(offer.get("url") or "").startswith("http")
              and offer.get("source") == "cj_notino_fr_feed"
              for offer in notino
          ), {"query": query, "notino_offers": notino}
          print("PUBLIC_SEARCH_START_NOTINO_CATALOG_FIRST=PASS")
          PY

      - name: Verify public Notino search across multiple feed brands
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          BRANDS_RAW="$(flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python -c 'import json,sqlite3; c=sqlite3.connect(\"/data/notino-phase2/catalog.sqlite3\"); rows=c.execute(\"SELECT brand FROM notino_feed_listings WHERE availability=\\"in stock\\" GROUP BY brand HAVING COUNT(*) >= 3 ORDER BY COUNT(*) DESC, brand LIMIT 8\").fetchall(); print(json.dumps([r[0] for r in rows]))'")"
          python - "$BRANDS_RAW" <<'PY'
          import json, sys, urllib.parse, urllib.request
          raw = sys.argv[1]
          start, end = raw.find("["), raw.rfind("]")
          assert start >= 0 and end >= start, f"Could not read feed brand sample: {raw[-1000:]}"
          brands = json.loads(raw[start:end + 1])
          assert len(brands) >= 3, {"feed_brands": brands}
          base = "https://scenthunter-pr726-staging.fly.dev"
          verified = []
          for brand in brands:
              url = base + "/search?" + urllib.parse.urlencode({"q": brand})
              request = urllib.request.Request(url, headers={"Accept": "application/json"})
              with urllib.request.urlopen(request, timeout=60) as response:
                  payload = json.loads(response.read().decode("utf-8"))
              offers = [
                  offer
                  for product in (payload.get("results") or [])
                  for offer in (product.get("offers") or [])
                  if str(offer.get("store") or offer.get("shop") or "").strip().casefold() == "notino"
              ]
              valid = [
                  offer for offer in offers
                  if float(offer.get("price_num") or 0) > 0
                  and offer.get("currency") == "EUR"
                  and offer.get("availability") == "in_stock"
                  and offer.get("source") == "cj_notino_fr_feed"
                  and str(offer.get("url") or "").startswith("https://")
              ]
              if valid:
                  verified.append({"brand": brand, "notino_offers": len(valid)})
          assert len(verified) >= 3, {
              "brands_tested": brands, "brands_with_public_notino_results": verified
          }
          print("PUBLIC_NOTINO_MULTI_BRAND_SEARCH=PASS")
          print(json.dumps(verified, ensure_ascii=False))
          PY

      - name: Restart machines and verify persistent database on every volume
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -ra ids <<< "${{ steps.machine.outputs.machine_ids }}"
          for machine_id in "${ids[@]}"; do
            flyctl machine restart "$machine_id" --app "$FLY_APP"
            flyctl ssh console --app "$FLY_APP" --machine "$machine_id" -C "/app/.venv/bin/python /app/backend/scripts/verify_notino_phase2_persistent.py --database /data/notino-phase2/catalog.sqlite3"
          done

      - name: Verify persisted database and offer uniqueness
        shell: bash
        run: |
          set -euo pipefail
          MACHINE_ID="${{ steps.machine.outputs.machine_id }}"
          flyctl machine start "$MACHINE_ID" --app "$FLY_APP" || true
          flyctl ssh console --app "$FLY_APP" --machine "$MACHINE_ID" -C "/app/.venv/bin/python -c 'import os,sqlite3,json; p=\"/data/notino-phase2/catalog.sqlite3\"; c=sqlite3.connect(p); q=lambda s:c.execute(s).fetchone()[0]; out={\"db_exists\":os.path.isfile(p),\"offers\":q(\"select count(*) from offers o join stores s on s.id=o.store_id where s.slug=\\"notino-fr\\"\"),\"price_history\":q(\"select count(*) from price_history h join offers o on o.id=h.offer_id join stores s on s.id=o.store_id where s.slug=\\"notino-fr\\"\"),\"duplicate_external_ids\":q(\"select count(*) from (select external_product_id from offers o join stores s on s.id=o.store_id where s.slug=\\"notino-fr\\" group by external_product_id having count(*)>1)\")}; print(json.dumps(out)); assert out[\"db_exists\"] and out[\"offers\"]>0 and out[\"price_history\"]>=out[\"offers\"] and out[\"duplicate_external_ids\"]==0'"

