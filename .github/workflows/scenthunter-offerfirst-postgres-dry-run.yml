name: ScentHunter Offer-First PostgreSQL import dry run

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenthunter-offerfirst-postgres-dry-run
  cancel-in-progress: false

jobs:
  dry-run:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
    steps:
      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Verify Fly access
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || {
            echo "::error::FLY_API_TOKEN repository secret is missing."
            exit 1
          }
          echo "Fly authentication is configured."

      - name: Verify immutable backup and run read-only importer dry-run
        shell: bash
        run: |
          set -euo pipefail
          remote_script="$(cat <<'SH'
          set -eu
          SOURCE="/data/migration-backups/phase2-catalog-20261121T100137Z.sqlite3"
          EXPECTED_SHA256="f93bfcf1fefe8be70b37de35ccc276a8626f9edc0473ac27fa6c14fa6cf45415"
          test -f "$SOURCE" || { echo "BACKUP_MISSING=1"; exit 1; }
          ACTUAL_SHA256="$(sha256sum "$SOURCE" | cut -d ' ' -f1)"
          echo "BACKUP_SHA256=$ACTUAL_SHA256"
          test "$ACTUAL_SHA256" = "$EXPECTED_SHA256" || {
            echo "BACKUP_CHECKSUM_MISMATCH=1"
            exit 1
          }
          test -n "${SCENTHUNTER_MIGRATION_TARGET_DATABASE_URL:-}" || {
            echo "MIGRATION_TARGET_SECRET_MISSING=1"
            exit 1
          }
          cd /app
          /app/.venv/bin/python backend/scripts/migrate_canonical_sqlite_to_postgres.py --source "$SOURCE"
          SH
          )"
          encoded_script="$(printf '%s' "$remote_script" | base64 -w0)"
          flyctl ssh console --app scenthunter --select=false -C "/bin/sh -lc 'echo $encoded_script | base64 -d | /bin/sh'"

      - name: Confirm no production cutover
        run: echo "DRY_RUN_ONLY=1; production runtime database was not switched."
