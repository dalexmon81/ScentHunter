name: Bplatz Liquid Brun offline verification

on:
  push:
    branches:
      - feat/phase2-bplatz-staging-pipeline
      - test/bplatz-real-canonical-matcher
    paths:
      - tests/test_bplatz_liquid_brun_fixture.py
      - backend/scrapers/bplatz/scraper.py
      - tests/fixtures/bplatz/liquid-brun-54015243419916.raw.html
      - tests/fixtures/bplatz/liquid-brun-54015243419916.meta.json
      - .github/workflows/bplatz-liquid-brun-offline-tests.yml

permissions:
  contents: read

jobs:
  offline-verification:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser test dependency
        run: python -m pip install beautifulsoup4 pytest requests
      - name: Verify committed fixture and run isolated SQLite tests
        run: python -m pytest -q -s tests/test_bplatz_liquid_brun_fixture.py
# Dedicated isolated matcher verification branch trigger.
