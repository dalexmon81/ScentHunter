name: Controlled legacy SQLite telemetry deploy

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scenthunter-production-diagnostic
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy pinned diagnostic build to Fly.io
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout the explicitly approved diagnostic source
        uses: actions/checkout@v4
        with:
          ref: c59abdca66c9f8fbaddd8bd9c58a24560706027f

      - name: Verify exact diagnostic source
        shell: bash
        run: |
          set -euo pipefail
          actual="$(git rev-parse HEAD)"
          expected="c59abdca66c9f8fbaddd8bd9c58a24560706027f"
          test "$actual" = "$expected"
          echo "Verified diagnostic commit: $actual"

      - name: Install Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@v1.5

      - name: Enable telemetry and deploy pinned diagnostic build
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          flyctl secrets set SCENTHUNTER_SQLITE_TXN_TELEMETRY=1 --app scenthunter
          flyctl deploy --remote-only --config fly.toml --app scenthunter
