name: Phase 0 - live retailer baseline (read-only)

on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Confirm production deploy and health checks succeeded
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")
          jq -e '
            [.jobs[].steps[] | select(.name == "Deploy ScentHunter") | .conclusion] == ["success"]
            and
            [.jobs[].steps[] | select(.name == "Verify production health and catalog API") | .conclusion] == ["success"]
          ' <<< "$jobs_json" >/dev/null

      - name: Reuse latest Phase 0 job, poll and validate its CSV
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SCENTHUNTER_BASELINE_URL" || -z "$SCENTHUNTER_BASELINE_TOKEN" ]]; then
            echo "::error::Phase 0 baseline URL or token secret is missing."
            exit 1
          fi

          suffix="/admin/phase0/baseline-report.csv"
          if [[ "$SCENTHUNTER_BASELINE_URL" == *"$suffix" ]]; then
            base_url="${SCENTHUNTER_BASELINE_URL%"$suffix"}"
          else
            base_url="${SCENTHUNTER_BASELINE_URL%/}"
          fi
          auth_header="Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN"

          echo "Checking the latest durable Phase 0 job before creating anything..."
          latest_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -H "$auth_header" -H "Accept: application/json" \
            --output phase0-latest.json --write-out '%{http_code}' \
            "$base_url/admin/phase0/baseline/latest")

          if [[ "$latest_http" == "200" ]]; then
            latest_payload=$(cat phase0-latest.json)
            job_id=$(jq -er '.job_id' <<< "$latest_payload")
            job_status=$(jq -er '.status' <<< "$latest_payload")
            echo "Reusing existing job_id=$job_id status=$job_status"
          elif [[ "$latest_http" == "404" ]]; then
            echo "No durable Phase 0 job exists; creating the first job."
            start_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -X POST -H "$auth_header" -H "Accept: application/json" \
              --output phase0-start.json --write-out '%{http_code}' \
              "$base_url/admin/phase0/baseline/start")
            [[ "$start_http" == "202" ]] || {
              echo "::error::Baseline start returned HTTP $start_http"
              cat phase0-start.json
              exit 1
            }
            start_payload=$(cat phase0-start.json)
            job_id=$(jq -er '.job_id' <<< "$start_payload")
            job_status=$(jq -er '.status' <<< "$start_payload")
            [[ "$job_status" == "queued" ]] || {
              echo "::error::Expected queued after POST /start, got $job_status"
              exit 1
            }
          else
            echo "::error::GET latest returned unexpected HTTP $latest_http"
            cat phase0-latest.json
            exit 1
          fi

          echo "PHASE0_JOB_ID=$job_id" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$job_status" == "failed" ]]; then
            echo "::error::Latest Phase 0 job is already failed:"
            jq '{job_id,status,error_message,error_traceback}' phase0-latest.json
            exit 1
          fi
          if [[ "$job_status" != "queued" && "$job_status" != "running" && "$job_status" != "completed" ]]; then
            echo "::error::Unexpected latest Phase 0 status: $job_status"
            jq . phase0-latest.json
            exit 1
          fi
          deadline=$((SECONDS + 1200))
          completed=false
          while [[ "$job_status" == "queued" || "$job_status" == "running" ]]; do
            (( SECONDS < deadline )) || break
            status_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -H "$auth_header" -H "Accept: application/json" \
              --output phase0-status.json --write-out '%{http_code}' \
              "$base_url/admin/phase0/baseline/status?job_id=$job_id")
            [[ "$status_http" == "200" ]] || {
              echo "::error::Status endpoint returned HTTP $status_http"
              cat phase0-status.json
              exit 1
            }
            status_payload=$(cat phase0-status.json)
            job_status=$(jq -er '.status' <<< "$status_payload")
            progress=$(jq -r '.progress // 0' <<< "$status_payload")
            heartbeat=$(jq -r '.heartbeat_at // "null"' <<< "$status_payload")
            processed=$(jq -r '.processed_stores // 0' <<< "$status_payload")
            total=$(jq -r '.total_stores // 11' <<< "$status_payload")
            echo "PHASE0_JOB_STATUS=$job_status progress=$progress stores=$processed/$total heartbeat_at=$heartbeat"

            case "$job_status" in
              queued|running) sleep 15 ;;
              completed) completed=true ;;
              failed)
                echo "::error::Phase 0 worker failed:"
                jq '{job_id,status,error,error_message,error_traceback}' <<< "$status_payload"
                exit 1
                ;;
              *)
                echo "::error::Unexpected Phase 0 job status: $job_status"
                jq . <<< "$status_payload"
                exit 1
                ;;
            esac
          done

          if [[ "$job_status" == "completed" ]]; then completed=true; fi
          [[ "$completed" == "true" ]] || {
            echo "::error::Phase 0 job did not complete before the 20-minute polling deadline."
            exit 1
          }

          echo "Downloading the latest completed CSV..."
          download_http=$(curl --silent --show-error --connect-timeout 10 --max-time 120 \
            -H "$auth_header" -H "Accept: text/csv" \
            --output phase-0-retailer-baseline.csv --write-out '%{http_code}' \
            "$base_url/admin/phase0/baseline/latest/download")
          [[ "$download_http" == "200" ]] || {
            echo "::error::Latest CSV download returned HTTP $download_http"
            exit 1
          }

          python3 - <<'PY'
          import csv
          import io
          from collections import Counter
          from pathlib import Path

          path = Path("phase-0-retailer-baseline.csv")
          text = path.read_bytes().decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text, newline=""))
          expected_header = [
              "store", "canonical_product_id", "brand", "fragrance",
              "concentration", "size_ml", "variant_type", "gtin",
              "external_product_id", "offer_url", "price", "currency",
              "availability", "captured_at", "source", "match_confidence",
              "is_valid_offer",
          ]
          if reader.fieldnames != expected_header:
              raise SystemExit("CSV schema mismatch: " + repr(reader.fieldnames))
          expected_stores = {
              "amazon_de", "amazon_fr", "bplatz", "deloox", "easycosmetic",
              "notino", "orioudh", "parfumcity", "parfumzentrum",
              "perfumemarket", "sabina",
          }
          rows = list(reader)
          counts = Counter(row["store"] for row in rows)
          missing = sorted(store for store in expected_stores if counts[store] == 0)
          if missing:
              raise SystemExit("CSV has no rows for required stores: " + repr(missing))
          unknown = set(counts) - expected_stores
          if unknown:
              raise SystemExit("CSV contains unknown stores: " + repr(sorted(unknown)))
          for store in ("amazon_de", "amazon_fr", "notino"):
              if counts[store] <= 0:
                  raise SystemExit(f"CSV has no real offer rows for {store}")
          if any(row["is_valid_offer"] not in {"true", "false"} for row in rows):
              raise SystemExit("CSV contains an invalid is_valid_offer value.")
          print("PHASE0_CSV_HEADER=PASS")
          print("PHASE0_CSV_ROWS=" + str(len(rows)))
          for store in sorted(expected_stores):
              print(f"PHASE0_STORE_ROWS_{store.upper()}={counts[store]}")
          PY
          echo "Phase 0 baseline CSV downloaded and validated for job $job_id."

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
