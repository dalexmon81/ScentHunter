name: Phase 0 - live retailer baseline (read-only)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fly Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Confirm production deploy and health checks succeeded
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")
          jq -e '
            [.jobs[].steps[] | select(.name == "Deploy ScentHunter") | .conclusion] == ["success"]
            and
            [.jobs[].steps[] | select(.name == "Verify production health and catalog API") | .conclusion] == ["success"]
          ' <<< "$jobs_json" >/dev/null

      - name: Download read-only baseline report
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BASELINE_URL_SET=$([[ -n "$SCENTHUNTER_BASELINE_URL" ]] && echo yes || echo no)"
          echo "BASELINE_TOKEN_SET=$([[ -n "$SCENTHUNTER_BASELINE_TOKEN" ]] && echo yes || echo no)"

          if [[ -z "$SCENTHUNTER_BASELINE_URL" ]]; then
            echo "::error::SCENTHUNTER_BASELINE_URL is missing from GitHub Secrets."
            exit 1
          fi
          if [[ -z "$SCENTHUNTER_BASELINE_TOKEN" ]]; then
            echo "::error::SCENTHUNTER_BASELINE_TOKEN is missing from GitHub Secrets."
            exit 1
          fi
          if [[ "$SCENTHUNTER_BASELINE_URL" != https://* ]]; then
            echo "::error::SCENTHUNTER_BASELINE_URL must be a complete HTTPS URL, not a relative path."
            exit 1
          fi

          max_attempts=12
          attempt=1
          downloaded=0
          while [[ "$attempt" -le "$max_attempts" ]]; do
            response_file="phase-0-baseline-response.tmp"
            set +e
            response_meta=$(curl --silent --show-error --connect-timeout 15 --max-time 240 \
              -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
              --output "$response_file" \
              --write-out 'HTTP_STATUS=%{http_code}\nFINAL_URL=%{url_effective}\n' \
              "$SCENTHUNTER_BASELINE_URL")
            curl_exit=$?
            set -e
            printf '%s\n' "$response_meta"
            http_status=$(printf '%s\n' "$response_meta" | sed -n 's/^HTTP_STATUS=//p' | tail -n 1)

            if [[ "$curl_exit" -eq 0 && "$http_status" == "200" ]]; then
              mv "$response_file" phase-0-retailer-baseline.csv
              downloaded=1
              break
            fi

            if [[ "$curl_exit" -eq 0 && "$http_status" == "503" ]]; then
              echo "Baseline coverage is incomplete; attempt $attempt/$max_attempts. The endpoint refused to emit a partial CSV:"
              cat "$response_file"
              rm -f "$response_file"
              if [[ "$attempt" -lt "$max_attempts" ]]; then
                sleep 60
                attempt=$((attempt + 1))
                continue
              fi
              echo "::error::Active retailer offers did not become complete within the 12-minute discovery window."
              exit 1
            fi

            case "$http_status" in
              401|403) echo "::error::HTTP $http_status: token missing or GitHub Secret does not match Fly SCENTHUNTER_BASELINE_TOKEN." ;;
              404) echo "::error::HTTP 404: endpoint is absent from the active Fly release, or the configured URL/path is wrong." ;;
              500) echo "::error::HTTP 500: internal error while generating the baseline CSV." ;;
              000|"") echo "::error::HTTP 000/timeout: baseline URL is wrong, the domain is unreachable, or the Fly app is unavailable. curl exit=$curl_exit." ;;
              *) echo "::error::HTTP $http_status: baseline endpoint returned an unexpected status. curl exit=$curl_exit." ;;
            esac
            [[ -f "$response_file" ]] && cat "$response_file"
            exit 1
          done

          if [[ "$downloaded" -ne 1 || ! -s phase-0-retailer-baseline.csv ]]; then
            echo "::error::No Phase 0 summary CSV was downloaded."
            exit 1
          fi

          python3 - <<'PY'
          import csv
          import io
          import sys
          from pathlib import Path

          path = Path("phase-0-retailer-baseline.csv")
          text = path.read_bytes().decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text, newline=""))
          expected_header = [
              "store", "indexed_url_count", "offer_count", "valid_price_count",
              "valid_price_pct", "valid_url_count", "valid_url_pct",
              "valid_stock_count", "valid_stock_pct", "ambiguous_match_count",
              "matched_count", "unresolved_match_count", "catalog_product_count",
              "catalog_variant_count", "offer_source_table",
          ]
          if reader.fieldnames != expected_header:
              print("::error::CSV does not match the Phase 0 summary schema.")
              print("Expected:", expected_header)
              print("Received:", reader.fieldnames)
              sys.exit(1)

          rows = list(reader)
          expected_stores = {
              "bplatz", "deloox", "easycosmetic", "notino", "orioudh",
              "parfumcity", "parfumzentrum", "perfumemarket", "sabina", "TOTAL",
          }
          stores = [row["store"] for row in rows]
          if len(stores) != len(set(stores)) or set(stores) != expected_stores:
              print("::error::CSV must contain exactly nine active retailers plus TOTAL.")
              print("Received:", stores)
              sys.exit(1)

          integer_fields = {
              "indexed_url_count", "offer_count", "valid_price_count",
              "valid_url_count", "valid_stock_count", "ambiguous_match_count",
              "matched_count", "unresolved_match_count", "catalog_product_count",
              "catalog_variant_count",
          }
          percentage_fields = {"valid_price_pct", "valid_url_pct", "valid_stock_pct"}
          for row in rows:
              for key in integer_fields:
                  value = int(row[key])
                  if value < 0:
                      raise ValueError(f"Negative {key} for {row['store']}")
              for key in percentage_fields:
                  value = float(row[key])
                  if not 0 <= value <= 100:
                      raise ValueError(f"Invalid {key} for {row['store']}")

          by_store = {row["store"]: row for row in rows}
          if int(by_store["notino"]["indexed_url_count"]) < 0:
              raise ValueError("Invalid Notino indexed URL count")
          print("PHASE0_ACTIVE_STORES=9")
          print("PHASE0_EXCLUDED_STORES=amazon_de,amazon_fr")
          print("PHASE0_NOTINO_INDEXED_URLS=" + by_store["notino"]["indexed_url_count"])
          print("PHASE0_NOTINO_VERIFIED_OFFERS=" + by_store["notino"]["offer_count"])
          print("PHASE0_OFFER_ROWS=" + str(sum(int(by_store[s]["offer_count"]) for s in expected_stores if s != "TOTAL")))
          PY

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
