name: Phase 0 - live retailer baseline (read-only)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fly Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: ${{ github.event.workflow_run.conclusion != 'cancelled' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm production deploy and health checks succeeded
        if: github.event_name != 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")
          jq -e '
            [.jobs[].steps[] | select(.name == "Deploy ScentHunter") | .conclusion] == ["success"]
            and
            [.jobs[].steps[] | select(.name == "Verify production health and catalog API") | .conclusion] == ["success"]
          ' <<< "$jobs_json" >/dev/null

      - name: Download read-only baseline report
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "BASELINE_URL_SET=$([[ -n "$SCENTHUNTER_BASELINE_URL" ]] && echo yes || echo no)"
          echo "BASELINE_TOKEN_SET=$([[ -n "$SCENTHUNTER_BASELINE_TOKEN" ]] && echo yes || echo no)"

          if [[ -z "$SCENTHUNTER_BASELINE_URL" ]]; then
            echo "::error::SCENTHUNTER_BASELINE_URL is missing from GitHub Secrets."
            exit 1
          fi
          if [[ -z "$SCENTHUNTER_BASELINE_TOKEN" ]]; then
            echo "::error::SCENTHUNTER_BASELINE_TOKEN is missing from GitHub Secrets."
            exit 1
          fi
          if [[ "$SCENTHUNTER_BASELINE_URL" != https://* ]]; then
            echo "::error::SCENTHUNTER_BASELINE_URL must be a complete HTTPS URL, not a relative path."
            exit 1
          fi

          set +e
          response_meta=$(curl --silent --show-error --connect-timeout 15 --max-time 240 \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            --output phase-0-retailer-baseline.csv \
            --write-out $'HTTP_STATUS=%{http_code}\\nFINAL_URL=%{url_effective}\\n' \
            "$SCENTHUNTER_BASELINE_URL")
          curl_exit=$?
          set -e
          printf '%s\\n' "$response_meta"
          http_status=$(printf '%s\\n' "$response_meta" | sed -n 's/^HTTP_STATUS=//p' | tail -n 1)
          if [[ "$curl_exit" -ne 0 || "$http_status" != "200" ]]; then
            case "$http_status" in
              401|403) echo "::error::HTTP $http_status: token missing or GitHub Secret does not match Fly SCENTHUNTER_BASELINE_TOKEN." ;;
              404) echo "::error::HTTP 404: endpoint is absent from the active Fly release, or the configured URL/path is wrong." ;;
              500) echo "::error::HTTP 500: internal error while generating the baseline CSV." ;;
              000|"") echo "::error::HTTP 000/timeout: baseline URL is wrong, the domain is unreachable, or the Fly app is unavailable. curl exit=$curl_exit." ;;
              *) echo "::error::HTTP $http_status: baseline endpoint returned an unexpected status. curl exit=$curl_exit." ;;
            esac
            exit 1
          fi

          python3 - <<'PY'
          import csv
          import io
          import sys
          from collections import Counter
          from pathlib import Path

          path = Path("phase-0-retailer-baseline.csv")
          text = path.read_bytes().decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text, newline=""))
          expected_header = [
              "store", "canonical_product_id", "canonical_variant_id", "brand",
              "fragrance", "concentration", "size_ml", "variant_type", "gtin",
              "external_product_id", "offer_url", "price", "currency",
              "availability", "captured_at", "source", "match_confidence",
              "match_status", "is_valid_offer", "baseline_scope", "excluded_stores",
          ]
          if reader.fieldnames != expected_header:
              print("::error::CSV is not the required offer-level schema.")
              print("Expected:", expected_header)
              print("Received:", reader.fieldnames)
              sys.exit(1)

          rows = list(reader)
          expected_stores = {
              "bplatz", "deloox", "easycosmetic", "notino", "orioudh",
              "parfumcity", "parfumzentrum", "perfumemarket", "sabina",
          }
          excluded_stores = {"amazon_de", "amazon_fr"}
          actual_stores = {row["store"] for row in rows}
          if actual_stores != expected_stores:
              print("::error::CSV must contain exactly the nine declared active retailers.")
              print("Expected:", sorted(expected_stores))
              print("Received:", sorted(actual_stores))
              sys.exit(1)
          if actual_stores & excluded_stores:
              print("::error::Temporarily excluded Amazon marketplaces appeared in the baseline.")
              sys.exit(1)
          if not rows:
              print("::error::Offer-level CSV contains no offer rows.")
              sys.exit(1)

          counts = Counter(row["store"] for row in rows)
          missing = sorted(store for store in expected_stores if counts[store] <= 0)
          if missing:
              print("::error::Active retailers must have real offer rows; zero-offer stores are not accepted.")
              print("Missing offers:", missing)
              sys.exit(1)

          seen = set()
          duplicates = []
          for line_number, row in enumerate(rows, start=2):
              if row["baseline_scope"] != "9_active_retailers":
                  raise ValueError(f"Unexpected baseline scope on CSV line {line_number}")
              if row["excluded_stores"] != "amazon_de;amazon_fr":
                  raise ValueError(f"Amazon exclusions not declared on CSV line {line_number}")
              if not row["offer_url"].startswith("https://"):
                  raise ValueError(f"Missing HTTPS offer URL on CSV line {line_number}")
              if row["is_valid_offer"] not in {"true", "false"}:
                  raise ValueError(f"Invalid is_valid_offer value on CSV line {line_number}")
              key = (
                  row["store"], row["offer_url"], row["external_product_id"],
                  row["gtin"], row["size_ml"], row["concentration"],
              )
              if key in seen:
                  duplicates.append((line_number, key))
              seen.add(key)
          if duplicates:
              print("::error::Duplicate retailer offers found.")
              print(duplicates[:10])
              sys.exit(1)

          print("PHASE0_ACTIVE_STORES=9")
          print("PHASE0_EXCLUDED_STORES=amazon_de,amazon_fr")
          print("PHASE0_OFFER_ROWS=" + str(len(rows)))
          print("PHASE0_OFFERS_BY_STORE=" + str(dict(sorted(counts.items()))))
          print("PHASE0_VALID_OFFERS=" + str(sum(row["is_valid_offer"] == "true" for row in rows)))
          PY

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
