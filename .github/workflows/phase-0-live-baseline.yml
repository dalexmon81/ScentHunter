name: Phase 0 - PostgreSQL live retailer baseline (read-only)

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/phase-0-live-baseline.yml
      - backend/app/api/phase0_baseline.py
      - backend/postgres_main.py

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Wait for the matching Fly deployment when runtime files changed
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          COMMIT="$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA")"
          RUNTIME_CHANGED="$(printf '%s' "$COMMIT" | jq -r '[.files[].filename] | any(startswith("backend/") or . == "fly.toml" or . == "Dockerfile")')"
          if [ "$RUNTIME_CHANGED" != "true" ]; then
            echo "No runtime files changed; auditing the current Fly release."
            exit 0
          fi
          for attempt in $(seq 1 90); do
            RUNS="$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?branch=main&per_page=100")"
            STATUS="$(printf '%s' "$RUNS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .status // "missing"')"
            CONCLUSION="$(printf '%s' "$RUNS" | jq -r --arg sha "$GITHUB_SHA" '[.workflow_runs[] | select(.name == "Fly Deploy" and .head_sha == $sha)] | first | .conclusion // ""')"
            echo "Fly Deploy: $STATUS / $CONCLUSION (attempt $attempt/90)"
            if [ "$STATUS" = "completed" ]; then
              [ "$CONCLUSION" = "success" ] || { echo "::error::Fly deployment failed."; exit 1; }
              exit 0
            fi
            sleep 10
          done
          echo "::error::Timed out waiting for Fly deployment."
          exit 1

      - name: Read the PostgreSQL catalog baseline from Fly production
        env:
          BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$BASELINE_TOKEN" || { echo "::error::SCENTHUNTER_BASELINE_TOKEN GitHub secret is missing."; exit 1; }
          HTTP="$(curl --silent --show-error --connect-timeout 10 --max-time 90 \
            -H "Authorization: Bearer $BASELINE_TOKEN" -H "Accept: application/json" \
            --output phase0-postgres-baseline.json --write-out '%{http_code}' \
            https://scenthunter.fly.dev/admin/phase0/postgres-baseline)"
          [ "$HTTP" = "200" ] || { echo "::error::PostgreSQL baseline endpoint returned HTTP $HTTP"; cat phase0-postgres-baseline.json; exit 1; }

      - name: Validate and summarize the nine-store snapshot
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          data = json.loads(Path("phase0-postgres-baseline.json").read_text())
          expected = {"bplatz", "deloox", "easycosmetic", "notino", "orioudh", "parfumcity", "parfumzentrum", "perfumemarket", "sabina"}
          stores = data.get("stores", [])
          names = {row.get("store") for row in stores}
          if data.get("report") != "phase0-postgresql-read-only" or data.get("database_backend") != "postgresql" or data.get("read_only") is not True:
              raise SystemExit("Unexpected report identity or database backend.")
          if names != expected or len(stores) != 9:
              raise SystemExit(f"Nine-store scope mismatch: {sorted(names)}")
          if sum(row.get("total_offers", 0) for row in stores) != data["totals"]["offers"]:
              raise SystemExit("Offer total does not reconcile.")
          if sum(row.get("publishable_offers", 0) for row in stores) != data["totals"]["publishable_offers"]:
              raise SystemExit("Publishable offer total does not reconcile.")
          lines = [
              "# Phase 0 — PostgreSQL live baseline",
              "",
              f"- Snapshot: {data['generated_at']}",
              f"- Catalog: {data['catalog']['brands']} brands, {data['catalog']['fragrances']} fragrances, {data['catalog']['variants']} variants",
              f"- Stores present: {data['totals']['stores_present']}/9",
              f"- Active stores: {data['totals']['active_stores']}",
              f"- Offers: {data['totals']['offers']} total, {data['totals']['active_offers']} active, {data['totals']['publishable_offers']} publishable",
              "",
              "| Store | DB status | Offers | Active | Publishable | Raw pending / promoted / rejected | Last successful sync |",
              "|---|---|---:|---:|---:|---:|---|",
          ]
          for row in stores:
              raw = row.get("raw_ingestion_by_status") or {}
              raw_summary = f"{raw.get('pending', 0)} / {raw.get('promoted', 0)} / {raw.get('rejected', 0)}"
              lines.append(f"| {row['store']} | {row['status']} | {row['total_offers']} | {row['active_offers']} | {row['publishable_offers']} | {raw_summary} | {row['last_successful_sync_at'] or '—'} |")
          gaps = [
              f"{row['store']}: database record missing" if not row['database_present']
              else f"{row['store']}: zero publishable offers"
              for row in stores if not row['database_present'] or row['publishable_offers'] == 0
          ]
          lines += ["", "## Coverage gaps", "", *(f"- {name}" for name in gaps)] if gaps else ["", "All nine stores have publishable offers."]

          lines += ["", "## Queue status", "", "| Stage | Status | Jobs |", "|---|---|---:|"]
          for item in data.get("queue", []):
              lines.append(f"| {item['stage']} | {item['status']} | {item['count']} |")
          Path("phase0-postgres-baseline.md").write_text("\n".join(lines) + "\n")
          with open(__import__("os").environ["GITHUB_STEP_SUMMARY"], "a") as f:
              f.write(Path("phase0-postgres-baseline.md").read_text())
          print("PHASE0_POSTGRES_BASELINE=PASS")
          print("PHASE0_STORES_PRESENT=" + str(data["totals"]["stores_present"]))
          print("PHASE0_OFFERS=" + str(data["totals"]["offers"]))
          print("PHASE0_PUBLISHABLE_OFFERS=" + str(data["totals"]["publishable_offers"]))
          PY

      - name: Upload the raw baseline and summary
        uses: actions/upload-artifact@v4
        with:
          name: phase0-postgres-live-baseline
          path: |
            phase0-postgres-baseline.json
            phase0-postgres-baseline.md
          retention-days: 30
