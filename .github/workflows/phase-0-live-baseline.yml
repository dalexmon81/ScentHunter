name: Phase 0 - live retailer baseline (read-only)

on:
  workflow_dispatch:
  workflow_run:
    workflows:
      - Fly Deploy
    types:
      - completed
    branches:
      - main

permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 22
    steps:
      - name: Confirm production deploy and health checks succeeded
        if: github.event_name == 'workflow_run'
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")
          jq -e '
            [.jobs[].steps[] | select(.name == "Deploy ScentHunter") | .conclusion] == ["success"]
            and
            [.jobs[].steps[] | select(.name == "Verify production health and catalog API") | .conclusion] == ["success"]
          ' <<< "$jobs_json" >/dev/null

      - name: Start and poll persistent Phase 0 baseline job
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SCENTHUNTER_BASELINE_URL" || -z "$SCENTHUNTER_BASELINE_TOKEN" ]]; then
            echo "::error::Phase 0 baseline URL or token secret is missing."
            exit 1
          fi

          suffix="/admin/phase0/baseline-report.csv"
          if [[ "$SCENTHUNTER_BASELINE_URL" == *"$suffix" ]]; then
            base_url="${SCENTHUNTER_BASELINE_URL%"$suffix"}"
          else
            base_url="${SCENTHUNTER_BASELINE_URL%/}"
          fi
          start_url="$base_url/admin/phase0/baseline/start"

          echo "Starting persistent Phase 0 baseline job..."
          start_payload=$(curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 20 \
            -X POST \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            -H "Accept: application/json" \
            "$start_url")
          echo "$start_payload" | jq .
          job_id=$(jq -er '.job_id | select(type == "string" and length > 0)' <<< "$start_payload")
          start_status=$(jq -er '.status' <<< "$start_payload")
          if [[ "$start_status" != "queued" ]]; then
            echo "::error::Expected queued job, received status=$start_status"
            exit 1
          fi
          echo "PHASE0_JOB_ID=$job_id" >> "$GITHUB_STEP_SUMMARY"

          status_url="$base_url/admin/phase0/baseline/status?job_id=$job_id"
          deadline=$((SECONDS + 1200))
          completed_payload=""
          while (( SECONDS < deadline )); do
            status_payload=$(curl --fail --silent --show-error \
              --connect-timeout 10 --max-time 20 \
              -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
              -H "Accept: application/json" \
              "$status_url")
            job_status=$(jq -er '.status' <<< "$status_payload")
            progress=$(jq -r '.progress // 0' <<< "$status_payload")
            processed=$(jq -r '.processed_stores // 0' <<< "$status_payload")
            total=$(jq -r '.total_stores // 11' <<< "$status_payload")
            echo "PHASE0_JOB_STATUS=$job_status progress=$progress stores=$processed/$total"

            case "$job_status" in
              queued|running)
                sleep 15
                ;;
              completed)
                completed_payload="$status_payload"
                break
                ;;
              failed)
                echo "::error::Phase 0 baseline worker failed:"
                jq '{job_id,status,error,duration_seconds}' <<< "$status_payload"
                exit 1
                ;;
              *)
                echo "::error::Unexpected Phase 0 job status: $job_status"
                jq . <<< "$status_payload"
                exit 1
                ;;
            esac
          done

          if [[ -z "$completed_payload" ]]; then
            echo "::error::Phase 0 baseline job exceeded the 20-minute polling deadline."
            exit 1
          fi

          processed=$(jq -r '.processed_stores // 0' <<< "$completed_payload")
          total=$(jq -r '.total_stores // 0' <<< "$completed_payload")
          if [[ "$processed" != "11" || "$total" != "11" ]]; then
            echo "::error::Worker did not process all 11 stores ($processed/$total)."
            exit 1
          fi

          download_url=$(jq -er '.download_url | select(type == "string" and length > 0)' <<< "$completed_payload")
          if [[ "$download_url" == /* ]]; then
            download_url="$base_url$download_url"
          fi
          echo "Downloading completed CSV artifact..."
          curl --fail --silent --show-error \
            --connect-timeout 10 --max-time 120 \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            -H "Accept: text/csv" \
            --output phase-0-retailer-baseline.csv \
            "$download_url"

          python3 - <<'PY'
          import csv
          import io
          from collections import Counter
          from pathlib import Path

          path = Path("phase-0-retailer-baseline.csv")
          text = path.read_bytes().decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text, newline=""))
          expected_header = [
              "store", "canonical_product_id", "brand", "fragrance",
              "concentration", "size_ml", "variant_type", "gtin",
              "external_product_id", "offer_url", "price", "currency",
              "availability", "captured_at", "source", "match_confidence",
              "is_valid_offer",
          ]
          if reader.fieldnames != expected_header:
              raise SystemExit(
                  "CSV schema mismatch. Expected " + repr(expected_header)
                  + "; received " + repr(reader.fieldnames)
              )
          expected_stores = {
              "amazon_de", "amazon_fr", "bplatz", "deloox", "easycosmetic",
              "notino", "orioudh", "parfumcity", "parfumzentrum",
              "perfumemarket", "sabina",
          }
          rows = list(reader)
          if not rows:
              raise SystemExit("CSV contains a header but no offer rows.")
          counts = Counter(row["store"] for row in rows)
          unknown = set(counts) - expected_stores
          if unknown:
              raise SystemExit("CSV contains unknown stores: " + repr(sorted(unknown)))
          if any(row["is_valid_offer"] not in {"true", "false"} for row in rows):
              raise SystemExit("CSV contains an invalid is_valid_offer value.")
          print("PHASE0_CSV_HEADER=PASS")
          print("PHASE0_CSV_ROWS=" + str(len(rows)))
          for store in sorted(expected_stores):
              print(f"PHASE0_STORE_ROWS_{store.upper()}={counts.get(store, 0)}")
          PY

          echo "Phase 0 baseline CSV downloaded and validated for job $job_id."
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
