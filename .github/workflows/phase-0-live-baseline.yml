name: Phase 0 - live retailer baseline (read-only)

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - .github/workflows/phase-0-live-baseline.yml
permissions:
  contents: read
  actions: read

jobs:
  baseline:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Confirm production deploy and health checks succeeded
        if: false
        env:
          GH_TOKEN: ${{ github.token }}
          PARENT_RUN_ID: ${{ github.event.workflow_run.id }}
        shell: bash
        run: |
          set -euo pipefail
          jobs_json=$(curl --fail --silent --show-error \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs/$PARENT_RUN_ID/jobs?per_page=100")
          jq -e '
            [.jobs[].steps[] | select(.name == "Deploy ScentHunter") | .conclusion] == ["success"]
            and
            [.jobs[].steps[] | select(.name == "Verify production health and catalog API") | .conclusion] == ["success"]
          ' <<< "$jobs_json" >/dev/null

      - name: Wait for this commit's Fly deployment before reading production
        if: ${{ github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PATH: ${{ github.event_path }}
          COMMIT_SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          backend_changed=$(jq -r '
            [(.head_commit.added // [])[], (.head_commit.modified // [])[], (.head_commit.removed // [])[]]
            | any(startswith("backend/") or startswith("fly.toml") or startswith("Dockerfile"))
          ' "$EVENT_PATH")
          if [[ "$backend_changed" != "true" ]]; then
            echo "No backend/deployment files changed; production deploy wait is not required."
            exit 0
          fi

          echo "Backend changed in this push; waiting for the matching Fly Deploy workflow."
          for attempt in $(seq 1 60); do
            runs=$(curl --fail --silent --show-error \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$COMMIT_SHA&event=push&per_page=100")
            deploy=$(jq -c '[.workflow_runs[] | select(.name == "Fly Deploy")] | first // empty' <<< "$runs")
            if [[ -n "$deploy" ]]; then
              status=$(jq -r '.status' <<< "$deploy")
              conclusion=$(jq -r '.conclusion // ""' <<< "$deploy")
              echo "Fly Deploy status=$status conclusion=$conclusion"
              if [[ "$status" == "completed" ]]; then
                [[ "$conclusion" == "success" ]] || {
                  echo "::error::Fly deployment did not succeed; refusing to run the production baseline."
                  exit 1
                }
                exit 0
              fi
            fi
            sleep 15
          done
          echo "::error::Timed out waiting for the Fly deployment for $COMMIT_SHA."
          exit 1

      - name: Reuse latest Phase 0 job, poll and validate its CSV
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$SCENTHUNTER_BASELINE_URL" || -z "$SCENTHUNTER_BASELINE_TOKEN" ]]; then
            echo "::error::Phase 0 baseline URL or token secret is missing."
            exit 1
          fi

          suffix="/admin/phase0/baseline-report.csv"
          if [[ "$SCENTHUNTER_BASELINE_URL" == *"$suffix" ]]; then
            base_url="${SCENTHUNTER_BASELINE_URL%"$suffix"}"
          else
            base_url="${SCENTHUNTER_BASELINE_URL%/}"
          fi
          auth_header="Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN"

          echo "Checking the latest durable Phase 0 job before creating anything..."
          latest_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
            -H "$auth_header" -H "Accept: application/json" \
            --output phase0-latest.json --write-out '%{http_code}' \
            "$base_url/admin/phase0/baseline/latest")

          start_new_job() {
            local reason="$1"
            echo "$reason"
            start_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -X POST -H "$auth_header" -H "Accept: application/json" \
              --output phase0-start.json --write-out '%{http_code}' \
              "$base_url/admin/phase0/baseline/start")
            [[ "$start_http" == "202" ]] || {
              echo "::error::Baseline start returned HTTP $start_http"
              cat phase0-start.json
              exit 1
            }
            start_payload=$(cat phase0-start.json)
            job_id=$(jq -er '.job_id' <<< "$start_payload")
            job_status=$(jq -er '.status' <<< "$start_payload")
            [[ "$job_status" == "queued" ]] || {
              echo "::error::Expected queued after POST /start, got $job_status"
              exit 1
            }
          }

          if [[ "$latest_http" == "200" ]]; then
            latest_payload=$(cat phase0-latest.json)
            previous_job_id=$(jq -er '.job_id' <<< "$latest_payload")
            previous_status=$(jq -er '.status' <<< "$latest_payload")
            if [[ "$previous_status" == "queued" || "$previous_status" == "running" ]]; then
              previous_status_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
                -H "$auth_header" -H "Accept: application/json" \
                --output phase0-previous-status.json --write-out '%{http_code}' \
                "$base_url/admin/phase0/baseline/status?job_id=$previous_job_id")
              [[ "$previous_status_http" == "200" ]] || {
                echo "::error::Could not safely inspect existing in-flight job (HTTP $previous_status_http); refusing to enqueue a duplicate."
                cat phase0-previous-status.json
                exit 1
              }
              previous_total=$(jq -r '.total_stores // 0' phase0-previous-status.json)
              if [[ "$previous_total" == "9" ]]; then
                job_id="$previous_job_id"
                job_status="$previous_status"
                echo "Reusing current-scope in-flight job_id=$job_id status=$job_status stores=$previous_total"
              else
                echo "Existing in-flight job has obsolete store scope ($previous_total); creating a fresh nine-store baseline."
                start_new_job "Starting a fresh Phase 0 baseline for the nine active retailers."
              fi
            else
              echo "Latest job is terminal (status=$previous_status); creating a fresh nine-store baseline."
              start_new_job "Starting a fresh Phase 0 baseline for the nine active retailers."
            fi
          elif [[ "$latest_http" == "404" ]]; then
            start_new_job "No durable Phase 0 job exists; creating the first job."
          else
            echo "::error::GET latest returned unexpected HTTP $latest_http"
            cat phase0-latest.json
            exit 1
          fi

          echo "PHASE0_JOB_ID=$job_id" >> "$GITHUB_STEP_SUMMARY"
          if [[ "$job_status" != "queued" && "$job_status" != "running" && "$job_status" != "completed" ]]; then
            echo "::error::Unexpected latest Phase 0 status: $job_status"
            jq . phase0-latest.json
            exit 1
          fi
          deadline=$((SECONDS + 3600))
          completed=false
          while [[ "$job_status" == "queued" || "$job_status" == "running" ]]; do
            (( SECONDS < deadline )) || break
            status_http=$(curl --silent --show-error --connect-timeout 10 --max-time 20 \
              -H "$auth_header" -H "Accept: application/json" \
              --output phase0-status.json --write-out '%{http_code}' \
              "$base_url/admin/phase0/baseline/status?job_id=$job_id")
            [[ "$status_http" == "200" ]] || {
              echo "::error::Status endpoint returned HTTP $status_http"
              cat phase0-status.json
              exit 1
            }
            status_payload=$(cat phase0-status.json)
            job_status=$(jq -er '.status' <<< "$status_payload")
            progress=$(jq -r '.progress // 0' <<< "$status_payload")
            heartbeat=$(jq -r '.heartbeat_at // "null"' <<< "$status_payload")
            processed=$(jq -r '.processed_stores // 0' <<< "$status_payload")
            total=$(jq -r '.total_stores // 9' <<< "$status_payload")
            echo "PHASE0_JOB_STATUS=$job_status progress=$progress stores=$processed/$total heartbeat_at=$heartbeat"

            case "$job_status" in
              queued|running) sleep 15 ;;
              completed) completed=true ;;
              failed)
                echo "::error::Phase 0 worker failed:"
                jq '{job_id,status,error,error_message,error_traceback}' <<< "$status_payload"
                exit 1
                ;;
              *)
                echo "::error::Unexpected Phase 0 job status: $job_status"
                jq . <<< "$status_payload"
                exit 1
                ;;
            esac
          done

          if [[ "$job_status" == "completed" ]]; then completed=true; fi
          [[ "$completed" == "true" ]] || {
            echo "::error::Phase 0 job did not complete before the 60-minute polling deadline."
            exit 1
          }

          echo "Downloading the latest completed CSV..."
          download_http=$(curl --silent --show-error --connect-timeout 10 --max-time 120 \
            -H "$auth_header" -H "Accept: text/csv" \
            --output phase-0-retailer-baseline.csv --write-out '%{http_code}' \
            "$base_url/admin/phase0/baseline/latest/download")
          [[ "$download_http" == "200" ]] || {
            echo "::error::Latest CSV download returned HTTP $download_http"
            exit 1
          }

          python3 - <<'PY'
          import csv
          import io
          import os
          from collections import Counter
          from pathlib import Path

          path = Path("phase-0-retailer-baseline.csv")
          text = path.read_bytes().decode("utf-8-sig")
          reader = csv.DictReader(io.StringIO(text, newline=""))
          expected_header = [
              "store", "catalog_product_count", "canonical_product_id", "brand", "fragrance",
              "concentration", "size_ml", "variant_type", "gtin",
              "external_product_id", "offer_url", "price", "currency",
              "availability", "captured_at", "source", "match_status", "match_confidence",
              "is_valid_offer", "store_status",
          ]
          if reader.fieldnames != expected_header:
              raise SystemExit("CSV schema mismatch: " + repr(reader.fieldnames))
          expected_stores = {
              "bplatz", "deloox", "easycosmetic", "notino", "orioudh",
              "parfumcity", "parfumzentrum", "perfumemarket", "sabina",
          }
          rows = list(reader)
          counts = Counter(row["store"] for row in rows)
          missing = sorted(store for store in expected_stores if counts[store] == 0)
          if missing:
              raise SystemExit("CSV has no rows for required stores: " + repr(missing))
          unknown = set(counts) - expected_stores
          if unknown:
              raise SystemExit("CSV contains unknown stores: " + repr(sorted(unknown)))
          offer_rows = [row for row in rows if row.get("source")]
          offer_counts = Counter(row["store"] for row in offer_rows)
          if offer_counts["notino"] <= 0:
              raise SystemExit("CSV has no real offer rows for notino")
          allowed_statuses = {"completed", "timeout", "failed", "skipped"}
          allowed_stock = {"in_stock", "out_of_stock", "preorder", "backorder", "limited_availability"}
          import re
          from urllib.parse import urlparse

          def valid_price(row):
              try:
                  amount = float(row.get("price", ""))
              except (TypeError, ValueError):
                  return False
              return amount > 0 and bool(re.fullmatch(r"[A-Z]{3}", row.get("currency", "")))

          def valid_url(row):
              try:
                  parsed = urlparse(row.get("offer_url", ""))
                  return parsed.scheme == "https" and bool(parsed.netloc)
              except ValueError:
                  return False

          catalog_counts = []
          for row in rows:
              try:
                  count = int(row.get("catalog_product_count") or 0)
                  if count > 0:
                      catalog_counts.append(count)
              except (TypeError, ValueError):
                  pass
          catalog_products = max(catalog_counts, default=0)

          summary_rows = []
          for store in sorted(expected_stores):
              offers = [row for row in offer_rows if row["store"] == store]
              n = len(offers)
              price_count = sum(valid_price(row) for row in offers)
              url_count = sum(valid_url(row) for row in offers)
              stock_count = sum(row.get("availability", "").strip().lower() in allowed_stock for row in offers)
              ambiguous = sum(row.get("match_status") == "ambiguous" for row in offers)
              summary_rows.append({
                  "store": store, "offer_count": n,
                  "valid_price_count": price_count,
                  "valid_price_pct": round(100 * price_count / n, 2) if n else 0,
                  "valid_url_count": url_count,
                  "valid_url_pct": round(100 * url_count / n, 2) if n else 0,
                  "valid_stock_count": stock_count,
                  "valid_stock_pct": round(100 * stock_count / n, 2) if n else 0,
                  "ambiguous_match_count": ambiguous,
              })

          total_offers = len(offer_rows)
          total_price = sum(valid_price(row) for row in offer_rows)
          total_url = sum(valid_url(row) for row in offer_rows)
          total_stock = sum(row.get("availability", "").strip().lower() in allowed_stock for row in offer_rows)
          total_ambiguous = sum(row.get("match_status") == "ambiguous" for row in offer_rows)
          summary_path = Path("phase-0-quality-summary.csv")
          with summary_path.open("w", newline="", encoding="utf-8") as handle:
              fields = list(summary_rows[0]) if summary_rows else []
              writer = csv.DictWriter(handle, fieldnames=fields)
              writer.writeheader()
              writer.writerows(summary_rows)

          report = Path("phase-0-quality-summary.md")
          with report.open("w", encoding="utf-8") as handle:
              handle.write("# Phase 0 — quality baseline\n\n")
              handle.write(f"- Canonical products in catalog: **{catalog_products}**\n")
              handle.write(f"- Persisted retailer offers: **{total_offers}**\n")
              handle.write(f"- Valid price: **{(100 * total_price / total_offers) if total_offers else 0:.2f}%** ({total_price}/{total_offers})\n")
              handle.write(f"- Valid HTTPS URL: **{(100 * total_url / total_offers) if total_offers else 0:.2f}%** ({total_url}/{total_offers})\n")
              handle.write(f"- Valid stock: **{(100 * total_stock / total_offers) if total_offers else 0:.2f}%** ({total_stock}/{total_offers})\n")
              handle.write(f"- Ambiguous matches: **{total_ambiguous}**\n\n")
              handle.write("| Store | Offers | Price valid | URL valid | Stock valid | Ambiguous |\n|---|---:|---:|---:|---:|---:|\n")
              for item in summary_rows:
                  handle.write(f"| {item['store']} | {item['offer_count']} | {item['valid_price_pct']:.2f}% | {item['valid_url_pct']:.2f}% | {item['valid_stock_pct']:.2f}% | {item['ambiguous_match_count']} |\n")
          with open(os.environ["GITHUB_STEP_SUMMARY"], "a", encoding="utf-8") as handle:
              handle.write(report.read_text(encoding="utf-8"))

          if any(row.get("store_status") not in allowed_statuses for row in rows):
              raise SystemExit("CSV contains an invalid store_status value.")
          if any(row["is_valid_offer"] not in {"true", "false"} for row in rows):
              raise SystemExit("CSV contains an invalid is_valid_offer value.")
          if any(row.get("match_status") not in {"matched", "ambiguous", "unresolved", ""} for row in offer_rows):
              raise SystemExit("CSV contains an invalid match_status value.")
          print("PHASE0_CSV_HEADER=PASS")
          print("PHASE0_CSV_ROWS=" + str(len(rows)))
          print(f"PHASE0_CATALOG_PRODUCTS={catalog_products}")
          print(f"PHASE0_TOTAL_OFFERS={total_offers}")
          print(f"PHASE0_AMBIGUOUS_MATCHES={total_ambiguous}")
          for item in summary_rows:
              print(f"PHASE0_STORE_{item['store'].upper()}_OFFERS={item['offer_count']}")
          PY
          echo "Phase 0 baseline CSV downloaded and validated for job $job_id."

      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: |
            phase-0-retailer-baseline.csv
            phase-0-quality-summary.csv
            phase-0-quality-summary.md
          if-no-files-found: error
          retention-days: 30
