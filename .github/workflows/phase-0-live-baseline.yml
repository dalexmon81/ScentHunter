name: Phase 0 - live retailer baseline (read-only)

on:
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - backend/main.py
      - .github/workflows/phase-0-live-baseline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scent-hunter-phase-0-live-baseline-http
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download read-only baseline report
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCENTHUNTER_BASELINE_URL" || { echo "Missing SCENTHUNTER_BASELINE_URL secret" >&2; exit 1; }
          test -n "$SCENTHUNTER_BASELINE_TOKEN" || { echo "Missing SCENTHUNTER_BASELINE_TOKEN secret" >&2; exit 1; }
          http_code=$(curl --silent --show-error \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            "$SCENTHUNTER_BASELINE_URL" \
            -o phase-0-retailer-baseline.csv -w '%{http_code}')
          echo "Baseline endpoint HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Endpoint returned an error response:"
            head -c 1000 phase-0-retailer-baseline.csv || true
            exit 1
          fi
          test -s phase-0-retailer-baseline.csv
          header=$(head -n 1 phase-0-retailer-baseline.csv | tr -d '\r')
          test "$header" = 'store,total_offers,offers_with_valid_price,offers_with_valid_url,offers_with_valid_availability,offers_matched_to_canonical_product,offers_with_recent_capture,stale_offers,invalid_offers'
          # Reject malformed/truncated CSV files and require at least one data row.
          python - <<'PY'
          import csv
          from pathlib import Path
          path = Path("phase-0-retailer-baseline.csv")
          with path.open(newline="", encoding="utf-8-sig") as handle:
              rows = list(csv.DictReader(handle))
          required = {
              "store", "total_offers", "offers_with_valid_price",
              "offers_with_valid_url", "offers_with_valid_availability",
              "offers_matched_to_canonical_product",
              "offers_with_recent_capture", "stale_offers", "invalid_offers",
          }
          if not rows or not required.issubset(rows[0]):
              raise SystemExit("CSV is empty or missing required fields")
          stores = [row["store"] for row in rows]
          if len(stores) != len(set(stores)):
              raise SystemExit("Duplicate store rows detected")
          for row in rows:
              for key in required - {"store"}:
                  try:
                      value = int(row[key])
                  except (TypeError, ValueError):
                      raise SystemExit(f"Invalid integer in {key} for {row['store']}")
                  if value < 0:
                      raise SystemExit(f"Negative metric in {key} for {row['store']}")
          print(f"Validated CSV rows: {len(rows)}")
          print(f"Stores: {', '.join(stores)}")
          PY
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
