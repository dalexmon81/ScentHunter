name: Phase 0 - live retailer baseline (read-only)

on:
  push:
    branches:
      - refactor/catalog-first-architecture
    paths:
      - backend/main.py
      - .github/workflows/phase-0-live-baseline.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: scent-hunter-phase-0-live-baseline-http
  cancel-in-progress: false

jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Download read-only baseline report
        env:
          SCENTHUNTER_BASELINE_URL: ${{ secrets.SCENTHUNTER_BASELINE_URL }}
          SCENTHUNTER_BASELINE_TOKEN: ${{ secrets.SCENTHUNTER_BASELINE_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SCENTHUNTER_BASELINE_URL" || { echo "Missing SCENTHUNTER_BASELINE_URL secret" >&2; exit 1; }
          test -n "$SCENTHUNTER_BASELINE_TOKEN" || { echo "Missing SCENTHUNTER_BASELINE_TOKEN secret" >&2; exit 1; }
          http_code=$(curl --silent --show-error \
            -H "Authorization: Bearer $SCENTHUNTER_BASELINE_TOKEN" \
            "$SCENTHUNTER_BASELINE_URL" \
            -o phase-0-retailer-baseline.csv -w '%{http_code}')
          echo "Baseline endpoint HTTP status: $http_code"
          if [ "$http_code" != "200" ]; then
            echo "Endpoint returned an error response:"
            head -c 1000 phase-0-retailer-baseline.csv || true
            exit 1
          fi
          test -s phase-0-retailer-baseline.csv
          header=$(head -n 1 phase-0-retailer-baseline.csv | tr -d '\r')
          test "$header" = 'store,offer_count,valid_price_count,valid_price_pct,valid_url_count,valid_url_pct,valid_stock_count,valid_stock_pct,ambiguous_match_count,matched_count,unresolved_match_count,catalog_product_count,catalog_variant_count,offer_source_table'
          python - <<'PY'
          import csv
          from pathlib import Path
          with Path("phase-0-retailer-baseline.csv").open(newline="", encoding="utf-8-sig") as handle:
              reader = csv.DictReader(handle)
              rows = list(reader)
          fields = set(reader.fieldnames or [])
          required = {
              "store", "offer_count", "valid_price_count", "valid_price_pct",
              "valid_url_count", "valid_url_pct", "valid_stock_count",
              "valid_stock_pct", "ambiguous_match_count", "matched_count",
              "unresolved_match_count", "catalog_product_count",
              "catalog_variant_count", "offer_source_table",
          }
          if not rows or not required.issubset(fields):
              raise SystemExit("CSV is empty or missing required fields")
          expected = {
              "bplatz", "deloox", "parfumcity", "parfumzentrum",
              "perfumemarket", "sabina", "orioudh", "easycosmetic", "notino", "TOTAL",
          }
          stores = [row["store"] for row in rows]
          if len(stores) != len(set(stores)):
              raise SystemExit("Duplicate store rows detected")
          if set(stores) != expected:
              raise SystemExit(f"Expected exactly nine active retailers plus TOTAL; got {stores}")
          integer_fields = {
              "offer_count", "valid_price_count", "valid_url_count",
              "valid_stock_count", "ambiguous_match_count", "matched_count",
              "unresolved_match_count", "catalog_product_count", "catalog_variant_count",
          }
          percentage_fields = {"valid_price_pct", "valid_url_pct", "valid_stock_pct"}
          for row in rows:
              for key in integer_fields:
                  try:
                      value = int(row[key])
                  except (TypeError, ValueError):
                      raise SystemExit(f"Invalid integer in {key} for {row['store']}")
                  if value < 0:
                      raise SystemExit(f"Negative metric in {key} for {row['store']}")
              for key in percentage_fields:
                  try:
                      value = float(row[key])
                  except (TypeError, ValueError):
                      raise SystemExit(f"Invalid percentage in {key} for {row['store']}")
                  if not 0 <= value <= 100:
                      raise SystemExit(f"Out-of-range percentage in {key} for {row['store']}")
          print(f"Validated retailer rows: {len(rows) - 1}")
          print(f"Stores: {', '.join(store for store in stores if store != 'TOTAL')}")
          PY
      - name: Upload CSV report
        uses: actions/upload-artifact@v4
        with:
          name: scenthunter-phase-0-live-baseline
          path: phase-0-retailer-baseline.csv
          if-no-files-found: error
          retention-days: 30
