name: Phase 0 - worker smoke test (retired)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  retired:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - name: Explain retirement
        shell: bash
        run: |
          echo "::error::This legacy smoke test enqueues jobs through endpoints that are not exposed by the active PostgreSQL runtime."
          echo "No production request was sent. A PostgreSQL-native smoke test requires a separately reviewed implementation."
          exit 1
