name: Fly read-only Deloox freshness audit v2

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-freshness-v2.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect Deloox offer freshness (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import sqlite3,json; c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True,timeout=5); c.row_factory=sqlite3.Row; c.execute(\"PRAGMA query_only=ON\"); p=(\"deloox\",); out={\"read_only\":True,\"database_mutated\":False,\"store\":\"deloox\",\"products_total\":c.execute(\"SELECT COUNT(*) FROM store_products WHERE store=?\",p).fetchone()[0],\"fetch_status_counts\":{str(r[0]):r[1] for r in c.execute(\"SELECT fetch_status,COUNT(*) FROM store_products WHERE store=? GROUP BY fetch_status\",p)},\"products_with_price\":c.execute(\"SELECT COUNT(*) FROM store_products WHERE store=? AND price IS NOT NULL\",p).fetchone()[0],\"products_with_availability\":c.execute(\"SELECT COUNT(*) FROM store_products WHERE store=? AND availability IS NOT NULL\",p).fetchone()[0],\"fetched_at_min_max\":list(c.execute(\"SELECT MIN(fetched_at),MAX(fetched_at) FROM store_products WHERE store=?\",p).fetchone()),\"variants_total\":c.execute(\"SELECT COUNT(*) FROM store_product_variants WHERE store=?\",p).fetchone()[0],\"hydration_state_counts\":{str(r[0]):r[1] for r in c.execute(\"SELECT state,COUNT(*) FROM hydration_queue WHERE store=? GROUP BY state\",p)},\"queue_latest_finished\":c.execute(\"SELECT MAX(last_finished_at) FROM hydration_queue WHERE store=?\",p).fetchone()[0],\"queue_latest_started\":c.execute(\"SELECT MAX(last_started_at) FROM hydration_queue WHERE store=?\",p).fetchone()[0],\"queue_with_error\":c.execute(\"SELECT COUNT(*) FROM hydration_queue WHERE store=? AND length(last_error)>0\",p).fetchone()[0],\"http_status_counts\":{str(r[0]):r[1] for r in c.execute(\"SELECT last_http_status,COUNT(*) FROM hydration_queue WHERE store=? GROUP BY last_http_status\",p)}}; print(json.dumps(out)); c.close()'"
