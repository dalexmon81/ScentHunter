name: Fly read-only Deloox freshness audit v2

on:
  workflow_dispatch:
  push:
    branches:
      - scenthunter-next-engine
    paths:
      - ".github/workflows/fly-readonly-deloox-freshness-v2.yml"

permissions:
  contents: read

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Install flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Inspect Deloox offer freshness (SQLite read-only)
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl ssh console --app scenthunter --select=false -C "python3 -c 'import sqlite3,json,time
c=sqlite3.connect(\"file:/data/store_catalog.sqlite3?mode=ro\",uri=True,timeout=5)
c.execute(\"PRAGMA query_only=ON\")
p=(\"deloox\",)
q=lambda sql,args=p:c.execute(sql,args).fetchone()[0]
out={\"read_only\":True,\"database_mutated\":False,\"store\":\"deloox\"}
out[\"products_total\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=?\")
out[\"fetch_ok\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=? AND fetch_status=?\",p+(\"OK\",))
out[\"http_404\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=? AND fetch_status LIKE ?\",p+(\"ERROR:RuntimeError: HTTP 404%\",))
out[\"parser_not_found\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=? AND fetch_status LIKE ?\",p+(\"%product_parser_not_found%\",))
out[\"products_with_price\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=? AND price IS NOT NULL\")
out[\"products_with_availability\"]=q(\"SELECT COUNT(*) FROM store_products WHERE store=? AND availability IS NOT NULL\")
out[\"fetched_at_min_max\"]=list(c.execute(\"SELECT MIN(fetched_at),MAX(fetched_at) FROM store_products WHERE store=?\",p).fetchone())
now=time.time()
buckets={0:\"UNKNOWN\",1:\"LAST_24_HOURS\",2:\"LAST_7_DAYS\",3:\"LAST_30_DAYS\",4:\"OLDER_THAN_30_DAYS\"}
raw=c.execute(\"SELECT CASE WHEN fetched_at IS NULL THEN 0 WHEN fetched_at>=? THEN 1 WHEN fetched_at>=? THEN 2 WHEN fetched_at>=? THEN 3 ELSE 4 END,COUNT(*) FROM store_products WHERE store=? GROUP BY 1\",(now-86400,now-604800,now-2592000,\"deloox\")).fetchall()
out[\"freshness_buckets\"]={buckets[r[0]]:r[1] for r in raw}
out[\"hydration_state_counts\"]={str(r[0]):r[1] for r in c.execute(\"SELECT state,COUNT(*) FROM hydration_queue WHERE store=? GROUP BY state\",p)}
out[\"queue_http_status_counts\"]={str(r[0]):r[1] for r in c.execute(\"SELECT last_http_status,COUNT(*) FROM hydration_queue WHERE store=? GROUP BY last_http_status\",p)}
out[\"queue_latest_finished\"]=q(\"SELECT MAX(last_finished_at) FROM hydration_queue WHERE store=?\")
out[\"queue_latest_started\"]=q(\"SELECT MAX(last_started_at) FROM hydration_queue WHERE store=?\")
out[\"queue_with_error\"]=q(\"SELECT COUNT(*) FROM hydration_queue WHERE store=? AND length(last_error)>0\")
print(json.dumps(out))
c.close()'"
