name: Deloox.be single-product read-only verification

on:
  push:
    branches: [ops/deloox-be-offline-completion]
    paths:
      - ".github/workflows/deloox-be-single-live-pilot.yml"

permissions:
  contents: read

concurrency:
  group: deloox-be-readonly-live-check
  cancel-in-progress: true

jobs:
  verify-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Read one Deloox.be product page without touching Neon
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine list --app scenthunter --json > machines.json
          WORKER_ID="$(python - <<'PY'
          import json
          with open("machines.json", encoding="utf-8") as handle:
              machines = json.load(handle)
          workers = [
              machine for machine in machines
              if machine.get("state") == "started"
              and machine.get("config", {}).get("metadata", {}).get("fly_process_group") == "worker"
          ]
          if not workers:
              raise SystemExit("No already-started ScentHunter worker found; refusing to start or deploy one")
          print(workers[0]["id"])
          PY
          )"
          echo "Using already-started worker: $WORKER_ID"

          cat > remote_check.py <<'PY'
          import os
          import requests
          from scrapers.deloox import scraper

          PRODUCT_URL = "https://www.deloox.be/produit/1379345/rasasi-hawas-fire-eau-de-parfum-100-ml.html"
          EXPECTED_PRODUCT_ID = "/produit/1379345/"

          os.environ["PLAYWRIGHT_BROWSERS_PATH"] = "/ms-playwright"
          browser = "/ms-playwright/chromium-1091/chrome-linux/chrome"
          if not os.path.isfile(browser):
              raise RuntimeError("Chromium is missing from the deployed /ms-playwright image path")

          with requests.Session() as http:
              record = scraper.extract_product_page(
                  http, PRODUCT_URL,
                  query="Rasasi Hawas Fire Eau de Parfum 100 ml",
              )

          if not isinstance(record, dict):
              raise RuntimeError("Deloox product page returned no valid record")

          connector_data = {
              "name": record.get("name"),
              "brand": record.get("brand"),
              "concentration": record.get("concentration"),
              "size_ml": record.get("size_ml"),
              "price": record.get("price_num"),
              "currency": record.get("currency"),
              "availability": record.get("availability"),
              "gtin": record.get("gtin"),
              "url": record.get("url"),
          }
          print("DELOOX_LIVE_EVIDENCE=" + repr(connector_data), flush=True)

          if str(record.get("brand") or "").strip().casefold() != "rasasi":
              raise RuntimeError("Live brand did not match Rasasi")
          if "hawas fire" not in str(record.get("name") or "").casefold():
              raise RuntimeError("Live product name did not match Hawas Fire")
          if record.get("size_ml") != 100:
              raise RuntimeError("Live page did not confirm the 100 ml variant")
          if record.get("concentration") != "Eau de Parfum":
              raise RuntimeError("Live page did not confirm Eau de Parfum")
          if record.get("availability") != "in_stock":
              raise RuntimeError("Live source did not explicitly confirm in-stock availability")
          price = float(record.get("price_num") or 0)
          if price <= 0:
              raise RuntimeError("Live source returned no valid positive price")
          if EXPECTED_PRODUCT_ID not in str(record.get("url") or ""):
              raise RuntimeError("Parsed URL did not match the approved Deloox product")
          raw = record.get("raw_data") if isinstance(record.get("raw_data"), dict) else {}
          jsonld = raw.get("jsonld") if isinstance(raw.get("jsonld"), dict) else {}
          offers = jsonld.get("offers")
          offers = offers if isinstance(offers, list) else [offers]
          explicit_eur = any(
              isinstance(item, dict) and str(item.get("priceCurrency") or "").upper() == "EUR"
              for item in offers
          )
          if not explicit_eur:
              raise RuntimeError("Live source did not explicitly confirm EUR in JSON-LD")
          print("DELOOX_LIVE_VERIFICATION=PASS", flush=True)
          PY

          ENCODED="$(base64 -w0 remote_check.py)"
          REMOTE_SCRIPT="cd /app/backend && printf '%s' '$ENCODED' | base64 -d | /app/.venv/bin/python"
          printf -v REMOTE_COMMAND '/bin/sh -lc %q' "$REMOTE_SCRIPT"

          ATTEMPT=1
          while [ "$ATTEMPT" -le 3 ]; do
            set +e
            OUTPUT="$(timeout 45s flyctl ssh console --app scenthunter --machine "$WORKER_ID" --pty=false --quiet -C "$REMOTE_COMMAND" 2>&1)"
            STATUS=$?
            set -e
            printf '%s\n' "$OUTPUT"
            if [ "$STATUS" -eq 0 ] && grep -q "DELOOX_LIVE_VERIFICATION=PASS" <<< "$OUTPUT"; then
              exit 0
            fi
            if [ "$ATTEMPT" -lt 3 ]; then
              echo "SSH attempt $ATTEMPT did not complete; retrying once after a short pause."
              sleep 5
            fi
            ATTEMPT=$((ATTEMPT + 1))
          done

          echo "::error::Deloox read-only live verification did not reach PASS after three bounded SSH attempts."
          exit 1
