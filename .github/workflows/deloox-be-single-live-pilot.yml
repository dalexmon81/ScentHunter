name: Deloox.be single-product live ingestion pilot

on:
  push:
    branches: [ops/deloox-be-single-live-pilot]
    paths:
      - ".github/workflows/deloox-be-single-live-pilot.yml"

permissions:
  contents: read

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Set up Fly CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fetch one verified Deloox.be product and run canonical ingestion
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          flyctl machine list --app scenthunter --json > machines.json
          WORKER_ID="$(python - <<'PY'
          import json
          with open("machines.json", encoding="utf-8") as handle:
              machines = json.load(handle)
          workers = [
              machine for machine in machines
              if machine.get("state") == "started"
              and machine.get("config", {}).get("metadata", {}).get("fly_process_group") == "worker"
          ]
          if not workers:
              raise SystemExit("No started ScentHunter worker machine found")
          print(workers[0]["id"])
          PY
          )"
          echo "Selected worker machine: $WORKER_ID"

          # The deployed worker image has Playwright installed but this machine
          # is missing its matching Chromium build. Install only the pinned
          # browser runtime before making the single Deloox product request.
          flyctl machine exec "$WORKER_ID" "sh -lc '/app/.venv/bin/playwright install chromium'" --app scenthunter --timeout 300

          SCRIPT="$(cat <<'PY'
          from uuid import UUID
          import re
          import requests
          from sqlalchemy import text

          from app.db import make_session_factory
          from app.models import Store
          from app.connectors.legacy_scrapers import LegacyScraperConnector
          from app.offers.ingestion import persist_connector_record
          from app.repositories.ingestion_runs import (
              start_ingestion_run,
              record_ingestion_progress,
              finish_ingestion_run,
          )
          from app.workers.notino_runtime import _matcher
          from scrapers.deloox import scraper

          STORE_ID = UUID("c88a7ce4-b453-4247-9af8-6b5b04abfddf")
          PRODUCT_URL = "https://www.deloox.be/produit/1379345/rasasi-hawas-fire-eau-de-parfum-100-ml.html"
          EXPECTED_PRODUCT_ID = "/produit/1379345/"
          factory = make_session_factory()

          with factory() as session:
              store = session.get(Store, STORE_ID)
              if store is None or store.slug != "deloox-be" or store.status != "active":
                  raise RuntimeError("Deloox.be canonical store is missing or inactive")
              existing = session.execute(text("""
                  SELECT count(*) FROM offers
                  WHERE store_id=:store_id
                    AND external_product_id=:external_id
                    AND status='active'
              """), {
                  "store_id": str(STORE_ID),
                  "external_id": PRODUCT_URL,
              }).scalar_one()
              if existing:
                  print("DELOOX_ALREADY_HAS_ACTIVE_PILOT_OFFER=" + str(existing))
                  raise SystemExit(0)

          # Use the existing Deloox parser's normal product-page path.
          # It makes one direct request and uses its built-in headless render
          # fallback only when the HTTP response is an incomplete interstitial.
          # No search, sitemap, retries, paid proxy, or other retailer is used.
          with requests.Session() as http:
              record = scraper.extract_product_page(
                  http, PRODUCT_URL,
                  query="Rasasi Hawas Fire Eau de Parfum 100 ml",
              )

          if not isinstance(record, dict):
              raise RuntimeError("The single live Deloox product page returned no valid record")

          connector = LegacyScraperConnector("deloox", scraper)
          parsed = connector.parse_raw(record)
          observed = {
              "name": record.get("name"),
              "brand": record.get("brand"),
              "concentration": record.get("concentration"),
              "size_ml": record.get("size_ml"),
              "price": record.get("price_num"),
              "currency": parsed.get("currency"),
              "currency_explicit": parsed.get("currency_explicit"),
              "availability": record.get("availability"),
              "gtin": record.get("gtin"),
              "url": record.get("url"),
          }
          print("DELOOX_LIVE_EVIDENCE=" + repr(observed))

          if str(record.get("brand") or "").strip().casefold() != "rasasi":
              raise RuntimeError("Live brand did not match Rasasi")
          if "hawas fire" not in str(record.get("name") or "").casefold():
              raise RuntimeError("Live product name did not match Hawas Fire")
          if record.get("size_ml") != 100:
              raise RuntimeError("Live page did not confirm the 100 ml variant")
          if record.get("concentration") != "Eau de Parfum":
              raise RuntimeError("Live page did not confirm Eau de Parfum")
          if parsed.get("currency") != "EUR" or parsed.get("currency_explicit") is not True:
              raise RuntimeError("Live source did not explicitly confirm EUR currency")
          if record.get("availability") != "in_stock":
              raise RuntimeError("Live source did not explicitly confirm in-stock availability")
          try:
              price = float(record.get("price_num"))
          except (TypeError, ValueError):
              raise RuntimeError("Live source returned no valid price") from None
          if price <= 0:
              raise RuntimeError("Live source returned a non-positive price")
          if EXPECTED_PRODUCT_ID not in str(record.get("url") or ""):
              raise RuntimeError("Parsed product URL did not match the approved Deloox product")

          promotion_error = None
          with factory() as session, session.begin():
              run_id = start_ingestion_run(session, store_id=STORE_ID)
              result = persist_connector_record(
                  session,
                  connector=connector,
                  store_id=STORE_ID,
                  raw_record=record,
                  matcher=_matcher(),
              )
              if result.status == "promoted" and result.offer_id:
                  record_ingestion_progress(
                      session, run_id=run_id,
                      products_discovered=1, offers_created=1,
                  )
                  finish_ingestion_run(session, run_id=run_id, status="completed")
              else:
                  promotion_error = str(result.reason or result.status)
                  record_ingestion_progress(
                      session, run_id=run_id,
                      products_discovered=1, offers_rejected=1,
                      error="canonical_promotion_not_completed:" + promotion_error,
                  )
                  finish_ingestion_run(session, run_id=run_id, status="partial")
              print("DELOOX_INGESTION_RUN=" + str(run_id))
              print("DELOOX_RAW_ID=" + str(result.ingestion_raw_id))
              print("DELOOX_OFFER_ID=" + str(result.offer_id))
              print("DELOOX_MATCH_REASON=" + str(result.reason))
          if promotion_error:
              raise RuntimeError(
                  "Live Deloox page was captured but canonical promotion was not approved: "
                  + promotion_error
              )

          with factory() as session:
              row = session.execute(text("""
                  SELECT s.status AS store_status, o.status AS offer_status,
                         o.price::text AS price, o.currency, o.availability, o.url,
                         b.name AS brand, f.name AS fragrance,
                         pv.concentration, pv.size_ml, pv.gtin,
                         o.captured_at
                  FROM stores s
                  JOIN offers o ON o.store_id=s.id
                  JOIN product_variants pv ON pv.id=o.product_variant_id
                  JOIN fragrances f ON f.id=pv.fragrance_id
                  JOIN brands b ON b.id=f.brand_id
                  WHERE s.id=:store_id
                    AND o.external_product_id=:external_id
                    AND o.status='active'
                  ORDER BY o.captured_at DESC
                  LIMIT 1
              """), {
                  "store_id": str(STORE_ID),
                  "external_id": PRODUCT_URL,
              }).mappings().first()
              if not row:
                  raise RuntimeError("No active canonical Deloox offer was found after ingestion")
              if (
                  row["brand"] != "Rasasi"
                  or row["fragrance"] != "Hawas Fire"
                  or row["concentration"] != "Eau de Parfum"
                  or row["size_ml"] != 100
                  or row["currency"] != "EUR"
                  or row["availability"] != "in_stock"
              ):
                  raise RuntimeError("Persisted Deloox offer failed final canonical identity checks")
              print("DELOOX_FINAL_VERIFICATION=PASS")
              print("DELOOX_PERSISTED_OFFER=" + repr(dict(row)))
          PY
          )"
          ENCODED="$(printf '%s' "$SCRIPT" | base64 -w0)"
          set +e
          REMOTE_OUTPUT="$(flyctl machine exec "$WORKER_ID" "sh -lc 'cd /app/backend && echo $ENCODED | base64 -d | /app/.venv/bin/python' " --app scenthunter --timeout 180 2>&1)"
          REMOTE_STATUS=$?
          set -e
          printf '%s\n' "$REMOTE_OUTPUT"
          if [ "$REMOTE_STATUS" -ne 0 ] || ! grep -q "DELOOX_FINAL_VERIFICATION=PASS" <<< "$REMOTE_OUTPUT"; then
            echo "Deloox remote ingestion did not reach final verification" >&2
            exit 1
          fi
