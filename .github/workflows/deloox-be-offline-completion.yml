name: Deloox.be offline completion checks

on:
  push:
    branches: [ops/deloox-be-offline-completion]
    paths:
      - ".github/workflows/deloox-be-offline-completion.yml"
      - "backend/scrapers/deloox/**"
      - "backend/tests/test_deloox*.py"
      - "backend/tests/test_legacy_scraper_connectors.py"
      - "backend/app/connectors/**"
      - "backend/catalog_engine.py"
      - "tests/test_deloox_url_admission.py"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/deloox-be-offline-completion.yml"
      - "backend/scrapers/deloox/**"
      - "backend/tests/test_deloox*.py"
      - "backend/tests/test_legacy_scraper_connectors.py"
      - "backend/app/connectors/**"
      - "backend/catalog_engine.py"
      - "tests/test_deloox_url_admission.py"

permissions:
  contents: read

concurrency:
  group: deloox-be-offline-completion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONPATH: .:backend
      DATABASE_URL: ""
      NEON_API_KEY: ""
      FLY_API_TOKEN: ""
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt pytest

      - name: Run Deloox parser and variant regression tests
        run: python -m unittest discover -s backend/tests -p 'test_deloox*.py' -v

      - name: Run shared legacy connector contract tests
        run: python -m unittest discover -s backend/tests -p 'test_legacy_scraper_connectors.py' -v

      - name: Run Deloox URL admission and catalog boundary tests
        run: pytest -q tests/test_deloox_url_admission.py
