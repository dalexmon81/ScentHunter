name: Notino canonical discovery regression

on:
  push:
    branches:
      - refactor/catalog-first-architecture
      - work/ingestion-coverage-report-20261119-rebased
      - work/notino-full-feed-audit-20261120
    paths:
      - "backend/scripts/notino_feed_coverage_audit.py"
      - "backend/app/workers/notino_runtime.py"
      - "backend/app/workers/legacy_runtime.py"
      - "backend/app/services/offer_refresh.py"
      - "backend/tests/test_offer_refresh_persistence.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/app/services/canonical_matching.py"
      - "backend/scripts/ingestion_coverage_report.py"
      - "backend/tests/test_ingestion_coverage_report.py"
      - ".github/workflows/notino-canonical-discovery.yml"
  pull_request:
    branches:
      - main
      - refactor/catalog-first-architecture
    paths:
      - "backend/app/workers/notino_runtime.py"
      - "backend/app/workers/legacy_runtime.py"
      - "backend/app/services/offer_refresh.py"
      - "backend/tests/test_offer_refresh_persistence.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/app/services/canonical_matching.py"
      - "backend/scripts/ingestion_coverage_report.py"
      - "backend/tests/test_ingestion_coverage_report.py"
      - "backend/scripts/notino_feed_coverage_audit.py"
      - ".github/workflows/notino-canonical-discovery.yml"

permissions:
  contents: read

jobs:
  canonical-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Test Notino canonical discovery filter
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_worker_runtime.py' -v
      - name: Test explicit currency evidence on offer refresh
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_offer_refresh_persistence.py' -v
      - name: Test canonical variant matching
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_canonical_matching.py' -v

      - name: Install Fly CLI for isolated Notino audit
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/notino-full-feed-audit-20261120'
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run read-only full Notino feed audit on pilot
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'work/notino-full-feed-audit-20261120'
        shell: bash
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter-pilot-20261030
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN" || { echo "Missing FLY_API_TOKEN" >&2; exit 1; }
          case "$FLY_API_TOKEN" in
            fm2_*) FLY_API_TOKEN="FlyV1 $FLY_API_TOKEN" ;;
          esac
          echo "::add-mask::$FLY_API_TOKEN"
          export FLY_API_TOKEN
          flyctl status --app "$FLY_APP"
          machine_json="$(flyctl machine list --app "$FLY_APP" --json)"
          machine_id="$(printf '%s' "$machine_json" | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0]["id"] if rows else "")')"
          state="$(printf '%s' "$machine_json" | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0].get("state","unknown") if rows else "unknown")')"
          test -n "$machine_id" || { echo "No pilot machine exists." >&2; exit 1; }
          if [ "$state" != "started" ]; then
            flyctl machine start "$machine_id" --app "$FLY_APP"
          fi
          for attempt in $(seq 1 18); do
            state="$(flyctl machine list --app "$FLY_APP" --json | python -c 'import json,sys; rows=json.load(sys.stdin); print(rows[0].get("state","unknown") if rows else "unknown")')"
            echo "PILOT_MACHINE_STATE=$state"
            [ "$state" = "started" ] && break
            sleep 5
          done
          [ "$state" = "started" ] || { echo "Pilot machine did not start." >&2; exit 1; }
          encoded_script="$(base64 -w0 backend/scripts/notino_feed_coverage_audit.py)"
          remote_command="sh -c 'echo $encoded_script | base64 -d > /tmp/notino_feed_coverage_audit.py && cd /app/backend && /app/.venv/bin/python /tmp/notino_feed_coverage_audit.py'"
          flyctl machine exec "$machine_id" "$remote_command" --app "$FLY_APP" --timeout 600
