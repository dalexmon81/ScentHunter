name: Notino canonical discovery regression

concurrency:
  group: notino-canonical-discovery-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  push:
    branches:
      - refactor/catalog-first-architecture
      - fix/notino-feed-index-main-20261120
      - work/ingestion-coverage-report-20261119-rebased
    paths:
      - "backend/scripts/notino_feed_coverage_audit.py"
      - "backend/app/connectors/notino_feed.py"
      - "backend/tests/test_notino_feed_connector.py"
      - "backend/app/workers/notino_runtime.py"
      - "backend/app/workers/legacy_runtime.py"
      - "backend/app/services/offer_refresh.py"
      - "backend/tests/test_offer_refresh_persistence.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/app/services/canonical_matching.py"
      - "backend/scripts/ingestion_coverage_report.py"
      - "backend/tests/test_ingestion_coverage_report.py"
      - ".github/workflows/notino-canonical-discovery.yml"
  pull_request:
    branches:
      - main
      - refactor/catalog-first-architecture
    paths:
      - "backend/scripts/notino_feed_coverage_audit.py"
      - "backend/app/connectors/notino_feed.py"
      - "backend/tests/test_notino_feed_connector.py"
      - "backend/app/workers/notino_runtime.py"
      - "backend/app/workers/legacy_runtime.py"
      - "backend/app/services/offer_refresh.py"
      - "backend/tests/test_offer_refresh_persistence.py"
      - "backend/tests/test_notino_worker_runtime.py"
      - "backend/app/services/canonical_matching.py"
      - "backend/scripts/ingestion_coverage_report.py"
      - "backend/tests/test_ingestion_coverage_report.py"
      - ".github/workflows/notino-canonical-discovery.yml"

permissions:
  contents: read

jobs:
  canonical-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt
      - name: Install backend requirements
        run: python -m pip install -r backend/requirements.txt
      - name: Test Notino feed connector snapshot and indexed lookup
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_feed_connector.py' -v
      - name: Test Notino canonical discovery filter
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_notino_worker_runtime.py' -v
      - name: Test explicit currency evidence on offer refresh
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_offer_refresh_persistence.py' -v
      - name: Test canonical variant matching
        working-directory: backend
        env:
          PYTHONPATH: .
        run: python -m unittest discover -s tests -p 'test_canonical_matching.py' -v

      - name: Install Fly CLI for isolated Notino audit
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Run full Notino feed audit with runner-local processing
        working-directory: backend
        timeout-minutes: 40
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SCENTHUNTER_NOTINO_FEED_APP: scenthunter-pilot-20261030
          PYTHONPATH: .
        run: python scripts/notino_feed_coverage_runner_audit.py
