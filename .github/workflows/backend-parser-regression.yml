name: Backend parser regression tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/catalog-hydration-mainline
      - fix/catalog-hydration-slug-normalization
      - fix/notino-authorized-feed-import
      - phase6/matching-validation
      - phase7/catalog-search
      - phase8/offer-ranking
      - phase9/api-frontend
      - phase10/observability-quality

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: scenthunter_test
          POSTGRES_PASSWORD: scenthunter_test
          POSTGRES_DB: scenthunter_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U scenthunter_test -d scenthunter_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      SCENTHUNTER_TEST_POSTGRES_URL: postgresql+psycopg://scenthunter_test:scenthunter_test@localhost:5432/scenthunter_test
      SCENTHUNTER_CATALOG_DATABASE_URL: postgresql+psycopg://scenthunter_test:scenthunter_test@localhost:5432/scenthunter_test
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend and test dependencies
        run: |
          python -m pip install -r backend/requirements.txt
          python -m pip install pytest
      - name: Apply disposable PostgreSQL schema
        working-directory: backend
        env:
          SCENTHUNTER_CATALOG_DATABASE_URL: postgresql+psycopg://scenthunter_test:scenthunter_test@localhost:5432/scenthunter_test
        run: alembic upgrade head
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Validate frontend inline JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("frontend/index.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          Path("/tmp/scenthunter-frontend.js").write_text("\n;\n".join(scripts), encoding="utf-8")
          if not scripts:
              raise SystemExit("No inline frontend scripts found")
          PY
          node --check /tmp/scenthunter-frontend.js
      - name: Validate admin dashboard JavaScript
        run: |
          python - <<'PY'
          import re
          from pathlib import Path
          html = Path("frontend/admin.html").read_text(encoding="utf-8")
          scripts = re.findall(r"<script(?:\\s[^>]*)?>(.*?)</script>", html, flags=re.S | re.I)
          Path("/tmp/scenthunter-admin.js").write_text("\\n;\\n".join(scripts), encoding="utf-8")
          if not scripts:
              raise SystemExit("No admin dashboard scripts found")
          PY
          node --check /tmp/scenthunter-admin.js
      - name: Run backend regression tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}/backend:${{ github.workspace }}
        run: python -m pytest -q tests
      - name: Run Notino feed regression tests
        run: >-
          python -m pytest -q
          tests/test_notino_authorized_feed.py
          tests/test_notino_search_adapter.py
          tests/test_catalog_notino_discovery.py
