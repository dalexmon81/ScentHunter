name: Backend parser regression tests

on:
  pull_request:
    branches:
      - main
      - phase5/fly-staging-workers-config
  push:
    branches:
      - fix/catalog-hydration-mainline
      - fix/catalog-hydration-slug-normalization
      - fix/notino-authorized-feed-import

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install pytest for backend and repository regression tests
        run: python -m pip install pytest

      - name: Run catalog hydration regression tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Notino feed and staging catalog seed regression tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          tests/test_notino_authorized_feed.py
          tests/test_notino_search_adapter.py
          tests/test_catalog_notino_discovery.py
          backend/tests/test_seed_catalog_store_safety.py
