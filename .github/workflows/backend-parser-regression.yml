name: Backend parser regression tests

concurrency:
  group: backend-parser-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - phase5/fly-staging-workers-config
  push:
    branches:
      - fix/catalog-hydration-mainline
      - fix/catalog-hydration-slug-normalization
      - fix/notino-authorized-feed-import
      - fix/notino-cj-memory
  workflow_dispatch:
    inputs:
      run_live_notino_feed:
        description: Run the two expensive, read-only full-feed parser checks against the isolated pilot
        required: true
        type: boolean
        default: false

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Install Chromium for browser-backed parser regressions
        run: python -m playwright install chromium
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install pytest for backend and repository regression tests
        run: python -m pip install pytest

      - name: Run catalog hydration regression tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Verify live PerfumeMarket product extraction (read-only)
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.head.ref == 'fix/perfumemarket-live-product-validation' ||
            github.event.pull_request.head.ref == 'fix/perfumemarket-live-closure'
          )
        timeout-minutes: 2
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
          SCENTHUNTER_DISCOVERY_QUERIES_PERFUMEMARKET: "Rasasi Hawas London"
          SCENTHUNTER_DISCOVERY_PRODUCT_URLS_PERFUMEMARKET: "https://perfumemarket.eu/products/rasasi-hawas-london-100ml-edp"
        run: python backend/scripts/check_perfumemarket_live.py

      - name: Verify live ParfumCity discovery, extraction, price, stock, URL and currency (read-only)
        if: >-
          github.event_name == 'pull_request' &&
          (
            github.event.pull_request.head.ref == 'fix/parfumcity-shopify-ingestion' ||
            github.event.pull_request.head.ref == 'fix/parfumcity-shopify-search-json-fallback' ||
          github.event.pull_request.head.ref == 'fix/parfumcity-final-audit' ||
            github.event.pull_request.head.ref == 'fix/parfumcity-final-clean'
          )
        timeout-minutes: 2
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_parfumcity_live.py

      - name: Verify one Easycosmetic.de product (read-only, no database)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/easycosmetic-visible-price-currency-evidence'
        timeout-minutes: 2
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_easycosmetic_live.py

      - name: Verify Easycosmetic.de search discovery (one request, read-only)
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'fix/easycosmetic-discovery-validation'
        timeout-minutes: 2
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_easycosmetic_discovery_live.py

      - name: Run Notino feed and staging catalog seed regression tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          tests/test_notino_authorized_feed.py
          tests/test_notino_search_adapter.py
          tests/test_catalog_notino_discovery.py
          backend/tests/test_seed_catalog_store_safety.py
          backend/tests/test_bplatz_live_offer_check.py
          tests/test_bplatz_persistence_service.py

      - name: Probe public Notino storefront fallback (read-only, 5 products)
        if: github.event_name != 'pull_request' || github.event.pull_request.head.ref != 'fix/parfumcity-html-product-fallback'
        id: notino-public-smoke
        continue-on-error: true
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/notino_public_fallback_smoke.py

      - name: Verify opt-in Notino persistence profiling including SQLite commit
        env:
          PYTHONPATH: backend
          NOTINO_PERSIST_PROFILE: "1"
        run: >-
          python -m pytest -q
          backend/tests/test_notino_affiliate_feed.py::NotinoAffiliateFeedTests::test_staging_publication_is_atomic_and_idempotent

      - name: Verify live Orioudh currency evidence (read-only)
        if: >-
          github.event_name == 'pull_request' &&
          github.event.pull_request.head.ref == 'fix/orioudh-shopify-variant-adapter'
        timeout-minutes: 2
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_orioudh_currency_evidence.py

      - name: Verify live Bplatz Liquid Brun offer (read-only pilot)
        if: >-
          github.event_name == 'pull_request' &&
          (github.event.pull_request.head.ref == 'fix/bplatz-canonical-domain-discovery' || github.event.pull_request.head.ref == 'fix/run-bplatz-live-check-on-canonical-domain')
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_bplatz_liquid_brun_live.py

  notino-live-parser-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_notino_feed
    name: Parse live CJ feed with PR parser (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 65
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify Fly SSH command execution
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter-pilot-20261030
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s flyctl ssh console --app "$FLY_APP" --select=false -C "printf 'NOTINO_FLY_SSH_PREFLIGHT=PASS\\n'; /app/.venv/bin/python --version"
      - name: Stream live CJ feed through PR parser without catalog writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter-pilot-20261030
        timeout-minutes: 60
        shell: bash
        run: |
          set -euo pipefail
          parser_source_b64=$(base64 -w0 backend/scrapers/notino/affiliate_feed.py)
          remote_python=$(cat <<'PY'
          import base64
          import json
          import os
          import sqlite3
          import sys
          import tempfile
          import time
          import types

          source = base64.b64decode(os.environ["NOTINO_PARSER_SOURCE_B64"])
          feed = types.ModuleType("notino_affiliate_feed_pr")
          sys.modules[feed.__name__] = feed
          exec(compile(source, "<notino_affiliate_feed_pr>", "exec"), feed.__dict__)

          import resource

          started = time.monotonic()
          deadline = started + 55 * 60
          stats = {}
          count = sized = 0
          unique_urls = set()
          db = None
          counters = {"products_read": 0, "valid": 0, "rejected": 0}
          timings = {phase: {"wall": 0.0, "cpu": 0.0}
                     for phase in ("download", "xml", "validation", "staging")}

          def record(phase, wall, cpu):
              timings[phase]["wall"] += time.monotonic() - wall
              timings[phase]["cpu"] += time.process_time() - cpu

          def report(phase, **values):
              rss_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
              with open("/proc/self/status", encoding="utf-8") as status:
                  current_rss_mb = int(next(line for line in status if line.startswith("VmRSS:")).split()[1]) / 1024
              print("NOTINO_PROFILE=" + json.dumps({
                  "phase": phase,
                  "elapsed_seconds": round(time.monotonic() - started, 2),
                  "rss_mb": round(current_rss_mb, 1),
                  "peak_rss_mb": round(rss_mb, 1),
                  "timings_seconds": {
                      name: {kind: round(value, 3) for kind, value in values.items()}
                      for name, values in timings.items()
                  },
                  **counters,
                  "staged_unique_variants": db.total_changes if db is not None else 0,
                  **values
              }, ensure_ascii=False), flush=True)

          original_items = feed._feed_items
          original_parse_item = feed._parse_item
          original_field_map = feed._field_map

          def measured_items(stream):
              iterator = iter(original_items(stream))
              while True:
                  wall, cpu = time.monotonic(), time.process_time()
                  try:
                      node = next(iterator)
                  except StopIteration:
                      return
                  finally:
                      record("xml", wall, cpu)
                  counters["products_read"] += 1
                  yield node
                  if counters["products_read"] % 5000 == 0:
                      report("progress", parsed_valid_offers=count,
                             unique_product_urls=len(unique_urls), offers_with_size=sized)

          def measured_field_map(*args, **kwargs):
              wall, cpu = time.monotonic(), time.process_time()
              try:
                  return original_field_map(*args, **kwargs)
              finally:
                  record("validation", wall, cpu)

          def measured_parse_item(*args, **kwargs):
              wall, cpu = time.monotonic(), time.process_time()
              try:
                  offer = original_parse_item(*args, **kwargs)
              finally:
                  record("validation", wall, cpu)
              counters["valid" if offer is not None else "rejected"] += 1
              return offer

          feed._feed_items = measured_items
          feed._parse_item = measured_parse_item
          feed._field_map = measured_field_map
          with tempfile.TemporaryFile() as downloaded:
              t = time.monotonic()
              wall, cpu = time.monotonic(), time.process_time()
              report("download_start")
              try:
                  download_bytes = feed._download_feed(downloaded, deadline)
              finally:
                  record("download", wall, cpu)
                  report("download_end")
              report("download_complete", download_bytes=download_bytes,
                     phase_seconds=round(time.monotonic() - t, 2))
              with tempfile.TemporaryDirectory(prefix="notino-pr-dryrun-") as directory:
                  db = sqlite3.connect(os.path.join(directory, "offers.sqlite3"))
                  db.execute("PRAGMA journal_mode=OFF")
                  db.execute("PRAGMA synchronous=OFF")
                  db.execute("CREATE TABLE offers(url TEXT, variant_key TEXT, PRIMARY KEY(url,variant_key)) WITHOUT ROWID")
                  parse_seconds = stage_seconds = 0.0
                  try:
                      with feed._xml_stream(downloaded, deadline) as stream:
                          report("xml_stream_open")
                          iterator = iter(feed._parsed_offers(stream, stats))
                          while True:
                              parse_started = time.monotonic()
                              try:
                                  offer = next(iterator)
                              except StopIteration:
                                  break
                              parse_seconds += time.monotonic() - parse_started
                              count += 1
                              sized += int(offer.size_ml is not None)
                              unique_urls.add(offer.url)
                              stage_started = time.monotonic()
                              wall, cpu = time.monotonic(), time.process_time()
                              try:
                                  db.execute("INSERT OR IGNORE INTO offers VALUES(?,?)",
                                             (offer.url, feed._stable_variant_key(offer)))
                              finally:
                                  record("staging", wall, cpu)
                              stage_seconds += time.monotonic() - stage_started
                      t = time.monotonic()
                      wall, cpu = time.monotonic(), time.process_time()
                      try:
                          db.commit()
                      finally:
                          record("staging", wall, cpu)
                      staged = db.execute("SELECT COUNT(*) FROM offers").fetchone()[0]
                      report("staging_complete", staged_unique_variants=staged,
                             commit_seconds=round(time.monotonic() - t, 2),
                             parse_seconds=round(parse_seconds, 2),
                             staging_seconds=round(stage_seconds, 2),
                             parser_stats=stats)
                  finally:
                      for phase in ("xml", "validation", "staging"):
                          report(phase + "_end")
                      db.close()

          print("NOTINO_PR_PARSER_DRY_RUN=" + json.dumps({
              "result": "PASS" if count > 0 and staged > 0 else "FAIL",
              "download_bytes": download_bytes,
              "elapsed_seconds": round(time.monotonic() - started, 2),
              "parsed_valid_offers": count,
              "staged_unique_variants": staged,
              "unique_product_urls": len(unique_urls),
              "offers_with_size": sized,
              "offers_without_size": count - sized,
              "parser_stats": stats,
              "catalog_database_touched": False
          }, ensure_ascii=False), flush=True)
          if count <= 0 or staged <= 0:
              raise SystemExit("Notino live feed produced no valid staged offers")
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'export NOTINO_PARSER_SOURCE_B64=\"$parser_source_b64\"; printf \"%s\" \"$remote_script_b64\" | base64 -d | /app/.venv/bin/python'"
          timeout 3630s flyctl ssh console --app "$FLY_APP" --select=false -C "$remote_command"

  notino-runner-parser-dry-run:
    if: github.event_name == 'workflow_dispatch' && inputs.run_live_notino_feed
    name: Parse live CJ feed on runner (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Install parser dependency
        run: python -m pip install requests==2.32.3
      - name: Download via Fly and validate with temporary runner staging
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          SCENTHUNTER_NOTINO_FEED_APP: scenthunter-pilot-20261030
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/notino_cj_runner_dry_run.py
