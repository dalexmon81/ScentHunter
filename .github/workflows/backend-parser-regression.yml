name: Backend parser regression tests

concurrency:
  group: backend-parser-regression-${{ github.event.pull_request.head.ref || github.ref_name }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - phase5/fly-staging-workers-config
  push:
    branches:
      - fix/catalog-hydration-mainline
      - fix/catalog-hydration-slug-normalization
      - fix/notino-authorized-feed-import
      - fix/notino-cj-memory

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Install pytest for backend and repository regression tests
        run: python -m pip install pytest

      - name: Run catalog hydration regression tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Run Notino feed and staging catalog seed regression tests
        env:
          PYTHONPATH: backend
        run: >-
          python -m pytest -q
          tests/test_notino_authorized_feed.py
          tests/test_notino_search_adapter.py
          tests/test_catalog_notino_discovery.py
          backend/tests/test_seed_catalog_store_safety.py


  notino-live-parser-dry-run:
    if: github.event_name == 'pull_request'
    name: Parse live CJ feed with PR parser (read-only)
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Verify Fly SSH command execution
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 2
        run: |
          set -euo pipefail
          timeout 90s flyctl ssh console --app scenthunter --select=false -C "printf 'NOTINO_FLY_SSH_PREFLIGHT=PASS\\n'; /app/.venv/bin/python --version"
      - name: Stream live CJ feed through PR parser without catalog writes
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        timeout-minutes: 10
        shell: bash
        run: |
          set -euo pipefail
          parser_source_b64=$(base64 -w0 backend/scrapers/notino/affiliate_feed.py)
          remote_python=$(cat <<'PY'
          import base64
          import importlib.util
          import json
          import os
          import sqlite3
          import sys
          import tempfile
          import time

          source = base64.b64decode(os.environ["NOTINO_PARSER_SOURCE_B64"])
          module_path = "/tmp/notino_affiliate_feed_pr.py"
          with open(module_path, "wb") as handle:
              handle.write(source)
          spec = importlib.util.spec_from_file_location("notino_affiliate_feed_pr", module_path)
          feed = importlib.util.module_from_spec(spec)
          sys.modules[spec.name] = feed
          spec.loader.exec_module(feed)

          import resource

          started = time.monotonic()
          deadline = started + 8 * 60
          stats = {}
          count = sized = 0
          unique_urls = set()
          last_report = started

          def report(phase, **values):
              rss_mb = resource.getrusage(resource.RUSAGE_SELF).ru_maxrss / 1024
              print("NOTINO_PROFILE=" + json.dumps({
                  "phase": phase,
                  "elapsed_seconds": round(time.monotonic() - started, 2),
                  "peak_rss_mb": round(rss_mb, 1),
                  **values
              }, ensure_ascii=False), flush=True)

          with tempfile.TemporaryFile() as downloaded:
              t = time.monotonic()
              download_bytes = feed._download_feed(downloaded, deadline)
              report("download_complete", download_bytes=download_bytes,
                     phase_seconds=round(time.monotonic() - t, 2))
              with tempfile.TemporaryDirectory(prefix="notino-pr-dryrun-") as directory:
                  db = sqlite3.connect(os.path.join(directory, "offers.sqlite3"))
                  db.execute("PRAGMA journal_mode=OFF")
                  db.execute("PRAGMA synchronous=OFF")
                  db.execute("CREATE TABLE offers(url TEXT, variant_key TEXT, PRIMARY KEY(url,variant_key)) WITHOUT ROWID")
                  parse_seconds = stage_seconds = 0.0
                  try:
                      with feed._xml_stream(downloaded, deadline) as stream:
                          report("xml_stream_open")
                          iterator = iter(feed._parsed_offers(stream, stats))
                          while True:
                              parse_started = time.monotonic()
                              try:
                                  offer = next(iterator)
                              except StopIteration:
                                  break
                              parse_seconds += time.monotonic() - parse_started
                              count += 1
                              sized += int(offer.size_ml is not None)
                              unique_urls.add(offer.url)
                              stage_started = time.monotonic()
                              db.execute("INSERT OR IGNORE INTO offers VALUES(?,?)",
                                         (offer.url, feed._stable_variant_key(offer)))
                              stage_seconds += time.monotonic() - stage_started
                              if count % 5000 == 0:
                                  report("progress", parsed_valid_offers=count,
                                         unique_product_urls=len(unique_urls),
                                         offers_with_size=sized,
                                         parse_seconds=round(parse_seconds, 2),
                                         staging_seconds=round(stage_seconds, 2),
                                         parser_stats=stats)
                      t = time.monotonic()
                      db.commit()
                      staged = db.execute("SELECT COUNT(*) FROM offers").fetchone()[0]
                      report("staging_complete", staged_unique_variants=staged,
                             commit_seconds=round(time.monotonic() - t, 2),
                             parse_seconds=round(parse_seconds, 2),
                             staging_seconds=round(stage_seconds, 2),
                             parser_stats=stats)
                  finally:
                      db.close()

          print("NOTINO_PR_PARSER_DRY_RUN=" + json.dumps({
              "result": "PASS" if count > 0 and staged > 0 else "FAIL",
              "download_bytes": download_bytes,
              "elapsed_seconds": round(time.monotonic() - started, 2),
              "parsed_valid_offers": count,
              "staged_unique_variants": staged,
              "unique_product_urls": len(unique_urls),
              "offers_with_size": sized,
              "offers_without_size": count - sized,
              "parser_stats": stats,
              "catalog_database_touched": False
          }, ensure_ascii=False), flush=True)
          if count <= 0 or staged <= 0:
              raise SystemExit("Notino live feed produced no valid staged offers")
          PY
          )
          remote_script_b64=$(printf '%s' "$remote_python" | base64 -w0)
          remote_command="/bin/sh -lc 'export NOTINO_PARSER_SOURCE_B64=\"$parser_source_b64\"; printf \"%s\" \"$remote_script_b64\" | base64 -d | /app/.venv/bin/python'"
          timeout 570s flyctl ssh console --app scenthunter --select=false -C "$remote_command"
