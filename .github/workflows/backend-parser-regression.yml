name: Backend parser regression tests

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - fix/catalog-hydration-mainline
      - fix/catalog-hydration-slug-normalization
      - fix/notino-authorized-feed-import

jobs:
  parser-regression:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile backend
        run: python -m compileall -q backend
      - name: Run catalog hydration regression tests
        working-directory: backend
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m unittest discover -s tests -p "test_*.py" -v

      - name: Install pytest for repository-level regression tests
        run: python -m pip install pytest

      - name: Run Notino feed and Amazon marketplace regression tests
        run: >-
          python -m pytest -q
          tests/test_notino_authorized_feed.py
          tests/test_notino_search_adapter.py
          tests/test_catalog_notino_discovery.py
          tests/test_amazon_creators_api.py
          tests/test_amazon_marketplace_scrapers.py
