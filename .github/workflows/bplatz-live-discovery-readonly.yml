name: Bplatz live discovery read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bplatz-live-discovery-readonly
  cancel-in-progress: true

jobs:
  bplatz-live-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install parser dependencies
        run: python -m pip install requests==2.32.3 beautifulsoup4==4.12.3
      - name: Run live discovery, extraction and catalog matching (no database)
        env:
          PYTHONPATH: backend
          PYTHONDONTWRITEBYTECODE: "1"
        run: python backend/scripts/check_bplatz_live_discovery_readonly.py
