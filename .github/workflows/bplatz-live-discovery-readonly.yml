name: Bplatz live discovery read-only verification

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bplatz-live-discovery-readonly
  cancel-in-progress: true

jobs:
  bplatz-live-discovery:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Execute Bplatz discovery from the existing Fly app machine
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          FLY_APP: scenthunter
        shell: bash
        run: |
          set -euo pipefail
          test -n "$FLY_API_TOKEN"
          probe_b64=$(base64 -w0 backend/scripts/check_bplatz_live_discovery_readonly.py)
          remote_python="import os,base64; ns={'__file__':os.path.join(os.getcwd(),'backend/scripts/check_bplatz_live_discovery_readonly.py')}; exec(compile(base64.b64decode('$probe_b64'),ns['__file__'],'exec'),ns)"
          remote_cmd="/bin/sh -lc 'ROOT=\$(readlink /proc/\$(pgrep -o uvicorn)/cwd); export PYTHONPATH=\"\$ROOT/backend:\$ROOT\"; cd \"\$ROOT\"; python3 -c \"$remote_python\"'"
          timeout 10m flyctl ssh console --app "$FLY_APP" --select=false -C "$remote_cmd"
