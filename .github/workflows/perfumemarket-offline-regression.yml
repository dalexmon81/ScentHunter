name: PerfumeMarket offline regression checks

on:
  push:
    branches: [ops/perfumemarket-readonly-live-check]

permissions:
  contents: read

concurrency:
  group: perfumemarket-offline-regression
  cancel-in-progress: true

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install backend dependencies
        run: python -m pip install -r backend/requirements.txt
      - name: Compile PerfumeMarket scraper and connector
        run: python -m compileall -q backend/scrapers/perfumemarket backend/app/connectors/legacy_scrapers.py
      - name: Run PerfumeMarket parser and connector regression tests
        working-directory: backend
        env:
          PYTHONPATH: ..
        run: python -m unittest discover -s tests -p "test_perfumemarket*.py" -v
