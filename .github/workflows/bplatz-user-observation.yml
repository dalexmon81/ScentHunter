name: Bplatz user screenshot observation fixture

on:
  pull_request:
    branches:
      - main
    paths:
      - tests/fixtures/bplatz/liquid-brun-100ml-user-observation.json
      - tests/test_bplatz_user_observation_fixture.py
      - .github/workflows/bplatz-user-observation.yml

permissions:
  contents: read

jobs:
  screenshot-observation:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run screenshot observation evidence-boundary test
        run: python -m pip install pytest && python -m pytest -q tests/test_bplatz_user_observation_fixture.py
