# Isolated Fly.io staging configuration for the Phase 5 ingestion workers.
# Deploy only with this config file. Do not use the production fly.toml.
app = "scenthunter-staging-workers"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile.worker"

# Enforce the catalog database contract before the worker process can start.
# If the staging PostgreSQL URL is missing, startup fails closed.
[env]
  SCENTHUNTER_CATALOG_REQUIRE_POSTGRESQL = "1"

[processes]
  app = "sh /app/backend/start_worker.sh worker"
  beat = "sh /app/backend/start_worker.sh beat"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "512mb"
  processes = ["beat"]

# No HTTP service, public port, or production volume.
