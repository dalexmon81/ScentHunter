# ScentHunter Fly.io configuration

app = "scenthunter"
primary_region = "ams"

[build]

[env]
  SCENTHUNTER_CATALOG_DB = "/data/store_catalog.sqlite3"
  # Interactive searches must not block on retailer HTTP fetches; the background hydrator owns refresh.
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"
  # Always allow generic Notino public discovery when the authorized feed has no matching offer.
  # Product matching and price/size verification remain in the shared adapter; no per-perfume exceptions.
  NOTINO_PUBLIC_FALLBACK_ENABLED = "1"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = "stop"
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "scenthunter_data"
  destination = "/data"
  auto_extend_size_threshold = 70
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
