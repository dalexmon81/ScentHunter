# ScentHunter Fly.io production configuration

app = "scenthunter"
primary_region = "ams"

[build]

[env]
  # Legacy catalog remains available during the controlled frontend cutover.
  SCENTHUNTER_CATALOG_DB = "/data/store_catalog.sqlite3"
  # Canonical catalog used by /api/catalog/search and the new ingestion worker.
  SCENTHUNTER_CATALOG_DATABASE_URL = "sqlite:////data/catalog/catalog.sqlite3"
  SCENTHUNTER_QUEUE_BACKEND = "sqlite"
  SCENTHUNTER_SQLITE_QUEUE_DB = "/data/catalog/ingestion_queue.sqlite3"
  SCENTHUNTER_ACTIVE_OFFER_REFRESH_ENABLED = "1"
  # Interactive legacy requests must not block on retailer HTTP fetches.
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "scenthunter_data"
  destination = "/data"
  auto_extend_size_threshold = 70
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
