# ScentHunter Fly.io configuration

app = "scenthunter"
primary_region = "ams"

[build]

[env]
  SCENTHUNTER_CATALOG_DB = "/data/store_catalog.sqlite3"
  CATALOG_FOREGROUND_REFRESH_ENABLED = "1"
  # Allow bounded targeted refreshes to finish real retailer requests (timeouts are ~3s).
  CATALOG_REFRESH_BUDGET_SECONDS = "2.5"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "scenthunter_data"
  destination = "/data"
  auto_extend_size_threshold = 70
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
