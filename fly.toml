# ScentHunter Fly.io configuration
app = 'scenthunter'
primary_region = 'ams'

[build]

[env]
  SCENTHUNTER_CATALOG_DB = '/data/store_catalog.sqlite3'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[mounts]]
  source = 'scenthunter_data'
  destination = '/data'

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
