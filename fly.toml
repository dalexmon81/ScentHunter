# fly.toml app configuration file generated for scenthunter-pr726-staging on 2026-11-10T21:29:37Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scenthunter-pr726-staging'
primary_region = 'ams'

[build]
[env]
  CATALOG_FOREGROUND_REFRESH_ENABLED = '0'
  SCENTHUNTER_CATALOG_DB = '/data/store_catalog.sqlite3'

[[mounts]]
  source = 'scenthunter_data'
  destination = '/data'
  auto_extend_size_threshold = 70
  auto_extend_size_increment = '1GB'
  auto_extend_size_limit = '5GB'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
