# ScentHunter Fly.io configuration

app = "scenthunter"
primary_region = "ams"

[deploy]
  # Fly executes release_command as an argv command, not through a shell.
  # Invoke a login shell explicitly so cd and && are interpreted correctly.
  release_command = "/bin/sh -lc 'cd /app/backend && /app/.venv/bin/alembic upgrade head'"

[processes]
  app = "sh -c 'cd /app/backend && /app/.venv/bin/uvicorn postgres_main:app --host 0.0.0.0 --port 8080'"
  worker = "sh -c 'cd /app/backend && /app/.venv/bin/python -m app.workers.postgres_worker'"

[build]

[env]
  SCENTHUNTER_QUEUE_BACKEND = "postgres"
  SCENTHUNTER_CATALOG_REQUIRE_POSTGRESQL = "1"
  # Preserve all pre-pilot queue rows but do not claim them; only newly created post-cutover jobs are eligible.
  SCENTHUNTER_QUEUE_MIN_CREATED_AT = "2026-11-23T08:10:00Z"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "stop"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]


[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
