# Isolated Fly.io staging deployment: PostgreSQL catalog API + Celery worker.
# This config targets only the existing staging app, never the production app.
app = "scenthunter-staging-workers"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile.worker"

[env]
  SCENTHUNTER_CATALOG_REQUIRE_POSTGRESQL = "1"

[processes]
  app = "sh /app/backend/start_worker.sh worker"
  web = "sh /app/backend/start_api.sh"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["web"]

[[http_service.checks]]
  grace_period = "15s"
  interval = "30s"
  method = "GET"
  path = "/healthz"
  timeout = "5s"

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["app"]

[[vm]]
  cpu_kind = "shared"
  cpus = 1
  memory = "1gb"
  processes = ["web"]
