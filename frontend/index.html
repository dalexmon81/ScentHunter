<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>ScentHunter</title>
<style>
*{box-sizing:border-box}html,body{margin:0;background:#050607;color:#f7f7f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}body{min-height:100vh}.app{width:min(100%,760px);margin:auto;min-height:100vh;padding:20px 18px 115px}.logo{font-size:30px;font-weight:900;text-align:center;margin:4px 0 18px}.logo span,.gold{color:#e7b83f}.hero{border:1px solid #234638;border-radius:22px;padding:22px 18px;background:radial-gradient(circle at 88% 30%,#173c2d 0,#0b1c16 25%,#07100d 58%,#060808 100%);margin-bottom:22px}.hero h1{font-size:25px;line-height:1.08;margin:0 0 9px;max-width:75%}.hero p{color:#cfd2cf;line-height:1.4;margin:0 0 18px;max-width:72%}.search{position:relative}.search input{width:100%;height:52px;border:1px solid #3b403e;border-radius:16px;background:#121615;color:#fff;padding:0 15px 0 45px;font-size:16px;outline:none}.search svg{position:absolute;left:14px;top:14px;width:23px;height:23px;stroke:#9b9da0;fill:none;stroke-width:2;z-index:2}.search button{width:100%;height:54px;margin-top:10px;border:0;border-radius:16px;background:linear-gradient(#f4ca5d,#d99c22);color:#111;font-size:14px;font-weight:900}.search button:disabled{opacity:.65}.status{margin:16px 4px 10px;color:#b7b9bc;font-size:15px;min-height:20px}.result-count{font-size:24px;font-weight:900;margin:12px 4px}.result-count span{color:#51cf76}.card{border:1px solid #303238;border-radius:19px;background:linear-gradient(145deg,#17191b,#0b0c0d);padding:16px;margin:12px 0}.product-head{display:flex;gap:13px;align-items:center}.product-image{width:70px;height:80px;flex:0 0 70px;border-radius:14px;border:1px solid #30343a;background:#0b0d0e;display:flex;align-items:center;justify-content:center;overflow:hidden;font-size:34px}.product-image img{width:100%;height:100%;object-fit:contain;background:#fff}.product-main{min-width:0;flex:1}.brand{font-size:12px;color:#aaa;text-transform:uppercase;font-weight:800}.name{font-size:19px;font-weight:850;margin-top:3px;line-height:1.15}.format{font-size:12px;color:#9c9ea2;margin-top:5px}.best{margin-top:14px;padding-top:13px;border-top:1px solid #303238;display:flex;justify-content:space-between;gap:10px;align-items:end}.best small{display:block;color:#9c9ea2;font-size:10px;text-transform:uppercase;font-weight:800}.price{color:#55ce78;font-size:23px;font-weight:950}.offers{margin-top:7px}.offer{padding:12px 0;border-top:1px solid #25282b;display:flex;justify-content:space-between;gap:12px;align-items:center}.offer:first-child{border-top:0}.store{font-weight:800}.offer-meta{font-size:11px;color:#8f9196;margin-top:3px}.offer-price{color:#55ce78;font-size:18px;font-weight:900;white-space:nowrap}.offer a{display:inline-block;margin-top:7px;color:#e7b83f;text-decoration:none;font-size:11px;font-weight:900;border:1px solid #6d5620;border-radius:18px;padding:7px 11px}.heart{background:none;border:0;color:#aaa;font-size:28px;line-height:1;padding:0;cursor:pointer}.heart.saved{color:#e7b83f}.error{margin:15px 4px;color:#85878c;font-size:12px}.empty{border:1px solid #303238;border-radius:19px;background:#111416;padding:28px 18px;text-align:center;color:#aaa}.empty strong{display:block;color:#e7b83f;font-size:21px;margin-bottom:7px}.nav{position:fixed;z-index:9999;left:50%;bottom:0;transform:translateX(-50%);width:min(100%,760px);display:grid;grid-template-columns:repeat(2,1fr);padding:9px 12px calc(9px + env(safe-area-inset-bottom));background:rgba(7,8,9,.97);border-top:1px solid #25272a}.nav button{border:0;background:none;color:#98999c;font-size:11px;font-weight:700}.nav button.active{color:#e7b83f}.nav b{display:block;font-size:25px;line-height:27px;font-weight:400}.view{display:none}.view.active{display:block}@media(max-width:390px){.app{padding-left:12px;padding-right:12px}.hero h1{font-size:22px}.name{font-size:17px}}
</style>
</head>
<body>
<main class="app">
<section id="exploreView" class="view active">
  <div class="logo">Scent<span>Hunter</span></div>
  <section class="hero">
    <h1>Trova sempre l'offerta migliore.</h1>
    <p>Confronta i prezzi dei principali negozi di profumi.</p>
    <div class="search">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"></circle><path d="m16.5 16.5 4 4"></path></svg>
      <input id="searchInput" autocomplete="off" placeholder="Cerca un profumo…">
      <button id="searchButton" type="button">INIZIA LA RICERCA</button>
    </div>
  </section>
  <div id="status" class="status"></div>
  <div id="searchOutput"></div>
</section>
<section id="wishlistView" class="view">
  <div class="logo">Wishlist</div>
  <div id="wishlistOutput"></div>
</section>
</main>
<nav class="nav">
  <button class="active" data-view="explore"><b>⌕</b>Esplora</button>
  <button data-view="wishlist"><b>♡</b>Wishlist</button>
</nav>
<script>
(() => {
  "use strict";

  const WISH_KEY = "scenthunter_wishlist_v3";
  const input = document.getElementById("searchInput");
  const button = document.getElementById("searchButton");
  const status = document.getElementById("status");
  const output = document.getElementById("searchOutput");
  const wishlistOutput = document.getElementById("wishlistOutput");
  let searchController = null;
  let currentOffers = [];

  function backend(){
    const origin = window.location.origin;
    if(origin.includes("-3000.app.github.dev")) return origin.replace("-3000.app.github.dev","-8000.app.github.dev");
    if(origin.startsWith("http://localhost") || origin.startsWith("http://127.0.0.1")) return "http://localhost:8000";
    return origin;
  }

  function esc(value){
    return String(value ?? "").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;");
  }

  function priceNumber(value){
    if(typeof value === "number" && Number.isFinite(value)) return value;
    const s = String(value ?? "").replace(/\s/g,"").replace("€","");
    const match = s.match(/\d+(?:[.,]\d+)?/);
    if(!match) return Infinity;
    return Number(match[0].replace(",","."));
  }

  function displayPrice(offer){
    if(offer?.price) return String(offer.price);
    const n = Number(offer?.price_value);
    return Number.isFinite(n) ? n.toFixed(2).replace(".",",")+" €" : "";
  }

  function imageOf(item){ return item?.image || item?.image_url || item?.thumbnail || ""; }

  function getWishlist(){
    try{
      const value = JSON.parse(localStorage.getItem(WISH_KEY) || "[]");
      return Array.isArray(value) ? value : [];
    }catch{return []}
  }

  function saveWishlist(list){ localStorage.setItem(WISH_KEY,JSON.stringify(list)); }

  function wishKey(item){
    return [String(item?.brand||""),String(item?.name||""),String(item?.size_ml||item?.size||"")].join("|").toLowerCase().trim();
  }

  function toggleWish(item){
    const list=getWishlist();
    const key=wishKey(item);
    const index=list.findIndex(x=>wishKey(x)===key);
    if(index>=0) list.splice(index,1); else list.push({...item, savedAt:Date.now()});
    saveWishlist(list);
    syncHearts();
    renderWishlist();
  }

  function syncHearts(){
    const list=getWishlist();
    document.querySelectorAll(".heart[data-wish-key]").forEach(el=>{
      const on=list.some(x=>wishKey(x)===el.dataset.wishKey);
      el.textContent=on?"♥":"♡";
      el.classList.toggle("saved",on);
    });
  }

  function normalizeOffers(data){
    const offers=[];
    if(Array.isArray(data?.results)) offers.push(...data.results);
    if(Array.isArray(data?.comparisons)){
      data.comparisons.forEach(group=>{
        (Array.isArray(group?.offers)?group.offers:[]).forEach(o=>offers.push({...o,brand:o.brand||group.brand||"",name:o.name||group.name||"",image:o.image||group.image||""}));
      });
    }
    return offers.filter(o=>o && (o.price || Number.isFinite(Number(o.price_value))));
  }

  function groupResults(data){
    const offers=normalizeOffers(data);
    const groups=[];
    const map=new Map();

    offers.forEach(o=>{
      const catalogId=String(
        o.catalog_id || o.product_identity || o.product_id || ""
      ).trim();

      const brand=String(
        o.canonical_brand || o.brand || ""
      ).trim();

      const name=String(
        o.canonical_name || o.name || o.title || o.product_name || "Profumo"
      ).trim();

      const size=String(
        o.size_ml || o.size || ""
      ).trim();

      // Catalog identity is authoritative. The raw name is used only as
      // fallback for unresolved offers.
      const identity=catalogId
        ? "catalog:"+catalogId.toLowerCase()
        : "raw:"+(brand+"|"+name).toLowerCase();

      const key=identity+"|"+size.toLowerCase();

      if(!map.has(key)){
        const g={
          brand,
          name,
          size,
          catalog_id:catalogId,
          image:imageOf(o),
          offers:[]
        };
        map.set(key,g);
        groups.push(g);
      }

      const g=map.get(key);
      if(!g.image)g.image=imageOf(o);
      if(!g.brand&&brand)g.brand=brand;
      if(!g.name&&name)g.name=name;
      g.offers.push(o);
    });

    groups.forEach(g=>{
      g.offers.sort(
        (a,b)=>priceNumber(a.price_value??a.price)-priceNumber(b.price_value??b.price)
      );
    });

    groups.sort(
      (a,b)=>priceNumber(a.offers[0]?.price_value??a.offers[0]?.price)
            -priceNumber(b.offers[0]?.price_value??b.offers[0]?.price)
    );

    return groups;
  }

  function renderResults(data){
    currentOffers=normalizeOffers(data);
    const groups=groupResults(data);
    const count=groups.length;
    if(!count){
      output.innerHTML='<div class="empty"><strong>Nessun risultato</strong><div>Non abbiamo trovato offerte disponibili per questa ricerca.</div></div>';
      return;
    }
    let html=`<div class="result-count"><span>${count}</span> ${count===1?'profumo trovato.':'profumi trovati.'}</div>`;
    html+=groups.map(g=>{
      const best=g.offers[0];
      const key=esc(wishKey({brand:g.brand,name:g.name,size_ml:g.size}));
      const img=g.image ? `<img src="${esc(g.image)}" alt="" loading="lazy">` : "🧴";
      const offers=g.offers.map(o=>{
        const p=displayPrice(o);
        const store=String(o.store||o.shop||"Negozio");
        const url=o.url||o.link||"";
        return `<div class="offer"><div><div class="store">${esc(store)}</div>${o.size_ml||o.size?`<div class="offer-meta">${esc(o.size_ml||o.size)} ml</div>`:""}${url?`<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">VAI AL NEGOZIO →</a>`:""}</div><div class="offer-price">${esc(p)}</div></div>`;
      }).join("");
      return `<article class="card"><div class="product-head"><div class="product-image">${img}</div><div class="product-main"><div class="brand">${esc(g.brand)}</div><div class="name">${esc(g.name)}</div>${g.size?`<div class="format">${esc(g.size)} ml</div>`:""}</div><button class="heart" data-wish-key="${key}" data-brand="${esc(g.brand)}" data-name="${esc(g.name)}" data-size="${esc(g.size)}">♡</button></div><div class="best"><div><small>MIGLIOR PREZZO</small></div><div class="price">${esc(displayPrice(best))}</div></div><div class="offers">${offers}</div></article>`;
    }).join("");
    output.innerHTML=html;
    syncHearts();
  }

  async function fetchJSON(url,signal){
    const response=await fetch(url,{signal,headers:{Accept:"application/json"},cache:"no-store"});
    if(!response.ok) throw new Error("HTTP "+response.status);
    return response.json();
  }

  async function doSearch(){
    const q=input.value.trim();
    if(!q)return;

    if(searchController)searchController.abort();
    searchController=new AbortController();

    button.disabled=true;
    button.textContent="CERCO…";
    status.textContent="Ricerca in corso…";
    output.innerHTML="";

    const accumulated={
      query:q,
      results:[],
      errors:{},
      comparisons:[]
    };

    try{
      const response=await fetch(
        backend()+"/search-stream?q="+encodeURIComponent(q),
        {
          signal:searchController.signal,
          headers:{Accept:"text/event-stream"},
          cache:"no-store"
        }
      );

      if(!response.ok)throw new Error("HTTP "+response.status);
      if(!response.body)throw new Error("Streaming non disponibile");

      const reader=response.body.getReader();
      const decoder=new TextDecoder();
      let buffer="";

      function handleEvent(block){
        const lines=block.split(/\\r?\\n/);
        let eventName="message";
        let dataText="";

        lines.forEach(line=>{
          if(line.startsWith("event:"))eventName=line.slice(6).trim();
          else if(line.startsWith("data:"))dataText+=line.slice(5).trim();
        });

        if(!dataText)return;

        let payload;
        try{payload=JSON.parse(dataText)}catch{return}

        if(eventName==="store"){
          const store=payload.store||"negozio";
          const incoming=Array.isArray(payload.results)?payload.results:[];

          // Replace only offers from this store. This prevents duplicates
          // when the backend sends another event for the same store.
          const withoutStore=accumulated.results.filter(
            x=>String(x.store||x.shop||"").toLowerCase()!==String(store).toLowerCase()
          );

          accumulated.results=withoutStore.concat(incoming);

          if(payload.errors){
            Object.assign(accumulated.errors,payload.errors);
          }

          renderResults(accumulated);
          status.textContent="Risultati ricevuti: "+store+"…";
          output.scrollIntoView({behavior:"smooth",block:"start"});
        }

        if(eventName==="done"){
          status.textContent=Object.keys(accumulated.errors).length
            ? "Ricerca completata con alcuni negozi non disponibili."
            : "Ricerca completata.";

          if(Object.keys(accumulated.errors).length){
            const failed=Object.entries(accumulated.errors)
              .map(([k,v])=>`${k}: ${v}`).join(" · ");
            output.insertAdjacentHTML(
              "beforeend",
              `<div class="error">${esc(failed)}</div>`
            );
          }
        }
      }

      while(true){
        const {value,done}=await reader.read();
        if(done)break;

        buffer+=decoder.decode(value,{stream:true});
        const blocks=buffer.split(/\\r?\\n\\r?\\n/);
        buffer=blocks.pop()||"";

        blocks.forEach(handleEvent);
      }

      buffer+=decoder.decode();
      if(buffer.trim())handleEvent(buffer);

    }catch(error){
      if(error?.name==="AbortError")return;

      status.textContent="Errore durante la ricerca.";
      output.innerHTML=
        `<div class="empty"><strong>Ricerca non disponibile</strong>`+
        `<div>${esc(error?.message||"Errore di connessione")}</div></div>`;
    }finally{
      button.disabled=false;
      button.textContent="INIZIA LA RICERCA";
    }
  }

  function renderWishlist(){
    const list=getWishlist();
    if(!list.length){
      wishlistOutput.innerHTML='<div class="empty"><strong>Wishlist vuota</strong><div>Salva un profumo dai risultati per ritrovarlo qui.</div></div>';
      return;
    }
    wishlistOutput.innerHTML=list.map(x=>{
      const img=imageOf(x) ? `<img src="${esc(imageOf(x))}" alt="" loading="lazy">` : "🧴";
      return `<article class="card"><div class="product-head"><div class="product-image">${img}</div><div class="product-main"><div class="brand">${esc(x.brand||"")}</div><div class="name">${esc(x.name||"Profumo")}</div>${x.price?`<div class="price" style="margin-top:7px">${esc(x.price)}</div>`:""}</div><button class="heart saved" data-remove-wish="${esc(wishKey(x))}">♥</button></div></article>`;
    }).join("");
  }

  button.addEventListener("click",doSearch);
  input.addEventListener("keydown",e=>{if(e.key==="Enter") doSearch()});
  document.addEventListener("click",e=>{
    const heart=e.target.closest(".heart[data-wish-key]");
    if(heart){
      toggleWish({brand:heart.dataset.brand,name:heart.dataset.name,size_ml:heart.dataset.size});
      return;
    }
    const remove=e.target.closest("[data-remove-wish]");
    if(remove){
      const list=getWishlist().filter(x=>wishKey(x)!==remove.dataset.removeWish);
      saveWishlist(list);renderWishlist();return;
    }
    const nav=e.target.closest(".nav button[data-view]");
    if(nav){
      document.querySelectorAll(".nav button").forEach(x=>x.classList.remove("active"));nav.classList.add("active");
      const wish=nav.dataset.view==="wishlist";
      document.getElementById("exploreView").classList.toggle("active",!wish);
      document.getElementById("wishlistView").classList.toggle("active",wish);
      if(wish) renderWishlist();
    }
  });
})();
</script>
</body>
</html>
