<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ScentHunter</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#09090b;color:#f5f5f5;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif}
.container{width:min(92%,760px);margin:auto;padding:54px 0 80px}header{text-align:center;margin-bottom:62px}
h1{margin:0;font-size:clamp(42px,8vw,58px);font-weight:800;letter-spacing:-2px}.gold{color:#dfb932}
.subtitle{margin-top:18px;color:#aaaab2;font-size:clamp(20px,4.5vw,27px)}
.search-card{border:2px solid #29292f;background:#111114;border-radius:28px;padding:18px}
input{width:100%;border:0;outline:0;border-radius:20px;padding:30px 26px;background:#202025;color:white;font-size:24px;font-weight:600}
input::placeholder{color:#8d8d96}button{width:100%;margin-top:18px;border:0;border-radius:20px;padding:26px 20px;background:#dfb932;color:#111114;font-size:25px;font-weight:800}
button:disabled{opacity:.65}#status{margin:38px 7px 20px;color:#b6b6bd;font-size:23px;line-height:1.4}
.result{margin-top:18px;padding:22px;border:1px solid #2c2c32;border-radius:20px;background:#151518}
.store{color:#dfb932;font-size:16px;font-weight:800;text-transform:uppercase}.name{margin-top:8px;font-size:21px;font-weight:700;line-height:1.3}
.price{margin-top:12px;font-size:22px;font-weight:800}.result a{display:inline-block;margin-top:16px;color:#dfb932;text-decoration:none;font-weight:700}
#errorsBox{margin:26px 7px 0;color:#85858d;font-size:14px;line-height:1.55}
</style>
</head>
<body><main class="container">
<header><h1>Scent<span class="gold">Hunter</span></h1><div class="subtitle">Trova il tuo profumo al prezzo migliore</div></header>
<section class="search-card"><input id="query" type="search" placeholder="Es. Rasasi Hawas Ice" autocomplete="off" enterkeyhint="search"><button id="searchButton">Cerca</button></section>
<div id="status">Cerca un profumo per confrontare i prezzi.</div><section id="results"></section><div id="errorsBox"></div>
</main>
<script>
const queryInput=document.getElementById("query"),searchButton=document.getElementById("searchButton"),statusBox=document.getElementById("status"),resultsBox=document.getElementById("results"),errorsBox=document.getElementById("errorsBox");
function esc(v){return String(v??"").replaceAll("&","&amp;").replaceAll("<","&lt;").replaceAll(">","&gt;").replaceAll('"',"&quot;").replaceAll("'","&#039;")}
function backend(){return "https://miniature-palm-tree-x5qxpg4r7x6j36x7g-8000.app.github.dev"}
async function searchPerfume(){
const q=queryInput.value.trim();if(!q){statusBox.textContent="Scrivi il nome di un profumo.";resultsBox.innerHTML="";errorsBox.innerHTML="";return}
searchButton.disabled=true;searchButton.textContent="Cerco…";statusBox.textContent="Ricerca in corso…";resultsBox.innerHTML="";errorsBox.innerHTML="";
try{
const controller=new AbortController();
const timeoutId=setTimeout(()=>controller.abort(),35000);
let response;
try{
response=await fetch(backend()+"/search?q="+encodeURIComponent(q),{signal:controller.signal});
}finally{
clearTimeout(timeoutId);
}
if(!response.ok)throw new Error("Errore del server: "+response.status);
const data=await response.json(),results=Array.isArray(data.results)?data.results:[];
statusBox.textContent=results.length?results.length+(results.length===1?" risultato trovato.":" risultati trovati."):"Nessun risultato trovato.";
resultsBox.innerHTML=results.map(i=>`<article class="result"><div class="store">${esc(i.store||"Negozio")}</div><div class="name">${esc(i.name||"Profumo")}</div><div class="price">${esc(i.price||"Prezzo non disponibile")}</div>${i.url?`<a href="${esc(i.url)}" target="_blank" rel="noopener noreferrer">Vai al negozio →</a>`:""}</article>`).join("");
if(data.errors&&Object.keys(data.errors).length)errorsBox.innerHTML="Alcuni negozi non hanno risposto: "+Object.keys(data.errors).map(esc).join(", ")+".";
}catch(e){console.error(e);statusBox.textContent="Impossibile completare la ricerca."}
finally{searchButton.disabled=false;searchButton.textContent="Cerca"}
}
searchButton.addEventListener("click",searchPerfume);queryInput.addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();searchPerfume()}});
</script></body></html>
