<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>ScentHunter</title>
  <style>
    * { box-sizing: border-box; }
    html { background: #050607; }
    body {
      margin: 0;
      background: radial-gradient(circle at 50% 0, #111713 0, #07090a 30%, #030405 100%);
      color: #f7f7f5;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
    }

    .app {
      width: min(100%, 760px);
      margin: auto;
      min-height: 100vh;
      padding: 22px 18px 120px;
    }

    .brandHero {
      text-align: center;
      padding: 8px 0 20px;
    }

    .brandName {
      font-size: 31px;
      font-weight: 800;
      letter-spacing: -1.4px;
      line-height: 1;
    }

    .brandName span { color: #e7b83f; }

    .tagline {
      margin-top: 10px;
      color: #d7d7d3;
      font-size: 11px;
      font-weight: 800;
      letter-spacing: 2.2px;
    }

    .hero {
      border: 1px solid #234638;
      border-radius: 22px;
      padding: 25px 20px;
      background: radial-gradient(circle at 85% 45%, #173c2d 0, #0b1c16 24%, #07100d 58%, #060808 100%);
      min-height: 240px;
      position: relative;
      overflow: visible;
    }

    .hero h2 {
      font-size: 22px;
      margin: 0 0 12px;
      line-height: 1.1;
    }

    .hero p {
      font-size: 16px;
      line-height: 1.45;
      margin: 0 0 18px;
      color: #d7d7d3;
    }

    .search-card {
      padding: 0;
      margin: 0 0 14px;
      border: 0;
      background: none;
    }

    .searchWrap {
      position: relative;
    }

    .searchIcon {
      position: absolute;
      left: 17px;
      top: 15px;
      font-size: 22px;
      z-index: 2;
      color: #9b9da0;
      pointer-events: none;
    }

    input[type="search"] {
      width: 100%;
      border: 1px solid #34363a;
      outline: 0;
      border-radius: 18px;
      padding: 17px 18px 17px 48px;
      background: linear-gradient(135deg, #181a1d, #101113);
      color: white;
      font-size: 17px;
    }

    .heroBtn {
      display: inline-block;
      width: 100%;
      background: linear-gradient(#f4ca5d, #d99c22);
      color: #111;
      padding: 15px 18px;
      border-radius: 18px;
      font-size: 14px;
      font-weight: 900;
      border: 0;
      cursor: pointer;
    }

    #status {
      margin: 18px 5px 10px;
      color: #b6b6bd;
      font-size: 16px;
      line-height: 1.4;
    }

    #results {
      display: grid;
      gap: 12px;
    }

    .result {
      padding: 17px;
      border: 1px solid #303238;
      border-radius: 18px;
      background: #121416;
    }

    .result-top {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .store {
      color: #e7b83f;
      font-size: 12px;
      font-weight: 900;
      text-transform: uppercase;
    }

    .name {
      margin-top: 7px;
      font-size: 18px;
      font-weight: 750;
    }

    .price {
      margin-top: 6px;
      font-weight: 900;
      color: #55ce78;
    }

    .result a {
      display: inline-block;
      margin-top: 10px;
      color: #e7b83f;
      text-decoration: none;
      font-weight: 700;
    }

    #errorsBox {
      margin: 20px 5px;
      color: #85858d;
      font-size: 13px;
    }

    .scent-ac {
      display: none;
      position: absolute;
      left: 0;
      right: 0;
      top: calc(100% + 7px);
      z-index: 9999;
      background: #101214;
      border: 1px solid #34363a;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 14px 34px rgba(0,0,0,.5);
      max-height: 330px;
      overflow-y: auto;
    }

    .scent-ac.open { display: block; }

    .scent-ac-row {
      width: 100%;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 9px 12px;
      background: #101214;
      color: #fff;
      border: 0;
      border-bottom: 1px solid #272a2d;
      text-align: left;
      cursor: pointer;
    }

    .scent-ac-row:last-child { border-bottom: 0; }
    .scent-ac-row:hover,
    .scent-ac-row:focus-visible { background: #15191c; }

    .scent-ac-img {
      width: 48px;
      height: 56px;
      flex: 0 0 48px;
      border-radius: 9px;
      background: #fff;
      object-fit: contain;
    }

    .scent-ac-fallback {
      width: 48px;
      height: 56px;
      flex: 0 0 48px;
      border-radius: 9px;
      background: #fff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 25px;
    }

    .scent-ac-meta {
      display: flex;
      flex-direction: column;
      min-width: 0;
      flex: 1;
    }

    .scent-ac-brand {
      display: block;
      color: #aaa;
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .5px;
      margin-bottom: 3px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scent-ac-name {
      display: block;
      font-size: 15px;
      font-weight: 800;
      line-height: 1.2;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .scent-ac-loading,
    .scent-ac-empty {
      padding: 12px 14px;
      color: #b6b6bd;
      font-size: 13px;
    }

    .thumb {
      width: 70px;
      height: 84px;
      border-radius: 12px;
      object-fit: contain;
      background: #fff;
      flex: 0 0 70px;
    }

    .thumb-fallback {
      width: 70px;
      height: 84px;
      border-radius: 12px;
      background: #fff;
      color: #222;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 30px;
      flex: 0 0 70px;
    }

    @media (max-width: 390px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .hero { padding: 21px 16px; }
      .hero h2 { font-size: 19px; }
    }
  </style>
</head>
<body>
  <main class="app">
    <div class="brandHero">
      <div class="brandName">Scent<span>Hunter</span></div>
      <div class="tagline">FIND THE BEST PRICE, EVERY TIME</div>
    </div>

    <section class="hero">
      <h2>TROVA IL TUO PROFUMO</h2>
      <p>Confronta i prezzi tra i migliori negozi online.</p>

      <form id="searchForm" class="search-card">
        <div class="searchWrap">
          <span class="searchIcon">⌕</span>
          <input
            id="query"
            type="search"
            placeholder="Cerca profumo, marca, nota..."
            autocomplete="off"
            enterkeyhint="search"
          />
          <div id="scentAC" class="scent-ac"></div>
        </div>
      </form>

      <button id="searchButton" class="heroBtn" type="button">INIZIA LA RICERCA</button>
    </section>

    <div id="status">Cerca un profumo per confrontare i prezzi.</div>
    <section id="results"></section>
    <div id="errorsBox"></div>
  </main>

  <script>
    const API_BASE = "";
    const queryInput = document.getElementById("query");
    const searchButton = document.getElementById("searchButton");
    const searchForm = document.getElementById("searchForm");
    const scentAC = document.getElementById("scentAC");
    const statusBox = document.getElementById("status");
    const resultsBox = document.getElementById("results");
    const errorsBox = document.getElementById("errorsBox");

    let autocompleteAbortController = null;
    let autocompleteTimer = null;
    let lastAutocompleteQuery = "";

    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#39;");
    }

    function closeAutocomplete() {
      scentAC.classList.remove("open");
      scentAC.innerHTML = "";
    }

    function renderAutocompleteBox(suggestions) {
      if (!suggestions.length) {
        scentAC.innerHTML = '<div class="scent-ac-empty">Nessun suggerimento trovato.</div>';
        scentAC.classList.add("open");
        return;
      }

      scentAC.innerHTML = suggestions.map(item => {
        const brand = escapeHtml(item.brand || "");
        const name = escapeHtml(item.name || "");
        const image = item.image
          ? `<img class="scent-ac-img" src="${escapeHtml(item.image)}" alt="${name}" loading="lazy" decoding="async">`
          : '<div class="scent-ac-fallback" aria-hidden="true">🧴</div>';

        return `
          <button type="button" class="scent-ac-row" data-name="${name}">
            ${image}
            <span class="scent-ac-meta">
              <span class="scent-ac-brand">${brand || "Brand"}</span>
              <span class="scent-ac-name">${name}</span>
            </span>
          </button>
        `;
      }).join("");

      scentAC.classList.add("open");

      scentAC.querySelectorAll(".scent-ac-row").forEach(row => {
        row.addEventListener("click", () => {
          const picked = row.dataset.name || "";
          queryInput.value = picked;
          closeAutocomplete();
          performSearch(picked);
        });
      });
    }

    async function fetchAutocomplete(query) {
      if (autocompleteAbortController) {
        autocompleteAbortController.abort();
      }

      autocompleteAbortController = new AbortController();
      const signal = autocompleteAbortController.signal;
      lastAutocompleteQuery = query;

      scentAC.innerHTML = '<div class="scent-ac-loading">Sto cercando i suggerimenti...</div>';
      scentAC.classList.add("open");

      try {
        const res = await fetch(`${API_BASE}/autocomplete?q=${encodeURIComponent(query)}`, { signal });
        const data = await res.json();

        if (queryInput.value.trim() !== query || lastAutocompleteQuery !== query) return;

        renderAutocompleteBox(data.suggestions || []);
      } catch (err) {
        if (err.name === "AbortError") return;
        closeAutocomplete();
      }
    }

    function renderErrors(errors) {
      const entries = Object.entries(errors || {});
      if (!entries.length) {
        errorsBox.innerHTML = "";
        return;
      }

      errorsBox.innerHTML = entries.map(([store, message]) => {
        return `<div><strong>${escapeHtml(store)}:</strong> ${escapeHtml(message)}</div>`;
      }).join("");
    }

    function renderResults(data) {
      const results = data.results || [];
      statusBox.textContent = results.length
        ? `${results.length} risultati trovati`
        : "Nessun risultato trovato.";

      resultsBox.innerHTML = results.map(item => {
        const image = item.image || item.image_url || item.thumbnail;
        const imageHtml = image
          ? `<img class="thumb" src="${escapeHtml(image)}" alt="${escapeHtml(item.name || '')}" loading="lazy" decoding="async">`
          : '<div class="thumb-fallback" aria-hidden="true">🧴</div>';

        return `
          <div class="result">
            <div class="result-top">
              ${imageHtml}
              <div style="flex:1;min-width:0;">
                <div class="store">${escapeHtml(item.store || "")}</div>
                <div class="name">${escapeHtml(item.brand || "")} ${escapeHtml(item.name || "")}</div>
                <div class="price">${escapeHtml(item.price || "")}</div>
                ${item.url ? `<a href="${escapeHtml(item.url)}" target="_blank" rel="noopener noreferrer">Vai al negozio</a>` : ""}
              </div>
            </div>
          </div>
        `;
      }).join("");

      renderErrors(data.errors || {});
    }

    async function performSearch(query) {
      const q = String(query || "").trim();
      if (!q) return;

      queryInput.value = q;
      closeAutocomplete();
      statusBox.textContent = "Sto cercando i prezzi migliori...";
      resultsBox.innerHTML = "";
      errorsBox.innerHTML = "";

      try {
        const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(q)}`);
        const data = await res.json();
        renderResults(data);
      } catch (e) {
        statusBox.textContent = "Errore durante la ricerca.";
      }
    }

    queryInput.addEventListener("input", () => {
      const query = queryInput.value.trim();
      clearTimeout(autocompleteTimer);

      if (query.length < 2) {
        closeAutocomplete();
        return;
      }

      autocompleteTimer = setTimeout(() => fetchAutocomplete(query), 180);
    });

    queryInput.addEventListener("focus", () => {
      const query = queryInput.value.trim();
      if (query.length >= 2) {
        clearTimeout(autocompleteTimer);
        autocompleteTimer = setTimeout(() => fetchAutocomplete(query), 120);
      }
    });

    queryInput.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        event.preventDefault();
        performSearch(queryInput.value.trim());
      }

      if (event.key === "Escape") {
        closeAutocomplete();
      }
    });

    document.addEventListener("click", (event) => {
      const wrapper = queryInput.closest(".searchWrap");
      if (!wrapper?.contains(event.target)) {
        closeAutocomplete();
      }
    });

    searchForm.addEventListener("submit", (e) => {
      e.preventDefault();
      performSearch(queryInput.value.trim());
    });

    searchButton.addEventListener("click", () => {
      performSearch(queryInput.value.trim());
    });
  </script>
</body>
</html>
