# Isolated background worker app. No web process or production service.
app = "scenthunter-staging-workers"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile.worker"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1

# The Dockerfile CMD starts Celery. Omitting [processes] uses Fly's
# default "app" process group, which matches the launch wizard's default.
