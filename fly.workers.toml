# fly.toml app configuration file generated for scenthunter-staging-workers on 2026-11-04T10:39:51Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'scenthunter-staging-workers'
primary_region = 'ams'

[build]
  dockerfile = 'backend/Dockerfile.worker'

[processes]
  app = 'celery -A app.workers.celery_app:celery_app worker --loglevel=INFO --queues=discovery,offers,validation,matching,refresh,dead_letter --concurrency=2'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
