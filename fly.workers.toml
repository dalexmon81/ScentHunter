# Isolated background worker app. No web process or production service.
app = "scenthunter-staging-workers"
primary_region = "ams"

[build]
  dockerfile = "backend/Dockerfile.worker"

[processes]
  app = "sh /app/backend/start_worker.sh worker"
  beat = "sh /app/backend/start_worker.sh beat"

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
