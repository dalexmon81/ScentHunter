# Isolated ScentHunter Offer Engine pilot. Never used by production deploys.
app = "scenthunter-pilot-20261030"
primary_region = "ams"

[build]

[env]
  SCENTHUNTER_CATALOG_DB = "/data/store_catalog.sqlite3"
  SCENTHUNTER_OFFER_ENGINE_DB = "/data/offer_engine.sqlite3"
  SCENTHUNTER_OFFER_ENGINE_AUTO_MIGRATE = "0"
  SCENTHUNTER_OFFER_ENGINE_BOOTSTRAP_MIGRATION = "1"
  SCENTHUNTER_OFFER_ENGINE_API_ENABLED = "1"
  SCENTHUNTER_OFFER_ENGINE_SEARCH_ENABLED = "1"
  SCENTHUNTER_OFFER_ENGINE_REFRESH_WORKER_ENABLED = "1"
  SCENTHUNTER_OFFER_ENGINE_REFRESH_INTERVAL_SECONDS = "60"
  SCENTHUNTER_CATALOG_FAMILY_COVERAGE_ENABLED = "0"
  CATALOG_FOREGROUND_REFRESH_ENABLED = "0"

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

[mounts]
  source = "scenthunter_pilot_data"
  destination = "/data"
  auto_extend_size_threshold = 70
  auto_extend_size_increment = "1GB"
  auto_extend_size_limit = "5GB"

[[vm]]
  memory = "2gb"
  cpu_kind = "shared"
  cpus = 1
